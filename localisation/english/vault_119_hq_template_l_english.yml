 hq_support_company: "Headquarters Staff"
 hq_support_company_desc: "A dedicated headquarters staff company that administrates and assists with the unit's activities."
 hq_engineer: "Engineer Staff"
 hq_engineer_desc: "Deals with matters regarding fortifications and mobility/counter-mobility measures."
 hq_recon: "Reconnaissance Staff"
 hq_recon_desc: "Collects and analyzes reconnaissance data received from the field."
 hq_military_police: "Military Police Staff"
 hq_military_police_desc: "Maintains local order and directs division traffic across the army's area of operations."
 hq_maintenance: "Maintenance Planning Staff"
 hq_maintenance_desc: "Plans and supports maintenance & repair efforts on the army level."
 hq_field_hospital: "Hospital Group Staff"
 hq_field_hospital_desc: "Responsible for medical administration and providing efficient casualty evacuation and treatment within the army area."
 hq_logistics: "Logistics & Service Staff"
 hq_logistics_desc: "Prioritizes and allocates the distribution of supplies and fuel within the army."
 hq_signal: "Signal & Intelligence Staff"
 hq_signal_desc: "Coordinates communication efforts within the army, while also collecting and keeping track of gathered intelligence."
 hq_infantry: "Infantry HQ Security"
 hq_infantry_desc: "A smaller infantry battalion, dedicated towards HQ security."
 hq_motorized: "Motorized HQ Security"
 hq_motorized_desc: "Infantry in motorized vehicles, allowing more rapid relocation of the HQ."
 hq_armored_car: "Armored Car HQ Security"
 hq_armored_car_desc: "Armored cars escort the HQ, combining mobility with protection and excellent reconnaissance."
 hq_paratrooper: "Paratrooper HQ Security"
 hq_paratrooper_desc: "Allows an HQ to join an airborne invasion directly, along with providing additional security."
 hq_light_armor: "Light Armor HQ Security"
 hq_light_armor_desc: "Armored battalions lets the HQ unit move quicker on the field as well as survive longer in combat, if the circumstances require it."
 hq_medium_armor: "Medium Armor HQ Security"
 hq_medium_armor_desc: "Armored battalions lets the HQ unit move quicker on the field as well as survive longer in combat, if the circumstances require it."
 hq_heavy_armor: "Heavy Armor HQ Security"
 hq_heavy_armor_desc: "Armored battalions lets the HQ unit move quicker on the field as well as survive longer in combat, if the circumstances require it."
 hq_naval_liaison: "Naval Liaison"
 hq_naval_liaison_desc: "Provides joint Army-Navy cooperation during amphibious landing operations."
 hq_air_liaison: "Forward Air Controller"
 hq_air_liaison_desc: "Air-Ground control parties and other units assigned with the task of ensuring close cooperation between the air force and the land units they support."
 hq_specops: "Special Operations Coordination"
 hq_specops_desc: "Staff office for the planning and coordination of Special Forces operations."
