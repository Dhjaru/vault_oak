 germany.4.d:0 "Repeated uprisings in Austria clearly show that the people there long to be united with our Reich. It is now time to take action and allow the will of the people to be made manifest."
 soviet.75.d:0 "Our offer to return territory was accepted by the [FROM.GetAdjective] government. This should hopefully make everyone satisfied for the foreseeable future, and reduce the risk of internal conflicts."
 usa.24.d:0 "[SOV.GetNameDefCap], the inspiration that convinced many of how overthrowing capitalism was possible, has betrayed the international revolution and aligned itself with Nazi Germany. Between socialism in one country and this alliance with fascists, people are beginning to doubt the sincerity of the communist ideals worldwide. Is American communism just another tool [Root.GetLeader] has used to consolidate power?"
 GER_modular_construction_desc:0 "By having parts of our submarines built at various construction facilities, assembly and construction speed are greatly improved."
 LOADING_TIP_82:0 "Give me fifty DC-3s and the Japanese can have the Burma Road.\n - Chiang Kai-Shek"
 LOADING_TIP_83:0 "Politics is war without bloodshed, while war is politics with bloodshed.\n - Mao Zedong"
 LOADING_TIP_84:0 "Keep men, lose land: land can be taken again. Keep land, lose men: land and men are both lost.\n - Mao Zedong"
 LOADING_TIP_85:0 "I would rather die in a swamp of Greater Romania than in a paradise of a small Romania.\n - Ion Antonescu"
 LOADING_TIP_86:0 "People don't matter, only what they represent.\n - Ion Antonescu"
 LOADING_TIP_87:0 "In wartime, truth is so precious that she should always be attended by a bodyguard of lies.\n - Winston Churchill"
 LOADING_TIP_88:0 "Vanquished today by mechanical force, in the future we will be able to overcome by a superior mechanical force. The fate of the world depends on it.\n - Charles de Gaulle"
 GER_barbarossa_mission_desc:0 "The German Armed Forces must be prepared to crush Soviet Russia in a rapid campaign. The bulk of the Russian Army will be destroyed by daring operations led by armored spearheads."
 rebuild_panama_canal_desc:0 "The Panama Canal is of the utmost importance to our war effort. We must allocate any resources needed to the rebuilding of this great canal, so that we may use it to traverse ships and troops freely between the Pacific and the Atlantic Oceans."
