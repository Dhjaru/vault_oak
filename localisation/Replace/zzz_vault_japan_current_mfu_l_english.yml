 generic_naval:0 "Ship Building Technology"
 air_upgrade:0 "Air Upgrades"
 jap_armour_folder:0 "Japanese Tanks"
 jap_armour_folder_desc:0 "Japanese Tank Tree"
 modern_tools:0 "Modern Machine Tools"
 modern_tools_desc:0 "Years of experience in weapon making allowed us to develop better techniques and machinery that are capable of manufacturing complex weaponry."
 starting_industry:0 "Basic Industry"
 starting_industry_desc:0 "Basic early 20th century industrial planning."
 radio_desc:0 "Adopting the inventions of amateur radio operators and extending the use of FM radio will reduce radio interference and allow us to find new uses for radio technology. This will add a need for some radio HQ equipment to each battalion getting the bonus."
 support_weapons:0 "Medium Machineguns and Mortars I"
 support_weapons_desc:0 "Mounted machineguns have already proven to be queen of the battlefield in the Great War. The mortar has also proven its worth as a the round could be aimed to fall directly into trenches, where artillery shells, because of their low angle of flight, could not possibly go. The development of both must continue."
 jap_basic_tank_engines:0 "Basic Engines"
 jap_basic_tank_engines_desc:0 "Basic tank engine."
 jap_diesel_engine:0 "Diesel Engines"
 jap_diesel_engine_desc:0 "The diesel engine (also known as a compression-ignition or CI engine) is and internal combustion engine in which ignition of the fuel, which is injected into the combustion chamber, is caused by the elevated temperature of the air in the cylinder due to the mechanical compression."
 jap_petrol_engine:0 "Petrol Engines"
 jap_petrol_engine_desc:0 "A petrol engine (known as a gasoline engine in English) is an internal combustion engine with spark-ignition, designed to run on petrol and similar volatile fuels."
 jap_suspension_upgrade:0 "Improved Suspensions"
 jap_suspension_upgrade_desc:0 "Upgraded system of tires, tire air, springs, shock absorbers and linkages that connects a vehicle to its wheels and allows relative motion between the two."
 jap_large_tracks:0 "Wide Tracks"
 jap_large_tracks_desc:0 "Wider tracks drastically improve the mobility of our armoured units on harsh terrain."
 jap_transmission_upgrade:0 "Improved Transmission"
 jap_transmission_upgrade_desc:0 "Transmission has proved to be the limiting factor of our many heavier designs, with new transmissions up the task, we can push our tanks to whole new level."
 jap_rivetted_armour:0 "Riveted Armour"
 jap_rivetted_armour_desc:0 "Riveting armour plates together is cheap, simple, and relatively fast, but has many hazardous downsides in combat."
 jap_casted_armour:0 "Cast Armour"
 jap_casted_armour_desc:0 "The armor can be molded into various shapes easily, allowing for curved areas and specific thicknesses"
 jap_welded_armour:0 "Welded Armour"
 jap_welded_armour_desc:0 "Welded armour seams are much stronger and more reliable, however due to the state of the art nature of the tech, hand welding is relatively expensive."
 jap_armour_skirts:0 "Armoured Skirts"
 jap_armour_skirts_desc:0 "Thin steel plates hung along the hull and turret sides make anti-tank rifle rounds and shaped charges tumble or detonate before they reach the main armour. The extra weight costs a little speed."
 all_armour:0 "All Armour technology"
 armor:0 "Armour technology"
 tank_upgrade:0 "Tanks Upgrades"
 air_equipment:0 "Air models"
 early_ship_hull_light:0 "Early Destroyers"
 basic_ship_hull_light:0 "Basic Destroyers"
 early_ship_hull_submarine:0 "Early Submarines"
 early_ship_hull_cruiser:0 "Early Cruisers"
 basic_ship_hull_cruiser:0 "Basic Cruisers"
 early_ship_hull_heavy:0 "Early Battleships"
 basic_heavy_battery_desc:1 "A gigantic turret housing massive guns under heavy armor. \n\nMounting a §YHeavy Battery§ module increases a ship's §YHeavy Gun Attack§!, improving performance against enemy §YCapital Ships§!."
 improved_heavy_battery_desc:1 "Power Rammers increase the loading speed of heavy guns while automatic flash-tight doors improve safety. \n\nMounting a §YHeavy Battery§ module increases a ship's §YHeavy Gun Attack§!, improving performance against enemy §YCapital Ships§!."
 advanced_heavy_battery_desc:1 "Improved Recoil Reduction Mechanisms and delay coils reduce interference of shells in flight and dramatically increase accuracy. \n\nMounting a §YHeavy Battery§ module increases a ship's §YHeavy Gun Attack§!, improving performance against enemy §YCapital Ships§!."
 basic_ship_hull_carrier:0 "1936 Carrier Hull"
 basic_carrier:0 "Basic Carrier (Carrier II)"
 basic_dp_light_battery:0 "Basic Dual-Purpose Battery"
 basic_dp_light_battery_desc:0 "Combining anti-ship and anti-air guns in a single mount allows for more flexibility and saves weight.\n\nMounting this module increases §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!, which helps in engaging enemy §YScreening Ships§!. These modules also increase §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!.\nMounting a §YSecondary Battery§! Module gives a §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!, or §Y$ship_hull_heavy$§! a small amount of §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! and allows it to engage a second target."
