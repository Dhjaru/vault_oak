 ABILITY_LAST_STAND:0 "Last Stand"
 ABILITY_LAST_STAND_DESC:1 "This general's army gains a defensive bonus, with some drawbacks.\n\nStays on until you switch it off, or until you can't pay the daily cost.\nSwitching it on pays for the first 24 hours.\nThe daily cost is recounted each day from the army's size.\nWhile it is on, §YForce Attack§! and its national versions are hidden for this general.\nOnly one ability that reduces organisation damage can be on per general."
 ABILITY_FORCE_ATTACK:0 "Force Attack"
 ABILITY_FORCE_ATTACK_DESC:1 "This general's army gains an offensive bonus, with some drawbacks.\n\nStays on until you switch it off, or until you can't pay the daily cost.\nSwitching it on pays for the first 24 hours.\nThe daily cost is recounted each day from the army's size.\nWhile it is on, §YLast Stand§! and its national versions are hidden for this general.\nOnly one ability that reduces organisation damage can be on per general."
