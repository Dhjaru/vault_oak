 ship_engine_upgrade:0 "Engine"
 ship_engine_upgrade_desc:0 "A ship with a more powerful engine can better control distance from its opponents in battle."
 ship_reliability_upgrade:0 "Reliability"
 ship_reliability_upgrade_desc:0 "A ship with high reliability will be less prone to critical hits, which can do massive damage to a ship without well thought-out construction."
 ship_anti_air_upgrade:0 "Anti-Air"
 ship_anti_air_upgrade_desc:0 "Increasing anti-air armament allows for improved outcomes against enemy naval aircraft."
 ship_ASW_upgrade:0 "ASW"
 ship_ASW_upgrade_desc:0 "Anti-submarine-warfare weapons are important for locating and taking out submarines; improving them allows us to do this more effectively."
 sub_engine_upgrade:0 "Engine"
 sub_engine_upgrade_desc:0 "A ship with a more powerful engine can control distance to its opponents in battle."
 sub_stealth_upgrade:0 "Stealth"
 sub_stealth_upgrade_desc:0 "Decreasing the amount of noise a submarine makes allows lower detectability by enemy sonar & hydroacoustic devices."
 sub_torpedo_upgrade:0 "Torpedo"
 sub_torpedo_upgrade_desc:0 "Improving torpedo speed and range gives our ships another weapon to use against the enemy naval forces."
 ship_deckspace_upgrade:0 "Deck Space"
 ship_deckspace_upgrade_desc:0 "More room to carry and launch carrier-capable airplanes."
