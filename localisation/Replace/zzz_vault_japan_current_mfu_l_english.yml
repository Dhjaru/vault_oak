 submarine:0 "Submarine"
 submarine_desc:0 "Submarines employ stealth and powerful torpedoes to destroy enemy convoys."
 light_cruiser:1 "Light Cruiser"
 light_cruiser_desc:0 "A light screening vessel. Its primary duty is to shield capital ships from enemy light ships but can also unleash powerful torpedoes that can hurt bigger ships."
 heavy_cruiser:1 "Heavy Cruiser"
 heavy_cruiser_desc:0 "A large armored cruiser that is pretty flexible. A good choice for nations who can't afford to build larger capital ships."
 destroyer:0 "Destroyer"
 destroyer_desc:0 "The lightest screening vessel. Its job is to defend larger ships and to find and destroy submarines."
 ship_hull_light:1 "Light Hull"
 ship_hull_light_desc:0 "The lightest screening vessel. Its job is to defend larger ships and to find and destroy submarines."
 carrier:0 "Carrier"
 carrier_desc:0 "A capital ship able to carry wings of powerful carrier capable aircraft into battle. Also useful as a floating airfield you can position off the coast of your enemy."
 battleship:0 "Battleship"
 battleship_desc:0 "The largest capital ship with the biggest guns and strongest armor that money can buy. Such an expensive investment deserves proper support of smaller screening ships."
 battle_cruiser:0 "Battlecruiser"
 battle_cruiser_desc:0 "A large capital ship often with offensive abilities close to those of a battleship, but with weaker armor traded for a faster speed."
 convoy:0 "Convoy"
 convoy_desc:0 "Convoys used for international trade of goods and resources. Also used to ferry troops around and for performing naval invasions."
 pack_artillery1:0 "Pack Artillery Carriage Upgrade"
 pack_artillery1_desc:0 "Upgraded carriage designs allow more rapid deployment of small artillery pieces."
 motorized_equipment:0 "Transport Vehicles"
 motorized_equipment_desc:0 "Trucks and other cars used for Infantry and equipment transport in the field."
 armored_cars_equipment:0 "Armored Car Vehicles"
 armored_cars_equipment_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 armored_cars_equipment_1:0 "Iw. Armored Car"
 armored_cars_equipment_1_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 armored_cars_equipment_2:0 "Armored Car 36"
 armored_cars_equipment_2_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 armored_cars_equipment_3:0 "Armored Car 38"
 armored_cars_equipment_3_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 armored_cars_equipment_4:0 "Armored Car 41"
 armored_cars_equipment_4_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 armored_cars_equipment_5:0 "Armored Car 44"
 armored_cars_equipment_5_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 JAP_armored_cars_equipment_3:0 "Type 93 Kokusan"
 JAP_armored_cars_equipment_3_short:0 "Type 93 Kokusan"
 JAP_armored_cars_equipment_1:0 "Type 87"
 JAP_armored_cars_equipment_1_short:0 "Type 87"
 JAP_armored_cars_equipment_1_desc:0 "The Type 87 was a Japanese copy of the British Crossley M25AC. 12 of these were supplied in 1925. They had two disparate 7.7 machine guns with a 90 degree traverse each."
 JAP_armored_cars_equipment_2:0 "Type 92 Chiyoda"
 JAP_armored_cars_equipment_2_short:0 "Type 92 Chiyoda"
 JAP_armored_cars_equipment_2_desc:0 "The Type 92 Chiyoda was a mass-produced armored car, designed by Ishikawajima Heavy Industries in 1932. It was a 6-wheeled car with three 6.5mm machine guns and 6mm of welded armor. About 200 were built between 1932 and 1936."
 JAP_armored_cars_equipment_4:0 "Type 93 Kokusan"
 JAP_armored_cars_equipment_4_short:0 "Type 93 So-Mo"
 JAP_armored_cars_equipment_4_desc:0 "The Type 93 So-Mo was Japan's largest and most advanced armoured car built. They were a 6-wheeled car based on the Type 2591 truck. There was one 7.7mm gun, and the crew could fire their guns through ports on the side. It had up to 16mm of welded armor. The Sumida could also travel on railroad with special metal bands. About 100 were built."
 JAP_armored_cars_equipment_5:0 "Type 1 So-To"
 JAP_armored_cars_equipment_5_short:0 "Type 1 So-To"
 motorized_equipment_1:0 "Infantry Trucks"
 motorized_equipment_1_desc:0 "Motorizing infantry is the first stage towards the mechanization of an army. Civilian trucks are readily adaptable to military uses of transporting soldiers, towing guns, and carrying equipment and supplies. This greatly increases the strategic mobility of infantry units, which would otherwise rely on marching."
 JAP_motorized_equipment_1:0 "Isuzu Type 94"
 JAP_motorized_equipment_1_short:0 "Type 94"
 JAP_motorized_equipment_1_desc:0 "The Isuzu Type 94 was a six-wheeled truck used to carry troops and supplies. A new military design, it was highly reliable in the field, capable of traveling cross country and traversing jungle terrain."
 support_equipment:0 "Support Equipment"
 support_equipment_desc:0 "Tents, Tools, Medical instruments & other equipment used to support troops."
 support_equipment_1:0 "Support Equipment"
 support_equipment_1_desc:0 "Tents, Tools, Medical instruments & other equipment used to support troops."
 JAP_EQUIPMENT_VERSION_1:0 "Otsu"
 JAP_EQUIPMENT_VERSION_2:0 "Ko"
 JAP_EQUIPMENT_VERSION_3:0 "Kai"
 JAP_EQUIPMENT_VERSION_4:0 "Hei"
 mechanized_equipment_1:0 "Mechanized 40"
 mechanized_equipment_1_desc:0 "Mechanized infantry is infantry equipped with armored personnel carriers or infantry fighting vehicles for transport and combat. Mechanized infantry is distinguished from motorized infantry in that its vehicles provide a degree of protection from hostile fire, as opposed to soft-skinned wheeled vehicles (trucks or jeeps) for motorized infantry."
 mechanized_equipment_2:0 "Mechanized 43"
 mechanized_equipment_2_desc:0 "Mechanized infantry is infantry equipped with armored personnel carriers or infantry fighting vehicles for transport and combat. Mechanized infantry is distinguished from motorized infantry in that its vehicles provide a degree of protection from hostile fire, as opposed to soft-skinned wheeled vehicles (trucks or jeeps) for motorized infantry."
 mechanized_equipment_3:0 "Mechanized 45"
 mechanized_equipment_3_desc:0 "Mechanized infantry is infantry equipped with armored personnel carriers or infantry fighting vehicles for transport and combat. Mechanized infantry is distinguished from motorized infantry in that its vehicles provide a degree of protection from hostile fire, as opposed to soft-skinned wheeled vehicles (trucks or jeeps) for motorized infantry."
 jap_mechanised_infantry:0 "Type 98 So-Da"
 JAP_mechanized_equipment_1:0 "Type 98 So-Da"
 JAP_mechanized_equipment_1_short:0 "So-Da"
 JAP_mechanized_equipment_1_desc:0 "The Type 98 So-Da was an armored personnel and ammunition carrier used by the Imperial Japanese Army. Its hull had an open top and the "flatbed" in back had a double door at the rear. The flatbed could be covered wiith a tarp over the three rail supports. It could carry 6 passengers along with a crew of up to 6, and had a max speed of 45 kph."
 JAP_mechanized_equipment_2:0 "Type 1 Ho-Ha"
 JAP_mechanized_equipment_2_short:0 "Ho-Ha"
 JAP_mechanized_equipment_2_desc:0 "The Type 1 Ho-Ha was developed in 1941 as a result of a request from the army for a vehicle that could be used to transport a squad of infantry to the battlefield protected from enemy small arms fire. Despite experiences of the Second Sino-Japanese War, armored personnel carriers were viewed as too slow compared to wheeled trucks and there was not much effort for their development in the army. It could carry 13 passengers and had a max of 8mm armor."
 JAP_mechanized_equipment_3:0 "Type 1 Ho-Ki"
 JAP_mechanized_equipment_3_short:0 "Ho-Ki"
 JAP_mechanized_equipment_3_desc:0 "The Type 1 Ho-Ki was developed in 1942 as a result of a request from the army for a fully tracked heavy armored artillery tractor which could also serve as a personnel transport. It had up to 6mm of armor, and could carry 13 passengers. Rather than having a back door for troops to quickly exit, it had three side doors. It had a max speed of 42 kph."
 horse_equipment:0 "Carriages & Field Eq."
 horse_equipment_desc:0 "Carriages drawn by horses or trucks for troops and supplies, along with logistical support equipment required by every battalion such as field kitchens."
 horse_equipment_0:0 "Carriages & Field Eq."
 horse_equipment_0_desc:0 "Carriages drawn by horses or trucks for troops and supplies, along with logistical support equipment required by every battalion such as field kitchens."
