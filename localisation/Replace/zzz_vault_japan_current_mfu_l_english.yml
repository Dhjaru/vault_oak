 jap_advanced_turret:0 "Improved Turret for 40 Medium Hull"
 jap_advanced_turret_short:0 "Improved Turret for 40 Medium Hull"
 jap_advanced_turret_desc:0 "Improved turret for 1940 Medium Tank hull, which allows mounting of §HMedium Armaments§!"
 fording_equipment_jap:0 "Fording Equipment"
 fording_equipment_jap_desc:0 "Fording equipment allows our tanks to cross small streams semi-submerged without using bridges."
 amphibious_drive_jap:0 "Amphibious Drive"
 amphibious_drive_jap_desc:0 "Mounting amphibious equipment on our regular tank hulls unlocks unfound performance for breaking in a bridgehead on enemy shores."
