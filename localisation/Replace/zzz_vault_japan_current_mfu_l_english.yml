 transport_plane_equipment_desc:0 "Delivers paratroopers to their destination."
 fighter_equipment_1934:0 "Interwar Fighter"
 fighter_equipment_1934_desc:0 "While fighter aircraft underwent many changes through the Great War, and since, the bi-plane design is becoming obsolete. We must begin to translate civilian technological advances into military applications."
 fighter_equipment_1936:0 "Fighter 36"
 fighter_equipment_1936_desc:0 "Light airframes been revolutionized with the introduction of radial engines, monoplane designs and all metal skin construction. This design is our attempt at creating our first modern fighter plane."
 strat_bomber_equipment_1937:0 "Strategic Bomber 37"
 strat_bomber_equipment_1937_desc:0 "Experiences from the Great War and studies since show that bombing the enemy's military targets and major cities will win the next war. At the very least, we must have a bomber capable of delivering such destruction. It will need to fly high and at good speed, and it must carry a large payload. This will require a large airframe with multiple engines. It will also have some defensive capability."
 tactical_bomber_1934:0 "Interwar Tactical Bomber"
 tactical_bomber_1934_desc:0 "Medium bombers need to be versatile and fast, capable of fulfilling a range of roles. A twin-engined design, remaining relatively light, can continue to be of use for many years to come."
 tac_bomber_equipment_1934:0 "Iw. Tactical Bomber"
 tac_bomber_equipment_1934_desc:0 "Medium bombers need to be versatile and fast, capable of fulfilling a range of roles. A twin-engined design, remaining relatively light, can continue to be of use for many years to come."
 transport_plane_equipment:0 "Transport Plane"
 transport_plane_equipment_1:0 "Transport Plane"
 transport_plane_equipment_1_desc:0 "§LPlanes used to transport troops on paradrop missions.§!"
 nav_bomber_equipment_1936:0 "Naval Bomber 36"
 nav_bomber_equipment_1936_desc:0 "Naval aviation will be vital in the coming decade to confronting new developments in naval warfare, such as the increased importance of submarines. Seaplanes with capacity to work as dive bombers and recon vehicles will be of use."
 CAS_equipment_1937:0 "Close Air Support 37"
 CAS_equipment_1937_desc:0 "Our CAS doctrine requires an aircraft capable of precision surface attack. While these aircraft carry a lesser payload compared to our larger Tactical Bombers, they are capable of attacking and destroying small targets of opportunity through strafing and dive bombing."
 cv_nav_bomber_equipment_1936:0 "CV Torp. Bomber 36"
 cv_nav_bomber_equipment_1936_desc:0 "An early naval bomber modified to launch from and land on aircraft carriers."
 cv_CAS_equipment_1937:0 "CV Dive Bomber 37"
 cv_CAS_equipment_1937_desc:0 "An early close air support plane modified to launch from and land on aircraft carriers."
