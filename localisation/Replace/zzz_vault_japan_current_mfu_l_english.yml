 communism:0 "Communist"
 democratic:0 "Democratic"
 fascism:0 "Fascist"
 fascism_desc:0 "Totalitarian Regime"
 communism_desc:0 "Totalitarian Regime"
 democratic_desc:0 "Democratic Regime"
 socialism:0 "Socialism"
 socialism_desc:0 "Striving for equality and a socialist state by reformist means, democratic socialism aims to abolish or mitigate the effects of capitalism with public mandate."
 stalinism:0 "Stalinism"
 stalinism_desc:0 "Identifying as a form of government applying and developing Marxist-Leninist policies, Stalinism emphasizes rapid industrialization and collectivization as well as the need for a strong, authorative socialist state to purge any counter-revolutionary elements."
 fascism_ideology:0 "Fascism"
 fascism_ideology_desc:0 "Encompassing a variety of ultra-nationalist movements, fascism typically venerates devotion to the state and uniting the people under a strong leader."
 rexism:0 "Rexism"
 rexism_desc:0 "Strongly opposed to both liberal and communist ideals, Rexism is a staunchly conservative nationalist movement who advocate a corporatist economic policy. Employing increasingly populist and authoritarian rhetoric, their ideals are shifting closer to other fascist movements."
 neutrality:0 "Non-Aligned"
 neutrality_desc:0 "Authoritarian Regime"
 despotism:0 "Despotic"
 despotism_desc:0 "Despotism is a form of government in which a single person rules with absolute power."
 JAP_communism_party:0 "Nihon Kyosan-to"
 JAP_democratic_party:0 "Rikken Minseito"
 JAP_fascism_party:0 "Kyokoku Itchi Naikaku"
 JAP_Taisei:0 "Taisei Yokusankai"
 JAP_neutrality_party_kodoha_long:0 "Kodoha Faction"
 JAP_neutrality_party_kodoha:0 "Kodoha Faction"
 CAS_1937:0 "CAS 37"
 basic_train:0 "Basic Train"
 antitank5_1:0 "Heavy Anti-Tank"
 nsb_jap_armor_folder:0 "Tank Chassis"
 nsb_jap_armor_folder_desc:0 "Research new tank chassis to create more advanced tank designs"
 small_gun:0 "Small Cannon"
 small_gun3:0 "Small High-Velocity Cannon"
 small_gun3_desc:0 "A small cannon specifically designed for high anti-armor capability. Using long barrel to achieve the velocity needed for increased piercing abilities, it has superb anti-armor characteristics, but its performance against soft targets suffers. §HSmall§! weapon, allows §HTank Destroyer§! role."
 support_gun:0 "Close Support Gun"
 support_gun_desc:0 "A small weapon designed to fire medium caliber high-explosive shells against enemy field fortifications to help the infantry on the attack. While capable of engaging tanks, its short barrel and thus limited muzzle velocity make it unoptimal when dealing with enemy tanks. §HSmall§! weapon."
 medium_gun2:0 "Medium Cannon"
 medium_gun2_desc:0 "A general-purpose weapon well suited to a wide variety of tasks. It excells at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility. A §HMedium§! weapon, allows §HTank Destroyer§! role."
 medium_gun3:0  "Medium High-Velocity Cannon"
 medium_gun3_desc:0 "A medium cannon specifically designed for high anti-armor capability. Using long barrel to achieve the velocity needed for increased piercing abilities, it has superb anti-armor characteristics, but its performance against soft targets suffers. §HMedium§! weapon, allows §HTank Destroyer§! role."
 automatic_gun:0 "Machine Gun"
 automatic_gun_desc:0 "A machine gun provides decent anti-infantry capability for a low cost. Even with special armor-piercing ammunition, its anti-armor performance leaves a lot to be desired. §HSmall§! weapon."
 automatic_gun2:0 "Automatic Cannon"
 automatic_gun2_desc:0 "Mounting fast firing automatic cannon as our tanks main armament for either AA or regular ground combat. The small caliber does limit its anti-armor performance. §HSmall§! weapons, anti-air gun variant allows §HAnti Air§! role."
 howizer:0 "Medium Howitzer"
 howizer_desc:0 "A medium howitzer mountable on a §HCasemate§!, or an §HOpen Topped§! turret for indirect fire support. §HArtillery§! weapon, allows §HSPG§! role."
 armour_sloping:0 "Unsloped Armor"
 armour_sloping2:0 "Shaped Armor"
 armour_sloping3:0 "Sloped Armor"
 autoloader:0 "Semi-Automatic Loading"
 turret_basket:0 "Improved Ergonomics"
 medium_tank_artillery_chassis:0 "Medium Tank Artillery"
 medium_tank_destroyer_chassis:0 "Medium Tank Destroyer"
 light_tank_artillery_chassis:0 "Light Tank Artillery"
 light_tank_destroyer_chassis:0 "Light Tank Destroyer"
 industry:0 "Industry"
 pocket_defence:0 "Pocket Defense"
 pocket_defence_desc:0 "It is possible that, on the defensive, our troops may be caught in a pocket. In this case they must merely hold out until the inevitable counter-attack relieves them."
 defence_in_depth:0 "Defense in Depth"
 defence_in_depth_desc:0 "By offering relatively light resistance and temporarily giving ground we can trade space for time and allow attacking forces to exhaust themselves before counter-attacking."
 large_front_operations:0 "Large Front Operations"
 large_front_operations_desc:0 "Fighting over a large front involves coordinating the efforts of multiple units over long distances: At an operational level, rather than tactical.\n\n"
 human_infantry_offensive:0 "Infantry Offensive"
 human_infantry_offensive_desc:0 "The offensive spirit of the infantry is the decisive element of winning battles. Our infantry must lead the way."
 peoples_army:0 "People's Army"
 peoples_army_desc:0 "The People's Army believes in the primacy of men over weapons, with superior motivation compensating for inferior technology, and enjoys widespread support from the civilian population.\n\n"
 paratroopers:0 "Paratroopers I"
 paratroopers_desc:0 "By incorporating airborne forces into our army, we can make forced entries and position key troops in previously inaccessible areas, allowing for new tactical opportunities."
 marines:0 "Marines I"
 marines_desc:0 "Troops specializing in amphibious warfare are growing ever more indispensable. Improvised methods and equipment become things of the past as our naval infantry is supported by specialized landing craft and training."
 tech_recon:0 "Recon Company I"
 tech_recon_desc:0 "Sending smaller groups to scout ahead before moving in the main force allows us to gather intelligence about where the enemy is and how many we are facing."
 tech_engineers:0 "Engineer Company I"
 tech_engineers_desc:0 "Construction of fortifications and breaching obstacles make combat engineers vital in the field. Giving our engineers a versatile role enables us to deploy them in the diverse situations where they will be needed."
 tech_field_hospital:0 "Field Hospital I"
 tech_field_hospital_desc:0 "A casualty doesn't need to mean a dead soldier. Having immediate medical attention available for our wounded brought back to the rear is the first step towards ensuring this."
 tech_logistics_company:0 "Logistics Company I"
 tech_logistics_company_desc:0 "Having specialized Logistics Officers among our ranks will ensure that support networks are leveraged to minimize waste."
 tech_military_police:0 "Military Police I"
 tech_military_police_desc:0 "Regular troops may be able to manage occupation for a shorter period of time, but they are first and foremost soldiers. Integrating military police into our forces will ensure we have people on the ground to respond to resistance and investigate sabotage."
 tech_maintenance_company:0 "Maintenance Company I"
 tech_maintenance_company_desc:0 "Maintenance, repair and overhaul are important to keep military equipment reliable and safe to use. Having companies dedicated to this will ensure that it's given appropriate attention."
 motorised_infantry:0 "Motorized Infantry"
 motorised_infantry_desc:0 "By extending the use of motor vehicles in infantry transports in the field, the mobility of otherwise slow-moving infantry units can be greatly improved, enabling faster responses and new strategies."
 night_vision:0 "Night Vision I"
 night_vision_desc:0 "Being able to see the enemy without being seen is key to night operations. With the invention of infra-red technology, we can outfit our army with devices which, though unwieldy, makes this possible."
 basic_machine_tools:0 "Basic Machine Tools"
 basic_machine_tools_desc:0 "A variety of newly developed milling machines can be used in military production, from the small and versatile types available to any machine shop to the large scale, advanced models that push the technological limits."
 improved_machine_tools:0 "Improved Machine Tools"
 improved_machine_tools_desc:0 "Turret lathes are proving indispensable for mass production. Ensuring efficient construction and use of the lathes themselves will give us a significant industrial advantage."
 advanced_machine_tools:0 "Advanced Machine Tools"
 advanced_machine_tools_desc:0 "Automating machine tools using servomechanisms has been discussed before. Putting these ideas into practice allows making use of other advancements in automation, such as computers."
 assembly_line_production:0 "Assembly Line Production"
 assembly_line_production_desc:0 "The powered assembly line, already in use in many industries, can change the course of war by allowing an unprecedented avalanche of production."
 flexible_line:0 "Flexible Line"
 flexible_line_desc:0 "As well-oiled a machine as the assembly line may be, it is still manned by humans, which allows for adaptation when needed. We should make use of this in our industrial production."
 dispersed_industry5:0 "Dispersed Industry V"
 dispersed_industry5_desc:0 "By having not only our industry, but the infrastructure tying it together operate in secrecy, we can make it even more difficult to destroy through aerial attacks."
 excavation2:0 "Excavation II"
 excavation2_desc:0 "New techniques help us collect resources more efficiently. We no longer taint the resources upon extraction, leading to a greater yield."
 excavation3:0 "Excavation III"
 excavation3_desc:0 "Progress in geology helps us determine the location of resources. We can now focus our extraction efforts in places where there is a greater chance that large amounts of natural resources will be found."
 excavation4:0 "Excavation IV"
 excavation4_desc:0 "Automation of key processes and advancement within mechanics makes all our resource sites much more efficient."
 excavation_tech:0 "Excavation Technologies"
 electronic_mechanical_engineering:0 "Electronic Mechanical Engineering"
 electronic_mechanical_engineering_desc:0 "We live in an age when electrical machines can no longer only warm and light us, but help us think and communicate. Electronics will be key to military intelligence in the coming century."
 radio:0 "Radio"
 experimental_rockets:0 "Experimental Rockets"
 experimental_rockets_desc:0 "Advancing the science of rocketry by improving the range and reliability of liquid-fuel rockets will teach us enough about the technology to allow the construction of launch sites for more advanced models."
 artillery1:0 "Light Artillery 1918"
 artillery1_desc:0 "The Great War proved that the lighter 75mm caliber was of limited use against entrenched enemies. Thus the guns of the 10-12 cm caliber range became the desired caliber for standard divisional artillery."
 artillery2:0 "Artillery Upgrade"
 artillery2_desc:0 "We can apply the lessons learned from the Great War in improving the performance of our Light- and Heavy artillery. These changes can include the lengthening of the firing chamber, new barrels, new sights and upgrades to the recoil mechanism."
 artillery2_tt:0 "Enables one level of §OFirepower§! and §ORange§! upgrades for Light- and Heavy Artillery"
 artillery3:0 "Split Trail Carriage"
 artillery3_desc:0 "Split trail carriage has two trails which can be spread to provide greater stability, compared to a single one in the currently in-use box trail. However, another reason for this design is to provide greater angles of elevation and traverse. Another advantage of a split trail is easier access to the breech for reloading at different angles."
 artillery3_tt:0 "Enables one level of §OCarriage§! upgrade for Light- and Heavy Artillery"
 artillery4:0 "Light Artillery 1937"
 artillery4_desc:0 "With the various innovations in gun and carriage design in the last decade, it is clear that a completely new light howitzer design is needed. This allows us to create a howitzer which utilizes these developments fully."
 heavy_artillery1:0 "Heavy Artillery 1918"
 heavy_artillery1_desc:0 "Heavy Howitzers of 15 cm caliber range were in a key role as the heavy hitters of divisional artillery in the Great War. Even if expensive and time consuming to build, heavy artillery will still be in key position in breaking the enemy."
 pack_artillery_equipment_desc:0 "Infantry guns are artillery weapons designed and used to increase firepower of infantry units they are intrinsic to. The designs are typically with short low velocity barrels, and light construction carriages allowing them to be more easily manoeuvred on the battlefield. They are mostly used for direct fire missions, as opposed to indirect fire like other artillery units. "
 pack_artillery_equipment:0 "Infantry Guns"
 gw_pack_artillery:0 "Infantry Gun 1918"
 pack_artillery_m_1:0 "Mountain Gun"
 pack_artillery_m_1_desc:0 "Our infantry support guns are already extremely mobile, but our specialized mountain troops need a gun that is able to be taken apart and carried by pack animals on narrow mountain paths. Due to their specialized nature they are operated by the special trained troops trained to the mountain environments."
 field_gun:0 "Field Gun 1918"
 field_gun_desc:0 "Field guns are generally high velocity 75mm field artillery pieces. The caliber was the most common before the great war with the majority of artillery pieces being these relatively small and mobile ones. However the war clearly showed the relatively light hitting power combined with the low trajectories of the shells isn't optimal against entrenched enemies."
 field_gun2_1:0 "Field Gun Breech Upgrade"
 field_gun2_1_desc:0 "Semi-automatic breeches and higher chamber pressures allow us to both increase the rate of fire and range of our field guns."
 field_gun2_1_tt:0 "Enables one level of §OFirepower§! and §OConstruction§! upgrades for Field Guns"
 field_gun2_2:0 "Field Gun Sight- and Ammunition Upgrade"
 field_gun2_2_tt:0 "Enables one level of §OAnti-Tank§! upgrade for Field Guns"
 field_gun2_2_desc:0 "Optics production is one of the faster developing fields after the war, and also allows for a broad increase in the direct fire abilities of our field guns. Also the considerable AT capabilities of these high velocity pieces was already noted in the Great War. Dedicated AT ammunition needs to be developed and distributed."
 field_gun3:0 "Field Gun 1936"
 field_gun3_desc:0 "With the various innovations in gun and carriage design in the last decade, it is clear that a completely new field gun design is needed. This allows us to create a weapon which utilizes these developments fully."
 interwar_antiair:0 "Anti-Air 1930"
 antiair3:0 "Anti-Air 1940"
 antiair4:0 "Anti Air Sights and Ammunition Upgrade"
 antiair4_desc:0 "Introducing better ammunition designs, and standardising on colimator sights for all anti-aircraft guns increases the effectiveness of the weapons for minimal cost."
 heavy_antiair_1:0 "Semi-Automatic Breech"
 heavy_antiair_1_tt:0 "Enables one level of §OAnti-Air§! and §OAnti-Tank§! upgrades for Heavy Anti-Aircraft Artillery"
 heavy_antiair_1_desc:0 "A semi-automatic loading system ejects fired shells, allowing the gun be reloaded by simply inserting a new shell into a tray. The gun will then fire and recoil; during the return stroke, the empty case will be thrown backward by levers, after which a cam will engage and recock the gun. Used already in some smaller guns, anti aircraft artillery benefits the most from the increased rof, and extra complexity isn't that much of an issue."
 antitank5_1_tt:0 "While massive design of new anti-tank guns certainly improves their combat ability, it will cost our industry dearly to adjust production for these monsters."
 antitank5_2:0 "Anti-Tank Barrel and Ammunition Upgrade"
 antitank5_2_desc:0 "A new gun with enough piercing would be way bulkier than the current ones, and thus impacting the tactical use of the weapons negatively. We will rather keep the current AT-weapons relevant with longer barrels and better ammunition designs."
 antitank5_2_tt:0 "Enables one level of §OAnti-Tank§! and §OCarriage§! upgrades for Anti-Tank Artillery\nEach level of §OAnti-Tank§! massively increases piercing, but also increases resource cost of equipment by 1 tungsten\nEach level of §OCarriage§! massively increases defence, but also increases resource cost of equipment by 1 aluminium"
 air_defence:0 "Air Defense"
 air_defence_desc:0 "By training our pilots to be constantly on the lookout, even when there is apparently no danger, their chances of intercepting enemy planes is increased."
