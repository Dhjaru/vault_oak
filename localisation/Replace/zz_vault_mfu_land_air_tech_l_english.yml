 tech_armored_cars:0 "1920's Armored Cars"
 tech_armored_cars_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 tech_armored_cars2:0 "Pre-War Armored Cars"
 tech_armored_cars2_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 tech_armored_cars3:0 "Early War Armored Cars"
 tech_armored_cars3_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 tech_armored_cars4:0 "Mid War Armored Cars"
 tech_armored_cars4_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 tech_armored_cars5:0 "Late War Armored Cars"
 tech_armored_cars5_desc:0 "A military armored (or armoured) car is a lightweight wheeled armored fighting vehicle, historically employed for reconnaissance, internal security, armed escort, and other subordinate battlefield tasks."
 sp_armored_advanced_flamethrower_tech: "Advanced Flamethrower"
 sp_armored_advanced_flamethrower_tech_desc: "$advanced_flamethrower_desc$"
 sp_armored_lc_naval_engine_conversion_tech: "Mega-Scale Land Vehicles"
 sp_armored_lc_naval_engine_conversion_tech_desc: "If we want to realize the construction of a land vehicle of proportions never seen before, we need to conduct studies on the feasibility of various systems required. Most of the required technology already exists, it is just utilized for shipbuilding."
 sp_armored_lc_transmission_improvements_tech: "Transmission Improvements"
 sp_armored_lc_transmission_improvements_tech_desc: "Refined gear ratios, clutch mechanisms and torque converters to create more efficient transmissions capable of handling the extreme power and weight of Land Cruisers, improving overall mobility and reducing mechanical strain."
 sp_armored_lc_specialized_field_manuals_tech: "Specialized Field Manuals"
 sp_armored_lc_specialized_field_manuals_tech_desc: "Developing detailed training manuals tailored for Land Cruiser crews, covering unique operational procedures, maintenance protocols, and complex battlefield tactics required to effectively command these giant war machines."
 sp_armored_lc_weapon_fire_control_tech: "Weapon Fire Control"
 sp_armored_lc_weapon_fire_control_tech_desc: "Implementing advanced targeting optics, rangefinders, and gyroscopic stabilizers to enhance weapon accuracy and firing coordination, ensuring the guns can effectively engage targets despite their massive recoil and slow maneuverability."
 sp_helicopter_transport_pods_tech: "Helicopter Transport Company"
 sp_helicopter_transport_pods_tech_desc: "Helicopters equipped with transport pods or towing goods beneath them on a line can move supplies and equipment quickly and without regard for terrain. Getting stuck in the mud is a thing of the past!"
 sp_helicopter_artillery_observers_tech: "Helicopter Recon Company"
 sp_helicopter_artillery_observers_tech_desc: "Helicopters are able get a good vantage point of the battlefield regardless of the actual terrain, and thus make excellent forward scouts to provide accurate feedback to artillery barrages."
 sp_helicopter_med_evac_tech: "Helicopter Med-Evac Company"
 sp_helicopter_med_evac_tech_desc: "Incoming wounded! We have incoming wounded! Helicopters provide even faster casualty evacuation than regular ambulances."
 amphibious_drive:0 "Amphibious Drive"
 amphibious_drive_desc:0 "A set of floatation devices and a small screw allow this tank to quickly be rigged to traverse water, either from ship to shore or across a river."
 early_cupola:0 "Commanders Cupola"
 early_cupola_desc:0 "Giving the tanks commander a cupola with hatch door on top allows for way better situational awareness on the battlefield, and thereby increases tanks combat capabilities. "
 cupola:0 "Improved Commanders Cupola"
 cupola_desc:0 "With improvements in design and discarding periscopes for all around armored glass vision slits on the cupola, we are able to give the tanks commander all around vision even when viewing the battlefield inside the cupola."
 amphibious_tank_chassis:0 "Amphibious Tank Chassis"
 amphibious_tank_chassis_desc:0 "A small tank hull specifically designed to float. To achieve this, strict limits have to be set on the size of the weapon and the thickness of the armor the vehicle carries."
 armored_skirts_tech:0 "Armored Skirts"
 armored_skirts_tech_desc:0 "A set of thin metal plates mounted on the side of the vehicle, giving additional protection against anti-tank rifles and shaped charges."
 mechanical_charging:0 "Supercharger"
 mechanical_charging_desc:0 "Majority of current aircraft use mechanically driven superchargers to boost the power output of their engines. Why wouldn't we be able to mount one on a tank engine?"
 austerity_transmission:0 "War Austerity Transmission"
 austerity_transmission_desc:0 "With restrictions on imports caused by the war, the lack of rare materials has been capping our tank transmission production. However with some sacrifices, we can reduce the amount of rare metals required in transmission production."
 armour_sloping_desc:0 "Constructing our tanks armor from vertical armor plates is cheap and efficient, and plate thickness can just be increased if the effectiveness of our enemies anti tank armaments grows."
 armour_sloping2_desc:0 "Mounting our armor plates at angles where possible increases our tanks armors effectiveness, even if a lot of the front armor is still almost vertical"
 armour_sloping3_desc:0 "Designing our tanks entire front plate and even the sides to be mounted at an oblique angle increases the armor effectiveness and can even cause the shells to bounce off with a reasonable chance. However a leap like this in construction of tanks armor increases the production expenses."
 armour_sloping4_desc:0 "Experience gained from the conflict clearly states that to protect our tanks from most modern AT guns armor sloped at regular angles ends up too heavy to be practical. By extreme angles and innovative shapes we can maximize the effectiveness of our steel armor."
 turret_basket_desc:0 "Various innovations in the interior of the tank make the functioning of the crew easier. This increase in ergonomics increases the tanks overall combat performance."
 autoloader_desc:0 "§RCan only be mounted on the first special slot§! A semi-automatic loader system helps the loader by lifting the shells to the level of the breech automatically, after which the loader pushes the round into the breech. Even if adding both expense and complexness to the vehicle, it increases the vehicles rate of fire, and especially helps with keeping it up in longer engagements."
 autoloader2_desc:0 "§RCan only be mounted on the first special slot§! Large caliber autoloading mechanisms are still in their infancy and require an oscillating turret which keeps the gun leveled with the mechanism. The autoloader allows for unmatched burst-fire potential and a reduced crew count. The small size of the ammo rack available to the autoloader and the unreliability of the cutting edge mechanisms limits potential for longer engagements."
 small_gun_desc:0 "A small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness."
 small_gun2_desc:0 "Improved small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness."
 fug:0 "Easy Maintenance"
 fug_desc:0 "Hatches around the vehicle give access to many different components of the vehicle, and allow the crew to perform even complex maintenance fairly easily."
 armored_train:0 "Armored Train"
 slo_mechanised_infantry1:0 "OT vz.39"
 rocket_artillery:0 "Rocket Artillery Company"
 rocket_artillery_desc:0 "Rocket Artillery Company"
