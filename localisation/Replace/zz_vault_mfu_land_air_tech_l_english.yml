 small_gun3:0 "Small High-Velocity Cannon"
 small_gun3_desc:0 "A small cannon specifically designed for high anti-armor capability. Using long barrel to achieve the velocity needed for increased piercing abilities, it has superb anti-armor characteristics, but its performance against soft targets suffers. §HSmall§! weapon, allows §HTank Destroyer§! role."
 support_gun:0 "Close Support Gun"
 support_gun_desc:0 "A small weapon designed to fire medium caliber high-explosive shells against enemy field fortifications to help the infantry on the attack. While capable of engaging tanks, its short barrel and thus limited muzzle velocity make it unoptimal when dealing with enemy tanks. §HSmall§! weapon."
 medium_gun2:0 "Medium Cannon"
 medium_gun2_desc:0 "A general-purpose weapon well suited to a wide variety of tasks. It excells at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility. A §HMedium§! weapon, allows §HTank Destroyer§! role."
 medium_gun3:0  "Medium High-Velocity Cannon"
 medium_gun3_desc:0 "A medium cannon specifically designed for high anti-armor capability. Using long barrel to achieve the velocity needed for increased piercing abilities, it has superb anti-armor characteristics, but its performance against soft targets suffers. §HMedium§! weapon, allows §HTank Destroyer§! role."
 medium_gun4:0  "Improved Medium High-Velocity Cannon"
 medium_gun4_desc:0 "An improved variant of the medium high-velocity cannon with an even longer barrel and bigger propellant charge for increased velocity and piercing. A §HMedium§! weapon, allows §HTank Destroyer§! role."
 heavy_gun:0 "Heavy Cannon"
 heavy_gun_desc:0 "A weapon that can fire a large shell at medium velocity. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it. §HHeavy§! weapon, allows §HTank Destroyer§! role."
 heavy_gun2:0 "Improved Heavy Cannon"
 heavy_gun2_desc:0 "A weapon that can fire a large shell at high velocities, at a cost. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it. §HHeavy§! weapon, allows §HTank Destroyer§! role."
 very_heavy_gun:0 "Very-Heavy Cannon"
 very_heavy_gun_desc:0 "A weapon that amplifies both the strenghts and negatives of the heavy cannon, the very-heavy cannon has the ability to shatter armor even on non-penetrating hits with the sheer kinetic force of the shell, and a shell with explosive charge large enough to break through almost all field fortifications. However the weapon is very difficult to mount and suffers from long reload times. §HVery Heavy§! weapon, allows §HTank Destroyer§! role."
 very_heavy_gun2:0 "Improved Very-Heavy Cannon"
 very_heavy_gun2_desc:0 "An overall improvement on the earlier weapon, the improved variant focuses on alleviating some of the worst weaknesses like the long reload, while increasing the anti-armor capabilities to an even higher level. §HVery Heavy§! weapon, allows §HTank Destroyer§! role."
 super_heavy_gun:0 "Super-Heavy Cannon"
 super_heavy_gun_desc:0 "An absurdly large weapon with unmatched performance. There are very few things that this weapon can not destroy, and none of them have any business shooting at a tank. §HVery Heavy§! weapon, allows §HTank Destroyer§! role."
 support_gun2:0 "Improved Close Support Guns"
 support_gun2_desc:0 "A new generation of close support guns, with both §HMedium§! and §HHeavy§! models."
 support_gun3:0 "Rocket Mortar"
 support_gun3_desc:0 "A battleship caliber breech loading launcher firing rocket boosted ammunition. Loads slowly and has limited range. When it hits something, it dies. §HVery Heavy§! weapon."
 siege_gun:0 "Siege Gun"
 siege_gun_desc:0 "The heaviest artillery piece (im)practically mountable to a tracked chassis. The firerate is measured in shots per hour, and the range is sub par for a weapon of this size, but it does hit quite hard when it hits. §HVery Heavy§! weapon."
 automatic_gun:0 "Machine Gun"
 automatic_gun_desc:0 "A machine gun provides decent anti-infantry capability for a low cost. Even with special armor-piercing ammunition, its anti-armor performance leaves a lot to be desired. §HSmall§! weapon."
 automatic_gun2:0 "Automatic Cannon"
 automatic_gun2_desc:0 "Mounting fast firing automatic cannon as our tanks main armament for either AA or regular ground combat. The small caliber does limit its anti-armor performance. §HSmall§! weapons, anti-air gun variant allows §HAnti Air§! role."
 automatic_gun3:0 "Improved Automatic Cannon"
 automatic_gun3_desc:0 "Improved firing mechanisms and larger caliber of the next generation of autocannons increases their power against ground targets and aircraft alike. §HSmall§! weapons, anti-air gun variant allows §HAnti Air§! role."
 automatic_gun4:0 "Advanced Automatic Cannon"
 automatic_gun4_desc:0 "Advanced mounts allow for mounting of twin, triple or even quad mountings of automatic weapons for anti air tanks, this obviously allows for much increased killing power. §HSmall§! weapon, allows §HAnti Air§! role."
 howizer:0 "Medium Howitzer"
 howizer_desc:0 "A medium howitzer mountable on a §HCasemate§!, or an §HOpen Topped§! turret for indirect fire support. §HArtillery§! weapon, allows §HSPG§! role."
 howizer2:0 "Improved Howitzers"
 howizer2_desc:0 "An improved medium howitzer mountable on all hull types on a §HCasemate§!, or an §HOpen Topped§! turret. A heavy howitzer mountable on medium or larger hulls on §HCasemate§! or §HOpen Topped§! turret types. §HArtillery§! and §HHeavy Artillery§! weapons, allow §HSPG§! roles."
 rocket:0 "Rocket Launcher"
 rocket_desc:0 "A multi-barrelled launcher for unguided, high-explosive rockets. The high volume of fire gives it excellent performance against soft targets, but even direct hits do little against armored targets. §HSpecial slot§! weapon."
 rocket2:0 "Improved Rocket Launcher"
 rocket2_desc:0 "While there are a number of improvements to accuracy, the main advantage of this improved rocket launcher is that it can hold more rockets to fire at the enemy. §HSpecial slot§! weapon."
 armour_sloping:0 "Unsloped Armor"
 armour_sloping2:0 "Shaped Armor"
 armour_sloping3:0 "Sloped Armor"
 armour_sloping4:0 "Advanced Sloped Armor"
 autoloader:0 "Semi-Automatic Loading"
 autoloader2:0 "Automatic Loading"
 turret_basket:0 "Improved Ergonomics"
 boiling_vessel:0 "Boiling Vessel"
 boiling_vessel_desc:0 "A boiling vessel permits the crew to heat water and cook food by drawing power from the vehicle electrical supply. It is often referred to by crewmembers (not entirely in jest) as "the most important piece of equipment in a British armoured vehicle"."
 automatic_gun5:0 "Coaxial Autocannon"
 automatic_gun5_desc:0 "A coaxial automatic cannon considerably increases the tanks firepower against soft and semi-hard targets such as light vehicles. However, the gun and its ammunition require considerable space inside the tank, and increase the volume of ammunition fired."
 night_vision_tank:0 "Night Vision"
 fording_equipment:0 "Fording Equipment"
 infantry_weapons2:0 "Improved Infantry Equipment I"
 infantry_weapons2_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Improved weapon models and more specialized equipment."
 improved_infantry_weapons_2:0 "Improved Infantry Equipment II"
 improved_infantry_weapons_2_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Improved weapon models and more specialized equipment."
 advanced_infantry_weapons2:0 "Improved Infantry Equipment III"
 advanced_infantry_weapons2_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further Modernized to include personal Assault Rifles and anti-tank rockets. Improved availability of weapons previously distributed to a limited extent."
 infantry_at:0 "Infantry Anti-Tank I"
 infantry_at_desc:0 "Arming our infantry units with anti-tank rifles will allow them to take out lighter armored vehicles while maintaining mobility."
 infantry_at2_desc:0 "For infantry to effectively engage heavier armored units, high-explosive anti-tank weapons need to be made smaller and lighter."
 HUN_light_infantry_tech:0 "Light Infantry Divisions Doctrine"
 HUN_light_infantry_tech_desc:0 "Reducing the amount of supporting arms in our infantry divisions makes them more flexible and gives them an edge in combat in restricted terrain like Cities and forests."
 tech_recon:0 "Recon Company I"
 tech_recon_desc:0 "Sending smaller groups to scout ahead before moving in the main force allows us to gather intelligence about where the enemy is and how many we are facing."
 tech_recon2:0 "Recon Company II"
 tech_recon2_desc:0 "Reconnaissance missions are often dangerous and casualties are high. Preparing our patrols to move and withdraw rapidly and equipping them to clear obstacles placed by the enemy will increase their chances of coming back alive."
 tech_recon3:0 "Recon Company III"
 tech_recon3_desc:0 "Improvements in radio technology change the way reconnaissance missions can be executed, enabling rapid communication of the gathered intelligence."
 tech_recon4:0 "Recon Company IV"
 tech_recon4_desc:0 "Deep reconnaissance operations, mixing espionage, guerilla operations and commando training, will aid our tactical choices and allow us to adapt our decision-making rapidly."
 tech_engineers:0 "Engineer Company I"
 tech_engineers_desc:0 "Construction of fortifications and breaching obstacles make combat engineers vital in the field. Giving our engineers a versatile role enables us to deploy them in the diverse situations where they will be needed."
 tech_engineers2:0 "Engineer Company II"
 tech_engineers2_desc:0 "With modern equipment and high explosives, our engineers can go beyond their traditional tasks and surprise the enemy with their ingenuity, at land and sea."
 tech_engineers3:0 "Engineer Company III"
 tech_engineers3_desc:0 "Military engineering projects are approaching a larger scale. The construction of advanced infrastructural aid enables operations requiring supplies beyond what is normally available in the field."
 tech_engineers4:0 "Engineer Company IV"
 tech_engineers4_desc:0 "Maintaining local mobility while constructing what would previously have been considered permanent fortifications and supply systems, combat engineers of the future will ensure that no matter where our troops are attacked, they will be prepared."
 tech_field_hospital:0 "Field Hospital I"
 tech_field_hospital_desc:0 "A casualty doesn't need to mean a dead soldier. Having immediate medical attention available for our wounded brought back to the rear is the first step towards ensuring this."
 tech_field_hospital2:0 "Field Hospital II"
 tech_field_hospital2_desc:0 "By establishing the use of portable hospitals, bringing the medical care to where it is needed, we can stop many unnecessary deaths and permanent injuries."
 tech_field_hospital3:0 "Field Hospital III"
 tech_field_hospital3_desc:0 "Surgery is among the most common emergency procedures needed in the field. Procedures and tools for this must be available closer to the front, and we must ensure that skilled surgeons are part of the military medical units."
 tech_field_hospital4:0 "Field Hospital IV"
 tech_field_hospital4_desc:0 "Although many improvements have been made in field medicine, many advances are improvised and we lack an established doctrine. With more experience, we can explain the role of these units more clearly and make improvised innovations permanent fixtures."
 tech_logistics_company:0 "Logistics Company I"
 tech_logistics_company_desc:0 "Having specialized Logistics Officers among our ranks will ensure that support networks are leveraged to minimize waste."
 tech_logistics_company2:0 "Logistics Company II"
 tech_logistics_company2_desc:0 "Adapting our risk analyses to the new circumstances of war will improve the safety of our logistical support."
 tech_logistics_company3:0 "Logistics Company III"
 tech_logistics_company3_desc:0 "Continued statistical evaluation of troop supply needs contribute to maximizing the utility of our resources."
 tech_logistics_company4:0 "Logistics Company IV"
 tech_logistics_company4_desc:0 "Developing standardized classifications for supplies will minimize confusion and make planning more efficient."
 tech_military_police:0 "Military Police I"
 tech_military_police_desc:0 "Regular troops may be able to manage occupation for a shorter period of time, but they are first and foremost soldiers. Integrating military police into our forces will ensure we have people on the ground to respond to resistance and investigate sabotage."
 tech_military_police2:0 "Military Police II"
 tech_military_police2_desc:0 "By engaging in regular police duties in occupied territories, such as traffic control and maintaining public order, our military police can minimize the chaos and confusion which partisan movements thrive in."
 tech_military_police3:0 "Military Police III"
 tech_military_police3_desc:0 "Cooperating with local spy networks and informers established before occupation, our military police can proactively prepare for where resistance is likely to arise."
 tech_military_police4:0 "Military Police IV"
 tech_military_police4_desc:0 "Safely policing occupied territory is as much about returning to normalcy as it is about ruthlessly eliminating opposition. Our military police must ensure that this process starts early, to ensure safety for soldiers and civilians alike."
 tech_signal_company:0 "Signal Company I"
 tech_signal_company_desc:0 "Establishing and maintaining communications in the field has always required special skills. With the advent of new communications and detection technology in the Great War, new possibilities for the practice lie ahead."
 tech_signal_company2:0 "Signal Company II"
 tech_signal_company2_desc:0 "Signal companies focusing on communication between the different branches of the military can ensure that ground forces are able to coordinate efforts with sea and air operations and plan their movements more rapidly."
 tech_signal_company3:0 "Signal Company III"
 tech_signal_company3_desc:0 "Increasingly portable communications technology is more viable to be personally carried as a backpack. This increased mobility of signal corps must be utilized."
 tech_signal_company4:0 "Signal Company IV"
 tech_signal_company4_desc:0 "Among our signal specialists are people with unparalleled first-hand knowledge of field use of this equipment. By involving them in the research of new communication technologies, we can make use of their expertise."
 tech_maintenance_company:0 "Maintenance Company I"
 tech_maintenance_company_desc:0 "Maintenance, repair and overhaul are important to keep military equipment reliable and safe to use. Having companies dedicated to this will ensure that it's given appropriate attention."
 tech_maintenance_company2:0 "Maintenance Company II"
 tech_maintenance_company2_desc:0 "Routine operational maintenance procedures minimize the risks of equipment breaking down and alerts troops to replace it before it does."
 tech_maintenance_company3:0 "Maintenance Company III"
 tech_maintenance_company3_desc:0 "Making sure that our troops always have the basic materials in the field to perform common repairs will prevent the continued use of equipment known to be damaged."
 tech_maintenance_company4:0 "Maintenance Company IV"
 tech_maintenance_company4_desc:0 "Experiences with designing for active redundancy in the Great War can be renewed to work with more modern equipment to make maintenance easier."
 motorised_infantry:0 "Motorized Infantry"
 motorised_infantry_desc:0 "By extending the use of motor vehicles in infantry transports in the field, the mobility of otherwise slow-moving infantry units can be greatly improved, enabling faster responses and new strategies."
 artillery1:0 "Light Artillery 1918"
 artillery1_desc:0 "The Great War proved that the lighter 75mm caliber was of limited use against entrenched enemies. Thus the guns of the 10-12 cm caliber range became the desired caliber for standard divisional artillery."
 artillery2:0 "Artillery Upgrade"
 artillery2_desc:0 "We can apply the lessons learned from the Great War in improving the performance of our Light- and Heavy artillery. These changes can include the lengthening of the firing chamber, new barrels, new sights and upgrades to the recoil mechanism."
 artillery3:0 "Split Trail Carriage"
 artillery3_desc:0 "Split trail carriage has two trails which can be spread to provide greater stability, compared to a single one in the currently in-use box trail. However, another reason for this design is to provide greater angles of elevation and traverse. Another advantage of a split trail is easier access to the breech for reloading at different angles."
 artillery4:0 "Light Artillery 1937"
 artillery4_desc:0 "With the various innovations in gun and carriage design in the last decade, it is clear that a completely new light howitzer design is needed. This allows us to create a howitzer which utilizes these developments fully."
 artillery5_1:0 "Motorized Light Artillery Primacy"
 artillery5_1_desc:0 "The coming war will be a war of movement. The motorization of artillery batteries allows not just advantages in strategic, but also in tactical mobility. Relocating guns becoming much easier will make enemy counter-battery fire less effective, and allow us to also field heavier gun designs."
 artillery5_2:0 "Improved Cross-terrain Performance"
 artillery5_2_desc:0 "We don't have the capability nor the resources to motorize all of our artillery in the coming years. Instead of trying to aim for the unreachable, we must make our current designs as light and as easy to tow with horses as possible."
 artillery7_2:0 "Light Artillery Anti-Tank Upgrade"
 artillery7_2_desc:0 "With light artillery pieces still being somewhat realistically able to hit a tank when provided with direct fire sights, why not provide them with some AT ammunition as well. This allows light artillery to work as emergency AT guns if needed."
 artillery7_1:0 "Light Mountain Howitzer"
 artillery7_1_desc:0 "With advances in metallurgy and the ability to manufacture aluminium carriages, we can bring in heavier artillery support in difficult terrain than ever before."
 artillery8_2:0 "Light Artillery 1942"
 artillery8_2_desc:0 "Long barrelled Guns compared to Howitzers have generally been used in corps level artillery for specialized long range duties. In the ever going fight for range and firepower, it is time to push these pieces to divisional use as well. Their increased weight however requires at least the partial mobilization of all light artillery batteries using these guns."
 artillery8_1:0 "Light Artillery Shell Upgrade"
 artillery8_1_desc:0 "With the constant race for the advantages of outranging enemy artillery, we can oust every last bit of range from our current howitzers with larger charges and most recent shell designs."
 heavy_artillery1:0 "Heavy Artillery 1918"
 heavy_artillery1_desc:0 "Heavy Howitzers of 15 cm caliber range were in a key role as the heavy hitters of divisional artillery in the Great War. Even if expensive and time consuming to build, heavy artillery will still be in key position in breaking the enemy."
 heavy_artillery2:0 "Heavy Artillery 1937"
 heavy_artillery2_desc:0 "With the various innovations in gun and carriage design in the last decade, it is clear that a completely new heavy howitzer design is needed. This allows us to create a howitzer which utilizes these developments fully."
 heavy_artillery3_1:0 "Motorized Heavy Artillery Primacy"
 heavy_artillery3_1_desc:0 "Heavy artillery due to the weight of the artillery pieces benefits the most from motorization. The current pieces in use are already at the limit of what horses can pull. The both in and out of combat benefits of motorizations are too great. We must at least semi-motorize all of our heavy artillery."
 heavy_artillery3_2:0 "Optimize for Horse Traction and Mass Production"
 heavy_artillery3_2_desc:0 "Even if in an ideal world every heavy artillery battery was fully motorized, this isn't the ideal world. We will work around the constraints of horse traction, which still works well enough for non motorized infantry divisions anyways. The focus will instead be in wielding as many heavy guns as our industry can churn out."
 heavy_artillery5_1:0 "Support Artillery Motorization"
 heavy_artillery5_1_desc:0 "Even support artillery will be motorized to better keep up with mobile combat."
 heavy_artillery6_1:0 "Heavy Artillery 1942"
 heavy_artillery6_1_desc:0 "Long barrelled Guns compared to Howitzers have generally been used in corps level artillery for specialized long range duties. In the ever going fight for range and firepower, it is time to push these pieces to divisional use as well. Their increased weight however requires the use of dedicated prime movers for all heavy artillery batteries using these guns."
 heavy_artillery6_2:0 "Rocket Boosted Ammunition"
 heavy_artillery6_2_desc:0 "When the gun cannot handle a bigger charge, fire charge outside of the gun."
 heavy_artillery7:0 "Improved Heavy Artillery Fire Control"
 heavy_artillery7_desc:0 "Closer coordination of other elements with gun batteries, and the improvements in radio technology allow us to use our current heavy howitzers much more effectively than before."
 gw_pack_artillery:0 "Infantry Gun 1918"
 pack_artillery_mot:0 "Infantry Gun Support Motorization"
 pack_artillery_mot_desc:0 "Motorization of our supporting infantry gun batteries elements allows for faster relocation of guns to more advantageous positions, and even more closely integrated fire support to troops."
 pack_artillery_m_1:0 "Mountain Gun"
 pack_artillery_m_1_desc:0 "Our infantry support guns are already extremely mobile, but our specialized mountain troops need a gun that is able to be taken apart and carried by pack animals on narrow mountain paths. Due to their specialized nature they are operated by the special trained troops trained to the mountain environments."
 pack_artillery_m_2_1:0 "Mountain Gun Mobility Upgrade"
 pack_artillery_m_2_1_desc:0 "The whole purpose of this type of artillery is the ability to be able to provide fire support in any terrain. Having more firepower doesn't matter if you cannot get the gun there in the first place."
 pack_artillery_m_2_2:0 "Mountain Gun Firepower Upgrade"
 pack_artillery_m_2_2_desc:0 "The specialized usage and the modularity of our pack guns gives severe constraints on the weight of the units. However, we are still able to give the pieces a nice boost in the firepower department for only a minor weight increase with integrating such recent inventions as muzzle brakes."
 pack_artillery_m_3:0 "Airborne Artillery Upgrade"
 pack_artillery_m_3_desc:0 "Without radical changes our current pack artillery designs fit well for the newborn field of airborne operations. However the required paradrop and auxiliary gear can be improved greatly."
 field_gun:0 "Field Gun 1918"
 field_gun_desc:0 "Field guns are generally high velocity 75mm field artillery pieces. The caliber was the most common before the great war with the majority of artillery pieces being these relatively small and mobile ones. However the war clearly showed the relatively light hitting power combined with the low trajectories of the shells isn't optimal against entrenched enemies."
 field_gun2_1:0 "Field Gun Breech Upgrade"
 field_gun_mot:0 "Field Gun Support Motorization"
 field_gun_mot_desc:0 "Motorization of our supporting field gun batteries elements allows for faster relocation of guns to more advantageous positions, and more closely integrated fire support to troops."
 field_gun2_1_desc:0 "Semi-automatic breeches and higher chamber pressures allow us to both increase the rate of fire and range of our field guns."
 field_gun2_2:0 "Field Gun Sight- and Ammunition Upgrade"
 field_gun2_2_desc:0 "Optics production is one of the faster developing fields after the war, and also allows for a broad increase in the direct fire abilities of our field guns. Also the considerable AT capabilities of these high velocity pieces was already noted in the Great War. Dedicated AT ammunition needs to be developed and distributed."
 field_gun3:0 "Field Gun 1936"
 field_gun3_desc:0 "With the various innovations in gun and carriage design in the last decade, it is clear that a completely new field gun design is needed. This allows us to create a weapon which utilizes these developments fully."
 field_gun5_1:0 "Field Gun Carriage Modernization"
 field_gun5_1_desc:0 "Modern carriages make our field guns overall easier to handle when in position, and also positively affect the ability to hit moving targets. However this increase in weight makes the getting of the guns to the positions harder without motorized prime movers."
 field_gun5_2:0 "Light Carriages"
 field_gun5_2_desc:0 "The lightness and the ability to maneuver even when just pushed by the crew should be the prime consideration for the modernization of our field artilleries carriages."
 rocket_artillery_spin:0 "Spin-Stabilized Rockets"
 rocket_artillery_spin_desc:0 "With milling the exhaust nozzles on our rockets in a way, which causes the spin of the projectile due to the venturi effect, we can make our rocket artillery as accurate as possible. However much intricate work is require compared to simple fins."
 rocket_artillery_fin:0 "Fin-Stabilized Rockets"
 rocket_artillery_fin_desc:0 "Fin-Stabilized rockets are comparatively inaccurate compared to spin-stabilized projectiles. However their benefits come in immense producability, which allows for firing the rockets in huge barrages."
 rocket_artillery3:0 "Rocket Artillery Launcher and Propellant Upgrade"
 rocket_artillery3_desc:0 "The launchers for rocket artillery can be made from lighter and cheaper materials than originally thought, without constraining combat performance. The constant advances in propellant chemistry allows us to increase the range of our rockets with just changing the mixture to a more potent one."
 motorized_rocket_support:0 "Motorized Rocket Artillery Support"
 motorized_rocket_support_desc:0 "Equiping our rocket artillery support companies with truck mounted launchers allows us to reap the same benefits the equipment already provides to our line battalions"
 mountain_gun:0 "Mountain Gun"
 mountain_gun_desc:0 "The mountainous terrain of Northern India led to the development of an artillery piece that could be dismantled and carried on muleback to wherever it was needed."
 interwar_antiair:0 "Anti-Air 1930"
 anti_air_moto:0 "Anti-Air Support Motorization"
 anti_air_moto_desc:0 "Motorization of our supporting anti-air elements allows for faster relocation of guns to more advantageous positions, and more closely integrated fire support to troops."
 antiair3:0 "Anti-Air 1940"
 antiair4:0 "Anti Air Sights and Ammunition Upgrade"
 antiair4_desc:0 "Introducing better ammunition designs, and standardising on colimator sights for all anti-aircraft guns increases the effectiveness of the weapons for minimal cost."
 heavy_antiair_1:0 "Semi-Automatic Breech"
 heavy_antiair_1_desc:0 "A semi-automatic loading system ejects fired shells, allowing the gun be reloaded by simply inserting a new shell into a tray. The gun will then fire and recoil; during the return stroke, the empty case will be thrown backward by levers, after which a cam will engage and recock the gun. Used already in some smaller guns, anti aircraft artillery benefits the most from the increased rof, and extra complexity isn't that much of an issue."
 antiairfc:0 "Centralized Anti Air Firecontrol"
 antiairfc_desc:0 "Centralized firecontrol for heavy anti-air artillery isn't a new invention, but integrating lighter guns to the same directors and networks yields great improvements in the deadliness of our AA fire."
 antitank1:0 "Anti-Tank Support Motorization"
 antitank1_desc:0 "It is apparent that horse-drawn anti-tank artillery is obsolescent. The speed and dynamics of modern combat simply won't allow horse-drawn AT cannons to be effective, since even motor-towed anti-tank cannons are considerably less mobile on the battlefield than the tanks they are meant to counter."
 at_line_mot:0 "Motorized Anti-Tank Primacy"
 at_line_mot_desc:0 "Anti-Tank artillery due to the front line usage against highly mobile targets benefits immensely from motorization. The current weapons also are starting to be too heavy to manhandle to positions. The both in and out of combat benefits of motorizations are too great. We must at least semi-motorize all of Anti-Tank battalions."
 antitank5_2:0 "Anti-Tank Barrel and Ammunition Upgrade"
 antitank5_2_desc:0 "A new gun with enough piercing would be way bulkier than the current ones, and thus impacting the tactical use of the weapons negatively. We will rather keep the current AT-weapons relevant with longer barrels and better ammunition designs."
 suicide_craft:0 "Yokosuka MXY7 Ohka"
 suicide_craft_desc:0 "Rocket powered kamikaze craft"
 infantry_weapons:0 "Infantry Weapons"
 motorized_rocket_unit:0 "Motorized Rocket Artillery"
 bicycle_infantry:0 "Bicycle Infantry"
 bicycle_infantry_desc:0 "Regular infantry with bicycles are more mobile than their marching counterparts, for a very modest price."
 amphibious_mechanized_infantry_2:0 "Improved Amphibious Tractors"
 amphibious_mechanized_infantry_2_desc:0 "These Amtracs feature several improvements over the base version, such as a rear loading ramp for easier unloading on the beach."
 scout_plane1:0 "Scout Plane I"
 scout_plane1_desc:0 "Gathering intelligence on enemy troop movements and providing reports of enemy naval deployments has been the original mission for airplanes since their first deployment in the Great War, and is still an important mission."
 scout_plane2:0 "Scout Plane II"
 scout_plane2_desc:0 "By developing dedicated planes to aerial surveillance and long-range reconnaissance, we ensure that we gain and maintain an accurate picture of our opponent's intentions and capabilities."
 usa_heavy_tank_1943:0 "M26 Pershing"
 motorized_rocket_unit_desc:0 "Self-propelled artillery utilizing multiple rockets will be able to cause large-scale destruction rapidly, while maintaining mobility to avoid counter-fire."
 camo_upgrade_1:0 "Camouflage uniforms"
 camo_upgrade_2:0 "Improved camouflage patterns"
 camo_upgrade_1_desc:0 "Camouflage uniforms"
 camo_upgrade_2_desc:0 "Improved camouflage patterns"
 ger_medium_tank_1938:0 "Panzer III Ausf.E"
 ger_medium_tank_1940:0 "Panzer III Ausf.H"
 support_weapons:0 "Medium Machineguns and Mortars I"
 support_weapons_desc:0 "Mounted machineguns have already proven to be queen of the battlefield in the Great War. The mortar has also proven its worth as a the round could be aimed to fall directly into trenches, where artillery shells, because of their low angle of flight, could not possibly go. The development of both must continue."
 support_weapons2:0 "Medium Machineguns and Mortars II"
 support_weapons2_desc:0 "Medium machineguns are becoming more portable thanks to better mounts and dispensing with the water jacket on newer designs. A modified version of the mortar, which fires a modern fin-stabilised streamlined projectile and has a booster charge for longer range will be put into service."
 support_weapons3:0 "Improved Mortar and MG Ammunition"
 support_weapons3_desc:0 "New shell types like improved smoke shells and white phosphorus rounds make our mortars more useful in the more varied situations of modern war. Introduction of incendiary and armour piercing ammunition in limited quantities to our medium MG teams makes the weapon even deadlier against more broad range of targets."
 support_weapons4:0 "Medium Machineguns and Mortars III"
 support_weapons4_desc:0 "With new firing mechanisms improving reliability of our mounted machine guns, we can also experiment with higher rates of fire. The mortar has proven to be a crucial support for our infantry during the conflict, we must introduce larger caliber types of them to bring them closer to artillery in range and deadliness."
 support_weapons5:0 "Medium Machineguns and Mortars IV"
 support_weapons5_desc:0 "With the growing firepower of the handheld machinegun, the lafette mounted guns role is questioned. Focusing on the ability to fire longer and stability provided by the heavier barrels still allows us to find a place for them in the battlefield. The role of the mortar is now clearly defined. New designs and better firecontrol offers our units better support than ever."
 basic_tank_engines:0 "Basic Engines"
 basic_tank_engines_desc:0 "Basic tank engine."
 diesel_engine:0 "Diesel Engines"
 diesel_engine_desc:0 "The diesel engine (also known as a compression-ignition or CI engine) is and internal combustion engine in which ignition of the fuel, which is injected into the combustion chamber, is caused by the elevated temperature of the air in the cylinder due to the mechanical compression."
 petrol_engine:0 "Petrol Engines"
 petrol_engine_desc:0 "A petrol engine (known as a gasoline engine in English) is an internal combustion engine with spark-ignition, designed to run on petrol and similar volatile fuels."
 suspension_upgrade:0 "Improved Suspensions"
