 siege_artillery2:0 "Improved Spotter Plane Coordination"
 siege_artillery2_desc:0 "The advances in radio technology have made it possible to rapidly react to the intelligence gained by spotting aircraft supporting our heaviest guns."
 siege_artillery4_1:0 "Mechanized Towing"
 siege_artillery4_1_desc:0 "We must prioritize towing our siege artillery without breaking it apart. This allows us to bring it to fire in considerably faster pace, but requires the heaviest prime movers in our arsenal."
 siege_artillery4_2:0 "Tracked Carriage"
 siege_artillery4_2_desc:0 "Tracked carriages allow us to tow our siege guns with tracked tractors at short ranges without transporting the gun and the carriage separately."
 siege_artillery5_1:0 "High Speed Tractors"
 siege_artillery5_1_desc:0 "With investing into dedicated high power artillery tractors capable of pulling our siege guns at road speeds, we are able to offer unparalleled artillery support on offense."
 siege_artillery5_2:0 "Direct Fire Doctrine"
 siege_artillery5_2_desc:0 "Tracked carriages have allowed some enterprising officers to utilize our heaviest guns at close range in urban combat. We should cement this approach to our doctrine."
 siege_artillery6:0 "Advanced Counter Battery Tactics"
 siege_artillery6_desc:0 "Better coordination with our artillery spotters and our lighter artillery allows us to hit our enemies even harder and more accurately."
 ger_advanced_turret:0 "Improved Turret for 40 Medium Hull"
 ger_advanced_turret_desc:0 "Improved turret for 1940 Medium Tank hull, which allows mounting of §HMedium Armaments§!"
 ger_spaced_armor:0 "Spaced Armor"
 ger_spaced_armor_desc:0 "We can use the spare carrying capacity on our mainline medium tank to strengthen its armor by mounting applique plates."
