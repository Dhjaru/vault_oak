 TASK_FORCE_COMPOSITION_TEMPLATE_DELETE_TITLE:0 "Delete Template"
 TASK_FORCE_COMPOSITION_TEMPLATE_DELETE_BODY:0 "Are you sure you want to delete the template §Y$NAME$§!?"
 TASK_FORCE_COMPOSITION_TEMPLATE_SAVE_TITLE:0 "Save Template"
 TASK_FORCE_COMPOSITION_TEMPLATE_SAVE_BODY:0 "Enter a name to save this task force composition template."
 TASK_FORCE_COMPOSITION_TEMPLATE_SAVE_NAME_LABEL:0 "Name"
 OPEN_TASK_FORCE_COMPOSITION_EDITOR_BULK:0 "Open the task force composition editor for all selected task forces"
 TASK_FORCE_COMPOSITION_EDITOR_BULK_DESC:0 "Allows you to set targets for the number of ships of each class you want to maintain, applying the same template to every selected task force at once.\nRequires §YAutomatic reinforcement§! to be enabled."
 CANNOT_OPEN_TASK_FORCE_COMPOSITION_EDITOR_BULK:0 "§RNone of the selected task forces can have their composition edited§!"
 AUTO_BALANCE_SHIPS_IN_TASK_FORCES_IN_COMBAT:0 "§RCannot distribute ships of a task force that is in combat§!"
 RIGHT_CLICK_TO_RESERVE_ALL_TASK_FORCES:0 "§GRight-Click§! to move all task forces of this theater to reserve"
 hq_armored_car:0 "Armored Car HQ Security"
 hq_armored_car_desc:0 "Armored cars escort the HQ, combining mobility with protection and excellent reconnaissance."
 VICTORY_POINTS_12269:0 "Janjira"
 VICTORY_POINTS_10004:0 "Fangcheng"
 VICTORY_POINTS_10810:0 "Nyingchi"
 VICTORY_POINTS_4379:0 "Hué"
 VICTORY_POINTS_7254:0 "Bassein"
 VICTORY_POINTS_1693:0 "Heihe"
 VICTORY_POINTS_10212:0 "Jesselton"
 VICTORY_POINTS_4361:0 "Tanjung Karang Teluk Betung"
 integrate_singapore:0 "Integrate Singapore"
 integrate_penang:0 "Integrate Penang"
 form_pan_tai_empire:0 "Form the Pan-Tai Empire"
 form_pan_tai_empire_category:0 "Form the Pan-Tai Empire"
 form_pan_tai_empire_category_desc:0 "The Great Thai Empire has restored our nation to the borders of its glory days, yet the Tai peoples stretch far beyond them. From the Shan hills to the Dai of Yunnan, the Zhuang of Guangxi and the distant Ahom of Assam, our kin remain divided. Now that these ancestral homelands fly our banner, let us proclaim a single empire for all the Tai."
 VICTORY_POINTS_6756:0 "San Sebastián"
 ITA_missiolini_occupy_ticino_desc:0 "Ever since Hannibal crossed the Alps with his elephants, the mountains have been a highway for barbarians straight into Italy’s heartlands. We must secure our northern border."
 bftb_greece.23.desc:0 "The majority of the attending delegates have voted that [ITA.GetNameDef] should be denied the right to establish any colonies in southern [TUR.GetNameDef], and have condemned the motion itself as more fatuous [ITA.GetAdjective] warmongering. [ITA.GetAdjective] officials attacked the decision and used the whole situation to illustrate how it is yet more proof that the [ITA.GetAdjective] people are right to believe in the 'vittoria mutilata'. Regardless of their personal views on the matter, [ITA.GetAdjective] delegates have been ordered to remain as part of the convention's proceedings - no doubt with the hope that they can still influence the verdict on the final and most important item on the agenda."
 bftb_greece.179.desc:0 "When the [FROM.GetAdjective]s decided to invite us to further discuss deepening our economic ties we could not refuse. Needless to say, they made a compelling case for why it might be ideal that [FROM.GetAdjective]'s industrial standing was strengthened. The matter of whether we seek to invest in their nation or leave their industrial potential up to fate is a matter we get to decide."
