 GER_construction_infrastructure_here:0 "§Y[This.GetName]§!: Add §Y1 Infrastructure§!\nModify §YArbeitseinsatz§! by\n§YAir Base§! construction speed: §G+1%§!\n§YNaval Base§! construction speed: §G+1%§!\n§YRocket Site§! construction speed: §G+1%§!\n§YRadar Station§! construction speed: §G+1%§!\n§YNuclear Reactor§! construction speed: §G+1%§!\n§YRailway§! construction speed: §G+1%§!\n§YSupply Hub§! construction speed: §G+1%§!\n§YInfrastructure§! construction speed: §G+1%§!\n-----\nUsing the workers enrolled into the §YArbeitseinsatz§!, you can build Infrastructure here. Each level of §YInfrastructure§! costs §R1000§! workers, and you can't go over level 10. The buildings are built instantaneously.\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
 GER_construction_arms_factory_conversion_here:0 "§Y[This.GetName]§!: Remove §Y1 Industrial Complex§! or §Y1 Arms Factory§!\n-----\nUsing the workers enrolled into the §YArbeitseinsatz§!, you can dismantle factories here. Each dismantled factory costs §R1000 workers§!.\n\n§RThis action will increase resistance in [This.GetName] by §Y4§!.§!\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
 GER_construction_radar_here:0 "§Y[This.GetName]§!: Add §Y1 Radar Station§!\nModify §YArbeitseinsatz§! by\n§YAir Base§! construction speed: §G+1%§!\n§YNaval Base§! construction speed: §G+1%§!\n§YRocket Site§! construction speed: §G+1%§!\n§YRadar Station§! construction speed: §G+1%§!\n§YNuclear Reactor§! construction speed: §G+1%§!\n§YRailway§! construction speed: §G+1%§!\n§YSupply Hub§! construction speed: §G+1%§!\n§YInfrastructure§! construction speed: §G+1%§!\n-----\nUsing the workers enrolled into the §YArbeitseinsatz§!, you can build a Radar Station here. Each level of §YRadar Station§! costs §R1500§! workers. The buildings are built instantaneously.\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
 GER_construction_anti_air_here:0 "§Y[This.GetName]§!: Add §Y1 Anti-Air§!\nModify §YArbeitseinsatz§! by\n§YAir Base§! construction speed: §G+1%§!\n§YNaval Base§! construction speed: §G+1%§!\n§YRocket Site§! construction speed: §G+1%§!\n§YRadar Station§! construction speed: §G+1%§!\n§YNuclear Reactor§! construction speed: §G+1%§!\n§YRailway§! construction speed: §G+1%§!\n§YSupply Hub§! construction speed: §G+1%§!\n§YInfrastructure§! construction speed: §G+1%§!\n-----\nUsing the workers enrolled into the §YArbeitseinsatz§!, you can build Infrastructure here. Each level of §YAnti-Air§! costs §R1500 workers§!. The buildings are built instantaneously.\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
