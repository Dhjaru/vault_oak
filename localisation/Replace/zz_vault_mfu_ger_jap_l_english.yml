 jap_advanced_turret_short:0 "Improved Turret for 40 Medium Hull"
 jap_advanced_turret_desc:0 "Improved turret for 1940 Medium Tank hull, which allows mounting of §HMedium Armaments§!"
 GER_artillery_equipment_1:0 "10.5cm leichte Feldhaubitze 16"
 GER_artillery_equipment_1_short:0 "10.5cm leFH 16"
 GER_artillery_equipment_1_desc:0 "The 10.5 cm leichte Feldhaubitze 16 was introduced in 1916 as a successor to 10.5 cm Feldhaubitze 98/09, featuring a longer barrel and hence longer range. It has the same carriage as the 7.7 cm FK 16."
 GER_artillery_equipment_2:0 "10.5cm leichte Feldhaubitze 18"
 GER_artillery_equipment_2_short:0 "10.5cm leFH 18"
 GER_artillery_equipment_2_desc:0 "Designed in the late 1920s, this gun represents a major advance on its predecessor the 10.5 cm leFH 16. It is superior in caliber to its contemporaries, with adequate range and firepower, but the modern split trail gun carriage which provides it with more stability and traverse also renders it overly heavy for a mobile role in the largely horse-drawn artillery battalions of the Heer."
 GER_artillery_equipment_3:0 "10.5cm schwere Kanone 18/42"
 GER_artillery_equipment_3_short:0 "10.5cm sK 18/42"
 GER_artillery_equipment_3_desc:0 "A long range cannon mounted on the carriage of the sFH 18 with a very similar outline. It has almost double the range to the leFH 18, but as a downside it weighs as much as the 15cm gun whilst having less punching power."
 JAP_artillery_equipment_1:0 "Type 38 105mm Field Howitzer"
 JAP_artillery_equipment_1_short:0 "Type 38 105mm"
 JAP_artillery_equipment_1_desc:0 "The type 38 is a licensed copy of a 1905 Krupp design. The Type 38 designation was given to this gun as it was accepted in the 38th year of Emperor Meiji's reign (1905). After experience in the Great War, the Type 38 was upgraded to the "C" version, with a lengthened bore and modified carriage to permit a higher angle of fire."
 JAP_artillery_equipment_2:0 "Type 91 105mm Howitzer"
 JAP_artillery_equipment_2_short:0 "Type 91 105mm"
 JAP_artillery_equipment_2_desc:0 "The Type 91 10 cm howitzer is an orthodox design, based largely on contemporary French Canon de 105 mle 1913 Schneider howitzers ordered during the late 1920s. It is much smaller and lighter than the German and U. S. howitzers of the same caliber, weighing even less than the standard 75 mm  guns used in Europe in the Great War. Despite its lightness and its appearance of not having been quite finished, it is capable of throwing a (16 kg) shell very nearly as far as can the heavier and far more formidable looking German 105 mm howitzer."
 JAP_artillery_equipment_3:0 "Type 92 105mm Cannon"
 JAP_artillery_equipment_3_short:0 "Type 92 105mm"
 JAP_artillery_equipment_3_desc:0 "Readily recognized by its long slender gun barrel and split carriage trail, the Type 92 10 cm cannon is designed particularly for long-range fire. The most remarkable fact about the Type 92, aside from its appearance, is the great range that it attains with a 16 kg shell in proportion to its unusually low weight. It has been reported that the weapon is rarely fired at extreme ranges, which require the use of a supercharge, because of malfunctions in the recoil system caused thereby."
 GER_field_gun_equipment_1:0  "7.7cm Feldkanone 16"
 GER_field_gun_equipment_1_short:0 "7.7cm FK 16"
 GER_field_gun_equipment_1_desc:0 "The FK 16 is an extensive overhaul of the 7.7 cm FK 96 n.A., designed for the needs of trench warfare. The barrel was lengthened and it was given a box carriage to allow for greater elevation, which increased the range. It was also given separate-loading ammunition to reduce powder consumption and barrel wear at short ranges, although this had the drawback of reducing the rate of fire compared to the older gun. Most surviving examples in Heer service were rebarreled after the war as the 7.5 cm FK 16 n.A."
 GER_field_gun_equipment_2:0 " 7.5cm Feldkanone 18"
 GER_field_gun_equipment_2_short:0 "7.5cm FK 18"
 GER_field_gun_equipment_2_desc:0 "The FK 18 has a modern split trail carriage, with the rear section and spades folding upwards for travel. It uses a typical German recoil system where the hydraulic buffer is housed in the cradle underneath the barrel and the hydro-pneumatic recuperator in a cylinder above the barrel. For some reason the FK 18 is unusually prone to bore damage from cartridge debris and the barrel has to be inspected after every shot to ensure that it is clear."
 JAP_field_gun_equipment_1:0 "Type 38 75mm Field Gun"
 JAP_field_gun_equipment_1_short:0 "Type 38 75mm"
 JAP_field_gun_equipment_1_desc:0 "Although we had extensive experience with artillery, as the result of the war with Russia and had the technology and industrial infrastructure to construct medium or large caliber naval weapons prior to the Great War, planners at the Imperial Japanese Army General Staff turned to Krupp in Germany, for the latest trend in artillery design. So, Krupp 7.5 cm Model 1903 were imported. However, after the Great War, Japanese production capabilities had improved, and the Type 38 underwent a re-design in Japan to improve the carriage, with a corresponding increase in elevation, range and rate of fire to 10-12 rounds per minute."
 JAP_field_gun_equipment_2:0 "Type 90 75mm Field Gun"
 JAP_field_gun_equipment_2_short:0 "Type 90 75mm"
 JAP_field_gun_equipment_2_desc:0 "Prior to the Great War, the IJA was largely equipped with Krupp cannons from Germany. After the Versailles Treaty, the we switched to the French Schneider company, and purchased numerous examples for test and evaluation. With an army rearmament program starting in 1931, a new 75 mm field gun loosely based on the Schneider Canon de 85 mle 1927 built for Greece was introduced, and labeled the Type 90. Even if capable, design is very complex and expensive to build, requiring very tight dimensional tolerances that are beyond the limits of our industry. In particular, the recoil system requires high amounts of complex maintenance, which is difficult to sustain in front line combat service."
 GER_pack_artillery_equipment_1:0 "7.7cm Infanteriegeschütz L/20"
 GER_pack_artillery_equipment_1_short:0 "7.7cm IG L/20"
 GER_pack_artillery_equipment_1_desc:0 "Infanteriegeschütz L/20 was created by Krupp with mounting a shortened 7.7 cm Feldkanone 96 n.A on one of their mountain howitzer carriages. It fires the full range of ammunition of the FK 96 n.A., but generally only with a reduced charge, although it retains the capacity to fire the old full-power charges that gave a maximum muzzle velocity of 435 m/s. It also uses a then new full-power anti-tank round."
 GER_pack_artillery_equipment_2:0 "7.5cm Leichtes Infanteriegeschütz 18"
 GER_pack_artillery_equipment_2_short:0 "7.5cm Le.IG 18"
 GER_pack_artillery_equipment_2_desc:0 "Development of the gun began in 1927 as a purpose made infantry support gun compared to the earlier conversions. It was adopted by the heer in 1932."
 GER_pack_artillery_equipment_3:0 "7.5cm Infanteriegeschütz 37/44"
 GER_pack_artillery_equipment_3_short:0 "7.5cm IG 37/44"
 GER_pack_artillery_equipment_3_desc:0 "The IG 37s were manufactured from carriages of 3.7cm Pak 36s and a barrel designed originally for the IG 42 infantry support gun. While the gun carriage was an old design, the gun itself was a new design created by Krupp, though the design had been shelved at the time of its conception."
 JAP_pack_artillery_equipment_1:0 "Type 41 75mm Mountain Gun"
 JAP_pack_artillery_equipment_1_short:0 "Type 41 75mm"
 JAP_pack_artillery_equipment_1_desc:0 "A Japanese license-built copy of the Krupp M1908 mountain gun. The weapon can be transported complete by its thirteen-man squad, or broken down into parts and carried on six pack horses using special harnesses, a seventh horse is used to carry ammunition."
 JAP_pack_artillery_equipment_2:0 "Type 94 75mm Mountain Gun"
 JAP_pack_artillery_equipment_3:0 "Type 4 75mm Infantry Gun"
 JAP_pack_artillery_equipment_2_short:0 "Type 4 75mm"
 JAP_pack_artillery_equipment_2_desc:0 "Shortened barrel of the Type 90 field gun mounted on a new lightweight carriage will provide our army a modern light artillery piece that's also easily motorized."
 GER_heavy_artillery_equipment_1:0 "15cm Schwere Feldhaubitze 13"
 GER_heavy_artillery_equipment_1_short:0 "15cm sFH 13"
 GER_heavy_artillery_equipment_1_desc:0 "The gun was loosely based on the previous standard howitzer, the 15 cm sFH 02. Improvements included a longer barrel resulting in better range and a gun shield to protect the crew. The ability of these guns to deliver mobile heavy firepower close to the frontline gave the us a major firepower advantage on the Western Front early in the Great War, as the French and British lacked an equivalent."
 GER_heavy_artillery_equipment_2:0 "15cm Schwere Feldhaubitze 18"
 GER_heavy_artillery_equipment_2_short:0 "15cm sFH 18"
 GER_heavy_artillery_equipment_2_desc:0 "The sFH 18 replaced the earlier, Great War-era design of the 15 cm sFH 13, which was judged by the Krupp-Rheinmetall designer team of the sFH 18 as completely inadequate. The sFH 18 was twice as heavy as its predecessor, had a muzzle velocity increase of forty percent, a maximum firing range 4.5 kilometers greater, and a new split-trail gun carriage that increased the firing traverse twelvefold. The secret development from 1926–1930 allowed our industry to deliver a trouble-free design at the beginning of the re-armament in 1933"
 GER_heavy_artillery_equipment_3:0 "15cm Kanone 18/40"
 GER_heavy_artillery_equipment_3_short:0 "15cm K 18/40"
 GER_heavy_artillery_equipment_3_desc:0 "A new artillery piece to fulfill a Heer requirement for a modern 15cm cannon. The army is happy with the range, but not with the carriage. There is a special transport carriage for just the gun when traveling long distances. Putting it on its turntable takes even more time to assemble."
 JAP_heavy_artillery_equipment_1:0 "Type 4 149mm Howitzer"
 JAP_heavy_artillery_equipment_1_short:0 "Type 4 149mm"
 JAP_heavy_artillery_equipment_1_desc:0 "The Type 4 designation was given to this gun as it was accepted in the 4th year of Emperor Taishō's reign (1915). The Type 4 was notable as the first Japanese artillery piece to use a hydro-pneumatic recoil system. It has a vertical sliding breech block and a box type trail. It can be moved short distances as one load, but needed to be broken down into two loads for longer distances."
 JAP_heavy_artillery_equipment_3:0 "Type 96 149mm Cannon"
 JAP_heavy_artillery_equipment_3_short:0 "Type 96C 149mm"
 JAP_heavy_artillery_equipment_3_desc:0 "The Type 96 is a development from the earlier Type 89 15 cm cannon but with a longer barrel and a heavier carriage. As a result, it attains much improved range over type 89, the earlier guns primary downfall. Due to the heavy weight of the gun, mobility is a concern. "
 JAP_heavy_artillery_equipment_2:0 "Type 96 149mm Howitzer"
 JAP_heavy_artillery_equipment_2_short:0 "Type 96 149mm"
 JAP_heavy_artillery_equipment_2_desc:0 "The Type 96 15 cm howitzer is a modern, well designed and effective weapon. Mounted on sturdy, rubber-shod, wooden wheels, the weapon is normally tractor drawn. One of its outstanding characteristics is its extreme elevation capability of 65 degrees."
 GER_siege_artillery_equipment_1:0 "21 cm Mörser 16"
 GER_siege_artillery_equipment_1_short:0 "21 cm Mörser 16"
 GER_siege_artillery_equipment_2:0 "21 cm Mörser 18"
 GER_siege_artillery_equipment_2_short:0 "21 cm Mörser 18"
 JAP_siege_artillery_equipment_1:0 "Type 45 240mm Howitzer"
 JAP_siege_artillery_equipment_1_short:0 "Type 45 240mm"
 JAP_siege_artillery_equipment_2:0 "Type 96 240mm Howitzer"
 JAP_siege_artillery_equipment_2_short:0 "Type 96 240mm"
 GER_anti_air_equipment_1:0 "2cm FlaK 30"
 GER_anti_air_equipment_1_short:0 "2cm FlaK 30"
 GER_anti_air_equipment_1_desc:0 "A Kriegsmarine C/30 converted for Army use by Rheinmetall, producing the 2 cm Flak 30. Generally similar to the C/30, the main areas of development were the mount, which was fairly compact. Set-up can be accomplished by dropping the gun to the ground off its two-wheeled carriage and levelling with hand cranks. The result is a triangular base that allowed fire in all directions. The rate of fire of 120 RPM however is not particularly fast for a weapon of this calibre."
 GER_anti_air_equipment_2:0 "3.7cm Flak 36"
 GER_anti_air_equipment_2_short:0 "3.7cm Flak 36"
 GER_anti_air_equipment_2_desc:0 "The Flak 36 is a further development of the small batch produced Flak 18 37mm. The development focused on replacing of the existing cumbersome dual-axle mount with a lighter single-axle one, resulting in the 3.7 cm Flak 36 that cut the complete weight to 1,550 kg in combat and 2,400 kg in transport. The gun's ballistic characteristics were not changed, although the practical rate of fire was raised to 120 rpm. The armour penetration is considerable when using dedicated ammunition, at 100m distance it can penetrate 36 mm of a 60°-sloped armour"
 GER_anti_air_equipment_3:0 "3.7cm Flak 43 Zwiling"
 GER_anti_air_equipment_3_short:0 "3.7cm Flak 43"
 GER_anti_air_equipment_3_desc:0 ""
 JAP_anti_air_equipment_1:0 "Type 93 13.2mm AA Machine Gun"
 JAP_anti_air_equipment_1_short:0 "Type 93 13.2mm"
 JAP_anti_air_equipment_1_desc:0 "The Type 93 13.2mm machine gun is a Japanese license-built version of the 13.2mm Hotchkiss M1929 machine gun. The army was so impressed with the gun's performance that they chose to produce it over domestic models."
 JAP_anti_air_equipment_2:0 "Type 98 20mm AA Machine Cannon"
 JAP_anti_air_equipment_2_short:0 "Type 98 20mm"
 JAP_anti_air_equipment_2_desc:0 "The Type 98 20mm is the most common AA gun produced by the IJA. It can be emplaced in only 3 minutes and weighs 373 kg. It has a practical maximum fire rate of 120 rounds per minute."
 JAP_anti_air_equipment_3_short:0 "Type 5 40mm"
 JAP_anti_air_equipment_3:0 "Type 5 40mm AA Machine Cannon"
 JAP_anti_air_equipment_3_desc:0 "The Type 5 is a Japanese copy of the immensely successful 40mm Bofors AA cannon."
 GER_anti_tank_guided_missile_equipment_1:0 "X-7 Röttkäpchen"
 GER_anti_tank_guided_missile_equipment_1_short:0 "X-7 Röttkäpchen"
 GER_heavy_anti_air_equipment_1:0 "8.8cm Flugabwehrkanone 16"
 GER_heavy_anti_air_equipment_1_short:0 "8.8cm Flak 16"
 GER_heavy_anti_air_equipment_1_desc:0 "The first dedicated German AA gun, the Flak 16, was introduced in 1917, using the 88 mm caliber, common in the Kaiserliche Marine."
 GER_heavy_anti_air_equipment_2:0 "8.8cm Flugabwehrkanone 18"
 GER_heavy_anti_air_equipment_2_short:0 "8.8cm Flak 18"
 GER_heavy_anti_air_equipment_2_desc:0 "Prototype 88s were first produced in 1928 in collaboration with Swedish Bofors company. The gun is mounted on a cruciform gun carriage. A simple-to-operate "semi-automatic" loading system ejects fired shells, allowing it to be reloaded by simply inserting a new shell into a tray. The Flak 18's carriage allows it to fire in an emergency when still on its wheels and without its outriggers."
 GER_heavy_anti_air_equipment_3:0 "8.8cm Flugabwehrkanone 41"
 GER_heavy_anti_air_equipment_3_short:0 "8.8cm Flak 41"
 GER_heavy_anti_air_equipment_3_desc:0 "An improvement upon the already world-beating FlaK 36, the 41 has a performance said to be "almost equal to the 128-mm" according to General der Flakartillerie Otto Wilhelm von Renz. However the guns mounting is not the best and the weapon itself is expensive and too complex."
 JAP_heavy_anti_air_equipment_1:0 "Type 88 75mm AA gun"
 JAP_heavy_anti_air_equipment_1_short:0 "Type 88 75mm"
 JAP_heavy_anti_air_equipment_1_desc:0 "The Type 88 75 mm AA gun is based on an exhaustive evaluation by the Army Technical Bureau of several existing overseas designs, amalgamating some of the best features from each design into a new, Japanese design.  Although it has been difficult and expensive weapon for us to produce with our limited industrial infrastructure and production technology, it has been produced in large numbers."
 JAP_heavy_anti_air_equipment_2:0 "Type 99 88mm AA gun"
 JAP_heavy_anti_air_equipment_2_short:0 "Type 99 88mm"
 JAP_heavy_anti_air_equipment_2_desc:0 "During the Battle of Nanjing, our forces captured a number of German-made SK C/30 anti-aircraft guns from the Republic of China. These weapons were originally naval anti-aircraft weapons for the Third Reich's Kriegsmarine. Quickly realizing the superiority of this design in terms of range and firepower over the Type 88 75 mm AA gun, the Army Technical Bureau quickly reverse engineered it, and placed it into production."
 JAP_heavy_anti_air_equipment_3:0 "Type 5 88mm AA gun"
 JAP_heavy_anti_air_equipment_3_short:0 "Type 5 88mm"
 JAP_heavy_anti_air_equipment_3_desc:0 "Our forces have captured examples of the Bofors M29 75mm AA gun from the National Revolutionary Army of the Kuomintang government of China, and the Army Technical Bureau is impressed with its performance, which is much superior to our existing aa guns. By reverse engineering a close copy was designed as the Type 4 75mm. With the firing mechanism able to easily handle larger loads, the design was later adapted for the 88mm shell as the Type 5."
 GER_anti_tank_equipment_desc:0 "Artillery specialized in defeating armored targets like Tanks, it generally fires armor piercing shells."
 GER_anti_tank_equipment_1:0 "3.7cm Panzerabwehrkanone 35/36"
 GER_anti_tank_equipment_1_short:0 "3.7cm PaK 35/36"
 GER_anti_tank_equipment_1_desc:0 "A design of a horse-drawn, 3.7 cm anti-tank gun (designated 3.7 cm Pak L/45) by Rheinmetall commenced in 1924 and the first guns were issued in 1928. By the early 1930s, it was apparent that horse-drawn artillery was obsolescent, and the gun was modified for motorized transport by substituting magnesium-alloy wheels and pneumatic tires for the original spoked wooden wheels, allowing it to be towed at highway speeds. Re-designated the 3.7 cm Pak 35/36, it began to replace the 3.7 cm Pak L/45 in 1934."
 GER_anti_tank_equipment_2:0 "5cm Panzerabwehrkanone 38"
 GER_anti_tank_equipment_2_short:0 "5cm PaK 38"
 GER_anti_tank_equipment_2_desc:0 "The Pak 38 is a longer barrel development of the failed 5 cm Pak 37 developed by Rheinmetall-Borsig."
 GER_anti_tank_equipment_3:0 "7.5cm Panzerabwehrkanone 40"
 GER_anti_tank_equipment_3_short:0 "7.5cm PaK 40"
 GER_anti_tank_equipment_3_desc:0 "Contracts were placed with Krupp and Rheinmetall to develop what is essentially a 7.5 cm version of the Pak 38 after reports reached Berlin about new, heavier allied armour being deployed. However, whilst the Pak 38 makes extensive use of light alloys to reduce overall gun weight, these are now earmarked for the Luftwaffe. As a result, the Pak 40 uses steel throughout its construction and is proportionally heavier than the 5 cm model. To simplify production, the Pak 38's curved gun shield was also replaced by one using three flat plates"
 GER_anti_tank_equipment_4:0 "8.8cm Panzerabwehrkanone 43"
 GER_anti_tank_equipment_4_short:0 "8.8cm PaK 43"
 GER_anti_tank_equipment_4_desc:0 "The Pak 43 is the most powerful anti-tank gun of the Wehrmacht to see service yet. The improved 8.8 cm gun is fitted with a semi-automatic vertical breech mechanism that greatly reduced recoil. It has a very flat trajectory out to 1km, making it easier for the gunner to hit targets at longer ranges as fewer corrections in elevation are needed."
 JAP_anti_tank_equipment_1:0 "Type 94 37 mm Rapid-firing Gun"
 JAP_anti_tank_equipment_1_short:0 "Type 94 37mm"
 JAP_anti_tank_equipment_1_desc:0 "The design originates as an improvement to the Type 11 37 mm infantry gun, which is also used as a primitive anti-tank weapon. However, its short bore, low muzzle velocity, short range and slow reloading time gave it a limited capacity against enemy armor. Development of a replacement began in July 1933 and was completed a year later. As with many Japanese designs, it has a very low profile and was intended to be operated from a squatting or prone position."
 JAP_anti_tank_equipment_2:0 "Type 1 Mobile 47 mm Rapid-firing Gun"
 JAP_anti_tank_equipment_2_short:0 "Type 1 47mm"
 JAP_anti_tank_equipment_2_desc:0 "After the Nomonhan Incident, the Imperial Japanese Army started the development of a new anti-tank gun, considering that the older models would likely be ineffective against the new Soviet tanks. The design is the first completely indigenous anti-tank gun design completed in Japan, and production is assigned to the army's Osaka Arsenal."
 JAP_anti_tank_equipment_3:0 "Type 2 Mobile 75mm Anti-Tank Gun"
 JAP_anti_tank_equipment_3_short:0 "Type 2 75mm"
 JAP_anti_tank_equipment_3_desc:0 "The belief among our general staff that we would only face light allied armor in the pacific has been proven false. A lengthened barrel firing same ammunition as the Type 90 field gun combined to a new carriage will provide the needed higher caliber to combat the current allied armor."
 JAP_anti_tank_equipment_4:0 "Type 6 Mobile 88mm Anti-Tank Gun"
 JAP_anti_tank_equipment_4_short:0 "Type 6 88mm"
 JAP_anti_tank_equipment_4_desc:0 "The origins of the Type 6 gun lie in the Type 5 88mm AA gun. The barrel and breech of this high performance gun gives a perfect foundation for a next generation AT gun."
 GER_rocket_artillery_equipment:0 "Rocket Artillery"
 GER_rocket_artillery_equipment_short:0 "Rocket Artillery"
 GER_rocket_artillery_equipment_desc:0 "Rocket artillery is less accurate and has a much lower sustained rate of fire than batteries of traditional artillery guns. However, they have the capability of simultaneously hitting a target with multiple rockets with devastating effect."
 GER_rocket_artillery_equipment_1:0 "15cm Nebelwerfer 41"
 GER_rocket_artillery_equipment_1_short:0 "15cm Nebelwerfer 41"
 GER_rocket_artillery_equipment_1_desc:0 "The first weapon to be delivered to the Nebeltruppen is the 15 cm Nebelwerfer 41, with purpose-designed rockets gas, smoke, and high-explosive warheads. The launcher is a six-tube one mounted on a towed carriage adapted from that used by the 3.7 cm PaK 36."
 GER_rocket_artillery_equipment_2:0 "30cm Raketenwerfer 56"
 GER_rocket_artillery_equipment_2_short:0 "30cm Raketenwerfer 56"
 GER_rocket_artillery_equipment_2_desc:0 "The 30 cm Raketenwerfer 56 is a six-barreled rocket launcher mounted on the carriage of the 5 cm PaK 38 anti-tank gun. Its 30 cm Wurfkörper 42 Spreng rocket is spin-stabilized and electrically-fired. The rockets have a prominent exhaust trail that kicks up a lot of debris, so the crew has to seek shelter before firing. This meant that they are easily located and have to displace quickly to avoid counter-battery fire."
 JAP_rocket_artillery_equipment:0 "Rocket Artillery"
 JAP_rocket_artillery_equipment_short:0 "Rocket Artillery"
 JAP_rocket_artillery_equipment_desc:0 "Rocket artillery is less accurate and has a much lower sustained rate of fire than batteries of traditional artillery guns. However, they have the capability of simultaneously hitting a target with multiple rockets with devastating effect."
 JAP_rocket_artillery_equipment_1:0 "Type 4 203mm Rocket Launcher"
 JAP_rocket_artillery_equipment_1_short:0 "Type 4 203mm"
 JAP_rocket_artillery_equipment_1_desc:0 "The Type 4 20cm is a 203mm rocket mortar used by the IJA as a low-cost, easy-to-produce weapon with greater accuracy over traditional mortars."
 JAP_rocket_artillery_equipment_2:0 "Type 4 400mm Rocket Launcher"
 JAP_rocket_artillery_equipment_2_short:0 "Type 4 400mm"
 JAP_rocket_artillery_equipment_2_desc:0 "The Type 4 40cm is a 400mm rocket mortar used in by the IJA in a similar role as its smaller 203mm cousin. Unlike the 20cm, which requires no special launching gear, the Type 4 40cm requires specially made launch rails."
 GER_ship_hull_submarine_1:0 "Type IIA "
 GER_ship_hull_submarine_1_desc:0 "The German Type IIA submarine was a single hull, all welded coastal submarine with internal ballast tanks. It displaced over 250 tons and mounts five 533mm torpedo tubes. Six were built between 1934 and 1935."
 GER_ship_hull_submarine_2:0 "Type VIIA "
 GER_ship_hull_submarine_2_desc:0 ""
 GER_ship_hull_submarine_3:0 "Type VIIC"
 GER_ship_hull_submarine_3_desc:0 "The Type VIIC seagoing submarine was the workhorse of the German U-boat force, with 568 commissioned between 1940 and 1945. The ships displaced 770 tons and were armed with five 533mm torpedo tubes."
 GER_ship_hull_submarine_4:0 "Type XXI"
 GER_ship_hull_submarine_4_desc:0 "Type XXI submarines, also known as 'Elektroboote', were the first submarines designed to operate primarily submerged, rather than as surface ships that could submerge as a means to escape detection or launch an attack. Its key features were its streamlined hull and conning tower and its large number of battery cells. It was among the largest of the German submarine classes, displacing over 1,620 tons. There were 118 ships commissioned between 1943 and 1945."
 GER_ship_hull_light_1:0 "Type 23 "
 GER_ship_hull_light_1_desc:0 "The Type 23 was a class of torpedo boat built for the Kriegsmarine following World War I. Six vessels were built between 1926 and 1928 and all served during World War II. Despite their torpedo boat designation, the ships were destroyer-sized, displacing over 920 tons and armed with three 105mm L/45 guns."
 GER_ship_hull_light_2:0 "Zerstörer 1934 "
 GER_ship_hull_light_2_desc:0 "The Zerstörer 1934 class was the first class of German destroyers built since World War I. They were armed with five 5" guns and eight torpedo tubes. 16 ships were built, out of which 12 were the improved Zerstörer 1934A subclass."
 GER_ship_hull_light_3:0 "Narvik Class"
 GER_ship_hull_light_3_desc:0 "Zerstörer 1936A, known to the Allies as Narvik Class destroyers, was designed to carry the new 150mm (5.9") guns. Designed with three single guns aft and a twin gun in the bow, they were originally fitted with a single gun in the bow. Four of the eight ships of the class were later refitted with the twin turrets. A second group of seven destroyers were built to a slightly modified design with twin guns in the bow."
 GER_ship_hull_light_4:0 "Zerstörer 1944"
 GER_ship_hull_light_4_desc:0 "Although the first prototype of a diesel powered destroyer (Zerstörer 1942) was not completed, the development of the ship type continued. Several proposals were made which finally lead to the Zerstörer 1944 project. In addition to a heavy main armament, the ships had an increased Flak armament compared to its predecessors, including the new 5,5 cm AA gun."
 GER_light_cruiser_1:0 "Emden Class "
 GER_light_cruiser_1_desc:0 "Emden was the first large warship built in Germany after World War I. She was laid down in 1921 and commissioned in 1925. The armament consisted of eight 150mm (5.9") guns in single turrets."
 GER_light_cruiser_2:1 "Leipzig Class "
 GER_light_cruiser_2_desc:1 "The Leipzig-class light cruisers were built between 1928 and 1935 as improvements over the preceding Königsberg-class cruisers. They displaced over 8,100 tons, had adequate speed and range, and were armed with nine 15cm SK C/25 guns in their main armament."
 GER_light_cruiser_3:0 "M Class"
 GER_light_cruiser_3_desc:0 "The M-class cruisers were designed as scouts for commerce raiding squadrons. Six ships were ordered as part of Plan Z, with two being laid down before work was halted at the outbreak of the war. The main armament would have been eight 150mm guns in four twin turrets."
 GER_light_cruiser_4:0 "Q Class"
 GER_light_cruiser_4_desc:0 "The Q-class cruisers were a modified M-class design. They were designed to be larger than the M-class with a heavier anti-aircraft armament and improved fire control."
 GER_ship_hull_cruiser_1:0 "Blücher Class"
 GER_ship_hull_cruiser_1_desc:0 "Blücher was the last armored cruiser built by Germany. Her design was innovative for her time and paved the way for the later Von der Tann-class Battlecruisers. By World War I, she was already obsolete. Blücher was sunk at the Battle at the Doggerbank in 1915."
 GER_ship_hull_cruiser_2:0 "Hipper Class "
 GER_ship_hull_cruiser_2_desc:0 "The Admiral Hipper Class heavy cruisers were the first heavy cruisers of the Kriegsmarine. Officially displacing 10,000 tons, in reality they displaced over 16000 tons. They were armed with eight 8" guns in four twin turrets, with a secondary battery of twelve 105mm guns."
 GER_ship_hull_cruiser_3:0 "Prinz Eugen Class"
 GER_ship_hull_cruiser_3_desc:0 "Officially part of the Hipper Class, the Prinz Eugen subclass incorporates many improvements, including a heavier anti air armament. Of the three ships in the subclass, only Prinz Eugen was completed. She participated in the sinking of HMS Hood during Operation Rheinübung. After the war, she was transferred to the United States and served as USS Prinz Eugen in the Able and Baker atomic bomb tests before sinking at the Kwajalein Atoll in 1946."
 GER_ship_hull_cruiser_4:0 "P Class Cruiser"
 GER_ship_hull_cruiser_4_desc:0 "The P Class was a large heavy cruiser design, officially designated as Panzerschiff (Armored Ship) by the Kriegsmarine. Displacing almost 24,000 tons, they would have been 3,000 tons lighter but 55 meters longer than the U.S. New York-class battleships. The armament consisted of six 280mm guns in two triple turrets."
 GER_battle_cruiser_1:0 "Yorck Class"
 GER_battle_cruiser_1_desc:0 "The three ships of the Yorck-class battlecruisers were designed in response to the British Renown Class. They would have been armed with eight 380mm guns in four twin turrets. All three ships were laid down in 1916, but none were completed due to the war."
 GER_battle_cruiser_2:0 "O Class"
 GER_battle_cruiser_2_desc:0 "In 1939, the Kriegsmarine decided to replace three of the planned P-class cruisers with battlecruisers. This resulted in the O-class battlecruisers, armed with six 38cm (15") guns in three twin turrets. The ships were designed with a displacement of 35,400 tons and a top speed of 35 knots. Construction orders were given for the three ships of the class, but none were started."
 GER_ship_hull_heavy_1:0 "Bayern Class "
 GER_ship_hull_heavy_1_desc:0 "Following the Treaty of Versailles, Germany was allowed to retain six pre-dreadnought battleships. Classified as Linienschiffe (Ships of the Line) by the Kriegsmarine, only two ships of the Deutschland Class, not to be confused with the later Deutschland-class Pocket Battleships, remained in active service through the 1930s. At 04:47 on September 1, 1939, Schleswig-Holstein fired the first shots of World War II as she opened fire on the Westerplatte base in Danzig, Poland."
 GER_ship_hull_heavy_2:0 "Scharnhorst Class "
 GER_ship_hull_heavy_2_desc:0 "The Scharnhorst-class battleships were the first modern battleships to be built for the Kriegsmarine. They were built as a response to the French Dunkerque-class battlecruisers, themselves a response to the German Deutschland-class Panzerschiffe (Pocket Battleships). The Scharnhorst class is armed with nine 283mm (11") guns in three triple turrets. Plans were made to up gun them with twin 380mm (15") guns, but with the outbreak of the war, this never happened."
 GER_ship_hull_heavy_3:0 "Bismarck Class "
 GER_ship_hull_heavy_3_desc:0 "The two-ship Bismarck-class battleships were the largest warships built for the Kriegsmarine. The ships were designed in response to the new French battleships under construction, with a similar armament of eight 38cm (15") guns as the Richelieu Class, with four twin turrets as opposed to the two quad turrets of the Richelieus. Bismarck is famous for the sinking of the British battlecruiser HMS Hood in the Battle of the Denmark Strait, but was subsequently hunted down and sunk before reaching port."
 GER_ship_hull_heavy_4:0 "Hindenburg Class"
 GER_ship_hull_heavy_4_desc:0 "The German Plan Z envisioned a force of ten battleships in order to challenge the naval power of the United Kingdom. The H-class was a series of designs for the six battleships needed to meet the demands of the plan. Two ships of the H39 design were laid down at the outbreak of World War II, but construction was halted as the war begun. Neither of the ships were officially named, but Hindenburg was speculated as a possible name for the lead ship of the class. Had the ships been completed, they would have been augmented Bismarck Class ships, with a main battery of eight 40.6cm (16") guns."
 GER_ship_hull_carrier_conversion_bb:0 "Flugzeugdampfer I"
 GER_ship_hull_carrier_conversion_bb_desc:0 "Designed in 1915, the Flugzeugdampfer I (Airplane Steamer I) Project was a conversion of the incomplete passenger liner Ausonia into an aircraft carrier. The construction was abandoned at the end of World War I. Had she been completed, she would have carried a mix of seaplanes and wheeled aircraft in her three hangars and would have displaced 12,500 tons."
 GER_ship_hull_carrier_1:0 "Seydlitz Class "
 GER_ship_hull_carrier_1_desc:0 "Seydlitz was laid down as the fourth ship of the Admiral Hipper-class heavy cruisers. Partially completed by the beginning of the war, she was considered for conversion into an aircraft carrier. The project, codenamed Weser 1, was partially underway when work was halted due to increasing air attacks on Bremen and the lack of resources for her construction."
 GER_ship_hull_carrier_2:0 "Graf Zeppelin Class "
 GER_ship_hull_carrier_2_desc:0 "Graf Zeppelin was the only class of ships in the Kriegsmarine that had been designed as an aircraft carrier from the keel up. Two ships were ordered, but neither was completed. As designed, the Graf Zeppelin would carry 30 Bf-109T fighters and 12 Ju-87E dive bombers, ship versions of the Bf-109E and the Ju-87D."
 GER_ship_hull_carrier_3:0 "Europa Class"
 GER_ship_hull_carrier_3_desc:0 "Several civilian ships were considered for conversions to aircraft carriers by the Kriegsmarine in the 1940s. The largest of these ships was the passenger ship Europa. Being the largest passenger ship in Germany, she had been used as a barracks ship and a troop transport before work began on converting her to a carrier. Had she been completed, she would have displaced 56,000 tons and carried an air group of 42 aircraft."
 GER_ship_hull_super_heavy_1:0 "Schlachtschiff H41"
 GER_ship_hull_super_heavy_1_desc:0 "The H41 design of battleships was an improvement over the previous H39 design. The design called for significantly stronger armor, strengthened torpedo bulkheads and protection for the ships rudder and propeller shafts. The main battery was upgraded to eight 42cm guns, larger than that of the proposed Lion Class battleships of the United Kingdom. As designed, these ships would have a displacement of almost 70,000 tons."
 GER_SH_ship_hull_heavy_2:0 "Schlachtschiff H44"
 GER_SH_ship_hull_heavy_2_desc:0 "The H44 Class was the last of the H-series of Battleship designs. With no limit on gun caliber or displacement, the H42 to H44 designs mounted increasingly heavier armament and armor protection, culminating in the 131,000 ton H44 design armed with eight 508mm (20") guns."
 JAP_ship_hull_submarine_1:0 "Kaichu Class"
 JAP_ship_hull_submarine_1_desc:0 "The kaichu class submarines were built after WWI and based on the earlier submarines. These medium-sized submarines were adequately armed, possesses good operational range and had good speed for their time, but by 1938 they were somewhat outdated. Altogether 42 Kaichu type submarines were built for the IJN and the series included 7 variants."
 JAP_ship_hull_submarine_2:0 "Kaidai VI Class"
 JAP_ship_hull_submarine_2_desc:0 "The Kaidai VI class submarines were large and well-armed submarines with long range and relatively good speed. The entire Kaidai series of submarines were stable and successful boats which served the IJN until the Pacific War ended."
 JAP_ship_hull_submarine_3:0 "Ko/Otsu/Hei-gata Class"
 JAP_ship_hull_submarine_3_desc:0 "The Ko-gata, Otsu-gata, and Hei-gata class boats were large-sized cruiser submarines which served as command ships for submarine squadrons. They were equipped with sophisticated radio equipment, heavy torpedo armament and their larger sizes meant a large operational radius. The Ko and Otsu-gata classes carried float-planes as well for scouting role."
 JAP_ship_hull_submarine_4:0 "Sen-Toku Class"
 JAP_ship_hull_submarine_4_desc:0 "The Sen-Toku class submarines were the largest submersibles of WWII. They were submarine aircraft carriers with heavy torpedo armament, adequate light AA and, due to their size and engines, relatively fast and long-ranged. They were able to carry three Aichi M6A Seiran aircraft for scouting and limited striking abilities."
 JAP_ship_hull_light_1:0 "Minekaze Class "
 JAP_ship_hull_light_1_desc:0 "The Minekaze, Kamikaze, and Mutsuki class destroyers were well-armed both with surface guns and torpedoes for their time but had limited AA weaponry. They were considered obsolete at the start of WWII and relegated to mostly secondary roles."
 JAP_ship_hull_light_2:0 "Fubuki Class "
 JAP_ship_hull_light_2_desc:0 "The Fubuki class has been described as the world's first modern destroyer. Much larger and heavily armed compared to previous classes of destroyers, the Fubuki class set a new standard not only for Japanese vessels, but for destroyers around the world."
 JAP_ship_hull_light_3:0 "Akizuki Class"
 JAP_ship_hull_light_3_desc:0 "The Akizuki class destroyers were well-armed with both surface guns and torpedoes, adequate AA armament, as well as much needed extra depth charges. Out of the 39 planned only 12 were completed before the series was cancelled."
 JAP_ship_hull_light_4:0 "Shimakaze Class"
 JAP_ship_hull_light_4_desc:0 "The Shimakaze class was the fastest destroyer in the world at the time of its completion. It was a prototype destroyer to test out new high-temperature, high-pressure turbines. It was extremely fast and heavily armed with torpedoes, but this meant a smaller radius of operations."
 JAP_light_cruiser_1:0 "Tenryu Class"
 JAP_light_cruiser_1_desc:0 "Tenryu class ships displaced around 4,400 tons and were lightly armed compared to the similar vessels of other navies, but good speed and adequate torpedo armament made up for these shortcomings. They were designed to act as flagships for destroyer flotillas, and thus considered an intermediate class between the light cruiser and the destroyer."
 JAP_light_cruiser_2:0 "Light Mogami Class"
 JAP_light_cruiser_2_desc:0 "Mogami class cruisers were heavily armed, equipped with good armor and strong engines that provided high speed. They were up-gunned from their original design and reclassified as heavy cruisers. The good AA defense and high speed ensured a long range of operations."
 JAP_light_cruiser_3:0 "Agano Class"
 JAP_light_cruiser_3_desc:0 "The Agano-class light cruisers were designed primarily as flottila leaders for destroyer squadrons. They were fast, armed with 3 twin 152mm guns, but limited AA armaments and thin armor plates were major drawbacks of the design."
 JAP_light_cruiser_4:0 "Agatsuma Class"
 JAP_light_cruiser_4_desc:0 "The Agatsuma class was light cruiser class that never saw any ships built before the end of the war. The cruisers were designed to be fast and heavily armed but light-armored, to protect the fleets and carriers against enemy aircraft."
 JAP_ship_hull_cruiser_1:0 "Furutaka Class "
 JAP_ship_hull_cruiser_1_desc:0 "The Furutaka-class and the following Aoba class heavy cruisers were the first heavy cruisers in the Imperial Japanese Navy. They were designed the US Omaha and British Hawkins class as templates. Later in their life they were modernized and received new armaments and better engines."
 JAP_ship_hull_cruiser_2:0 "Mogami Class "
 JAP_ship_hull_cruiser_2_desc:0 "Mogami class cruisers were heavily armed, equipped with good armor and strong engines that provided high speed. They were up-gunned from their original design and reclassified as heavy cruisers. The good AA defense and high speed ensured a long range of operations.""
 JAP_ship_hull_cruiser_3:0 "Tone Class "
 JAP_ship_hull_cruiser_3_desc:0 "The Tone class heavy cruisers were originally designed as light cruisers, but revisioned with heavier armaments. They were unique in that all armaments were positioned forward, while the aft part of the ship was used to carry and service float-planes that scouted for enemy forces."
 JAP_ship_hull_cruiser_4:0 "Ibuki Class"
 JAP_ship_hull_cruiser_4_desc:0 "The Ibuki-class heavy cruisers were the last cruisers to be built by Japan before the end of the war. They were improved versions of the Mogami class heavy cruisers, featuring the same layout and armament but with more modern AA weaponry and engines."
 JAP_battle_cruiser_1:0 "Amagi Class"
 JAP_battle_cruiser_1_desc:0 "The Amagi battlecruisers were a series of planned battlecruisers as part of the Japanese Navy's ambitious plan to have eight battleships and eight battlecruisers. Following the Washington Naval Treaty, the Amagi ships were scrapped, and one converted to a carrier."
 JAP_battle_cruiser_2:0 "Design B-65"
 JAP_battle_cruiser_2_desc:0 "Design B-65 battlecruisers were fast, moderately armored vessels with good AA weaponry and modern armaments. Designed to fight the new heavy cruisers of the US Navy and to protect the fleet carriers of the IJN, the ships would have been a force to be reckoned with if finished."
 JAP_ship_hull_heavy_1:0 "Fuso Class "
 JAP_ship_hull_heavy_1_desc:0 "The Fuso class battleships were built during WWI and modernized in the 1930's when the 1st London Naval Treaty banned construction of new battleships for the signatories. They were well-armored and armed, with the 6 twin turrets on the centerline giving a heavy broadside, but also limiting the extra AA weaponry these ships could carry."
 JAP_ship_hull_heavy_2:0 "Amagi Class "
 JAP_ship_hull_heavy_2_desc:0 "The Amagi battlecruisers were a series of planned battlecruisers as part of the Japanese Navy's ambitious plan to have eight battleships and eight battlecruisers. Following the Washington Naval Treaty, the Amagi ships were scrapped, and one converted to a carrier."
 JAP_ship_hull_heavy_3:0 "Tajima Class"
 JAP_ship_hull_heavy_3_desc:0 "The Tajima class was a hypothetical class of fast battleships, designed to be cheaper and faster to build than the massive Yamato class battleships. They utilized the older cannons of previous battleships, but high speed, adequate armor and AA provided the defense for these ships."
 JAP_ship_hull_heavy_4:0 "Iwami Class"
 JAP_ship_hull_heavy_4_desc:0 "The Iwami class was a hypothetical class of battleships, that utilized new methods to speed up construction. They were well-armed with new cannons and heavy AA guns, and could match any similarly armed vessels for firepower. However, the resulting improvements meant a heavier and thus somewhat slower class of ships."
 JAP_ship_hull_super_heavy_1:0 "Yamato Class "
 JAP_ship_hull_super_heavy_1_desc:0 "The Yamato class consisted of the heaviest battleships ever created, displacing 72,000 tons, and the ships were designed to be the pride and might of the Japanese navy under the Peace Goddesses plan. Each ship carried nine 460-millimetre naval guns, the largest naval artillery ever fitted to a warship."
 JAP_SH_ship_hull_heavy_2:0 "Super Yamato Class"
 JAP_SH_ship_hull_heavy_2_desc:0 "The hypothetical Super Yamato class saw the Yamato was used as a base, but the weapons would be even stronger with a main armament of 51cm cannons and a strong AA armament of the newest type. Their armor thickness was designed to withstand even shells from its own cannons, and they would displace around 70-80.000tons."
 JAP_ship_hull_carrier_conversion_bb:0 "Kaga Class "
 JAP_ship_hull_carrier_conversion_bb_desc:0 "The aircraft carrier Kaga was Japan's first fleet carrier. She was originally a battleship, but finished as an aircraft carrier. This resulted in a large and heavily armored carrier with limited space for improvement. However, it was an important experience in aircraft carrier construction for the Imperial Japanese Navy."
 JAP_ship_hull_carrier_1:0 "Soryu Class "
 JAP_ship_hull_carrier_1_desc:0 "Soryu and Hiryu were designed with mirrored island superstructure to speed up aircraft recovery processes while sailing next to each other. They were fast carriers with room for large air groups, but minimally armored. They displaced 20.000tons and large engines provided high speed and a long range of operations."
 JAP_ship_hull_carrier_2:0 "Shokaku Class "
 JAP_ship_hull_carrier_2_desc:0 "The Shokaku class aircraft carriers were designed for high speed, long radius of action, heavy protection and a large aircraft capacity, which made them excellent carriers. Due to the improved construction methods, they displaced 33.000tons full load, and could survive more damage than most contemporary carriers."
 JAP_ship_hull_carrier_3:0 "Taiho Class"
 JAP_ship_hull_carrier_3_desc:0 "The Taiho class aircraft carrier was the IJN's first fully armored carriers, with an armored flight deck to withstand multiple bomb and torpedo hits and still function effectively. A large air group together AND heavy AA armament would provide not just self-defense but also force projection over enemy forces."
 ger_advanced_turret:0 "Improved Turret for 40 Medium Hull"
 ger_advanced_turret_short:0 "Improved Turret for 40 Medium Hull"
 ger_advanced_turret_desc:0 "Improved turret for 1940 Medium Tank hull, which allows mounting of §HMedium Armaments§!"
 ger_spaced_armor:0 "Spaced Armor"
 ger_spaced_armor_short:0 "Spaced Armor"
 ger_spaced_armor_desc:0 "We can use the spare carrying capacity on our mainline medium tank to strengthen its armor by mounting applique plates."
