 GER_arrdenes_counter_offensive_decision:0 "Ardennes Counter Offensive"
 GER_arrdenes_counter_offensive_decision_desc:0 "We must strike hard and fast into the allied lines. The element of surprise and favorable weather enable us to punch much harder than the Allies are expecting."
 GER_balkan_access:0 "Balkan Military Access"
 GER_balkan_access_desc:0 "We shall ask for military access through our neighbors to help prepare for the potential invasion of Greece and Yugoslavia."
 GER_integrate_bulgarian_war_economy:0 "Integrate Bulgarian War Economy"
 GER_integrate_bulgarian_war_economy_desc:0 "By closely integrating Bulgaria into our war economy, we will be able to have almost complete control over their country."
 GER_operation_25:0 "Operation 25"
 GER_operation_25_desc:0 "Yugoslavia has conveniently given us a reason to invade them with the coup d'état against the regent Prince Paul. All the while Greece continues to side itself with the Allies. We must strike hard and fast through Yugoslavia to seize the important railways north of Greece whilst we push down into Greece itself. This will remove any foothold the Allies could hope to retain onto Europe."
 GER_operation_marita_desc:0 "Yugoslavia has conveniently given us a reason to invade them with the coup d'état against the regent Prince Paul. All the while Greece continues to side itself with the Allies. We must strike hard and fast through Yugoslavia to seize the important railways north of Greece whilst we push down into Greece itself. This will remove any foothold the Allies could hope to retain onto Europe."
