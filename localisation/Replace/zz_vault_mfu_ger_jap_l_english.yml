 GER_improve_national_spirit:0 "Improve National Spirit"
 GER_improve_national_spirit_desc:0 "With the capital cities of the victors of the Great War in our hands we can finally cast off the shadow of our defeat. A new age is dawning for Germany!"
 GER_improve_national_spirit_tooltip:0 "We, or our Faction members, must control London and Paris and the states they reside in."
 GER_inflexible_communist_organizer:0 "Inflexible Communist Organizer"
 GER_inflexible_communist_organizer_leader:0 "Inflexible Communist Organizer"
 GER_influential_pastor:0 "Influential Pastor"
 GER_integrate_war_economies_tt3:0 "§R[HUN.GetName] must approve of the agreement for the bonuses to take effect.§!\n"
 GER_integrate_war_economies_tt4:0 "§R[ROM.GetName] must approve of the agreement for the bonuses to take effect.§!\n"
 GER_intelligence_coordinator:0 "Intelligence Coordinator"
 GER_iron_maiden:0 "The Iron Maiden"
 GER_is_forming_hre:0 "The splendor of our Kaiserin knows no bounds, and neither do the borders of our nation. These have now grown to encompass the limits of the old Holy Roman Empire, and the nations in our way are no longer in a position to object to our policies. The Kaiserin has decreed that the current opportunity shall be seized, and that the nation shall embrace its role as the spiritual successor of the Holy Roman Empire. Aquila Elegit Iovis Omnia Vincit!"
 GER_is_forming_hre_without_victoria:0 "The splendor of our government knows no bounds, and neither do the borders of our nation. These have now grown to encompass the limits of the old Holy Roman Empire, and the nations in our way are no longer in a position to object to our policies. It has now been decreed that the current opportunity shall be seized, and that the nation shall embrace its role as the spiritual successor of the Holy Roman Empire. Aquila Elegit Iovis Omnia Vincit!"
 GER_italy_declined_assassination_tt:0 "§Y[ITA.GetNameWithFlag]§! has not rejected our assassination proposal"
 GER_japan_friend_tt:0 "Recalls von Falkenhausen.\n"
 GER_julius_leber:0 "Julius Leber"
 GER_kriegsmarinewerft_wilhelmshaven_organization:0 "$GER_kriegsmarinewerft_wilhelmshaven$"
 GER_low_countries_membership:0 "Low Countries Membership"
 GER_low_countries_membership_desc:0 "Though far removed from the Eastern borders of Europe, the Low Countries nevertheless know that if Central Europe falls, they shall be next. We shall offer them membership so that they may stand with us against the threat of communism."
 GER_loyal_inner_circle:0 "Loyal Inner Circle"
