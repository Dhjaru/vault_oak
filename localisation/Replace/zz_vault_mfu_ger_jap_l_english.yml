 GER_air_rearmament_desc:0 "By diverting large amounts of funding from various aspects of our society, we can sustain higher numbers of plane production for our military."
 GER_economy_of_plunder_1:0 "Economy of Plunder: Light Plunder"
 GER_economy_of_plunder_1_desc:0 "The Nazis expected to cover their debt by plundering the wealth of conquered nations during the war. By extracting the wealth of occupied nations, the German economy can hopefully come back on its feet, although the price of such an extraction is paid in human life through extremely complicated bureaucracy and logistics."
