 GER_disorganized_industry:0 "Disorganized Industry"
 GER_disorganized_industry_desc:0 "The German war economy is only a formal title passed around by Hitler's cronies. The Reich's unpreparedness in the face of a conflict on this scale has left it at a disastrous disadvantage.\n §RIt can be removed by completing the summon Fritz Todt focus."
 GER_strategic_bombing_focus:0 "Operation Blitz"
 GER_ckd:0 "BMM"
 GER_ckd_desc:0 "CKD was one of the main suppliers to the Czechoslovak state of military vehicles during the 1930s. After the occupation of Czechoslovakia the company was renamed Böhmisch-Mährische Maschinenfabrik and manufactured arms for the Wehrmacht. The company's most notable products in this era were a light tank of the company's own design – the Panzer 38(t) – and the Jagdpanzer 38(t) tank destroyer, which was built on the Panzer 38(t)'s chassis."
 GER_speer:0 "Albert Speer"
 GER_speer_desc:0 "Albert Speer was a German architect who was the Minister of Armaments and War Production from 1942 to 1945. Often credited with the 'Armaments miracle', his appointment will increase Industrial Efficiency."
 GER_otto_skorzeny:0 "Otto Skorzeny"
 GER_otto_skorzeny_desc:0 "An innovator of commando tactics and the rescuer of Mussolini."
 GER_blitzkrieg:0 "Blitzkrieg!"
 GER_blitzkrieg_desc:0 "We will show our enemies the capabilities of our fully modernized doctrine."
