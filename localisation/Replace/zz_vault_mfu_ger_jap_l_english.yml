 GER_constrution_air_base_here_2:0 "§Y[This.GetName]§!: Add §Y1 Air Base§!\nModify §YArbeitseinsatz§! by\n§YAir Base§! construction speed: §G+1%§!\n§YNaval Base§! construction speed: §G+1%§!\n§YRocket Site§! construction speed: §G+1%§!\n§YRadar Station§! construction speed: §G+1%§!\n§YNuclear Reactor§! construction speed: §G+1%§!\n§YRailway§! construction speed: §G+1%§!\n§YSupply Hub§! construction speed: §G+1%§!\n§YInfrastructure§! construction speed: §G+1%§!\n-----\nUsing the workers enrolled into the §YArbeitseinsatz§!, you can build a Radar Station here. Each level of §YAir Base§! costs §R1000§! workers. The buildings are built instantaneously.\n\n§RTo be able to build here, the state needs to have less than a level 6 §YAirbase§!. You can build Military Factories using the Programm only once per state.§!\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
 GER_input_workers_here:0 "§YAssign Workers§! in §Y[This.GetName]§!\n-----\nAssign §R6.000§! workers from the §YArbeitseinsatz§! to this state's industry. This will improve the §YArbeitseinsatz§! national spirit's output by:\nRecruitable Population: §Y0.01%§!\n£prod_eff!Production Efficiency Growth: §G+1.00%§!\n£industry_texticon!Factory Output: §G+0.80%§!\nRequired Garrisons: §R+1%§!\nResistance Damage to Garrisons §R+1%§!\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
 GER_build_u_boat_pens_here:0 "§Y[This.GetName]§!: Add §Y1§! offsite §YDockyard§!\n-----\nUsing the workers enrolled into the §YArbeitseinsatz§!, you can build an offsite §YDockyard§! here. An offsite §!Dockyard§! costs §R1000§! workers. The buildings are built instantaneously.\n\n§RTo be able to build here, the state needs to be coastal.\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
 GER_project_riese_arms_factory_here:0 "§Y[This.GetName]§!: Add §Y1§! offsite §YArms Factory§! and Remove §Y1§! §YArms Factory§!\n-----\nUsing the workers enrolled into the §YArbeitseinsatz§!, you can build an offsite §YArms Factory§! here. An offsite §YArms Factory§! costs §R400§! workers. The buildings are built instantaneously.\n\n§RTo be able to click this button, you need to complete the National Focus §YUnderground Factories§!§!.\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
