 GER_weserubung_tt:0 "If you went with the §YFalkenhorst plan§!:\n Ports in §YHannover§!, §YWeser-Ems§!, §YVorpommern§! and §YMecklenburg§! are preparing for invasion of Norway. In order to launch the invasions you need either:\n At most §Y5 division§! in the respective states\n At most §Y10 division§! in the respective states and §YPlan Z§! finished.\n Divisions in §YHannover§! will be teleported to §YOslo§!.\n Divisions in §YWeser-Ems§! will be teleported to §YTrondheim§!.\n Divisions in §YVorpommern§! will be teleported to §YBergen§!.\n Divisions in §YMecklenburg§! will be teleported to §YKristiansand§!. Additionally 2 30 width mountaineers will spawn in Narvik.\n All other units that you are not planning to teleport have to leave the respective state !! You can launch the invasions without having every Taskforce ready by simply not putting any units in that state (will result in not getting the respective Norway state)."
