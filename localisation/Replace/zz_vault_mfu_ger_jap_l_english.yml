 GER_division_latvia_infantry_tt:0 "The veteran §Y15. SS-Waffen-Grenadier-Division§! and §Y19. SS-Waffen-Grenadier-Division§! will be activated."
 GER_division_latvia_mech_tt:0 "The §Ymechanized 15. SS-Panzergrenadier-Division§! will be activated."
 GER_division_latvia_mot_tt:0 "The §Ymotorized 15. SS-Division§! will be activated."
 GER_division_latvia_armored_tt:0 "The §Yarmored 19. SS-Panzerdivision Latvia§! will be activated."
 GER_division_britain_mech_tt:0 "The §Ymechanized SS-Division Oliver Cromwell§! will be activated."
 GER_division_britain_mot_tt:0 "The §Ymotorized SS-Division Oliver Cromwell§! will be activated."
 GER_division_britain_armored_tt:0 "The §Yarmored SS-Panzerdivision Oliver Cromwell§! and the §Yarmored SS-Panzerdivision Sankt Georg§! will be activated."
 GER_division_scotland_infantry_tt:0 "The §YGälische Freiwilligen-Division der Waffen-SS§! will be activated."
 GER_division_scotland_mech_tt:0 "The §Ymechanized Gälische Freiwilligen-Division der Waffen-SS§! will be activated."
 GER_division_scotland_mot_tt:0 "The §Ymotorized Gälische Freiwilligen-Division der Waffen-SS§! will be activated."
