 germany.707:0 "Vichy Forces"
 germany.707.t:0 "Vichy Forces"
 germany.707.d:0 "With the war escalating on multiple fronts, the French State has pledged greater support to Germany, eager to secure its position within the Axis and maintain control over its remaining territories. Though limited in manpower and equipment, the Vichy government has mobilized experienced forces willing to fight alongside the Wehrmacht."
