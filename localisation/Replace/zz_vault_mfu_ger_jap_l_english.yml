 JAP_kenpeitai:0 "Kempeitai"
 JAP_kenpeitai_desc:0 "Tasked with maintaining order, stability, and silencing dissent in internal and occupied territories, the Kempeitai are the military police arm of the Japanese government. Led by Tojo Hideki since 1935, it has been brought to the forefront of Japan’s efforts to pacify the occupied peoples and those who may threaten the war effort domestically through a variety of less than savory methods. Such methods often included but were not limited to torture, threats, thug-like tactics, and planting evidence to achieve their goals."
