 JAP_intervene_in_china:1 "Marco Polo Bridge Incident"
 JAP_intervene_in_china_desc:1 "[Root.GetNameDefCap] is poor in resources, but our neighbours are not. We must take from them what we lack, and only require an excuse to begin doing so. Such an excuse could be provided by a few enterprising soldiers, after which the Emperor will have no choice but to assent to a war, no matter how ill-prepared..."
 JAP_intervene_in_china_decision:1 "Marco Polo Bridge Incident"
 JAP_intervene_in_china_decision_desc:0 "[Root.JAP_get_marco_polo_description]"
 JAP_intervene_in_china_decision_desc1:0 "\n\n£decision_topbar_JAP_invasion_of_china£\n\n\n\n[Root.GetNameDefCap] is poor in resources, but our neighbours are not. We must take from them what we lack, and only require an excuse to begin doing so. Such an excuse could be provided by a few enterprising soldiers, after which the Emperor will have no choice but to assent to a war, no matter how ill-prepared...\n\nEscalating the war can lead to increased foreign support for China from §YSoviet Union§! and §YUnited States of America§!\n\nChina heavily relies on foreign support due to the inadequacies of its domestic industry. The Burma Road, Hanoi Road, and other routes are crucial for China for importing essential technology and military equipment from the Allies.\nWestern Allies can provide China at most 4 lend leases at a time.\n\nOverseas Aid: [?CHI.CHI_coastal_state_counter_var|G0] Hanoi Road: [?CHI.CHI_hanoi_routes_used|G0]\nBurma Road: [?CHI.CHI_burma_routes_used|G0]   Alternative Routes through India: [?CHI.CHI_ledo_road_available_var|G0]"
 JAP_intervene_in_china_decision_desc2:0 "\n\n£decision_topbar_JAP_invasion_of_china£\n\n\n\n[Root.GetNameDefCap] is poor in resources, but our neighbours are not. We must take from them what we lack, and only require an excuse to begin doing so. Such an excuse could be provided by a few enterprising soldiers, after which the Emperor will have no choice but to assent to a war, no matter how ill-prepared."
 JAP_ledo_road_placeholder:0 "Allied Support for China via Alternative Routes through India"
 JAP_burma_road_placeholder:0 "Allied Support for China via Burma Road"
 JAP_overseas_imports_placeholder:0 "Allied Overseas Support for China"
 JAP_hanoi_road_placeholder:0 "Allied Support for China via Hanoi Road"
