 GER_industrial_assistance_to_RK:0 "Industrial Assistance for Reichskommissariat"
 GER_industrial_assistance_desc:0 "A Reichskommissariat has asked for our industrial assistance and we have reluctantly been forced to accept, we also pay a heavier toll than normal due to extremely overcomplicated bureaucracy and political inefficiency."
 GER_production_assistance_to_RK:0 "Production Diversion for Reichskommissariat"
 GER_production_assistance_to_RK_desc:0 "A Reichskommissariat has requested equipment for their garrisons and police forces from us, at the time we did not have enough so now we have to pay a heavier toll than normal due to extremely overcomplicated bureaucracy and political inefficiency."
