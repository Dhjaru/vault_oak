 GER_arbeitseinsatz_category_desc:0 "A Vampire Economy is an economy that feeds upon other economies to sustain itself, and our economy falls under that umbrella expression as it is dependant on sustenance from occupied countries. We are lacking in natural resources, but we are also lacking in workers for our industry. At our disposal we have many ministers, but most notably the Reichsführer of the SS to assist us with rounding up workers and pacifying regions. Remember, workers extracted from their home country will generate resistance, and exact a heavier toll upon our garrisons.\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
