 GER_plunder_button_here:0 "§YExtract Equipment§! from §Y[This.GetName]§!\n-----\nUsing the workers enrolled into the §YArbeitseinsatz§!, we are able to force produce the following equipment this costs §R1000§! workers:\n§Y1.25K§! units of German §YInfantry Equipment§! is added to the national stockpile.\n§Y90§! units of German §YSupport Equipment§! is added to the national stockpile.\n§Y50§! units of German §YRadio Equipment§! is added to the national stockpile.\n§Y50§! units of German §YMotorized Equipment§! is added to the national stockpile.\n§Y60§! units of German §YArtillery Equipment§! is added to the national stockpile\n§Y20§! units of German §YAnti-Air Equipment§! is added to the national stockpile\n§Y15§! units of German §YAnti-Tank Equipment§! is added to the national stockpile.\n\n§RThis action will increase resistance in [This.GetName] by §Y1§!.§!\n\n§LWe currently have [?GER.GER_num_arbeitseinsatz] free workers available.§!"
