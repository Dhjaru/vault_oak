 GER_war_zone_modifier:0 "Die Ostfront"
 GER_war_zone_modifier_desc:0 "This state is under the full control of the Wehrmacht, thus it is much harder to launch unplanned offensives into this area. A larger more dedicated offensive has to be launched if we wish to break through this area."
