 GER_afrikakorps_tt:0 "§Y300§! units of long barrel Panzer IIIs and §Y150§! units of long barrel Panzer IVs is added to national stockpile\n§Y18§! of Deutsches Afrikakorps infantry will spawn in Tunis"
