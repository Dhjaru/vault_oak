 GER_victory_over_soviet_union:0 "Triumphed against the Soviet Union"
 GER_RK_tooltip_tt:0 "Forms a §YReichskommissariat§! in the country detailed in the §Ydecision§!."
 GER_german_soviet_trade_agreement:0 "Trade Treaty with the USSR"
 GER_german_soviet_trade_agreement_desc:0 "We can pursue a trade treaty that will help us against the embargo we face at sea in exchange for technological knowledge."
 GER_race_for_baku_oil:0 "Race For Baku Oilfields"
 GER_race_for_baku_oil_desc:0 "Our preparations for summer southern strike did not go unnoticed by the enemy. According to our intel, they are preparing to ruin oil wells and refineries in Baku to deny us access to their oil. Once offensive starts we will need to act swiftly if we want to capture them intact for our war effort."
 GER_sweden_treaty:0 "German-Swedish Trade Treaty"
 GER_finland_access:0 "Request Access to Sweden and Finland"
 GER_finland_access_desc:0 "Finland has showed interest in joining us against the soviets, we may move troops to Finland in order to gain an other point of attack."
 GER_operations:0 "German Operations"
 GER_operations_desc:0 "Major operations or undertakings done by the German Wehrmacht during World War 2."
 GER_SS_installment:0 "Increasing Power to the SS"
 GER_SS_installment_desc:0 " The 'Schutzstaffel' was a paramilitary organization under Adolf Hitler and the Nazi Party (NSDAP) in Nazi Germany. In 1925 Heinrich Himmler joined the unit, which had by then been reformed and given its final name. Under his direction it grew from a small paramilitary formation to one of the most powerful organizations in Nazi Germany, the SS was the foremost agency of security, surveillance, and terror within Germany and German-occupied Europe."
 GER_Schutzstaffel_decision:0 "Schutzstaffel"
 GER_Schutzstaffel_decision_desc:0 "The Schutzstaffel, or "SS", is a paramilitary group that directly serves Adolf Hitler and the Nazi Party. What began as a simple security detachment for NSDAP meetings has grown under the leadership of Heinrich Himmler into a powerful and feared tool for Hitler's totalitarian regime."
 GER_Bandenkampf_decision:0 "Bandenkampf"
 GER_Bandenkampf_decision_desc:0 "We need units that focus on fighting the resistance in the countries we control now!"
 GER_historical_Schutzstaffel_decision:0 "Increasing the Power of the SS"
 GER_historical_Schutzstaffel_decision_desc:0 ""
 GER_TV_Schutzstaffel_decision:0 "SS-Totenkopfverbände"
 GER_TV_Schutzstaffel_decision_desc:0 ""
 GER_VT_Schutzstaffel_decision:0 "SS-Verfügungstruppe"
 GER_VT_Schutzstaffel_decision_desc:0 "The SS-Verfügungstruppe was formed in 1934 as combat troops for the Nazi Party. They were involved in the German invasion of Poland in 1939. By 1940 these military SS units had become the nucleus of the Waffen-SS."
 GER_Schutzstaffel_divisions_decision:0 "SS-Totenkopf-Division"
 GER_Schutzstaffel_divisions_decision_desc:0 "The SS Division Totenkopf : "Death's Head", also known as 3. SS-Panzergrenadier-Division Totenkopf and 3. SS-Panzer-Division Totenkopf, was one of the divisions fielded by the Waffen-SS during World War II. It started as a militia but developed into a potent but fanatical Panzer-division that suffered heavy losses, particularly in Russia."
 GER_Schutzstaffel_divisions_II_decision:0 "Polizei-Division"
 GER_Schutzstaffel_divisions_II_decision_desc:0 "Polizei Division was formed in October 1939 from members of the Ordnungspolizei (regular police) that were conscripted into the unit."
 GER_Schutzstaffel_divisions_III_decision:0 "SS-Division (mot.) Reich"
 GER_Schutzstaffel_divisions_III_decision_desc:0 "The 2nd SS Panzer Division Das Reich" was a Waffen-SS division during WW II.  It is considered to be an elite formation amongst the divisions fielded by the Waffen-SS. Das Reich was the most successful Waffen-SS division in terms of Knight's Crosses awarded and was commanded by Panzer legend Paul Hausser"
 GER_Schutzstaffel_divisions_IV_decision:0 "SS-Division (mot.) Wiking"
 GER_Schutzstaffel_divisions_IV_decision_desc:0 "The 5th SS Panzer Division Wiking was an elite Panzer division among the thirty eight Waffen-SS divisions of Germany. It was recruited from foreign volunteers in Denmark, Norway, Sweden, Finland, Estonia, the Netherlands and Belgium under the command of German officers. During the course of WW II, the division served on the Eastern Front during WW II. It was commanded by the legendary Felix Steiner."
 GER_Schutzstaffel_divisions_V_decision:0 "LSSAH Division"
 GER_Schutzstaffel_divisions_V_decision_desc:0 "The Leibstandarte SS Adolf Hitler" (LSSAH) was founded in September 1933 as Adolf Hitler's personal bodyguard formation and later became known as an elite mtorized division and later panzergrenadier division."
 GER_Schutzstaffel_divisions_VI_decision:0 "Hitler Youth Division"
 GER_Schutzstaffel_divisions_VI_decision_desc:0 "The Hitler Youth Panzer division was an elite Panzergreandier division."
 GER_Schutzstaffel_Expansion_decision:0 "SS Expansion"
 GER_Schutzstaffel_Expansion_decision_desc:0 "With the success of the wehrmacht Panzer formations, Himmler has realised the strategic and propaganda of having Panzer units in the SS. July 1942 in Bergen, Netherlands the "SS-Panzer-Generalkommando" was created. The corps served as a skeletal formation, overseeing the reorganization and restructure of Waffen SS combat divisions in the area of Toulon, France. In early February 1943, the corps was ordered to join Generalfeldmarschall Manstein's Army Group South in Ukraine where it was to become known very simply as the "SS Panzer Corps". SS-Gruppenführer and Panzer legend Paul Hausser was placed in charge of the corps"
 GER_Schutzstaffel_junkerschulen_decision:0 "SS-Junkerschulen"
 GER_Schutzstaffel_junkerschulen_decision_desc:0 "SS Junker schools were introduced in 1937 as officer cadet schools and training centers of the SS during the Second World War. These had the task of training officer candidates for the Waffen-SS.  SS Junker schools eventually existed at four locations: Bad Tolz , Brunswick , Klagenfurt and Prague-Dewitz."
 GER_Schutzstaffel_foreign_units_decision:0 "Foreign SS units recruitment"
 GER_Schutzstaffel_foreign_units_decision_desc:0 "This will allow the Waffen-SS to recruit troops from all over Europe. SS-Freiwilligen (volunteer) units are ready to help us abolish bolshevism."
 GER_integrate_german_people:0 "Integrate German territory into the reich."
 GER_integrate_german_people_desc:0 "Posen is a territory with many ethnic germans and will now be part of the new german reich!"
 GER_operation_oak:0 "Operation Oak - Save Mussolini"
 GER_gustav_line:0 "Build the Gustav Line"
 GER_gothic_line:0 "Build the Gothic Line"
 GER_rape_italia:0 ""Relocate" Italian factories"
 GER_plan_z:0 "Plan Z"
 GER_reichskommissariat_croatie:0 "Reichskommissariat Croatie"
 GER_speeches_category:0 "Public Speaking"
 GER_speeches_category_desc:0 "The object of rhetoric is not truth, but persuasion. A man has made at least a start on discovering the meaning of human life when he plants shade trees under which he knows full well he will never sit. Therefore when at least one of the parties to a conflict wants something more than it wants peace, war is inevitable. Hence one should be grateful, that nothing is so unbelievable that great oratory cannot make it acceptable."
 GER_war_with_usa:0 "War with the USA"
 GER_triumph_france1:0 "Fall Gelb 1"
 GER_triumph_france2:0 "Fall Gelb 2"
 GER_triumph_france3:0 "Fall Gelb 3"
