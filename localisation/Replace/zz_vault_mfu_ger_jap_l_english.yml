 GER_fanaticism_category:0 "Wehrmacht Fervor"
 GER_fanaticism_category_desc:0 "The Wehrmacht was inspired by its many victories across Europe and during the early onset of Barbarossa, an aura of invincibility pervaded throughout the ranks. They saw themselves as the best, and fought as if they were the best. They may have been outnumbered, but they always fought on hard and bravely for their beloved fatherland."
 GER_barb_planning:0 "Prepare for Operation Barbarossa"
 GER_barb_planning_desc:0 "We will discuss with our general staff to plan out our preparation and operations in the Soviet Union. Some of our generals prepare for a short, fast, war with the Soviet Union, while others prepare for a war of attrition with the Soviets. How should we decide?"
 GER_stalingrad_idea:0 "Stalingrad"
 GER_seize_iraqs_oil:0 "Seize Iraqs Oil"
 GER_seize_iraqs_oil_desc:0 "Iraqs oil must be ours to fuel our war machine."
 GER_seize_irans_oil:0 "Seize Irans Oil"
 GER_seize_irans_oil_desc:0 "Iran is too costly to invade, but our proximity to them will let use pressure them to give up their valuable oil."
 GER_tank_treaty:0 "German-Soviet Technological Agreement"
 GER_tank_treaty_desc:0 "Under the pact, Germany offers the Soviet Union a treaty to exchange armour designs and test results. Signing it starts the Soviet-German Technological Agreement. If this agreement concludes before §Y22 August 1939§!, Germany's research bonuses are 15% higher."
 GER_tank_treaty_visual:0 "German-Soviet Technological Agreement"
 GER_tank_treaty_visual_desc:0 "Under the pact, Germany offers the Soviet Union a treaty to exchange armour designs and test results. Signing it starts the Soviet-German Technological Agreement. If this agreement concludes before §Y22 August 1939§!, Germany's research bonuses are 15% higher."
 GER_tank_treaty_fire_tt:0 "Starts the §YSoviet-German Technological Agreement§! decision for the §YSoviet Union§!.\n"
 GER_tank_treaty_signed_tt:0 "Germany has signed the §YTank Treaty§!"
 GER_tank_treaty_tt:0 "If the agreement concludes before §Y22 August 1939§!, Germany's research bonuses are §G15%§! higher.\n This means to utilize this, we must start the process §Ybefore June 13th!§!"
