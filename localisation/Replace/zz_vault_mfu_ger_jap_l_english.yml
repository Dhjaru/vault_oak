 GER_shorter_barb_tt:0 "When §YOperation Barbarossa§! begins, you will gain the following: \n\nFor §Y110§! Days\n§YAll Generals Gain§! - River Attack: §G+15%§! Forest Attack: §G+5%§!\n\n§YDrang nach Osten§! for §Y60§! Days which grants:\nEncirclement Penalty: §G-5%§!\nRiver Crossing Speed Penalty: §G-20%§!\nFortification Damage: §G+10%§!\nSupply Consumption: §G-30%§!\nAir Superiority: §G+25%§!\nGround Support: §G+30%§!\n(§YThe Soviet Union§!) Attack bonus against country: §G+7.5%§!\n(§YThe Soviet Union§!) Defense bonus against country: §G+7.5%§!\n\n§YOperation Barbarossa§! for §Y115§! Days which grants:\n(§YThe Soviet Union§!) Attack bonus against country: §G+5%§!\n(§YThe Soviet Union§!) Defense bonus against country: §G+5%§!"
 GER_normal_barb_tt:0 "When §YOperation Barbarossa§! begins, you will gain the following: \n\nFor §Y110§! Days\n§YAll Generals Gain§! - River Attack: §G+15%§! Forest Attack: §G+5%§! \n\n§YDrang nach Osten§! for §Y110§! Days which grants:\nSupply Consumption: §G-30%§!\nAir Superiority: §G+25%§!\nGround Support: §G+30%§!\n(§YThe Soviet Union§!) Attack bonus against country: §G+2.5%§!\n(§YThe Soviet Union§!) Defense bonus against country: §G+2.5%§!\n\n§YOperation Barbarossa§! for §Y180§! Days which grants:\n(§YThe Soviet Union§!) Attack bonus against country: §G+5%§!\n(§YThe Soviet Union§!) Defense bonus against country: §G+5%§!"
 GER_longer_barb_tt:0 "When §YOperation Barbarossa§! begins, you will gain the following: \n\nFor §Y110§! Days\n§YAll Generals Gain§! - River Attack: §G+15%§! Forest Attack: §G+5%§! \n\n§YDrang nach Osten§! for §Y140§! Days which grants:\nSupply Consumption: §G-30%§!\nAir Superiority: §G+17.5%§!\nGround Support: §G+22.5%§!\n(§YThe Soviet Union§!) Defense bonus against country: §G+2.5%§!\n§YOperation Barbarossa§! for §Y210§! Days which grants:\nEntrenchment Speed: §G+20%§!\nWinter Attrition: §G-20%§!\n(§YThe Soviet Union§!) Attack bonus against country: §G+2.5%§!\n(§YThe Soviet Union§!) Defense bonus against country: §G+2.5%§!\n"
