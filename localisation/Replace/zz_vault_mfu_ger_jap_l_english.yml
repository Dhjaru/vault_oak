 JAP_infantry_equipment_1_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs.\n Includes §HType 99 Rifle§! and §HType 96 LMG§!"
 JAP_infantry_equipment_2_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Modernized to include a great number of sub-machineguns and anti-tank rifles.\n Includes §HType 99 Rifle§!, §HType 2 SMG§!, and §HType 99 LMG§!"
 JAP_infantry_equipment_3_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further modernized to include personal semi-automatic rifles and improved sub-machineguns.\n Includes §HType 99 Rifle§!, §HType 4 Rifle§!, §HType 100 SMG§!, and §HType 99 LMG§!"
 JAP_infantry_equipment_4_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further modernized to include improved personal Assault Rifles and anti-tank rockets.\n Includes §HType 7 Assault Rifle§!, and §HType 5 LMG§!"
