 germany.700:0 "D-Day Wall Garrison"
 germany.31.t:0 "The [FROM.GetName] Requests Equipment"
 germany.31.d:0 "A telegram has arrived from [FROM.GetLeader], he is requesting material assistance for their garrison and police forces. He states that the following amount will suffice for now:\n\n2000 Infantry Equipment§!\n500 Support Equipment\n500 Horses\n\nIf these requests are not met, their current pacification efforts will be hampered and they will start to lose control over their Reichskommissariat."
 germany.31.a:0 "Organize a Shipment!"
 germany.31.b:0 "Re-route production!"
 germany.31.c:0 "Forget it!"
 germany.32.t:0 "The [FROM.GetName] Requests Manpower"
 germany.32.d:0 "A telegram has arrived from [FROM.GetLeader], he is requesting more manpower for their garrison and police forces. He states that the following amount will suffice for now:\n\n20000 Manpower\n\nIf these requests are not met, their current pacification efforts will be hampered and they will start to lose control over their Reichskommissariat."
 germany.32.a:0 "Send a Detachment!"
 germany.32.b:0 "Conscript some 'Volunteers'!"
 germany.32.c:0 "We need our men at the front!"
 germany.33.t:0 "The [FROM.GetName] Requests Industrial Assistance"
 germany.33.d:0 "A telegram has arrived from [FROM.GetLeader], he is requesting the use of some of our Industrial Capacity. He states that the following amount will suffice for now:\n\n5% £industry_texticon!Factory Output\n\nIf these requests are not met, their current pacification efforts will be hampered and they will start to lose control over their Reichskommissariat."
 germany.33.a:0 "Of course we will help out!!"
 germany.33.b:0 "Everything is needed for the front...!"
 germany.34.t:0 "The [FROM.GetName] Requests Political Support"
 germany.34.d:0 "A telegram has arrived from [FROM.GetLeader], he is requesting the use of some of our political power. He states that the following amount will suffice for now:\n\n200 Political Power\n\nIf these requests are not met, their current pacification efforts will be hampered and they will start to lose control over their Reichskommissariat."
 germany.34.a:0 "Of course we will help out!!"
 germany.34.b:0 "Sort out your own mess"
 germany.555.t:0 "Volunteer workers sabotage our industry!"
 germany.555.d:0 "Several weapons facilities have been sabotaged by our foreign workers. Their motivations are alleged poor working conditions and \"harsh\" treatment by us. Order has been restored now, but many factories will require repairs."
 germany.555.a:0 "Nothing to see here..."
 germany.320.t:0 "The German War Economy"
 germany.320.d:0 "Germany is not ready to fight a 'total war': despite all the propaganda talk, we have made no serious attempt to exploit our own war potential fully, despite preparing for one for almost 6 years. There is no evidence of ruthless sacrifices having been imposed upon our own people for the sake of victory."
 germany.320.a:0 "At least it isn't as bad as the Italian economy..."
 germany.333:0 "Romania Betraying The Axis"
 germany.333.t:0 "Romania is Betraying the Axis"
 germany.333.d:0 "We have received word from our agents present in the Romanian government, that the so called figurehead-king of Romania, King Michael, is negotiating with the Allies for a peace with both the western powers and the Soviets. He is promising to depose Antonescu and restore Romania's democracy if her borders are respected in the coming peace deal. This means that as soon as Michael has gathered enough support, he will be able to stage a Coup D'etat against Antonescu's government. With this information in hand, we have the ability to secure a foothold in the country before it is too late."
 germany.333.a:0 "Secure the oil fields!"
 germany.333.b:0 "Leave Romania, the Soviet Bear will eat that carcass."
 germany.4.t:0 "Anschluss"
 germany.4.d:0 "Prior to the Anschluss, there had been strong support from people of all backgrounds – not just Nazis – in both Austria and Germany for a union of the two countries. The desire for a union formed an integral part of the Nazi "Heim ins Reich" movement. Earlier, Nazi Germany had provided support for the Austrian National Socialist Party (Austrian Nazi Party) in its bid to seize power from Austria's Fatherland Front government. On the morning of 12 March, the 8th Army of the German Wehrmacht crossed the border into Austria. The troops were greeted by cheering Austrians with Nazi salutes, Nazi flags, and flowers."
 germany.4.a:0 "How can anyone say that Austria is not German?!"
 germany.704.t:0 "Allies threatening our iron ore supply"
 germany.704.d:0 "Following a meeting with Vidkun Quisling from Norway, Hitler turned his attention to Scandinavia. Convinced of the threat posed by the Allies to the iron ore supply, Hitler ordered the Oberkommando der Wehrmacht to begin preliminary planning for an invasion of Norway."
 germany.704.a:0 "Go with the Falkenhorst plan"
 germany.704.b:0 "Prepare your own plan"
 germany.6.t:0 "The Tripartite Pact"
 germany.6.d:0 "The signees consider it as the condition precedent of any lasting peace that all nations in the world be given each its own proper place, have decided to stand by and co-operate with one another in their efforts in Greater East Asia and the regions of Europe respectively wherein it is their prime purpose to establish and maintain a new order of things, calculated to promote the mutual prosperity and welfare of the peoples concerned."
 germany.6.a:0 "Join"
 germany.6.b:0 "Refuse"
 germany.11.t:0 "The Molotov-Ribbentrop Pact"
 germany.11.d:0 "The German Foreign Ministry has proposed a non-aggression pact between our two nations. This treaty will greatly increase our mutual trade, and an additional secret protocol suggests the division of Eastern Europe into German and Soviet spheres.\n\nWhile the fascists in Berlin may not be trustworthy, this pact will allow us to deal with Finland, the Baltic States and Romania without fear of outside interference. The eastern territories of Poland will also befall us in the event of a Polish collapse."
 germany.11.a:0 "Sign the treaty."
 germany.12.t:0 "Moscow Signs the Pact"
 germany.12.d:0 "The Soviet Union has wisely agreed to sign our non-aggression pact. This means that we are free to act without risk of Soviet intervention.\n\nUnfortunately, some of our friends now question Germany's commitment towards the ultimate destruction of communism. When matters with Poland and France have been settled, we may need to revisit this treaty, but that is a discussion for another time..."
 germany.12.a:0 "Excellent."
 germany.13.t:0 "Moscow Rejects the Pact"
 germany.13.d:0 "The Soviet Union has refused to sign our non-aggression pact! This complicates matters, since we cannot deal decisively with Poland or France without the risk of the Bolsheviks getting themselves involved."
 germany.13.a:0 "Curse them!"
 germany.14.t:0 "The Partitioning of Poland"
 germany.14.d:0 "Poland is ours, but the eastern parts fall under the Soviet sphere of influence according to the stipulations of the Molotov-Ribbentrop Pact. Should we withdraw our forces and let the Soviets occupy this territory? Failure to do so would render our treaty void."
 germany.14.a:0 "Yes, Treaty stipulations must be obeyed."
 germany.15.t:0 "Germany Honors the Pact"
 germany.15.d:0 "In accordance with the Molotov-Ribbentrop Pact, German forces have evacuated eastern Poland and our own troops have moved in to occupy the territory."
 germany.16.t:0 "Germany Betrays the Pact"
 germany.16.d:0 "Germany has refused to partition Poland with us, in a blatant violation of the Molotov-Ribbentrop Pact! This betrayal has rendered our treaty with them null and void!"
 germany.16.a:0 "We were fools to trust the fascists!"
 germany.20.t:0 "Second Vienna Award"
 germany.20.d:0 "Recognizing that a new order has been established in Europe, we have been asked by Hungary and Romania to arbitrate in a territorial dispute between the two countries. Transylvania was taken from Hungary and incorporated into Romania in one of the many ill-conceived changes forced upon the world at Versailles. Should Northern Transylvania be returned to Hungarian control?"
 germany.20.a:0 "Give Hungary Northern Transylvania."
 germany.20.b:0 "Give Hungary all of Transylvania."
 germany.20.c:0 "Transylvania shall remain in Romania."
 germany.21.t:0 "Romania Rejects Our Verdict"
 germany.21.d:0 "Romania has refused to abide by the decision we reached in the Second Vienna Award! Their delegation has been recalled to Bucharest, and no territory has been surrendered to Hungary."
 germany.21.a:0 "The will of Germany must be obeyed!"
 germany.22.t:0 "Memel - Baltic States Fold"
 germany.22.d:0 "The Baltic States government has agreed to our demands, and Memel will be incorporated back into East Prussia. Yet another unlawfully stolen province has been returned to the German nation!"
 germany.22.a:0 "Excellent."
 germany.23.t:0 "Memel - Lithuania Refuses Demand"
 germany.23.d:0 "The Lithuanian government has refused our demands! They are hiding behind the Klaipeda Convention, claiming that Germany has no legal right to the Memel territory. We shall have to explain our position to them by different means..."
 germany.23.a:0 "Stubborn fools."
 germany.24.t:0 "German Military Mission to China"
 germany.24.d:0 "Germany has enjoyed good relations with China since the end of the previous Weltkrieg, despite the loss of our Chinese possessions. A German military mission has been present in China for a number of years, and Alexander von Falkenhausen has made great progress in reforming parts of the Kuomintang army.\n\nThis is naturally of some concern to the Japanese, given their present war against China. They are demanding the immediate withdrawal of all German support to the Chinese."
 germany.24.a:0 "Recall von Falkenhausen."
 germany.24.b:0 "No, our advisors will stay."
 germany.24.c:0 "No, our advisors will stay, just as we have promised the Chinese."
 germany.25.t:0 "Military Advisors Recalled"
 germany.25.d:0 "Deteriorating relations with China has made it politically unfeasible to maintain a military mission in their country. Alexander von Falkenhausen and the rest of our advisors have been recalled."
 germany.25.a:0 "We shall put him to work."
 germany.26.t:0 "China Detains Military Advisors"
 germany.26.d:0 "Germany and China are in a state of war, and the Chinese have consequently detained the German military advisors that were reforming their army. Von Falkenhausen and a few of his officers managed to elude capture, and are now on their way back to Europe."
 germany.26.a:0 "Good man!"
 germany.28.t:0 "Germans press for Anschluss"
 germany.28.d:0 "Civil unrest and acts of violence have broken out as protesters voice their desire for Austria to join Germany in a union of German peoples. Berlin is pressing hard for an Anschluss, which would see Austria annexed into their nation."
 germany.28.a:0 "We shall join the German Reich!"
 germany.29.t:0 "Austria refuses the Anschluss!"
 germany.29.d:0 "The fools in Vienna have refused to accept the merger of our two nations! This is a blatant disregard for the will of the Austrian people, and it will not stand! We may have to enforce the Anschluss through military means."
 germany.29.a:0 "We must prepare for a military intervention."
 germany.40.t:0 "The Munich Conference"
 germany.40.d:0 "German demands for the Sudetenland region of Czechoslovakia, where a significant number of ethnic Germans live, have come to a head. Hitler has positioned forces along the Czechoslovakian border in preparation for an attack. Talks are being held in Munich between Britain, France, Italy and Germany in the hopes of negotiating a peaceful end to the Sudeten Crisis. What will the British position be?"
 germany.40.d_2:0 "German demands for the Sudetenland region of Czechoslovakia, where a significant number of ethnic Germans live, have come to a head. Hitler has positioned forces along the Czechoslovakian border in preparation for an attack. As we have already proven that we won't accept German expansionism, this means we now have another ally in the war against Germany."
 germany.40.a:0 "The Czechs are on their own."
 germany.41.d:0 "German demands for the Sudetenland region of Czechoslovakia, where a significant number of ethnic Germans live, have come to a head. Hitler has positioned forces along the Czechoslovakian border in preparation for an attack. Talks are being held in Munich between Britain, France, Italy and Germany in the hopes of negotiating a peaceful end to the Sudeten Crisis.\n\nThe British have made it clear that they have no intention of going to war over a 'quarrel in a far-away country.' Should we follow their lead, or will we honor our obligations to Czechoslovakia by offering them support?"
 germany.41.a:0 "Leave the Czechs to their fate."
 germany.43.t:0 "France leaves the Allies"
 germany.43.d:0 "The stubborn French have refused to follow our lead in the Sudeten Crisis! They stand by their support of Czechoslovakia, and since we do not they have decided to rescind our mutual alliance. Even now, France is preparing for an imminent war with Germany."
 germany.43.a:0 "Fools! Hitler must be appeased!"
 germany.44.d:0 "German demands for our territory in the Sudetenland region have become increasingly hostile, and now their forces are massing along our border! A conference is being held in Munich where European leaders are discussing the future of Czechoslovakia, but we haven't been invited.\n\nFortunately, it looks like the Allies will stand by their earlier promises of support. They have threatened Hitler with war if our borders are violated in the slightest. Despite this, we must prepare for an imminent German attack."
 germany.44.a:0 "Good! Let them come!"
 germany.45.d:0 "German demands for our territory in the Sudetenland region have become increasingly hostile, and now their forces are massing along our border! A conference is being held in Munich where European leaders are discussing the future of Czechoslovakia, but we haven't been invited.\n\nThe British cowards have refused to back our sovereignty, but at least the French are sticking up for us! They have abandoned their alliance with Britain and formed a new one with us, promising to support Czechoslovakia against German aggression."
 germany.45.a:0 "Vive la France!"
 germany.46.t:0 "The Munich Diktat"
 germany.46.d:0 "German demands for our territory in the Sudetenland region have become increasingly hostile, and now their forces are massing along our border! A conference is being held in Munich where European leaders are discussing the future of Czechoslovakia, but we haven't been invited.\n\nBoth the British and French have rescinded their earlier promises to support us against German aggression. Their diplomats have made it clear that if we choose to resist the Germans, we do so on our own. Perhaps we have no choice but to surrender the Sudetenland..."
 germany.46.a:0 "This is a dark day for Europe."
 germany.47.d:0 "Talks have been held in Munich between the leaders of Germany, Britain, France and Italy to discuss the future of Czechoslovakia. The British and their Allies have both rejected our rightful claims to the Sudetenland, and they have threatened us with war if we 'violate' the Czech border!\n\nA plan for the invasion of Czechoslovakia has been drawn up, but this will likely trigger a general European war. We must make certain we are ready for this."
 germany.47.a:0 "Time to do this the hard way."
 germany.48.d:0 "Talks have been held in Munich between the leaders of Germany, Britain, France and Italy to discuss the future of Czechoslovakia. The British have seen reason and accepted our claims to the Sudetenland as legitimate, but the stubborn French are refusing to back down.\n\nThey have abandoned their cooperation with Britain and forged closer ties with the Czechs instead. It looks like we will have to deal with them both at the same time, but at least now the British hopefully won't intervene..."
 germany.48.a:0 "This may work to our advantage."
 germany.49.d:0 "Talks have been held in Munich between the leaders of Germany, Britain, France and Italy to discuss the future of Czechoslovakia. Both the British and French have accepted our claims to the Sudetenland as legitimate, and their previous offers of support to the Czechs have been rescinded.\n\nDespite the hopelessness of their situation, the stubborn Czechs are refusing to surrender their territory! We will have to take it by force. An invasion plan has been prepared that will wipe this vile experiment of Versailles off the face of the Earth!"
 germany.49.a:0 "The Czechs must be destroyed."
 germany.50.d:0 "Talks have been held in Munich between the leaders of Germany, Britain, France and Italy to discuss the future of Czechoslovakia. Both the British and French have accepted our claims to the Sudetenland as legitimate, and their previous offers of support to the Czechs have been rescinded.\n\nRecognizing the hopelessness of their situation, the Czechs have surrendered the Sudeten territories to us. Their oppressed German inhabitants will at long last be brought into the Vaterland!"
 germany.50.a:0 "This is a historic day for Germany."
 germany.51.t:0 "First Vienna Award"
 germany.51.d:0 "Czechoslovakia is a cancer tumor in the heart of Europe, and at last the Germans have decided to take decisive action against them. The Sudetenland has already been surrendered to Germany, and now, as a consequence of the Munich Agreement, the Czechoslovakian territory that rightfully belongs to Hungary is to be returned to us."
 germany.51.a:0 "About time!"
 germany.52.t:0 "The Annexation of Zaolzie"
 germany.52.d:0 "Czechoslovakia is falling apart, and we must act quickly to protect territory with significant Polish populations before it can be seized by Germany. Czech ownership of Zaolzie has always been contested by us, and it is time for the region to join our nation."
 germany.52.a:0 "Zaolzie is ours!"
 germany.1002.t:0 "The Question of Czechoslovakia"
 germany.1002.d:0 "Czechoslovakia is falling apart, and we must decide, what to do on this matter. Czechoslovakia is the only ally of France in our proximity. Putting a knife into the back of ally of our ally would be suicidal. Especially now in the time when Reich is growing stronger than ever. After Beck was forced to abandon his policy of "Even distances" there is no place for such foolish acts. "
 germany.1002.a:0 "We will keep our honor!"
 germany.53.t:0 "The Fate of Czechoslovakia"
 germany.53.d:0 "Not content with stealing the Sudetenland, the Germans have now decided to seize the rest of our nation. Abandoned by our so-called allies, and with our best defenses lost in the Munich Diktat, the situation appears hopeless..."
 germany.53.a:0 "Give in to the Germans."
 germany.55.d:0 "The end of Czechoslovakia is at hand, and our forces are marching into Prague at this very moment. With the surrender of the Czechoslovakian military, we have liberated vast quantities of armaments. Their tanks, in particular, should serve our forces well.\n\nBöhmen will be annexed into Germany as a protectorate, but what should become of Slovakia? We can set them up as an autonomous puppet state under Jozef Tiso."
 germany.55.d_2:0 "The end of Czechoslovakia is at hand, and our forces are marching into Prague at this very moment. With the surrender of the Czechoslovakian military, we have liberated vast quantities of armaments. Their tanks, in particular, should serve our forces well.\n\nBöhmen will be annexed into Germany as a protectorate, but what should become of Slovakia? We can set them up as an autonomous puppet state under Jozef Tiso."
 germany.55.a:0 "Set up Slovakia as a puppet state (advised for Czechoslovakia player)."
 germany.55.b:0 "Partition Czechoslovakia with Hungary."
 germany.55.c:0 "All of Czechoslovakia belongs to the Reich!"
 germany.56.t:0 "The Partition of Czechoslovakia"
 germany.56.d:0 "German forces have entered Prague and the end of Czechoslovakia is imminent. They intend to annex Bohemia into the German Reich, but they are willing to let us have Slovakia. Should we agree to this partitioning? It will mean entering a formal military alliance with Germany."
 germany.56.d_2:0 "After annexing Czechoslovakia, Germany is intending to retain Bohemia as part of the Reich, but they are willing to let us have Slovakia. Should we agree to this partitioning? It will mean entering a formal military alliance with Germany."
 germany.56.a:0 "Of course! Greater Hungary will soon be a reality!"
 germany.57.t:0 "Hungary Rejects Our Offer"
 germany.57.d:0 "The Hungarians have outrageously refused our generous offer to annex Slovakia, claiming they have no interest in the region! We will have to deal with them soon enough. For now, we must come up with a solution to the Slovakian Question."
 germany.57.a:0 "Set up Tiso's puppet government."
 germany.57.b:0 "Annex Slovakia into Germany."
 germany.58.t:0 "The Polish Question"
 germany.58.d:0 "The Reichsministerium of Public Enlightenment and Propaganda has done an excellent job, and the people of Germany - indeed, the entire world - has been informed of the injustices our German brethren in Poland are forced to endure. We now have all the justification we need for a war!"
 germany.58.a:0 "Soon Poland will be no more!"
 germany.60.t:0 "The Remilitarization of the Rhineland"
 germany.60.d:0 "Several German divisions recently advanced into the Rhineland, marking the first time since the end of the Great War that Germany has forces positioned west of the Rhine. This is in clear violation of the Versailles Treaty, under which Germany is forbidden from militarizing the region! Unless we issue an ultimatum demanding their withdrawal, the treaty will not be enforced."
 germany.60.a.tt:0 "§RIf war breaks out, we will suffer a civil war due to our §YDisjointed Government:§!\n"
 germany.60.b:0 "Issue a diplomatic objection."
 germany.61.d:0 "Several German divisions recently advanced into the Rhineland, marking the first time since the end of the Great War that Germany has forces positioned west of the Rhine. This is in clear violation of the Versailles Treaty, under which Germany is forbidden from militarizing the region!\n\nThe French are mobilizing their forces, and seem intent on issuing an ultimatum. If Germany refuses, they are prepared to advance into Germany to deal with this threat. Popular opinion in Britain is against a war, but if we refuse to stand by the French our alliance with them will be dissolved."
 germany.61.a:0 "A war is out of the question."
 germany.61.b:0 "We must stand by France!"
 germany.62.d:0 "Several German divisions recently advanced into the Rhineland, marking the first time since the end of the Great War that Germany has forces positioned west of the Rhine. This is in clear violation of the Versailles Treaty, under which Germany is forbidden from militarizing the region!\n\nThe French seem content to limit their response to this breach to diplomatic objections, and public opinion in Britain is firmly against a war."
 germany.62.a:0 "We will issue an objection as well."
 germany.63.t:0 "Britain Refuses War"
 germany.63.d:0 "The British are refusing to support us against Germany, claiming that the Germans are 'simply walking in their own backyard.' If we go to war with them, it looks like we will be on our own.\n\nPublic opinion in France is against a war, but Germany will only grow stronger and the remilitarization of the Rhineland constitutes a direct threat against our borders. Issuing an ultimatum would be less threatening without Britain on our side. Should we proceed against them alone?"
 germany.63.a:0 "Yes! Germany must be dealt with now."
 germany.63.b:0 "No, without the British we must back down..."
 germany.64.t:0 "Britain Supports Us"
 germany.64.d:0 "Though popular support for a war is lacking in Britain, the British government has recognized the threat posed by the Germans and they have offered us their full support. We will issue a final ultimatum to Germany to withdraw from the demilitarized zone. If they refuse, it is time for our forces to drive deep into Germany and put an end to their tyrannical regime!"
 germany.64.a:0 "Onwards!"
 germany.65.t:0 "France and Britain Mobilize!"
 germany.65.d:0 "The British and French have refused to accept the remilitarization of the Rhineland, calling it an 'unforgivable breach' of the Versailles Treaty. They are mobilizing their forces against us and have issued an ultimatum that our forces back down at once and the Rhineland remains demilitarized, or our nations are at war."
 germany.65.a:0 "We cannot back down! The Reich must be defended!"
 germany.65.b:0 "We are unprepared for this confrontation. We must back down."
 germany.66.t:0 "France Mobilizes!"
 germany.66.d:0 "The British have seen reason and accepted the remilitarization of the Rhineland, but the mad French are refusing to back down! Claiming that this incident constitutes a direct threat against the security of their nation, they are mobilizing their forces and may sweep in across the border at any moment! We are at war!"
 germany.67.t:0 "France Backs Down"
 germany.67.d:0 "The French wisely chose to back down when they realized that their mad enterprise wouldn't enjoy British support. Their forces have been demobilized and war has been averted for now. By golly, that was a close one!"
 germany.67.a:0 "A war now would be madness."
 germany.68.t:0 "France Refuses to Back Down"
 germany.68.d:0 "The French have stubbornly decided to go at it alone against the Germans, and our alliance with them has been rescinded. Yet another European war has broken out due to pointless squabbling. Perhaps it is time for Britain to distance itself from continental affairs again..."
 germany.68.a:0 "Perhaps it was inevitable."
 germany.71.t:0 "The Führer is Dead"
 germany.71.d:0 "SS troops and loyal army units rushing to the Reichskanzlei have managed to kill or capture all of the traitor commandos, but not before the dogs managed to kill Hitler! The Führer was found with several dozen gunshot wounds slumped over his desk - working tirelessly for the Vaterland to his last breath, no doubt!\n\nThe surviving conspirators will stand trial for their heinous crime, but for now Germany is at war and a new leader is needed. Who shall be the next Führer?"
 germany.71.a:0 "Herr Himmler will lead us into the future."
 germany.71.b:0 "Herr Göring is the logical choice."
 germany.72.t:0 "The Conspiracy Fails"
 germany.72.d:0 "SS troops and loyal army units rushing to the Reichskanzlei have managed to kill or capture all of the traitor commandos, and Hitler himself led the clean-up effort with his trusty Luger. Miraculously, the Führer emerged from the fighting with only a few scratches.\n\nThe surviving conspirators will pay a steep price for their disloyalty, and Hitler is now even more committed towards prosecuting the current war towards a glorious victory!"
 germany.72.a:0 "Long live the Führer!"
 germany.73.t:0 "The Conspiracy Succeeds"
 germany.73.d:0 "The heavy fighting in the Reichskanzlei has reduced the building to a burning ruin. Despite a large number of SS soldiers rushing to Hitler's aid, army units loyal to the conspirators joined the fray and proved decisive. The Führer has been confirmed as killed, and the conspirators have successfully stormed all government buildings in Berlin.\n\nA large portion of the Wehrmacht has gone over to the other side, but many officers are still NSDAP loyalists. Who should be leading them?"
 germany.73.a:0 "Death to National Socialism!"
 germany.73.b:0 "Himmler will turn this around!"
 germany.73.c:0 "Göring is our only hope at this point!"
 germany.74.t:0 "Preparing the Ground"
 germany.74.d:0 "The Austrians are yearning to become part of the German Reich, but the stubborn government in Vienna has so far resisted all attempts to bring about a union. We must increase support for fascism in Austria. The Austrian Nazi Party will then become a viable alternative to the ruling austrofascists.\n\nAn Abwehr agent has been made available for an espionage mission. Use him to covertly increase popular support for fascism in Austria."
 germany.74.a:0 "Austria will be ours!"
 germany.75.t:0 "German-Soviet Treaty"
 germany.75.d:0 "Despite harsh previous rhetoric against both the people and the ideological leadership of the [GER.GetName], [GER.GetLeader] and Germany has now reached out to us, requesting a mutually beneficial research treaty. While exchanging knowledge would help our efforts to develop new tank designs along with promises of other research benefits in the future, there is little doubt considering previous statements that the Germans are doing this for their own sake. Should we go forward with the agreement despite the risk of aiding [From.GetLeader]'s ambitions?"
 germany.75.a:0 "The capitalists are a worse threat to us both."
 germany.76.t:0 "Soviets Accept German-Soviet Treaty"
 germany.76.d:0 "Our negotiations with the [FROM.GetName] have been successful. An agreement has been reached where our nations will aid each other in the development of new armored units, with a possible extension to other research areas in the future."
 germany.76.a:0 "This treaty will be a stepping stone to the future."
 germany.77.t:0 "Soviets Reject German-Soviet Treaty"
 germany.77.d:0 "The [From.GetName] has rejected our suggestion for a treaty aimed at advancing armored unit research in both countries, presumably fearing our superior weapons would be turned against them."
 germany.77.a:0 "They have hardly diminished the risks of it now."
 germany.78.t:0 "German Joint Air Research"
 germany.78.d:0 "As stipulated by the treaty with Germany, some of their special research projects share discoveries with our engineers. A recent breakthrough in radar technology has come to our attention, opening up unexpected opportunities to advance our research in the field."
 germany.78.a:0 "Detecting the enemy is the first step."
 germany.79.t:0 "Ultimatum from Germany"
 germany.79.d:0 "With Greece under the thumb of Germany, [From.GetLeader] has put pressure on our government to join their ranks. The Soviet-German alliance has put us in a position where neutrality is no longer an option, and now an ultimatum has arrived from Berlin demanding we cede our eastern territories to their Soviet allies and join them in the very pact they are using to force our hand.\n\nAlthough we cannot maintain neutrality, there are other options. Seeking support from Britain is one, standing our ground is another. None, however, can secure the future of the republic with certainty."
 germany.79.a:0 "If we work with the Germans, we may find the opportunity to reclaim other land."
 germany.79.b:0 "We can count on British support, and they can count on us."
 germany.79.c:0 "If these despots want to take our home, they have to fight for it."
 germany.80.t:0 "Danzig for Slovakia"
 germany.80.d:0 "The Germans have long had their eyes on Danzig, seeking to unite their territories in Ostpreussen with the rest of the German nation. Diplomats have warned that the day may come when they make us choose between Danzig or war.\n\nSurprisingly, we have been presented with what the Germans consider a more peaceful solution. They offer the newly created state of Slovakia, currently little more than a puppet state under German rule, to us in exchange for Danzig. \nWhat steps the Germans will take if we decline is unknown, but we have been given an opportunity to resolve this conflict with some territorial gains."
 germany.80.a:0 "This is the best offer we'll get."
 germany.80.b:0 "We will not give what is rightfully ours for what they have stolen!"
 germany.81.t:0 "Danzig Ceded for Slovakia"
 germany.81.d:0 "Poland has agreed to the exchange wherein Danzig will be ceded to [GER.GetNameDef], while Slovakia will now be under Polish control. Through this agreement, we have reclaimed Danzig while maintaining cordial, or at least not openly hostile, relations with our eastern neighbor."
 germany.81.a:0 "Germany is one again."
 germany.82.t:0 "[From.GetNameDefCap] Refuses to give up Danzig"
 germany.82.d:1 "Our generous offer of Slovakian territories to [From.GetNameDef] in exchange for Danzig has been rejected, leaving Danzig in Polish hands. Clearly, [From.GetLeader] does not share our understanding of Danzig as rightfully German territory. \n[Root.GetLeader] is furious, and the diplomatic options for reclaiming Danzig appear to have been exhausted."
 germany.82.a:0 "It may be time to consider other options."
 germany.83.t:0 "Anti-Soviet Pact"
 germany.83.d:0 "With the Anti-Comintern Pact, [From.GetNameDef] has secured fertile ground for diplomatic means of containing the Soviet menace. However, the pact does not constitute a military alliance, nor does it contain well-defined obligations for the signatories. [From.GetLeader] now seeks to extend the pact to an Anti-Soviet coalition, a binding agreement to join together in war if any signatory enters into a state of war with the Soviet Union.\n\nWhile substantially more dangerous, and likely to bring an end to any diplomacy we still maintain with the Soviets, this is also our chance to ensure that we have strong allies on our side in the case of war."
 germany.83.a:0 "We will stand by Germany and its allies against the Soviets."
 germany.83.b:0 "Anyone could start another world war with such a pact."
 germany.84.t:0 "Call Pact Members to War"
 germany.84.d:0 "Just as we suspected when we signed the Anti-Soviet Pact, we now find ourselves in a state of war with the Soviet Union. It is time for our co-signatories to honor their promise and join us."
 germany.84.a:0 "Our foresight pays off."
 germany.85.t:0 "[From.GetName] Calls Pact Members to War"
 germany.85.t.a:0 "[From.GetName] Calls Pact Members to War"
 germany.85.t.b:0 "[From.GetName] Invokes Guarantee"
 germany.85.desc.a:0 "The Anti-Soviet Pact stipulates that all signatories must join in any defensive conflict with the Soviet Union. [From.GetName] has now been attacked by the Soviets and has sent out a request for all pact members to come to their aid immediately. It is time to show the [Root.GetAdjective] dedication to protecting the world from the threat of the Soviet Union once and for all."
 germany.85.desc.b:0 "Our guarantee to [From.GetNameDef] stipulates that we must join in any defensive conflict with the Soviet union. They have now been attacked by the Soviets, and the time has come for us to uphold our end of the bargain and come to their aid immediately. It is time to show the [Root.GetAdjective] dedication to protecting the world from the threat of the Soviet Union once and for all."
 germany.85.a:2 "[From.GetName] does not stand alone!"
 germany.85.b:0 "This is not our war."
 germany.85.b_tt:0 "§YThis will be viewed as a betrayal by all countries who honor the pact (§!§R-50§!§Y opinion)§!"
 germany.86.t:0 "Danzig or War"
 germany.86.d:0 "[GER.GetNameDefCap] has long publicized their goal of reclaiming the territories they lost in the Great War. In particular they look to the territory of Danzig, which separates Ostpreussen from the rest of their nation. \n\nNow, they have demanded that Danzig be ceded to [GER.GetNameDef], and in exchange offer nothing but a promise to waive their claims on Poznan. With the threat of war looming, accepting the offer will delay a possible conflict, but at the cost of freely granting the Germans more strength for whatever lies ahead."
 germany.86.b:0 "Danzig will remain Gdansk!"
 germany.87.t:0 "Poland Cedes Danzig"
 germany.87.d:0 "Faced with our ultimatum, Poland has agreed to give up their unjustly acquired territory to us, proving that they must have known it rightfully belonged to Germany!"
 germany.87.a:0 "Poland has avoided war... for now."
 germany.88.t:0 "Poland Refuses to Cede Danzig"
 germany.88.d:0 "Despite our attempts to allow Poland to hand over Danzig peacefully, even vowing to give up our claims on other German territories in exchange, we have been met with refusal. As expected, the world gives nothing to us that we do not seize by force."
 germany.88.a:0 "They know very well what the alternative is."
 germany.2280.t:0 "Bohemia has been reunited with Germany!"
 germany.2280.d:0 "We now have control over the Czech military industry and their army's stockpiles. The nation had fielded a modern army of 35 divisions and was a major manufacturer of machine guns, tanks, and artillery, most of them assembled in the Škoda factory in Plzeň or by ČKD in Prague. With an inspection conducted at the ČKD facilities, the delegation found a state of the art light tank at late testing stages, the LT vz. 38. The tanks overall performance highly impressed the delegation, which after an examination, proposed its production to be immediately started."
 germany.2280.a:0 "Let's see what we can use."
 germany.565.t:0 "The Blomberg Affair"
 germany.565.d:0 "Werner von Blomberg, the reichsminister of war and the commander in chief of the armed forces is under accusations that his newfound wife has a criminal history and has posed for pornographic photos in 1932. This had been reported to the Berlin police chief, von Helldorf, who went to Wilhelm Keitel with the file on the new Mrs. Blomberg.  Keitel, seeing a chance to destroy Blomberg's career, told Helldorf to take the file to Göring, which he did. Göring and Himmler see this an opportunity to strike against Blomberg, who they see as an enemy to their ambitions, and to weaken the OKH as a whole."
 germany.565.a:0 "Blomberg doesn't back down and resigns. OKH is reshuffled and OKW is created."
 germany.565.b:0 "Blomberg listens to Hitler and annuls the marriage."
 germany.566.t:0 "Hitler pushes for reforms in the command structure"
 germany.566.d:0 "Even with the failure of Keitel's plan to oust Blomberg, the opposition to his post as the War Minister and the Chief of the Wehrmacht still remains. It doesn't help matters that Hitler himself wants the armed forces more strictly under his control. With the support of both the Luftwaffe and the SS, Hitler has announced that the War Ministry is to be reorganized as the Oberkommando der Wehrmacht, with strong pressure applied to Blomberg to be honorably discharged from his posting. This placing of the military more strictly under political control also fights against Blomberg's will to safeguard the German military's traditional "state within the state" status dating back to Prussian times, under which the military does not take orders from the civilian government."
 germany.566.a:0 "Blomberg retires as a protest and Fritsch is pressured to resign based on false charges."
 germany.566.b:0 "Blomberg leaves his post as the chief of Wehrmacht, but remains as a commander."
 ger_peace_pol:0 "The Germans back down after Soviet pressure"
 japan.1.d:0 "Chinese authorities claim that the 'breaking point' has been reached in regards to our 'unwarranted aggressions' towards China! Our demands for reparations have been refused, and there are reports of Japanese nationals coming under attack in Shanghai. If we needed an excuse to deal decisively with the Chinese, this is it!"
 japan.1.a:0 "They will pay for this!"
 japan.2.d:0 "Surprisingly, the Chinese have chosen to back down following the skirmish at the Marco Polo Bridge. They understand that angering us carries a steep price, and have agreed to extensive territorial concessions that include Beijing and its surrounding regions. Little by little, China is becoming ours."
 japan.2.a:0 "The war will have to wait."
 japan.3.t:0 "Border Skirmish: Soviet Victory"
 japan.3.d:0 "The Russians and their Mongolian lap dogs detected the build-up of our troops in Heilungkiang, and responded with a large raid across the border before our preparations had been completed! Our forces were badly mauled in the intense skirmishing that followed before the two sides disengaged."
 japan.3.a:0 "How could this have happened?!"
 japan.4.t:0 "Border Skirmish: Japanese Victory"
 japan.4.d:0 "The Russians and their Mongolian lap dogs detected the build-up of our troops in Heilungkiang, and attempt to launch a large raid across the border to disrupt our preparations! Fortunately, our quick-thinking commanders caught their forces in a pincer movement. We inflicted severe losses on their forces before they fled back across the border."
 japan.4.a:0 "That will teach them!"
 japan.5.t:0 "Soviet Withdrawal"
 japan.5.d:0 "After detecting our troop build-up, the Soviets wisely chose to withdraw their forces from the areas immediately adjacent to the Manchurian border. Our soldiers have temporarily occupied several of their abandoned border outposts. This will hopefully put an end to the ludicrous border claims the Russians and their Mongolian allies have been putting forward."
 japan.5.a:0 "A show of force was all it took."
 japan.6.t:0 "The French Accept Our Demands"
 japan.6.d:0 "The French have agreed to our demands, and their bases and facilities in Indochina are at our complete disposal. They have effectively turned over full control of their colony to us."
 japan.6.a:0 "A wise move."
 japan.7.t:0 "The French Refuse Our Demands"
 japan.7.d:0 "The French have outrageously refused our demands! It seems that if we want Indochina, we'll have to take it by force!"
 japan.7.a:0 "Fools!"
 japan.8.t:0 "Germany Recalls Advisors"
 japan.8.d:0 "The Germans have recalled all of their advisors from China. They should be boarding planes bound for Berlin even now. Germany recognizes that the future of Greater East Asia belongs to Japan, not China."
 japan.8.a:0 "A Blow to Our Efforts"
 japan.9.t:0 "Germany Refuses Our Request"
 japan.9.d:0 "The Germans have refused to recall their advisors from China, despite the fact that their military mission interferes directly with our plans for East Asia! Do they not see that this erodes the foundation for our nations to build diplomacy on? Can the Germans even be trusted?"
 japan.9.a:0 "Then their advisors will die with the rest of the Chinese."
 japan.11.t:0 "Issue Ultimatum to Siam"
 japan.11.d:0 "Amassing troops in Indochina, close to the Siamese border, we have made it clear that our intent to use their land as a base for freeing Southeast Asia from European colonialism is sincere. Hopefully, by allowing them the option of joining us in a military alliance, effectively making Siam a puppet state of the Japanese Empire, we can avoid a meaninglessly one-sided invasion. Of course, if they reject it, this will be tantamount to a declaration of war."
 japan.11.a:0 "We will enter Siam, regardless of what they say."
 japan.11.b:0 "In hindsight, threatening invasion is too aggressive."
 japan.12.t:0 "Japan Issues Ultimatum"
 japan.12.d:0 "Japan has been gathering forces close to our border for a long time and as suspected, their plan is to use our ports as bases for further expansion into Burma and Malaya. Now, they have presented us with the choices of submitting and allowing them to pass through or facing invasion.\n\nAlthough this could be seen as giving up our sovereignty and turning us into a Japanese puppet state, avoiding a war may be in our best interest."
 japan.12.a:0 "We will agree to an alliance with Japan."
 japan.12.b:0 "We will not surrender our independence so easily!"
 japan.13.t:0 "Siam Accepts Ultimatum"
 japan.13.d:0 "[From.GetLeader] has wisely decided to accept our ultimatum and forge a military alliance between our nations. Effectively, we will be able to use Siam as a base for future operations in the Pacific."
 japan.13.a:0 "The Greater East Asia Co-Prosperity Sphere grows stronger."
 japan.14.t:0 "Siam Rejects Ultimatum"
 japan.14.d:0 "[From.GetLeader] has rejected our demands to enter Siam and our offer of a military alliance. Having announced our intent to enter regardless, this means war."
 japan.14.a:0 "Unfortunate that it would come to this."
 japan.25.t:0 "Recent Conquest in China"
 japan.25.d:0 "We have successfully conquered a new area in China. Now it remains up to us to decide what to do with the fruits of our labour and how to materialize it into prosperity that all of Japan can prosper from! In the true spirit of the Yamato, the sword that shall pierce the heavens will slash through all that dare stand in front of the divine Emperor."
 japan.25.a:0 "Let the Zaibatus build Industrial Complexes"
 japan.25.b:0 "Let the Zaibatus build Arms Factories"
 japan.16.t:0 "A Puppet of Japan"
 japan.16.d:0 "The Japanese seek to control the wealth of China, and will not be stopped short of war. If we do not wish to fight them, we must submit to their control and become nothing more than a Japanese Puppet."
 japan.16.a:0 "We cannot fight"
 japan.16.b:0 "We must fight!"
 japan.17.t:0 "China submits"
 japan.17.d:0 "The cowardly Chinese have once again submitted to our demands, they have agreed to become a mere puppet of our nation."
 japan.17.a:0 "Their loss is our gain!"
 japan.18.t:0 "China refuses"
 japan.18.d:0 "The foolish Chinese have refused our perfectly reasonable request that we manage certain aspects of their government. We will need to conquer them if we want access to their resources."
 japan.18.a:0 "Shouldn't be difficult!"
 japan.20.t:0 "Strike Pearl Harbour!"
 japan.20.d:0 "Admiral Yamamoto is convinced that our best chance to victory against the Americans is to destroy their aircraft carriers in a sudden and lethal at their main port: Pearl Harbour. Our carrier will get as close as possible to Hawaii and then send several waves of attack planes."
 japan.20.a:0 "TORA! TORA! TORA!"
 japan.21.t:0 "Japanese occupation of the Dutch East Indies"
 japan.21.d:0 "After the Dutch government-in-exile had declared war on Japan, the Japanese started to prepare plans to invade the Dutch East Indies. The invasion was swift and decisive. The Japanese had landed on Sumatra where they had encouraged the Acehnese to rebel against the Dutch, any other Dutch resistance proved to be futile against the rapidly advancing IJA. The Japanese occupation was initially greeted with optimistic enthusiasm by Indonesians who came to meet the Japanese army waving flags and shouting support such as "Japan is our older brother.""
 japan.21.a:0 "Banzai Dai Nippon! For the Emperor!"
 JAP_Indian_National_Army_arrives:0 "Two divisions of the Indian National Army arrive in Singapore."
 germany.90.t:0 "Alliance refused"
 germany.90.d:0 "The Soviets have refused our offer, if we want the resources of the Soviet Union we shall have to take them by force!"
 germany.90.a:0 "If they are not with us they are against us."
 germany.91.t:0 "France wants to join our faction"
 germany.91.d:0 "The strong leaders of Mouvement Franciste have made great progress and offer to join our cause. The nation of France is ready to fight for the Reich."
 germany.91.a:0 "Mehr Soldaten für das Reich"
 germany.91.b:0 "Nein!"
 germany.92.t:0 "Germany Refuses Ultimatum"
 germany.92.d:0 "Despite our clarification that their remilitarization of the Rhineland would be viewed as an act of war, Germany has refused to back down and advanced into the demilitarized zone, ignoring our warning. This means that despite our best efforts to maintain peace, war has once again broken out in Europe."
 germany.92.a:0 "The Versailles Treaty must be enforced."
 germany.93.t:0 "London Conference"
 germany.93.d:0 "We expected the great powers of Europe to sit sound the table and come to equitable agreement in the name of peace. Instead the British and French have chosen to support the upstart Yugoslavs and their artificial state. Slovenia will be ours, one way or another...."
 germany.93.d_FRA_abandoned_yugoslavia:0 "We expected the great powers of Europe to sit sound the table and come to equitable agreement in the name of peace. Although France saw the justice of our case the foolish British have chosen to support the upstart Yugoslavs and their artificial state. Slovenia will be ours, one way or another...."
 germany.93.a:0 "We will not be denied"
 germany.94.t:0 "The London Surrender"
 germany.94.d:0 "In yet another triumph for daring and action Slovenia, soon to be renamed to Carniola, has been returned to its rightful home in the German Reich."
 germany.94.a:0 "A Triumph for Germany!"
 germany.95.t:0 "The Yugoslavs Refuse"
 germany.95.d:0 "In a misplaced sense of their place in the world the Yugoslavs have chosen to not accept the chance we have offered them."
 germany.95.a:0 "Time to teach them a lesson"
 germany.96.t:0 "London Conference"
 germany.96.d:0 "The Yugoslavs, egged on by the foolish Italians, have decided to defy us. The ungrateful Italians will burn with the Yugoslavs. General Rommel assures us that they ran the last time, and no doubt they will run again."
 germany.96.a:0 "This war won't last long"
 germany.97.t:0 "London Conference"
 germany.97.d:0 "The great London Conference was supposed to right one of the many wrongs that have been done to Germany. The French, though, still thirst for revenge and only wish to see Germany on its knees. They backed the regime in Belgrade despite the justice of our cause. They honestly think their empty threats mean anything to us?"
 germany.97.a:0 "We will crush them both."
 germany.102.t:0 "Greece Refuses"
 germany.102.d:0 "Greece has foolishly refused our assistance in solving their border disputes."
 germany.102.a:0 "They must have realised the alternative"
 germany.103.t:0 "Greece Refuses"
 germany.103.d:0 "Greece has refused our generous offer of protection and assistance"
 germany.103.a:0 "We must force them to see reason"
 germany.104.t:0 "Italy Demands Vichy Territory"
 germany.104.d_Savoy:0 "The Italians have started to issue demands to Vichy France on the back of our victory. They are seeking the frontier zone of Savoy to strengthen Italy. However, we are the ones who will decide that."
 germany.104.d_Corsica:0 "The Italians are demanding the Island of Corsica from Vichy as their share of the spoils. We could grant it to them?"
 germany.104.d_Savoy_Corsica:0 "Italy has demanded that Vichy hand over Savoy and Corsica. It would be a boon to Italy but this will concern the French colonial authorities."
 germany.104.a:0 "I suppose the can have Savoy"
 germany.104.b:0 "Corsica is all they are worth"
 germany.104.c:0 "Let them have Savoy"
 germany.104.e:0 "A strong ally leads to a strong Germany"
 germany.104.f:0 "They need more than a few thousand dead"
 germany.105.t:0 "Italy Leaves [Root.GetFactionName]"
 germany.105.d:0 "Following our decision to not grant any lands to Italy. They have chosen to leave [Root.GetFactionName] saying that we are not worthy enough allies for them."
 germany.105.a:0 "They never did much fighting anyway"
 germany.106.t:0 "Treaty Of Craiova"
 germany.106_threat:0 "Treaty Of Craiova"
 germany.106.d_second_vienna_accepted_north:0 "With Hungary's gain of Northern Transylvania, Bulgaria has reminded us of their long standing boundary dispute with Romania over Southern Dobrudja, seized by Romania in 1913."
 germany.106.d_second_vienna_accepted_all:0 "With Hungary's gain of Transylvania, Bulgaria has reminded us of their long standing boundary dispute with Romania over Southern Dobrudja, seized by Romania in 1913."
 germany.106.d_no_vienna:0 "Since relationship with Hungary has cooled, with them choosing to join in another alliance, our original plan to give them a part of Transylvania is out of the question. Instead, we should lend an ear to the Bulgarian territorial dispute for Southern Dobrudja, seized by Romania in 1913."
 germany.106.a:0 "Let them demand Southern Dobrudja"
 germany.107.t:0 "The Flight of Rudolf Hess"
 germany.107.d:0 "Deputy Führer Rudolf Hess was arrested by Home Guard soldiers in Scotland yesterday after parachuting from a heavy fighter. An accomplished pilot, he apparently flew alone across the North Sea, taking care to stay out of radar range before veering west towards Britain.\nHess appears to have taken it upon himself to negotiate a peace treaty between Britain and Germany, although Berlin has denounced him as a madman and he has been stripped of all of his political offices. British authorities have not been available for comment."
 germany.107.a:0 "Wahnsinn!"
 germany.108.t:0 "The Death of Rudolf Hess"
 germany.108.d:0 "Deputy Führer Rudolf Hess was killed yesterday when the Royal Air Force intercepted the heavy fighter he was flying off the coast of Scotland. The exact nature of his mission remains unclear - although Hess was an accomplished pilot, he flew alone and his airplane does not appear to have been armed.\nHis remains were recovered by British authorities, but a state funeral with an empty coffin has been scheduled in Berlin. \n\nHitler was reported as being visibly distraught by the death of his old friend."
 germany.108.a:0 "That poor fool."
 germany.109.d:0 "The airship Hindenburg, which had been moored in Germany since the beginning of hostilities, met with a dramatic end today when it exploded over Scotland. It appears to have been commandeered by Deputy Führer Rudolf Hess, who managed to fly it alone across the North Sea on a personal mission to negotiate peace with Britain.\nBritish radar stations had no trouble detecting the massive aircraft, and several Royal Air Force wings were immediately directed towards its position. When the Hindenburg failed to respond over the radio, they opened fire. \n\nHess parachuted to safety, and has now been imprisoned in the Tower of London."
 germany.110.d:0 "The airship Hindenburg, which had been moored in Germany since the beginning of hostilities, met with a dramatic end today when it exploded over Scotland. It appears to have been commandeered by Deputy Führer Rudolf Hess, who managed to fly it alone across the North Sea on a personal mission to negotiate peace with Britain.\nBritish radar stations had no trouble detecting the massive aircraft, and several Royal Air Force wings were immediately directed towards its position. When the Hindenburg failed to respond over the radio, they opened fire. \n\nThe remains of Hess were found in the wreckage."
 germany.110.a:0 "That madman..."
 germany.111.t:0 "Yugoslavia Refuses"
 germany.111.d:0 "Yugoslavia has foolishly refused our offer to resolve tensions in the region."
 germany.111.a:0 "They have forced our hand"
 germany.113.t:0 "Germany Officially Requests Danzig"
 germany.113.d:0 "Seeing their military support as essential for any future success in our civil war, [GER.GetNameDef] has presented plans for establishing [GER.GetAdjective] control over Danzig upon the conclusion of hostilities. They have also made it clear that [Root.GetNameDef]'s reliance on their military support leaves [Root.GetLeader] no choice but to sign this "Danzig Agreement.""
 germany.113.a:0 "[Root.GetName] must take one battle at a time."
 germany.114.t:0 "German Demands for Danzig"
 germany.114.d:0 "Following our victory in the [Root.GetAdjective] civil war, Germany has repeatedly reminded us of their request for Danzig. They have also reminded us of what the consequences of disobedience may be for a nation still recovering from internal conflict."
 germany.114.a:0 "They will have Danzig, as agreed."
 germany.114.b:0 "We will never cede Polish land!"
 germany.115.t:0 "Poland Cedes Danzig"
 germany.115.d:0 "In accordance with the Danzig agreement, [GER.GetNameDef] has agreed to the transfer of Danzig to [GER.GetNameDef] control."
 germany.115.a:0 "This has proved a beneficial partnership."
 germany.116.t:0 "Poland Reneges On the Danzig Agreement"
 germany.116.d:0 "Ignoring the invaluable support we offered them in their civil war, [From.GetName] has decided to ignore our claims on Danzig."
 germany.116.a:0 "Dishonoring our agreement will cost them dearly."
 germany.116.b:0 "We cannot afford this conflict."
 germany.117.t:0 "The Danzig Agreement"
 germany.117.d:0 "[From.GetName] has agreed to our request for Danzig in exchange for support in their civil war. Our request and our promise have been formalized in the Danzig Agreement. Now we must make certain that [From.GetName] emerges victorious from their conflict."
 germany.117.a:0 "This is a [Root.GetAdjective] struggle, too."
 germany.122.t:0 "[From.GetNameDefCap] Demands the Sudetenland"
 germany.122.d:0 "In the middle of the ongoing situation, Germany has demanded the Sudetenland territory from us, to "protect the German population" of the region.\n\nWith the ongoing situation, they have made it very clear that this is it. There will be no negotiations or diplomacy. They will have the Sudetenland, or they will go to war over it."
 germany.122.a:0 "We cannot afford a war with [From.GetNameDef]."
 germany.123.t:0 "[From.GetNameDefCap] Refuses us the Sudetenland"
 germany.123.d:0 "In a foolish diplomatic move, [From.GetLeader], the leader of the [From.GetAdjective]s has rejected all [Root.GetAdjective] demands!\n\nThey will not cede the Sudetenland, and practically dared us to declare war, mocking our desire to protect our [Root.GetAdjective] brothers and sisters."
 germany.123.a:0 "So be it!"
 germany.124.t:0 "[From.GetNameDefCap] Cedes the Sudetenland"
 germany.124.d:0 "Facing the prospect of war with us, [From.GetNameDef] has agreed to cede all control of the Sudetenland, and renounce any future claim to the region.\n\nThe [Root.GetAdjective] population of the Sudetenland will finally be safely in the fold of the [Root.GetNameDef]."
 germany.124.a:0 "For [Root.GetNameDef] and all [Root.GetAdjective]s!"
 germany.126.t:0 "Anschluss or Destruction"
 germany.126.warning:0 "§RCan lead to war§!\n"
 germany.126.d:0 "Civil unrest and acts of violence have broken out as protesters voice their desire for Austria to join Germany. The internal struggles our nation already suffers from only adds to the voice of people wishing for a union with Germany. Berlin is pressing hard for an Anschluss and this may very well be our only chance to keep part of the true Austrian values alive."
 germany.126.a:0 "We shall join the German Reich!"
 germany.126.b:0 "No, Austria's destiny lies elsewhere."
 germany.127.t:0 "Formalize the Alliance"
 germany.127.d:0 "United in our fight against the Soviet Union, perhaps it is time to formalize the alliance and invite our new partners in this anti-communist war to our faction."
 germany.127.a:0 "We shall send envoys."
 germany.127.b:0 "We will not have further obligations to them."
 germany.128.t:0 "The Anti-Soviet Pact"
 germany.128.d:0 "[From.GetNameDefCap] has offered to welcome us to their faction, so that we may better coordinate against the communist threat. Envoys to formalize this alliance have already arrived in the capital."
 germany.128.a:0 "This is a great initiative."
 germany.128.b:0 "Our fate lies with others."
 germany.563.t:0 "The Battle of France"
 germany.563.d:0 "After you click the §RAround Maginot§! decision, both you and France will have a set of missions called ticks (up to 10). For every tick that completes, France will gain 2 Off Map Civilian Factory and 2 Off Map Military Factory (for the first 5 missions); after that, it gets 1 each (up to a maximum of 15 MIC and CIC, considering a hold of at least 220 days).\n\nHowever, for every unfinished mission after the capitulation of France, Germany will in turn receive 2 Civilian factories and 2 Military factories. The first 3 missions take 10 days each, 4th to 7th take 20 days each, and 8th to 10th take 30 days each.\nFrance gains Initial War Enthusiasm at the start of WW2, which grants:\nDivision Attack on Core Territory: §G+55%§!\nDivision Defense on Core Territory: §G+55%§!\nWeekly War Support: §R-0.30%§!\nThis modifier decays by §R-6%§! (it starts decaying after 1st September 1939, and if France is at war with Germany) every month. After §RAround Maginot§! happens, it will decay by §R-10%§!\n§BGermany§! capitulating §BBelgium§!, §BNetherlands§! and §BDenmark§! each decreases this modifier by §R-5%§!, and §BNorway§! by §R-7.5%§!\nBy capitulating Poland, Germany will trigger Phoney War, which grants France:\nDivision Attack on Core Territory: §G+20%§!\nDivision Defense on Core Territory: §G+20%§!\nUpon declaring war on Benelux, the Phoney War buff disappears."
 germany.563.a:0 "OK."
 germany.564.t:0 "The Invasion of Poland"
 germany.564.d:0 "After you click the §RDanzig or War§! decision, both you and Poland will have a set of missions called ticks (up to 10). For every tick that doesn't complete, Poland will gain 2 Civilian factories, 2 Military factories, 5k IC worth of equipment and 20k manpower after they capitulate.\n\nHowever, for every unfinished mission after the capitulation of Poland, Germany will in turn receive 1 Civilian factory and 2 Military factories. All missions take 10 days each, except the last one, which takes 20.\nPoland loses Attack and Defence on Core Territory as it loses states. For losing §BPoznań§!, §BGdynia§!, §BKraków§!, §BŁódź§! Poland will receive:\nDivision Attack on Core Territory: §R-5%§!\nDivision Defense on Core Territory: §R-5%§!\nFor losing Hel it will receive:\nDivision Attack on Core Territory: §R-10%§!\nDivision Defense on Core Territory: §R-10%§!\nIf Germany captures Warsaw, Poland will capitulate.\nAdditionally, after 17 days, eastern states of Poland will be invaded by the USSR according to the Molotov-Ribbentrop Pact. The Soviet Union will get up to 6 Military factories if they complete their ticks. When this happens, Poland will receive:\nDivision Attack on Core Territory: §R-10%§!\nDivision Defense on Core Territory: §R-10%§!"
 germany.564.a:0 "OK."
 germany.567.t:0 "The Battle of the Netherlands"
 germany.567.d:0 "When you take the §RAround Maginot§! decision, the Netherlands will activate a set of timed defense missions. Capture the listed cities before their timers expire to deny the Dutch their rewards and secure spoils for the Reich.\n\n§BRotterdam§! — §O7 days§!\nCapture before the timer expires to seize Dutch shipping and warships:\n§OGermany§! gains §O50§! convoys\n§OGermany§! gains §O6§! Dutch §O1936 Submarines§!\n§OGermany§! gains §O3§! Dutch §O1940 Light Cruisers§! at §O60%§! construction progress\n\n§BAmsterdam§! — §O5 days§! per shipment (repeating)\nHold Amsterdam to send gold convoys to Britain. Each completed shipment:\n§OThe United Kingdom§! gains §G100§! Million Pounds\nEach shipment reduces what §OGermany§! can seize if Amsterdam falls later by §O5000§! £cic£\nIf Amsterdam is captured immediately, §OGermany§! gains §O30000§! £cic£ (minimum §O0§!)\n\n§BThe Hague§! — §O12 days§!\nCapture before the timer expires to prevent the government from escaping:\nUpon capitulation, §OGermany§! gains §G30%§! Compliance in all §ONetherlands§! states it controls\n\n§BLeeuwarden§! — §O7 days§!\nCapture before the timer expires to seize the northern air wing:\n§OGermany§! gains §O50§! fighters\nIf held, §ONetherlands§! receives §O50§! fighters and an ace pilot upon capitulation\n\n§BBreda§! — §O100 days§! (only if the Netherlands coordinated with France)\nCapture Breda to sever the French corridor:\n§ONetherlands§! suffers §R-10%§! Division Attack on Core Territory until capitulation\n\n§BUtrecht§! — §O5 days§! (only if the Netherlands prepared inundation lines)\nCapture Utrecht before the inundation is completed to prevent the Dutch from flooding the province and destroying factories there.\n\nIf the Netherlands prepared infrastructure demolitions, they will automatically wreck §O4§! levels of §OInfrastructure§! in every Dutch core state they still control after §O3 days§!.\n\nMove quickly — every mission the Dutch complete strengthens their position and weakens ours."
 germany.567.a:0 "OK."
 germany.568.t:0 "The February Strike"
 germany.568.d:0 "On 25 February, Dutch workers in Amsterdam and across the occupied Netherlands have launched a general strike in protest against the persecution of the Jewish population. Tram workers, dockers, and civil servants have walked off the job, bringing much of the city to a standstill. The occupation authorities demand a response — crush the unrest with force, or make concessions to calm the population."
 germany.568.a:0 "Harsh Suppression"
 germany.568.b:0 "Give in to Demands"
 germany.558.t:0 "Telegram from the Bender Block"
 germany.558.desc:0 "The Oberkommando der Wehrmacht have discussed the future plans against the Soviet Union. Some argue for a short, fast, thrust into the Soviets just as we did in France, while some prepare a war of attrition. We can still continue with the original plan for Barbarossa, but can pick to plan for a shorter war or a longer war with the Soviets. "
 germany.558.a:0 "Prepare for a Quick Victory"
 germany.558.b:0 "Continue with the Original Plan"
 germany.558.c:0 "Adjust for a Long War"
 germany.1000.t:0 "General Vlasov offers to form a Russian Liberation Army"
 germany.1000.d:0 "After the second shock army under Soviet general Vlasov was surrounded, he himself was offered an escape by aeroplane. The general refused and hid in German-occupied territory; ten days later, a local farmer exposed him to us. He said that during his ten days in hiding he affirmed his anti-Bolshevism, believing Joseph Stalin was the greatest enemy of the Russian people. While in prison, Vlasov met Captain Wilfried Strik-Strikfeldt, a Baltic German who was attempting to foster a Russian Liberation Movement. Vlasov was taken to Berlin under the protection of the Wehrmacht's propaganda department. While there, he and other Soviet officers have begun drafting plans for the creation of a Russian provisional government and the recruitment of a Russian army of liberation under Russian command."
 germany.1000.a:0 "He could be a useful asset..."
 germany.1001.t:0 "German Field Marshal Captured?!"
 germany.1001.d:0 "Cut off by a Soviet counteroffensive and denied the option of retreat by German leader Adolf Hitler, Paulus was forced to surrender what was left of his army at [GetDateText]. Is this one of the turning points of the war?"
 germany.1001.a:0 "Verräter!"
 GER_vlasov_offers_his_services:0 "Vlasov has offered to lead the KONR"
 japan.26.t:0 "The "Righteous Army" Attempts a Coup"
 japan.26.d:0 "Young officers supporting a "Shōwa Restoration" modeled on the Meiji Restoration of 70 years earlier have decided to act. Their goal was the purging of the government and military leadership of their factional rivals and ideological opponents. Although the rebels succeeded in assassinating several leading officials including two former prime ministers, and in occupying the government center of Tokyo, they failed to assassinate Prime Minister Keisuke Okada or secure control of the Imperial Palace. Their supporters withing Kōdō-ha faction of the army have made attempts to capitalize on their actions, but divisions within the military, combined with Imperial anger at the coup, meant they were unable to achieve a change of government. Facing overwhelming opposition as the army moved against them, the rebels surrendered on 29 February."
 japan.26.a:0 "Banzai?"
 japan.27.t:0 "The Trial of the "Righteous Army""
 japan.27.d:0 "Over 1400 men taking part in the attempt have been interogated. Of these, all of the officers, 43 NCOs, three soldiers and all of the civilians were found guilty. The trial was held in secret, and the defendants did not have rights to legal representation, call witnesses or appeal. The trial of the ringleaders was held in secret. The judges were not interested in hearing about the defendants' motives and intentions, and forced them to concentrate on their actions in their testimony. The trial was therefore far different from the ordinary court martial that Aizawa had faced a few months earlier. Charged with rebellion the rebel officers argued that their actions had been approved by the Minister of War's Proclamation and their incorporation into the martial law forces, and that they had never been formally presented with the imperial command. What should the verdicts be?"
 japan.27.a:0 "Harsh Sentences for Key Cuprits"
 japan.27.b:0 "Throughly Purge the General Staff"
 japan.28.t:0 "The Fall of the Koki Cabinet"
 japan.28.d:0 "Hirota Koki has resigned as the prime minister after a disagreement with general Hisaichi Terauchi, who was serving as the war minister, over a speech by the Rikken Seiyūkai representative Kunimatsu Hamada criticizing military interference in politics. Kazushige Ugaki was appointed as his successor but was unable to form the government because of army opposition. In the end general Senjūrō Hayashi was appointed as prime minister where he tries to establish a cabinet that rises above the factional strife of the political parties."
 japan.28.a:0 "Stability at last?"
 japan.29.t:0 "The First Konoe Cabinet"
 japan.29.d:0 "Current president of house of peers, prince Fumimaro Konoe has been nominated prime minister by the last surviving genro and his mentor, Saionji Kinmochi. Emperor Hirohito accepted the nomination earlier this month. A notorious hawk with opinions about breaking the Anglo-American economic hegemony and asserting Japanese dominance over asia, he is likely to be very collaborative with the army."
 japan.29.a:0 "The Hawks are now Firmly in Charge"
 japan.30.t:0 "Konoe Resigns!"
 japan.30.d:0 "Konoe has been a strong advocate for a total victory over China. However with continuing Chinese resistance even with apparently endless Japanese victories, Konoe has recently resigned. He has left the war that he had a large part in making to be finished by someone else, and was appointed chairman of the Privy Council. The Japanese public, which has been told that the war was an endless series of victories, has been bewildered."
 japan.30.a:0 "Hiranuma will prepare Japan for victory over China..."
 japan.31.t:0 "The Collapse of the Hiranuma Cabinet"
 japan.31.d:0 "With Germany entering to a non-aggression pact with our common enemy, and our massive defeat in Mongolia, Hiranuma's cabinet has lost the support of the Emperor and resigned. After a short tenure of Nobuyuki Abe, Mitsumasa Yonai has been appointed prime minister. However, his policies of seeking to distance Japan from the European Axis have sparked protests in the military. We will see how long his government will last."
 japan.31.a:0 "The Germans Cannot be Trusted!"
 japan.32.t:0 "The Battle of Lake Khasan"
 japan.32.d:0 "The Kwantung Army has decoded a message sent by the Soviet commander in the Posyet region to Soviet headquarters in Khabarovsk. The message recommended that Soviet soldiers be allowed to secure unoccupied high ground west of Lake Khasan, most notably the disputed Changkufeng Heights, because it would be advantageous for the Soviets to occupy terrain which overlooked the Korean port-city of Rajin, as well as strategic railways linking Korea to Manchuria. In the next two weeks, small groups of Soviet border troops moved into the area and began fortifying the mountain. Kotoku Sato's troops bravely took the position via daring night action, inflicted heavy casualties on the Soviets, but were eventually forced to retreat. Despite not being forced off the battlefield, it was clear that the local Japanese units would not be able to keep Changkufeng without widening the conflict. Eventually our ambassador Mamoru Shigemitsu asked for peace. The army is satisfied that the incident has been brought to an honourable conclusion."
 japan.32.a:0 "Banzai!"
 japan.34.t:0 "Strengthen the Divine Wind"
 japan.34.d:0 "The island-hopping campaign turns against us. American fleets press ever closer to the Home Islands, and conventional tactics no longer suffice to stop them. Naval command has authorized the Special Attack Units: pilots will crash their aircraft directly into enemy warships, sacrificing themselves for the Emperor and the nation."
 japan.34.a:0 "For the Emperor!"
 germany.1333:0 "Fast Oak spawn ins"
 germany.1333.t:0 "To replace Vichy/Slovakia/Bulgaria, focus resources and factory output"
 germany.1333.d:0 "5% Factory output, and a couple hundred resources"
 germany.2290.t:0 "Waffen-SS Panzergrenadier Corps"
 germany.2290.d:0 "The SS-Verfügungstruppe has the men and trucks for its Panzergrenadier divisions. What heavy weapons should the artillery regiments be issued?"
 germany.2290.a:0 "Standard Light Artillery."
 germany.2290.b:0 "Heavy Artillery."
 germany.2290.c:0 "Rocket Artillery."
 germany.2291.t:0 "Waffen-SS Infantry Corps"
 germany.2291.d:0 "The SS-Verfügungstruppe has the men for its Grenadier divisions. What heavy weapons should the artillery regiments be issued?"
 germany.2291.a:0 "Standard Light Artillery."
 germany.2291.b:0 "Heavy Artillery."
 germany.2291.c:0 "Rocket Artillery."
 germany.2292.t:0 "The Royal Army Dissolves"
 germany.2292.d:0 "Fifteen days into the invasion the Royal Yugoslav Army has ceased to exist as a fighting force. Units have disbanded, officers have gone home and the stores are empty or in enemy hands."
 germany.2292.a:0 "It is over."
 germany.2293.t:0 "Denmark Falls"
 germany.2293.d:0 "Danish resistance collapsed within a day. Copenhagen has surrendered and the country has been occupied."
 germany.2293.a:0 "Denmark is lost."
 germany.248.t:0 "Germany has declared war on Poland"
 germany.248.d:0 "German forces have violated Polish neutrality and most likely intend to annex the entire country, this would put us in a vulnerable position. We help the polish to fight back or simply warn the Germans to pull back before we intervene, either way we must act fast."
 germany.248.a:0 "Help the polish, they will be ours instead."
 germany.248.b:0 "Warn them, we are not ready for war."
 germany.249.t:0 "The Soviets will support the Polish"
 germany.249.d:0 "Without an agreement in place Stalin sees our aggression unacceptable. Soviet troops are already entering Poland in order to fight us!"
 germany.249.a:0 "We will defeat them too."
 germany.250.t:0 "The USSR has warned us!"
 germany.250.d:0 "The Soviets consider our aggression unjustified and would rather sign an agreement for partitioning Poland. A lack of an agreement would leave them in a vulnerable position, therefore they have warned us that if we don't immediately back off Poland and cease hostilities, they will join the Poles against us."
 germany.250.a:0 "We can't afford such a war now."
 germany.250.b:0 "The purge seems to have crippled them..."
 germany.255.t:0 "Fate of Yugoslavia"
 germany.255.d:0 "We are annexing Yugoslavia."
 germany.255.a:0 "Sure."
 germany.233.t:0 "Deutsches Afrikakorps DAK"
 germany.233.d:0 "The DAK was the German expeditionary force in Africa during the North African Campaign of World War II. First sent as a holding force to shore up the Italian defense of their African colonies, the formation fought on in Africa, under various appellations, from March 1941 until its surrender in May 1943. The unit's best known commander was Field Marshal Erwin Rommel."
 germany.233.a:0 "Form the D.A.K."
 germany.236.t:0 "French Equipment"
 germany.236.d:0 "With the fall of France we have aquired large amounts of war materials including trucks, artillery and small arms."
 germany.236.a:0 "Very Useful!"
 germany.301.t:0 "German-Spanish Friendship Treaty"
 germany.301.d:0 "The Germans ask us to sign a non-aggression pact and give them military access to show our sympathies and our distance to the Allies. We should consider signing it, to show that we didn't forget their help in the civil war. If we don't sign it, they might think that we will join the Allies and probably attack us!"
 germany.301.a:0 "Sign it! It will help us recover from the war!"
 germany.312.t:0 "Join or Die!"
 germany.312.desc:0 "Germany gives us the choice, either we join them or they will attack our country, we have to choose death or dishonour!"
 germany.312.a:0 "No, we won't join! Let the military take control!"
 germany.312.b:0 "Yes,they are the only ones that can protect us!"
 germany.313.t:0 "Bulgaria refuses"
 germany.313.d:0 "Bulgaria has foolishly refused our assistance in solving their border disputes."
 germany.313.a:0 "They will pay for it!"
 germany.314.t:0 "Alliance against Soviet Union"
 germany.314.d:0 "Now that we exchanged Danzig for Slovakia, the Germans ask us to join the Axis to fight together against the Soviet threat! We should think carefully about this because if we don't join they might think we are on the soviet side and declare us an enemy!"
 germany.314.a:0 "Yes, we will crush Communism!"
 germany.314.b:0 "No, that doesn't seem right!"
 germany.318.t:0 "The Death of Todt"
 germany.318.d:0 "Soon after takeoff from the Wolfsschanze airfield near Rastenburg in East Prussia, Todt's aircraft crashed. He was buried in the Invalids' Cemetery in the Scharnhorst-Strasse in Berlin. Posthumously he became the first receiver of the newly created Deutscher Orden ("German Order") the most important award that the Nazi Party could bestow on a person for "duties of the highest order to the state and party. "
 germany.318.a:0 "Rest in Peace."
 germany.322.t:0 "German-Swedish Treaty"
 germany.322.d:0 "Germany ask us to trade exclusively with them and stop trading with all other countries, except Finland! In return they offer a non-agression pact! If we don't agree to this, we anger the germans and they might attack us!"
 germany.322.a:0 "Yes, it's our only choice!"
 germany.322.b:0 "No, never!"
 germany.323.t:0 "The Fate of Sweden"
 germany.323.d:0 "Sweden is trying to maintain its policy of neutrality, since the fate of Sweden is unclear it has had to use a combination of its geopolitical location in the Scandinavian Peninsula, successful realpolitik manoeuvring during an unpredictable course of events and due to the fact that at the beginning of the war, agreements had been signed between Sweden and the United Kingdom and Nazi Germany in order to sustain vital trade; but in spite of this, and the fact that Sweden had declared itself a neutral country, Swedish shipping began to be attacked. Sweden's trade with Britain was cut by a total of 70%. Within the North Sea blockade, trade with Germany has thus increased."
 germany.323.a:0 "They are just trying to survive!"
 germany.325.t:0 "The Lufthansa Planes"
 germany.325.d:0 "The Lufthansa has many planes that could be put to use in the armed forces, all civilian flight operations of the Lufthansa will come to an end and the aircraft fleet will come under command of the Luftwaffe, along with most of its' staff."
 germany.325.a:0 "Turn them into bombers!"
 germany.325.b:0 "The Fallschirmjäger will ride in style"
 JAP_reorganize_chinese_milita:0 "Reorganize Chinese Milita"
 JAP_reorganize_chinese_milita_desc:0 ""
 JAP_own_destiny:0 "Reinforcing the New State"
 JAP_own_destiny_desc:0 ""
 JAP_freeze_the_frontlines:0 "Deadlock Period"
 JAP_freeze_the_frontlines_desc:0 ""
 JAP_peace_out_with_china:0 "Please Don't Push Me, China :("
 GER_first_wave:0 "First Wave"
 GER_second_wave:0 "Second Wave"
 GER_third_wave:0 "Third Wave"
 GER_fourth_wave:0 "Fourth Wave"
 GER_fifth_wave:0 "Fifth Wave"
 GER_sixth_wave:0 "Sixth Wave"
 GER_seventh_wave:0 "Seventh Wave"
 GER_west_wall_lite_tt:0 "§RIf the Rhineland is remilitarized, you will also gain:§!\n"
 GER_west_wall_lite_forts:0 "Add §Y12 Land Forts§! on the French border.\n"
 GER_west_wall_med:0 "Westwall-Med Forts"
 GER_west_wall_med_desc:0 "The Westwall runs parallel to France's vaunted Maginot Line, occupying much of the same ground as the Siegfried Line did in the previous Weltkrieg. Fortifying its defenses will allow us to hold the border with fewer men, freeing up divisions to participate in any potential eastern campaigns."
 GER_west_wall_med_tt:0 "§RIf the Rhineland is remilitarized, you will also gain:§!\n"
 GER_west_wall_med_forts:0 "Add §Y12 Land Forts§! on the French border.\n"
 GER_west_wall_Hv:0 "Westwall-Hv Forts"
 GER_west_wall_Hv_desc:0 "The Westwall runs parallel to France's vaunted Maginot Line, occupying much of the same ground as the Siegfried Line did in the previous Weltkrieg. Fortifying its defenses will allow us to hold the border with fewer men, freeing up divisions to participate in any potential eastern campaigns."
 GER_west_wall_Hv_tt:0 "§RIf the Rhineland is remilitarized, you will also gain:§!\n"
 GER_west_wall_Hv_forts:0 "Add §Y12 Land Forts§! on the French border.\n"
 GER_expand_austrian_oil:0 "Expand the Austrian Oil"
 GER_expand_austrian_oil_desc:0 "We desperately need more oil, with this in mind we should send specialists to Austria to see if we can increase oil extraction from the small but well documented deposits.."
 GER_industrial_effort_36:0 "1936 Industrial Effort"
 GER_industrial_effort_36_desc:0 "The Germans are a work-loving people, we can channel all our political efforts on re-vitalizing the civilian economy with their help."
 GER_industrial_effort_37:0 "1937 Industrial Effort"
 GER_industrial_effort_37_desc:0 "With iron will and a relentless work ethics, we can mobilize the people in another great industrial effort."
 GER_augustplan:0 "Augustprogramm"
 GER_augustplan_desc:0 "The Augustprogramm was the armament program to increase the strength of the German army. It was done according to with the exception of the anschluss and the annexation of czechoslovakia, both things helped the army a lot!"
 GER_improve_the_motorization:0 "Improve the Motorization"
 GER_improve_the_motorization_desc:0 "We can strengthen the army massively by improving the overall speed by using more and more motorized units!"
 GER_expand_opel_werke:0 "Expand the Opel Werke"
 GER_expand_opel_werke_desc:0 "Expanding the industrial capability of producing motorized equipment, like trucks or mechanized half-tracks, will be important for our new Army! "
 GER_take_over_skoda:0 "Seize Czech Industry"
 GER_take_over_skoda_desc:0 "Through skillful political manoeuvring and military intimidation, Bohemia has been reunited with the German Reich! This means that the Reich has access to one of the biggest arms complexes in the world, the Skoda arms factory."
 GER_strengthen_the_tankforce:0 "Strengthen the Tankforce"
 GER_strengthen_the_tankforce_desc:0 "We can strengthen the army massively by using more tanks. We know that they are expensive, but if we use them correctly, it will pay off!"
 GER_autobahn_I:0 "Reichsautobahnen"
 GER_autobahn_I_tt:0 "Add maximum §YInfrastructure§! in §YBrandenburg§!, §YHannover§!, §YThüringen§! and §YFranken§!"
 GER_organisation_todt:0 "Organisation Todt"
 GER_organisation_todt_desc:0 "Named after Industrial Engineer Fritz Todt that served as minister of Armaments."
 GER_Landungstruppen:0 "Form a Landungs-Division!\n"
 GER_ss_equip_the_RONA:0 "Form the KONR"
 GER_ss_equip_the_RONA_desc:0 "We will allow general Vlasov to form a committee composed of military and civilian Nazi collaborators from territories of the Soviet Union. This has the added benefit of working as a powerful propaganda tool to bolster the ranks of the formations already formed of russian collaborators. A local police and combat force in our eastern territories will ensure better compliance with our rule, the locals will have a better knowledge of local areas and speak the language of the people living under our occupation. In the future, we can possibly grant Vlasov his wish for a "Russian liberation army"."
 GER_mol_rib_pact_trading:0 "Soviet-German Trade Agreement Expansion"
 GER_mol_rib_pact_trading_desc:0 "Germany needs raw materials such as oil and food, the Soviet Union needs blueprints, theorems and machine tools. By exchanging one for the other, both countries will grow stronger and benefit from this new arrangement."
 GER_exploit_the_east:0 "Exploit the East"
 GER_exploit_the_east_desc:0 "The Lebensraum theory will be put into practice."
 GER_private_military_industrial_complex:0 "Private Military Industrial Complex"
 GER_private_military_industrial_complex_desc:0 "The private sector is now ready to provide Germany with the weapons she needs."
 GER_the_states_military_industrial_complex:0 "Nationalized Military Industrial Complex"
 GER_the_states_military_industrial_complex_desc:0 "Our military industrial complex has been mostly nationalised and set up to provide us  with the weapons we need."
 GER_trust_in_the_luftwaffe:0 "Trust in the Luftwaffe"
 GER_trust_in_the_luftwaffe_desc:0 "The threat of Allied bombers is worse than we expected. The only way to make sure our industries are safe is to make sure the Luftwaffe has the proper tools to fight the bombers."
 GER_trade_route_to_turkey:0 "Trade Route to Turkey"
 GER_trade_route_to_turkey_desc:0 "We shall sign an agreement with the turks in order to make sure we keep a steady supply of rare metals."
 GER_implement_rationing:0 "Implement Rationing"
 GER_implement_rationing_desc:0 "Our fuel situation is quite dramatic, without a big source of natural oil we are forced to ration fuel in order to make sure every last drop goes into the military machine."
 GER_modern_grenadiers:0 "Modern Grenadiers"
 GER_modern_grenadiers_desc:0 "Despite our drive towards armoured warfare the grenadiers remain the backbone of our army. We must make sure our infantry remains the best equipped on the battlefield. "
 GER_division_support_structure:0 "Division Support Structure"
 GER_division_support_structure_desc:0 "Experience has shown that any division requires as many specialised companies as possible and proper anti-air cover to keep combat readiness high."
 GER_the_end_of_czechoslovakia:0 "The End of Czechoslovakia"
 GER_junkers_CAS:0 "Junkers"
 GER_junkers_CAS_desc:0 "Junkers was the main German CAS planes designer and builder. They pioneered the concept of dive bombers which became a vital part of the German blitzkrieg."
 GER_long_range_escorts:0 "Long Range Fighters"
 GER_long_range_escorts_desc:0 "Our bombers will require protection from enemy interceptors. We thus require fighters with higher range and more durability."
 GER_victory_through_airpower:0 "Victory Through Air Power"
 GER_victory_through_airpower_desc:0 "During WW1 the potential of strategic bombers became apparent to all belligerents. If we are to win the next war we must ensure the complete dominance of our skies and protection of our industry."
 GER_strategic_bombing_doctrine:0 "Strategic Bombing Doctrine"
 GER_strategic_bombing_doctrine_desc:0 "Our nation cannot afford a long and attritional war. If we can destroy our enemies' industrial bases we would be able to achieve victory with little cost in time and materiel."
 GER_CAS_doctrine:0 "German CAS Doctrine"
 GER_CAS_doctrine_desc:0 "As a continental power intent on offensive operations, Germany could not ignore the need for aerial support of ground operations. Though the Luftwaffe, like its counterparts, tended to focus on strategic bombing, it was unique in its willingness to commit forces to CAS. This is because, unlike the Allies, the Germans were not able to develop powerful strategic bombing capabilities."
 GER_AT_infantry:0 "Infantry AT Weapons"
 GER_udets_strike_force:0 "Udets' Strike Force"
 GER_udets_strike_force_desc:0 "After the trials of the Ju 87, a confidential directive issued by Generalfeldmarschall Wolfram von Richthofen called for the cessation of all further Ju 87 development, although the Ju 87 had been awarded top marks. However, Udet rejected von Richthofen's instructions and Ju 87 development continued. Udet became a major proponent of the dive bomber, taking credit for having introduced it to the Luftwaffe."
 GER_drang_nach_osten:0 "Drang Nach Osten"
 GER_drang_nach_osten_desc:0 "Our future, our destiny, lies to the east. Vorwärts! Unternehmen Barbarossa begins!"
 GER_the_winter_of_1941:0 "The Winter of 1941"
 GER_the_winter_of_1941_desc:0 "Our troops are woefully underprepared for the harsh winter temperatures and storms; this has left a large part of our army dying to the simple cold. This is due to many factors. An ill lack of preparation for such an event is at its root, as it was anticipated that the army would defeat the Red Army in a couple of months."
 GER_festung_principle:0 "Every Centimeter a Fortress"
 GER_festung_principle_desc:0 "We can not allow the Soviets to take back what we have conquered, our goal should be to consolidate and keep control of what we have to launch invasion from there, not to keep attacking."
 GER_offense_is_the_best_defense:0 "Offense is the best Defense"
 GER_offense_is_the_best_defense_desc:0 "It is no longer an option for us to sit still and watch idly as the Soviets fortify positions and build up their strength along the front. To make sure that our own front is strong and secure we must launch continuous incursions against the Soviet lines to keep them on their heels and make them feel threatened across the entire front."
 GER_mobile_fortresses_desc:0 "Our experiences in Russia have taught us three things, wide tracks are necessary to traverse the Russian terrain, big guns are needed to strike from afar and take out the armoured legions we are fighting against and heavy armour to resist the high velocity Soviet guns. Henschel's Tiger will decimate our enemies."
 GER_mobile_fortresses:0 "Tigers in the East"
 GER_grenadiers_never_retreat:0 "Grenadiers, stand fast!"
 GER_grenadiers_never_retreat_desc:0 "The title of Grenadier shall be bestowed upon our soldiers to inspire them to hold steadfast and to be brave in the face of our enemy. Our men in the field are true heroes and should be treated as such, they are the decisive factor of our success in the east. They repel the Soviet counter-attacks, THEY, will drive the bolsheviks back behind the Urals and farther."
 GER_the_wild_cats_that_roam_in_russia:0 "Panthers in the East"
 GER_the_wild_cats_that_roam_in_russia_desc:0 "Our experiences in Russia have taught us three things, wide tracks are necessary to traverse the Russian terrain, big guns are needed to strike from afar and take out the armoured legions we are fighting against and heavy armour to resist the high velocity Soviet guns. MAN's Panther is the cost effective and clear answer."
 GER_endless_offensives:0 "Endless Offensives"
 GER_endless_offensives_desc:0 "Offense is the best defence, there is no point in standing still and letting the Soviets recover, we must simply put keep up the advance and never let the Soviets rest. If we can find parts of the front to breakthrough it means that we can create potential encirclements and keep collapsing the Soviet Front."
 GER_sieg_im_westen:0 "Der Sieg im Westen"
 GER_the_final_crusade:0 "The Final Crusade"
 GER_the_final_crusade_desc:0 "The Final Crusade has begun, the titantic struggle between the civilized world and the despotic, brutal regime that is communism. It is our duty to protect the future of Europe and Europeans from this threat, we will extinguish the flame of the revolution once and for all. Men! March! Destroy the Soviet Union."
 GER_sieg_im_westen_desc:0 "The Governments of France and Britain have defied our plans of expansion, and we must now secure their defeat. The first enemy is the one in the East, the artifical nation state Poland, after Poland we shall turn our attention further west."
 GER_fall_weiss:0 "Fall Weiss"
 GER_fall_weiss_desc:0 "Fall Weiss was the Nazi strategic plan for the invasion of Poland. The German military High Command finalized its operational orders on 15 June 1939 and the invasion commenced on 1 September, precipitating World War II."
 GER_polish_occupation:0 "Occupation of Poland"
 GER_polish_occupation_desc:0 "Establish a degree of control over our newly conquered territories so that we can take control of their economy and add their wealth to our own. High Command will also create a local garrison of older veterans that will maintain order and protect it from rebels and partisans."
 GER_plunder_their_economy:0 "Seize Foreign Assets"
 GER_plunder_their_economy_desc:0 "The territory of our former neighbours and now rightful land is filled with riches, these riches must be brought to Germany to enhance our armaments industry."
 GER_collaborationist_government:0 "Collaborationists in Government"
 GER_collaborationist_government_desc:0 "The appointment of local collaborationists as leaders in the occupied countries has a direct effect on our control of that country and will make it easier for us to vampirize its economy."
 GER_wesereberung:0 "Unternehmen: §YWeserübung§!"
 GER_wesereberung_desc:0 "With the downfall of Norway and Denmark, the Swedish Steel trade has been secured and that Norwegian ports are safe from British control. The essential Swedish steel shall flow for as long as we control Norway."
 GER_fall_gelb:0 "Fall Gelb: "§YMannstein Plan§!""
 GER_fall_gelb_desc:0 "The hour has come, the moment is here where we will succeed where our grandfathers and fathers failed, we will strike with one decisive blow against France through the Ardennes and secure their down fall. The French believe that the Maginot and their alliance with the British will protect them, but we will prove to them that they are naught but fools."
 GER_occupation_of_the_benelux:0 "Occupation of the Benelux"
 GER_occupation_of_the_benelux_desc:0 "The occupation of the Benelux region is essential, both the Netherlands, Belgium and Luxembourg are rich countries with a strong industrial basis and the vampirization of their economies is essential for German armament and munition production."
 GER_occupation_of_france:0 "Occupation of France"
 GER_occupation_of_france_desc:0 "The time has come for us to finally occupy the French, after their imperialistic seizure of the Ruhr and its coal our moment of revenge and vindication has finally come. A loyal puppet state has been established in the south, and in the North our military will assume full control."
 GER_fuhrer_directive_25:0 "Führer Directive: §YNr.25§!"
 GER_fuhrer_directive_25_desc:0 "Another artificial state created by the Entente after the Great War, lead by an illegal monarchy that was established after the downfall of the Austro-Hungarian empire. Originally, the plan was to leave Yugoslavia alone, but after a disastrous Italian invasion of Greece. The German Army needs to move to their aid."
 GER_establish_the_occupational_zones_in_yugoslavia:0 "Occupation of the Balkans"
 GER_establish_the_occupational_zones_in_yugoslavia_desc:0 "The occupation of Yugoslavia shall be managed by all the members of the Axis. With the Italians controlling the coastline, Germans controlling Slovenia and Serbia, the Hungarians, Romanians will manage a small part in the north, the Bulgarians will reclaim macedonia and a new state, Croatia, will be created to have jurisdiction in Bosnia and Croatia."
 GER_secure_hellas:0 "Unternehmen: §YMarita§!"
 GER_secure_hellas_desc:0 "The Italian invasion in October 1940, which is usually known as the Greco-Italian War, was followed by the German invasion in April 1941. German landings on the island of Crete (May 1941) came after Allied forces had been defeated in mainland Greece. These battles were part of the greater Balkan Campaign of Germany."
 GER_four_year_plan_tt:0 "Activates the mission §YGöring's Four Year Plan§!\n"
 GER_med_command_tt:0 "General §YErwin Rommel§! and Field Marshal §YKesselring§! will form the Mediterranean Command, this means that you will lose them as §Yunit leaders§!, but §YItaly§! will gain them."
 GER_triumph_in_africa_tt:0 "§GSuccess!§! Rommel has triumphed in Afrika! After he entered the ancient city of Cairo at the head of the §LAfrika Korps§!, he was crowned pharaoh by local Egyptian leaders. This new state is loyal to §Ythe [Root.GetName]§!.\n"
 GER_focus_malta_tt:0 "Builds a §YLevel 5 Airport§! and §YLevel 1 Radar Station§! in the following states:\n§YSicilia§!\n§YTripoli§!\n"
 GER_focus_tobruk_tt:0 "Builds a §YLevel 3 Airport§! and §YLevel 1 Radar Station§! in the following states:\n§YBenghasi§!\n§YDerna§!\n"
 GER_focus_tobruk:0 "Defense of Tobruk"
 GER_focus_tobruk_desc:0 "Tobruk is the key to the invasion of Egypt due to its vicinity to the border, if we are to take the Suez canal Tobruk must be ours."
 GER_focus_malta:0 "Naval Blockade of Malta"
 GER_focus_malta_desc:0 "The island of Malta has been a thorn in our side since the start of the war. Its position allows the British to raid our supply chains to Libya with relative ease. Our focus should be towards the incapacitation of Malta's bases and an eventual invasion."
 GER_grosraumwirtschaft:0 "Großraumwirtschaft"
 GER_grosraumwirtschaft_desc:0 "We must prepare Germany for its destiny as a centerpiece of Europe. Our infrastructure will bind together the West with the East, and the South with the North."
 GER_increase_working_hours:0 "Increase Factory Working Hours"
 GER_increase_working_hours_desc:0 "German workers are not working enough shifts, there must be more shifts and longer shifts if our armaments production is to ever have the hope of catching up."
 GER_women_in_the_factories:0 "Women in the Factories"
 GER_women_in_the_factories_desc:0 "We must relax our policy of not allowing women to enter the workforce and relax the values of National Socialism."
 GER_women_in_the_workforce_desc:0 "We must relax our policy of not allowing women to enter the workforce and relax the values of National Socialism."
 GER_swedish_steel:0 "Swedish Steel Trade"
 GER_swedish_steel_desc:0 "The Swedish Steel trade was essential for many reasons, the most important of these reasons was the fact that it was very high grade which made mixing German low grade steel more efficient. Thus providing an incredible boost to the German arms production."
 GER_swiss_cash:0 "The Swiss Money Laundry"
 GER_swiss_cash_desc:0 "The Swiss will launder all the assets that we have stolen, and turn them into vital fiscal assets and supplies that the German Economy can use."
 GER_disperse_industry:0 "Dispersed Industry"
 GER_disperse_industry_desc:0 "The Industry suffers from not being dispersed enough, allied bomber raids are disrupting our internal industrial production by hitting vital railways, roads and factory complexes."
 GER_air_shield:0 "The Air Shield"
 GER_air_shield_desc:0 "If the industrial workers are to ever feel safe, they need to be protected by both the luftwaffe and static anti air defences that can target and disrupt allied bombing raids."
 GER_consolidate_production_lines:0 "Consolidate the Production Lines"
 GER_consolidate_production_lines_desc:0 "Consolidating the production lines serves one effect, it stops the industries from producing many different equipment hampering their total efficiency. Instead one factory will focus on producing one type of armament."
 GER_specialization_of_worker_skills:0 "Specialization of Worker Skills"
 GER_specialization_of_worker_skills_desc:0 "Smart workers are harder workers. German engineers and factory workers have the machine tools available to them, they just need the technical know-how of how to assemble and build equipment efficiently."
 GER_integrate_war_economies:0 "Integrate War Economies"
 GER_integrate_war_economies_tt:1 "If §YHungary§! is in a faction with §Y[Root.GetName]§!, add §Y4 Military Factory§! each to §Y[Root.GetName]§! and §YHungary§!, and §YHungary§! becomes puppet of §Y[Root.GetName]§!.\n"
 GER_integrate_war_economies_tt2:1 "If §YRomania§! is in a faction with §Y[Root.GetName]§!, add §Y4 Military Factory§! each to §Y[Root.GetName]§! and §YRomania§!, and §YRomania§! becomes puppet of §Y[Root.GetName]§!.\n"
 GER_me262:0 "Me 262"
 GER_me262_desc:0 ""
 GER_summon_fritz_todt:0 "Summon Fritz Todt"
 GER_summon_fritz_todt_desc:0 "Summon the current minister of armaments to Berlin to discuss how we can best plan ahead for the future. The war seems that it will be drawn out and long and thus we will have to rethink it... yet again..."
 GER_stalingrad:0 "Stalingrad"
 GER_stalingrad_desc:0 ""
 GER_a_storm_of_steel:0 "Stahlgewitter"
 GER_a_storm_of_steel_desc:0 ""
 GER_a_feeling_of_blitz:0 "Feeling of Blitz"
 GER_a_feeling_of_blitz_desc:0 ""
 GER_heavy_tank_focus:0 "Durchbruchswagen"
 GER_heavy_tank_focus_desc:0 ""
 GER_open_ww1_stockpiles:0 "Open Great War Stockpiles"
 GER_open_ww1_stockpiles_desc:0 ""
 GER_gott_mit_uns:0 "Gott mit uns"
 GER_gott_mit_uns_desc:0 ""
 GER_every_worker_a_soldier:0 "Every Worker a Soldier"
 GER_every_worker_a_soldier_desc:0 ""
 GER_krupp_stahl:0 "Krupp Stahl"
 GER_krupp_stahl_desc:0 ""
 GER_infanterie_greift_an:0 "Panzer Greift an"
 GER_infanterie_greift_an_desc:0 ""
 GER_modernize_support_weapons:0 "Modernize Support Weapons"
 GER_modernize_support_weapons_desc:0 ""
 GER_apc_design_focus:0 "APC Design"
 GER_apc_design_focus_desc:0 ""
 GER_mobile_artillery_platforms:0 "Mobile Artillery Platforms"
 GER_mobile_artillery_platforms_desc:0 ""
 GER_light_tanks:0 "Leichter Panzer"
 GER_light_tanks_desc:0 ""
 GER_kesselschlacht:0 "Kesselschlacht"
 GER_kesselschlacht_desc:0 ""
 GER_raketenwerfer:0 "Raketenwerfer"
 GER_raketenwerfer_desc:0 ""
 GER_hanomag:0 "Hanomag"
 GER_operation_ursula:0 "Operation Ursula"
 GER_operation_ursula_desc:0 ""
 GER_maus:0 "Maus"
 GER_maus_desc:0 ""
 JAP_greater_east_asia_research_name:0 "Greater East Asia Research Initiative"
 JAP_greater_east_asia_research_desc:0 "The Empire of Japan and its subjects will share technological advances to strengthen the Co-Prosperity Sphere."
 GER_reichsforschungsgemeinschaft_name:0 "Reichsforschungsgemeinschaft"
 GER_reichsforschungsgemeinschaft_desc:0 "The German Reich and its subject states will coordinate scientific research to advance the interests of the New Order in Europe."
 ger_heavy_tank_1942:0 "Pz VI Tiger"
 ger_fighter_1938:0 "Messerschmitt Bf 109 Emil"
 ger_CAS_1939:0 "Junkers Ju 87D"
 GER_ig_faben_focus:0 "Fund IG Farben's Efforts"
 GER_ig_faben_focus_desc:0 "IG Farben is an Industrial Chemical specialist that is renowned worldwide, with our government's recent interest in achieving autarky we have need of their expertise in coal to oil liquidification and practical know how in matters relating to producing synthetic rubber."
 GER_autarky:0 "Autarky"
 GER_autarky_desc:0 "For Germany to be truly great, it must be self-sufficient. We must make better use of our resources, and become more efficient in our construction."
 GER_Fallschirmjaeger:0 "Form a Fallschirmjäger-Division!\n"
 GER_autobahn:0 "Reichsautobahn"
 GER_autobahn_tt:0 "Add maximum §YInfrastructure§! in §YBrandenburg§!, §YHannover§!, §YThüringen§! and §YFranken§!"
 GER_autobahn_desc:0 "Since its inception in 1933, the autobahn project has been a glorious success. The construction efforts have reduced unemployment, and the wide roads stand as a monument to Germany's economic recovery. Much work remains to be done, however."
 GER_mobilize_the_reich:0 "Mobilize the Reich"
 GER_mobilize_the_reich_desc:0 "The time is here, after a disastrous defeat in the First World War and the humilitating treaty of Versailles, the Reich strikes back."
 GER_autobahn_I_desc:0 "Since its inception in 1933, the autobahn project has been a glorious success. The construction efforts have reduced unemployment, and the wide roads stand as a monument to Germany's economic recovery. Much work remains to be done, however."
 GER_westwall:0 "Westwall"
 GER_westwall_desc:0 "The Westwall runs parallel to France's vaunted Maginot Line, occupying much of the same ground as the Siegfried Line did in the previous Weltkrieg. Fortifying its defenses will allow us to hold the border with fewer men, freeing up divisions to participate in any potential eastern campaigns."
 GER_nibelungenwerk:0 "Nibelungenwerk"
 GER_nibelungenwerk_desc:0 "The Nibelungenwerk was a massive tank factory built in Austria after the Anschluss. The main production focused on the Panzer 4."
 GER_underground_factories:0 "Underground Factories"
 GER_underground_factories_desc:0 "Allied bombing have the potential of irreparably cripple our industry. The best possible solution is to start construction of underground factories in our mountainous territories."
 GER_plan_z_tt:0 "Activates the mission §YPlan Z§!, where the [Root.GetName] has §Y1800§! days to build the following ships:\n"
 GER_plan_z_tt_2:0 "§Y10 Heavy Ships or 8 Heavy Ships and 2 Carriers or 20 Cruisers and 30 Destroyers§!\n"
 GER_plan_z_tt_3:0 "Removes §R-7§!£oil_texticon  from the state Hannover\n"
 GER_plan_z_tt_4:0 "Modify §YMEFO Bills§! by\nDaily Political Power Gain: §R-0.2§!\n"
 GER_plan_z_tt_5:0 "\n§YWhile Active:§!\n£industry_texticon!Factory Output: §R-5.00%§!\n£shipyard_texticon!Dockyard Output: §G+15.00%§!\nDaily Political Power Gain: §R-0.15§!"
 GER_plan_z_tt_6:0 "Modify §YMEFO Bills§! by\nDaily Political Power Gain: §R-0.3§!\n"
 GER_projekt_riese:0 "Projekt Riese"
 GER_projekt_riese_desc:0 "Projekt Riese was a project to build a huge underground complex near Breslau in Niederschlesien."
 GER_reichswerke_hermann_goering:0 "Reichswerke Hermann Goering"
 GER_reichswerke_hermann_goering_desc:0 "The Reichswerke Hermann Goering was founded as part of the Four Year Plan; their main task was to make Germany less dependent on resources from abroad."
 GER_synthetic_oil_refinery:0 "Synthetic Oil Refineries"
 GER_synthetic_oil_refinery_desc:0 "Oil is the foundation of the modern Warmachine."
 GER_synthetic_rubber_refinery:0 "Synthetic Rubber Refineries"
 GER_synthetic_rubber_refinery_desc:0 "Rubber is literally the wheels of the modern warmachine."
 GER_more_resource_efficient_desings:0 "More Resource Efficient Designs"
 GER_more_resource_efficient_desings_desc:0 "By forming engineering teams with specialist in cost-cutting material design and sending them to companies across the nation we can cut the cost in valuable resources."
 GER_rationing:0 "War Rationing"
 GER_rationing_desc:0 "After the appointment of Speer the civilian ration was made smaller for the civilian industry, in return the military output was increased!"
 GER_deutsche_arbeitsfront:0 "Deutsche Arbeitsfront"
 GER_deutsche_arbeitsfront_desc:0 "All the workers of Germany must be united into a common trade union, which will of course be controlled by the state."
 GER_reorganise_the_industry:0 "Reorganize our Industry"
 GER_reorganise_the_industry_desc:0 "Our armaments industry, has, despite our best efforts not been at the capacity it can truly work at. Consumer goods are still being produced, people are still working in services that are not necessary for the War-Effort. Our enemies outproduce and outnumber us, to level the playing field, her Speer's suggestions to improve the industry have to be implemented."
 GER_reorganized_industry_tt:0 "The German industry may not be able to sustain a war economy efficiently, only further inspections will tell...§RDisorganized Industry will be triggered with war declaration§W"
 GER_revenge_versailles:0 "Avenge Versailles"
 GER_revenge_versailles_desc:0 "Now that we defeated the french they will feel what you get when you try to hold the german people down! They will pay our troops that we leave to guard and protect the land!"
 GER_total_war:0 "Totaler Krieg"
 GER_total_war_desc:0 "Do you want a war more total and radical than anything that we can even imagine today?"
 GER_oil_weapon_treaty:0 "Oil for Weapons"
 GER_oil_weapon_treaty_desc:0 "We can send arms equipment to Romania and get oil in return."
 GER_flaktower:0 "Flaktowers"
 GER_flaktower_desc:0 "Flaktowers were permanent fortresses constructed in major cities as an emergency war measure to counter the raids by large strategic bomber formations. They were often constructed on the roofs of large buildings."
 GER_naval_attack_bomber:0 "Naval Patrol"
 GER_naval_attack_bomber_desc:0 "The Luftwaffe initially used aircraft to support the Kriegsmarine, making great loops out across the North Sea and, following the fall of France, the Atlantic Ocean. Aircrafts were used for maritime patrols and reconnaissance, searching for Allied convoys and warships that could be reported for targeting by U-boats. Winston Churchill called these patrol aircrafts the "Scourge of the Atlantic" during the Battle of the Atlantic due to its contribution to the heavy Allied shipping losses."
 GER_tactical_air_effort:0 "Tactical Air Effort"
 GER_tactical_air_effort_desc:0 "Victory will be achieved by annihilating the enemy's ground forces. We must focus on supporting our own armies with tactical strikes against close and deep targets."
 GER_Legion_Condor:0 "Dispatch the Condor Legion"
 GER_Legion_Condor_desc:0 "The Legion Condor was a unit composed of military personnel from the air force and army of Nazi Germany, which served with the Nationalists during the Spanish Civil War of July 1936 to March 1939. The Condor Legion developed methods of strategic bombing which were used widely in the Second World War shortly afterwards. The bombing of Guernica was the most infamous operation carried out by the Legion."
 GER_Ural_Bomber:0 "Ural-Bomber"
 GER_Ural_Bomber_desc:0 "The Ural bomber was the initial aircraft design program/competition to develop a long-range bomber for the Luftwaffe, created and led by General Wever in the early 1930s. Although in reality Wever died in an air crash on June 3, 1936, and the program ended almost immediately. Albert Kesselring took over his position in the Luftwaffe, abandoning most of his designs and turning others into tactical bombers."
 GER_Amerika_Bomber:0 "Amerika-Bomber"
 GER_Amerika_Bomber_desc: "The Amerikabomber project was an initiative of the German Reichsluftfahrtministerium to obtain a long-range strategic bomber for the Luftwaffe that would be capable of striking the United States from Germany, a round-trip distance of about 11,600 km (7,200 mi). The concept was raised as early as 1938, but advanced, cogent plans for such a long-range strategic bomber design did not begin to appear in Reichsmarschall Hermann Göring's offices until early 1942."
 GER_Fast_Bomber:0 "Schnellbomber"
 GER_Fast_Bomber_desc:0 "The concept developed in the 1930s when it was believed that a very fast bomber could simply outrun its enemies. Omitting defensive armament allowed for significant reduction in drag (there would be no turrets, gondolas or gun barrels protruding from the fuselage) as well as weight (no guns, ammunition or manning crew members would be required on board), resulting in improved performance."
 GER_army_innovation:0 "Army Innovations"
 GER_army_innovation_desc:0 "Heinz Guderian and other radical theorists are pushing for daring new doctrines emphasizing communication, identification of 'schwerpunkts' and local concentrations of combined arms forces. Giving them free reins might help avoid the meat grinder horrors of the Great War."
 GER_soviet_treaty:0 "Treaty with the USSR"
 GER_soviet_treaty_desc:0 "We can pursue a new research treaty with the Soviet Union in order to develop, chiefly, better tanks. If they agree, we can reopen the tank school we closed down in Kama in 1933. Soviet cooperation will, of course, mean that they too will benefit from the innovations made..."
 GER_expand_peenemuende_research_center:0 "Expand the Peenemünde Research Center"
 GER_expand_peenemuende_research_center_desc:0 "Rocket propulsion holds the key to massive innovations in all three of the military branches."
 GER_wunderwaffe:0 "Wunderwaffe"
 GER_wunderwaffe_desc:0 "Heisenberg and von Braun are chomping at the bit to explore certain ideas they have for true doomsday weapons. All they need is extra resources..."
 GER_mol_rib_pact:0 "Molotov-Ribbentrop Pact"
 GER_mol_rib_pact_desc:0 "A treaty of friendship and non-aggression with the USSR might turn the stomach, but it will allow their precious oil to keep flowing into Germany. The secret addendum will divide the territories of Romania, Poland, Lithuania, Latvia, Estonia and Finland into German and Soviet spheres of influence..."
 GER_mol_rib_pact_tt:0 "Enter into a §Ynon-aggression pact§! with §YSoviet Union§! and agree to §Ydivide Poland§! between Soviet Union and Germany\n"
 GER_form_the_reichskommissariats:0 "Form the Reichskommissariats"
 GER_form_the_reichskommissariats_desc:0 "To improve use of local resources, industry, and manpower, we should look into establishing quasi-autonomous subject governments in our conquered areas."
 GER_reichskommissariats_tt:0 "Allows the formation of subject states in conquered territories.\n"
 GER_rhineland:0 "Rhineland"
 GER_rhineland_desc:0 "The Rhineland has been demilitarized since the end of the Great War, but this insult shall stand no longer! Germany is a sovereign nation and is free to move troops anywhere within her borders!"
 GER_rhineland_ultimatum:0 "§RThe remilitarization may be reversed if you are confronted and back down.§!\n"
 GER_japan_friend:0 "Befriend Japan"
 GER_japan_friend_desc:0 "We have long had a fruitful relationship with China, but our ambitions might be better served by instead aligning with our kindred warrior culture of Japan, even if it means throwing China to the wolves..."
 GER_china_friend:0 "Befriend China"
 GER_china_friend_desc:0 "Let us deepen our long-standing friendship with China. Doing so will alienate Japan, but what is Japan if not merely the Italy of the East?"
 GER_anti_comitern_pact:0 "Anti-Comintern Pact"
 GER_anti_comitern_pact_desc:0 "Interference by the Communist International in the internal affairs of the nations not only endangers their internal peace and social well-being, but is also a menace to the peace of the world! We will ask many of the non-Communist countries to sign the pact, and make sure that we keep the red menace in check."
 GER_anti_soviet_pact:0 "Anti-Soviet Pact"
 GER_anti_soviet_pact_desc:0 "We can take the Anti-Comintern Pact one step further and ask all members to commit to a coalition against the Soviet Union. If any signatory ends up at war with the USSR, all other members must also declare war."
 GER_anti_soviet_pact_tt:0 "§YSends offer to all members of the Anti-Comintern Pact to join a defensive alliance against the Soviet Union.§!"
 GER_anti_soviet_pact_tt_2:0 "§Y The defensive alliance will call members to war if one of them is attacked by Comintern§!"
 GER_ussr_war_goal:0 "Operation Barbarossa"
 GER_ussr_war_goal_desc:0 "We only have to kick in the door and the whole rotten structure will come crashing down"
 GER_anschluss:0 "Anschluss"
 GER_anschluss_desc:0 "The Anschluss, or union with Austria, is a long held goal of the German people. Although forbidden by the Treaty of Versailles, the time has finally come to bring it about. Let us offer the Austrians a chance at sharing our glorious destiny!"
 GER_demand_memel:0 "Reassert Eastern Claims"
 GER_demand_memel_desc:0 "The Great War saw the loss of much German territory in the East with the resurrection of Poland and the transfer of Memel to Lithuania. An Ultimatum shall be sent to both nations, but Poland, at least, will likely not bow to mere words."
 GER_demand_memel_threat:0 "Germany Reasserted Eastern Claims"
 GER_south_tyrol:0 "Demand South Tyrol"
 GER_south_tyrol_desc:0 "The Great War saw the loss of some German territory in the South with the splitting of the Austro-Hungarian Empire and the transfer of South Tyrol to Italy. An Ultimatum shall be sent to Italy, the alps belong to the German people."
 GER_south_tyrol_threat:0 "Germany Demands South Tyrol"
 GER_danzig_or_war:0 "Danzig or War"
 GER_danzig_or_war_POL_faction_GER_leader:0 "§R[This.GetName] must approve of the agreement for bonuses to take effect. They will leave [Root.GetFactionName] if war is declared.§!\n"
 GER_danzig_or_war_POL_faction_GER_noleader:0 "§R[This.GetName] must approve of the agreement for bonuses to take effect. You will leave [Root.GetFactionName] the faction if war is declared.§!\n"
 GER_danzig_or_war_desc:0 "Danzig was German, Danzig has remained German, and Danzig shall be German from now on! If Poland does not cede the territory, we must prepare the German people for the inevitable war. Danzig and the surrounding lands will return to Germany!"
 GER_czech_friend:0 "Befriend Czechoslovakia"
 GER_czech_friend_desc:0 "The Czechs and the Slovaks are industrious and admirable peoples. It is unfortunate that our territorial ambitions clash with theirs, but it is not too late to pursue friendship rather than subjugation."
 GER_demand_sudetenland:0 "Demand Sudetenland"
 GER_demand_sudetenland_desc:0 "The fate of the Sudet-Germans was one of the worst injustices inflicted by the Treaty of Versailles. They must be brought under our protection, regardless of Czech objections."
 GER_demand_sudetenland_threat:0 "Germany Demanded Sudetenland"
 GER_first_vienna_award:0 "First Vienna Award"
 GER_first_vienna_award_desc:0 "The Hungarians were one of the people that suffered worst after the Great War. In the slaughter of the Austro-Hungarian Empire, many Hungarians were stranded on foreign soil though their ancestors had lived there for ages. We could greatly improve our relations with Hungary by awarding them some territories from Czechoslovakia."
 GER_end_of_czechoslovakia:0 "Fate of Czechoslovakia"
 GER_end_of_czechoslovakia_desc:0 "The time has come to divide the old Czech lands between those who can govern them properly. We should also consider the creation of a separate Slovak puppet state to the east."
 GER_second_vienna_award:0 "Second Vienna Award"
 GER_second_vienna_award_desc:0 "Transylvania has a Hungarian majority and should rightly belong to our friends in Hungary. However, it is hard to say how the Romanian regime and people will react to this demand."
 GER_italy_ally:0 "Alliance with Italy"
 GER_italy_ally_desc:0 "Italians may be untrustworthy - as they proved in the Great War - but Mussolini and his Fascist movement have shown that there is hope for Italy yet. Surely, Germany only stands to gain by allying with Italy, does it not?"
 GER_secure_spain:0 "Secure Spain"
 GER_secure_spain_desc:0 "We can't risk that spain might join our enemies, it would create a new frontline! Also if we get spain under our control we can get gibraltar and get a stable trade route for the tungsten trade with portugal!"
 GER_befriend_nationalist_spain:0 "Befriend Spain"
 GER_befriend_nationalist_spain_desc:0 "We should try to get spain on our side! Maybe we can use their ports."
 GER_nationalist_spain_ally:0 "Alliance with Spain"
 GER_nationalist_spain_ally_desc:0 "The nationalist victory in the Spanish civil war has paved the way for a closer relationship between our two countries. Franco holds the key to the Mediterranean."
 GER_nationalist_spain_ally_tt:0 "Boosts diplomatic relations with §YNationalist Spain§!"
 GER_africa_korps:0 "Afrikakorps"
 GER_africa_korps_desc:0 "There is a need for Panzers in the Northern Afrika, General Rommel will be dispatched along with the newly formed Afrika Korps. He will assist the Italians in conquering Egypt and seizing the Suez!"
 GER_build_u_boat_bunker:0 "U-Boat Bunker"
 GER_build_u_boat_bunker_desc:0 "We need to protect our U-Boat production and when they are in port for repairs or supply from enemy bombing! So we should build protection in form of anti air and bunkers!"
 GER_french_naval_bases:0 "Naval Bases in France"
 GER_french_naval_bases_desc:0 "Now that we own the northern Coast of France, we not only have access to the atlantic but also a better position in the war over naval supremacy! We should expand this by building some good bases for our Fleet!"
 GER_modern_battlefleet:0 "Modern Battlefleet"
 GER_modern_battlefleet_desc:0 "We are the ruler of the world, so we should be the ruler of the sea too!"
 GER_u_boat_effort:0 "U-Boat Effort"
 GER_u_boat_effort_desc:0 "Commodore Dönitz advocates a strategy of unrestricted submarine warfare as the best way of bringing Britain to its knees. With enough U-boats, we might be able to starve the British home industries of all the required resources from its far-flung empire."
 GER_trade_interdiction:0 "Trade Interdiction"
 GER_trade_interdiction_desc:0 "Our dockyards are committed to churning out U-boats, but we need to develop better ways of utilizing these 'wolf packs'. Give the admirals everything they need to conduct their simulations and war games..."
 GER_surface_raiders:0 "Surface Raiders"
 GER_surface_raiders_desc:0 "Put effort into better tactics for our Surface Raiders!"
 GER_war_with_usa_desc:0 "We tried to keep this conflict in europe but it seems that america is helping the Allies! This means War!"
 GER_operation_paukenschlag:0 "Operation Paukenschlag"
 GER_operation_paukenschlag_desc:0 "Operation Paukenschlag was a move to stop cutting the supplies to england and instead focusing more on just sinking as many convoys as possible."
 GER_weserubung:0 "Operation Weserübung"
 GER_weserubung_desc:0 "Norway is a critical strategic point and would be an obvious point of attack for any enemy wanting to disrupt our steel trade with Sweden. We cannot risk our enemies setting up bases in this region. To obtain a good staging area for the invasion of Norway we need to move on Denmark first."
 GER_around_maginot:0 "Around Maginot"
 GER_around_maginot_desc:0 "If we want to ensure a tactical advantage against France we need to be able to hit them from all sides. They will not expect an attack from the North, which is exactly where we will hit them from, once we've disposed of a few obstacles."
 GER_plan_atlantikwall:0 "Defence of Europe"
 GER_plan_atlantikwall_desc:0 "If we want to ensure that europe is german and will be german from now on, we need to build a defensive line at our coast! This mean we should consider building defences at our new coastline!"
 GER_atlantikwall:0 "Atlantic Wall"
 GER_atlantikwall_desc:0 "Europe will become a fortress, an unassailable fortress of concrete, machine guns, flak and mines. If the Allies do land on our shores, the first day will be crucial!"
 GER_alone_or_peace_faction_tt:0 "is not in a faction, or is in a faction at peace with [GER.GetNameDef]."
 GER_alsace_lorraine:0 "Reassert Alsace-Lorraine Claims"
 GER_alsace_lorraine_desc:0 "The Great War and the Versailler Diktat saw the loss of German territory in the West with the transfer of huge mining basin to France. An Ultimatum shall be sent to them, without any guarantee of success. "
 GER_alsace_lorraine_threat:0 "Germany Reasserted Alsace-Lorraine Claims"
 GER_army_innovation_2:0 "Wehrmacht Expansion"
 GER_army_innovation_2_desc:0 "The lessons learned at our facilities in the USSR will allow us to further improve our doctrines and equipment. However, this time we will keep the advances to ourselves!"
 GER_kampfgruppes:0 "Kampfgruppen"
 GER_kampfgruppes_desc:0 "Our experience shows that combined-arms warfare is the way of the future. If we apply the Prussian doctrine of mission command to combined-arms warfare, our military can increase efficiency and effectiveness by forming "Kampfgruppes", ad hoc military formations designed to complete a specific task."
 GER_artillery_expansion:0 "Artillerie Expansion"
 GER_artillery_expansion_desc:0 "The Treaty of Versailles sought to limit Germany's field artillery to just 284 pieces in total, but this laughable restriction is no obstacle to the Reich now. A powerful Germany needs a powerful Heer, and a powerful Heer needs powerful guns!"
 GER_infanterie_tactics:0 "Infanterie Tactics"
 GER_infanterie_tactics_desc:0 "Infantry tactics have come a long way since the Great War. By comparing the General Staff's recent advancements in military thought to our battlefield experiences, the backbone of the Wehrmacht may become more unshakeable than ever before."
 GER_support_tanks:0 "Support Panzer"
 GER_support_tanks_desc:0 "Panzer variants arecheaper to produce and can perform better in specialised roles compared to normal panzers."
 GER_Panzer_division:0 "Panzer-Division"
 GER_Panzer_division_desc:0 "The old "Leichte Divisions" have proven too thin-skinned to do their jobs as armor, but not maneuverable enough to fully replace cavalry. The next generation of tanks must have tougher armor and more powerful armaments, even if there is a slight cost in speed."
 GER_liecht_division:0 "Leichte Division"
 GER_liecht_division_desc:0 "In theory, it is possible for divisions with fast, lightly-armored vehicles to replace obsolete cavalry units. We just need to develop the required vehicles first..."
 GER_Wehrmacht:0 "Wehrmacht"
 GER_Wehrmacht_desc:0 "The Treaty of Versailles once limited the German army to a mere 100,000 men, but we have covertly circumvented this limit for over a decade. In 1935, Hitler openly announced that the Reich would re-introduce conscription and quintuple the size of its army. To shed the memory of the weak Reichswehr of the Weimar period, this grand military force was christened with a new name - the Wehrmacht."
 GER_paratroopers:0 "Fallschirmjäger"
 GER_paratroopers_desc:0 "A new form of unit that has become more appealing to countries all around the world. If the German Reich is to succeed in war, the wehrmacht needs the advantage of having the ability to deploy units behind enemy lines."
 GER_achtung_panzer:0 "Achtung Panzer"
 GER_achtung_panzer_desc:0 ""Achtung - Panzer!" is a book written by Heinz Guderian. Evaluating the development and use of the first tanks during the Great War, Guderian argues that traditional cavalry should be replaced with mechanised infantry, and that the use of armored vehicles will play a key role in the use of "mobile" warfare tactics."
 GER_naval_rearmament:0 "Kriegsmarine"
 GER_air_innovation:0 "Luftwaffe"
 GER_air_innovation_desc:0 "Modern wars cannot be won without dominating the skies. We must do everything in our power to develop the air force! The unjust Treaty of Versailles forbade Germany from having an air force, but German pilots continued training in secret. In 1935, all pretenses of obeying Versailles were dropped and the German Reich proudly announced the official establishment of the new air force, the Luftwaffe."
 GER_air_innovation_2:0 "Luftwaffe Expansion"
 GER_air_innovation_2_desc:0 "The tasks of the Reich's Air Ministry are of paramount importance. The Luftwaffe must be the most advanced Air Force in the world!"
 GER_naval_bomber:0 "Naval Attack Bomber"
 GER_naval_bomber_desc:0 "The royal navy is huge and powerful, our only hope of defeating it in open battle is to compensate our lack of ships with modern naval bombers."
 GER_levelbomber_focus:0 "Level Bombing"
 GER_levelbomber_focus_desc:0 "We need stronger tactical bombers!"
 GER_divebomber_focus:0 "Dive Bombing"
 GER_divebomber_focus_desc:0 "During the Great War, the inability of early aircraft to sustain a vertical dive often turned bombing runs into suicide missions. But recent advances in aeronautics and with the experience from the Spanish civil war may allow us to produce viable dive-bombing planes that are not only more accurate than traditional level bombers, but more flexible and cost-effective. Such an aircraft could be dubbed the "Sturzkampfflugzeug" ("diving combat airplane"), or "Stuka" for short..."
 GER_fighter_air_effort:0 "Fighter Arm"
 GER_fighter_air_effort_desc:0 "The ability of the Luftwaffe to conduct operations relies on achieving air superiority. We must develop agile and effective fighter planes for our Jagdgeschwaders ("hunter squadrons") to keep our enemies' fighters out of the sky."
 GER_heavyfighter_effort:0 "Heavy Fighter Arm"
 GER_heavyfighter_effort_desc:0 "Luftwaffe staff believe there may be merit in pursuing the development of offensive-oriented twin-engine fighter planes with greater range and fuel capacity. These "heavy fighters" could escort our bombers to enemy territory, then use their speed to quickly return home before more agile single-engine fighters can shoot them down... At least, in theory."
 GER_western_knowledge:0 "Western Knowledge"
 GER_western_knowledge_desc:0 "With so much of Europe under the control of the Reich, we have a vast repository of knowledge to draw upon. Both via scientific institutions and captured weapons/ blueprints."
 GER_continue_the_new_plan:0 "Continue the New Plan"
 GER_continue_the_new_plan_desc:0 "Continue the new plan that was set in motion by Schacht, this will in fact make Schacht remain as de facto Führer of the German economy. It will undoubtably upset Göring immensely."
 GER_freedom_to_the_steel_barons:0 "Cooperate with the Steel Barons"
 GER_freedom_to_the_steel_barons_desc:0 "By promising that any changes to the economy are done in the favour of the Steel Barons, they have promised to cooperate more willingly with the Government. In return we promise to not infringe upon their activities and that they will always be able to exert a form of control over their interests in peace-time."
 GER_mefo_loans_for_resources:0 "Mefo Investments"
 GER_mefo_loans_for_resources_desc:0 "Schacht, the man behind the MEFO-bills has managed to create a re-armament process where none thought it would be possible. He is one of the main instigators of the entire system and he knows how to work it to its full efficiency. By securing investments in key sectors of the country he can also produce the highest yields."
 GER_the_steel_most_flow:0 "Steel Trade"
 GER_the_steel_most_flow_desc:0 "The Steel Trade is a necessity to the rearmament process, currently the deficits faced by the army, airforce and navy are putting a heavy demand on our internal steel production, therefore it is necessary that new channels of imports are created to sate the industry's demand for steel."
 GER_resource_rationing:0 "Resource Rationing"
 GER_resource_rationing_desc:0 "Schacht has dictated that there is a need to amass the necessary resources so that there are existing stockpiles to withdraw the necessary resources from. Germany has an abundance of people and a large industry, but without the resources to maintain them, Germany will once again be forced to its knees."
 GER_prevent_rheinmetall_merger:0 "Prevent Rheinmetall Merger"
 GER_prevent_rheinmetall_merger_desc:0 "It has come to our attention that certain people amongst German industrialists would not want to see Rheinmetall merge as it would hinder their future interests in the German arms business. Therefore the Government has, through blackmailing, intimidation and threats "
 GER_new_subsidiaries:0 "New Subsidiaries"
 GER_new_subsidiaries_desc:0 "New subsidiaries for the major firms in Germany, with our recent territorial acquisitions a lot of major firms in the former countries have been put under temporary state control. Schacht dictates that they would be much better under the control of the Steel Barons, since it is already increasingly difficult to complete the production quotas put out by them."
 GER_integrate_war_economies_desc:0 "We shall integrate the economies of Hungary and Romania into our own to create a more effective industrial base."
 GER_sweden_treaty_desc:0 "We need Swedens rich iron deposits to help fuel our war economy. Let us set up a trade deal with them to ensure the steel flows."
 GER_panzerfausts_for_all:0 "Panzerfausts For All"
 GER_panzerfausts_for_all_desc:0 "Every man pressed into the army shall be armed with our most effective and modern tank killer. The panzerfaust. Equipping every man with these fearsome yet cheap weapons will force enemy armor to slow down their advance to wait for their infantry screens or risk utter destruction. Our brave crusaders will wait in every bush, hedgerow and building to destroy as many tanks as possible. Gott mit uns."
 GER_standard_panzer:0 "Entwicklung Series"
 GER_standard_panzer_desc:0 "We shall implement the final standardised series of tanks. This series will range from the smaller E-10, the E-50 Standardpanzer medium tank, to the E-75 standard heavy tank, and finally the E-100 superheavy tank. With these standardised, though rushed, designs we will be able to produce tanks at a significantly cheaper cost. These will help create surpluses of tanks that will help allow us to achieve our final victory."
 GER_festung_deutschland:0 "Festung Deutschland"
 GER_festung_deutschland_desc:0 "We shall construct a new series of fortifications to defend Germany from the barbarous invaders from the West and East. Under no circumstances shall these lines be breached by foreign powers and will be held at all costs. Not a single soldier shall falter in the defense of his nation, or all will be lost.'Victory must be ours... One does ones duty and it would be cowardice not to fight to the end.' "
 GER_inspire_fanatasiscm:0 "Enforced Fanaticalism"
 GER_inspire_fanatasiscm_desc:0 "Hundreds of NSFOs (Nationalsozialistische Führungsoffiziere) will be sent throughout the ranks of the Wehrmacht to root out cowardice and promote loyalty in the various defence districts with 'extreme ruthlessness'. Summary martial courts (Standgerichte) will perform immediate executions in view of the troops which will serve as a deterrent to would be traitors. Meine Ehre heißt Treue."
 GER_implement_scorched_earth_tactics:0 "The Nero Decree"
 GER_implement_scorched_earth_tactics_desc:0 "The Führer has decreed ‘All military transport, communications, industrial and supplies installations... which the enemy can render usable immediately... are to be destroyed’. We must implement these scorched earth tactics in order to slow down and halt the Reds and West, otherwise worse is still to come. ‘The conviction that a victory of the Soviets would mean the extinction of life of the German people’"
 GER_endsieg:0 "Endsieg"
 GER_endsieg_desc:0 "Germany and her people will overcome any obstacle and achieve ultimate victory over its many foes. In the East we shall strike at their center and drive them out to Moscow. In the West we will launch a final offensive against the Allies to force them into a peace settlement. History shall remember our glorious triumph against the world. ‘As the curve sometimes goes down, so one day it will go up again.’"
 GER_volksgewehr:0 "Volkssturmgewehr"
 GER_volksgewehr_desc:0 "As the first Volkssturm battalions have already been sent to the front, we have realized the need to equip future troops with rifles. To do this, we shall create a new easier to produce standard rifle. The Volkssturmgewehr. This rifle will be able to be mass produced and stamped without any artisanal support hastening production substantially. Every Volkssturm shall have his rifle."
 GER_volksturm:0 "Volkssturm"
 GER_volksturm_desc:0 "We shall form the Volkssturm, or peoples storm, to fight alongside the Wehrmacht. These troops will supply their own clothes and culinary equipment and will be sent almost immediately to the cities and frontlines to fiercely defend the Fatherland. ‘...if the enemy should break in somewhere, he will encounter such a fanatical people, fighting like mad to the end, that he will certainly not get through’"
 JAP_the_ultimate_tank:0 "The Ultimate Tank"
 JAP_ija_expansion:0 "IJA Expansion"
 JAP_ija_expansion_desc:0 ""
 JAP_ija_cas:0 "CAS Doctrine"
 JAP_ija_cas_desc:0 ""
 JAP_ija_tank_killers:0 "Tank Killers"
 JAP_ija_tank_killers_desc:0 ""
 JAP_ija_fighter_development:0 "Fighter Development"
 JAP_ija_fighter_development_desc:0 ""
 JAP_ija_fighter_production:0 "Fighter Production"
 JAP_ija_fighter_production_desc:0 ""
 JAP_ija_tactical_development:0 "Heavy Plane Research"
 JAP_ija_tactical_development_desc:0 ""
 JAP_ija_airborne:0 "Army Paratroopers"
 JAP_ija_airborne_desc:0 ""
 JAP_ija_giretsu_kuteitai:0 "Giretsu Kuteitai"
 JAP_ija_giretsu_kuteitai_desc:0 ""
 JAP_nomonhan_incident:0 "Nomonhan Incident"
 JAP_nomonhan_incident_desc:0 "For weeks, we have been skirmishing with Mongolian and Soviet troops around Nomonhan between Mongolia and Manchukuo. Besides indecisive skirmishing the incident continues, with both sides stockpiling troops. To resolve the situation, we have given the commander of the Japanese 23rd Infantry Division, Lt. Gen. Michitarō Komatsubara permission to "expel the invaders"."
 JAP_northern_expansion_doctrine:0 "Hokushin-ron"
 JAP_northern_expansion_doctrine_desc:0 "The Bolsheviks should be the priority of our government as they are the greatest threat to us. Siberia also holds vast deposits of resources our empire so desperately needs. Accordingly we should prepare to enter conflict with them and deal with them, expansions to our military and presence in Manchuria should help aid us in this goal."
 JAP_manchurian_military_industry:0 "Manchurian Military Developments"
 JAP_manchurian_military_industry_desc:0 "Manchukuo is the optimal base for launching any attacks into the Soviet Union or China, as such we should expand this foundation for future strikes."
 JAP_Steal:0 "Take over Hulubuir Mining Industry"
 JAP_Steal_desc:0 ""
 JAP_take:0 "Improve Manchurian Industrial Sector"
 JAP_take_desc:0 ""
 JAP_csg:0 "Improve Japanese Colonial Goods"
 JAP_csg_desc:0 ""
 JAP_resource_man:0 "Improve Manchurian Resource Extraction"
 JAP_resource_man_desc:0 ""
 JAP_domestic_military_infrastructure:0 "Domestic Military Infrastructure"
 JAP_domestic_military_infrastructure_desc:0 "Expanding our domestic Industry will allow us to support high intensity border conflicts with the Soviets and Chineses, as such we will put additional funding into new military infrastructure."
 JAP_strike_south_battleline:0 "Third Circle Plan"
 JAP_strike_south_battleline_desc:0 "The term of the London Naval Treaty has expired, and our government has refused overtures to participate in further disarmament negotiations. Instead, a massive third expansion plan will be drafted, centering on two of the new Yamato-class battleships. Increased budgets will now allow us to refit, and produce quality ships to compete against our many foes."
 JAP_zaibatsus_dominance2:0 "Zaibatsus Dominance"
 JAP_zaibatsus_dominance3:0 "Zaibatsus Dominance"
 JAP_zaibatsus_dominance4:0 "Zaibatsus Dominance"
 JAP_zaibatsus_dominance5:0 "Zaibatsus Dominance"
 JAP_zaibatsus_dominance3_desc:0 "The zaibatsus representatives and thus by extension the government have decided the most effective way for Japan to prosper and be prepared for its future is through unregulated business practices to maximize military production without hampering domestic growth. In no way can this backfire."
 JAP_zaibatsus_dominance4_desc:0 "The zaibatsus representatives and thus by extension the government have decided the most effective way for Japan to prosper and be prepared for its future is through unregulated business practices to maximize military production without hampering domestic growth. In no way can this backfire."
 JAP_zaibatsus_dominance5_desc:0 "The zaibatsus representatives and thus by extension the government have decided the most effective way for Japan to prosper and be prepared for its future is through unregulated business practices to maximize military production without hampering domestic growth. In no way can this backfire."
 JAP_zaibatsus_dominance2_desc:0 "The zaibatsus representatives and thus by extension the government have decided the most effective way for Japan to prosper and be prepared for its future is through unregulated business practices to maximize military production without hampering domestic growth. In no way can this backfire."
 JAP_zaibatsus_dominance:0 "Zaibatsus Dominance"
 JAP_zaibatsus_dominance_desc:0 "The zaibatsus representatives and thus by extension the government have decided the most effective way for Japan to prosper and be prepared for its future is through unregulated business practices to maximize military production without hampering domestic growth. In no way can this backfire."
 JAP_zaibatsus_dominance_2:0 "Unrestricted Zaibatsus Practices"
 JAP_zaibatsus_dominance_2_desc:0 "We shall let the Zaibatsus go wild"
 JAP_zaibatsus_dominance_corperate_merger:0 "Allow Continued Zaibatsus Growth"
 JAP_zaibatsus_dominance_corperate_merger_desc:0 "Business is doing great, why should we try to limit it?"
 JAP_civilian_industry:0 "Private Industry Subsidies"
 JAP_civilian_industry_desc:0 "Funding into the civilian sector will yield significant growth."
 JAP_military_industry:0 "Imperial Armament And Dockyard Expansion"
 JAP_military_industry_desc:0 "More funding into government controlled industry."
 JAP_guide_zaibatsus_mixed_industry:0 "Influence Key Private Industries"
 JAP_guide_zaibatsus_mixed_industry_desc:0 "It is much easier to talk to the various industries and convince them to do what we want than force them to."
 JAP_guide_zaibatsus_mixed_industry_2:0 "Business Collaboration Efforts"
 JAP_guide_zaibatsus_mixed_industry_2_desc:0 "We will work closely with the armament industry and the dockyards of Japan to better research and produce new technologies."
 JAP_challenge_the_zaibatsus_3:0 "Nationalize Key Companies"
 JAP_challenge_the_zaibatsus_3_desc:0 "Through clever tactics and talks, we can nationalize key companies throughout Japan for our own usage."
 JAP_planning_board:0 "Found the Planning Board"
 JAP_planning_board_desc:0 "The Planning Board (Kikaku-in) is a group of bureaucrats (influenced by some amount of military, business, and internal struggles) who will help dictate internal policy relating to production, internal financial operations, and applications of resources. This board will help us more effectively organize our efforts to optimize Japan’s war making efforts."
 JAP_reorganization_of_japanese_economy:0 "Reorganization Of Japanese Economy"
 JAP_reorganization_of_japanese_economy_desc:0 "Drawn up by the Showa Research Association, the plan called for the owners of capital and management should be split. This split would change the goals of corporations to pursue better production methods rather than profits. Shareholders (The owners of capital) will still however be given the right to receive dividends at fair rates but cannot influence the management side of the company."
 JAP_personal_service_drafting_act:0 "Personal Service Drafting Act"
 JAP_personal_service_drafting_act_desc:0 "The proposed ‘Personal Service Drafting Act’ (Kokumin choyo-rei) will conscript workers in ‘non-urgent and unnecessary’ industries into service for military industries. These workers will heed the call or face punishment for desertion. This new surplus of workers will help free up manpower for frontline military service."
 JAP_steel_movement:0 "Establish Control Over Steel Movement"
 JAP_steel_movement_desc:0 "The effective use of Japan’s railways is key to controlling the flow of steel throughout Japan. By nationalizing key components of these railways, diverting certain tracks to military arsenals, building new tracks and working with private railway companies we can significantly increase the effective amount of steel output of our economy. Control of the rails is control over the steel of Japan."
 JAP_unify_private_railway_companies:0 "Unify Private Railway Companies"
 JAP_unify_private_railway_companies_desc:0 "We should attempt to unify various private railway companies into larger more efficient ones. One such proposed example is Tokyo Kyuko Electric Railway, which would be a conglomeration of various smaller private railway companies into the area. By uniting various companies under regional blocks, we can make better use of the infrastructure for our own needs."
 JAP_outline_of_the_new_economic_order:0 "Outline Of The New Economic Order"
 JAP_outline_of_the_new_economic_order_desc:0 "Proposed in September, the Planning Board has come up with a new outline. In this outline the Planning Board proposed much stricter economic controls over the entirety of Japan to ensure better production. The best way to do this is through amending the Commercial Codes, which is too lax for an efficient war economy. However, we must see what we can actually accomplish."
 JAP_zaibatsus_control:0 "Leave The Commercial Code Untouched"
 JAP_zaibatsus_control_desc:0 "Amending The Code would be important to ramping up wartime production and keeping the industrial sector under control, or so argues the Planning Board. However, the Business League have rejected this plan in favor of a more modest solution. They argue that leaving the businesses alone would increase production more than upsetting the ‘foundation of the economic structure’."
 JAP_zaibatsus_control_2:0 "Super Conglomerates"
 JAP_zaibatsus_control_2_desc:0 "All of the remaining non-Zaibatsus companies in Japan remain ripe for the taking, let us merge into them and enrich ourselves even further. Despite there being active conflict in the world, our growth rates have never been better. At least for the Zaibatsus."
 JAP_production_vitalization:0 "Amend The Commercial Code"
 JAP_production_vitalization_desc:0 "Amending The Code will be vital to ramping up wartime production, so we must do what we can. However, the Business League has put up fierce resistance so we must compromise with them in order to get anything done. Businesses will be under tighter control then they were before, but will still have plenty of self-control over how they operate business. While not ideal, this will help production."
 JAP_production_vitalization_2:0 "Supervise Key Private Industry"
 JAP_production_vitalization_2_desc:0 "In accordance with the watered down amendment to the Commercial Code, we will help supervise businesses to help them make the right decisions in production. In the shipbuilding industry, we have a significant degree of control. More so than over the more land loving industries. This will help us increase naval production for the IJN."
 JAP_hoshino_plan:0 "The Hoshino Plan"
 JAP_hoshino_plan_desc:0 "Proposed by Hoshino, a bureaucrat and a politician in the Second Konoe Cabinet, to subject industry to direct bureaucratic control. With this plan, supported by the Army and Navy ministers, we can get the Zaibatsus under control. The Zaibatsus on the other hand won't be pleased and will throw everything they have at resisting this plan in an attempt to retain influence."
 JAP_break_up_the_big_four:0 "Break Up The Big Four"
 JAP_break_up_the_big_four_desc:0 "The big four Zaibatsus, Sumitomo, Mitsui, Mitsubishi, and Yasuda have been getting in the way of efficient military production for too long. Despite their roots dating back to the Edo period for Sumitomo and Mitsui, and the Meiji Restoration for Mitsubishi, and Yasuda, their time has come to an end. We will break them up into smaller more manageable parts."
 JAP_superiority_of_firepower:0 "Superiority of Airpower"
 JAP_superiority_of_firepower_desc:0 "By creation of new ways to signal Close-Air-Support and communicate effectively with them, we can significantly improve the overall effectiveness of our support planes to help our infantry out."
 JAP_air_land_cooperation:0 "Larger Payloads"
 JAP_integrated_spotters:0 "Divisions in the Skies"
 JAP_integrated_spotters_desc:0 "The industrial nature of air warfare cannot be understated. We will produce our military planes en masse to equip units in strength and size never seen before."
 JAP_shock_n_awe:0 "Improve Air-Artillery Coordination"
 JAP_shock_n_awe_desc:0 "The western powers demonstrated the power of artillery in the Great War. Communications are of utmost importance in perfecting the usage of artillery in cooperation with our aviation."
 JAP_light_artillery_manufacturing_plants:0 "Cannon Manufacturing Plants"
 JAP_light_artillery_manufacturing_plants_desc:0 "We will invest into new artillery manufacturing plants to help expand artillery production. Through the increased expansion of artillery production, it will help us produce it more efficiently and cheaper than before."
 JAP_cannon_modernization:0 "Cannon Modernization Effort"
 JAP_cannon_modernization_desc:0 "Our artillery is severely outdated when compared to the rest of the world, some models by several decades. We must rectify this to get up to par with the western imperialists."
 JAP_superiority_of_man:0 "Superiority Of Man"
 JAP_superiority_of_man_desc:0 ""
 JAP_massed_rifle_production:0 "Massed Rifle Production"
 JAP_massed_rifle_production_desc:0 ""
 JAP_indoctrination_efforts:0 "Indoctrination Efforts"
 JAP_indoctrination_efforts_desc:0 ""
 JAP_the_emperors_wave:0 "The Emperors Wave"
 JAP_the_emperors_wave_desc:0 ""
 JAP_expanded_military_factories:0 "Expanded Military Factories"
 JAP_expanded_military_factories_desc:0 ""
 JAP_new_tactics:0 "New Tactics"
 JAP_new_tactics_desc:0 ""
 JAP_intensify_yamato_damashii:0 "Intensify Yamato Damashii"
 JAP_intensify_yamato_damashii_desc:0 ""
 JAP_offensive_doctrine:0 "Offensive Doctrine"
 JAP_offensive_doctrine_desc:0 ""
 JAP_the_occupation_of_china:0 "The Occupation of China"
 JAP_the_occupation_of_china_desc:0 "After a brutal war, it is time for us to reap the spoils! We must decide what to do with the Chinese. However, occupying all of China may be difficult, and possibly a waste of resources…"
 JAP_develop_chinese_aluminium:0 "Develop Chinese Aluminium"
 JAP_develop_chinese_aluminium_desc:0 "Our Aluminium supply is being strained, we must develop our resource aquisitions in China."
 JAP_develop_chinese_steel:0 "Develop Chinese Steel"
 JAP_develop_chinese_steel_desc:0 "Our Steel imports are being denied, we must increase productions in our chinese mines."
 JAP_china_bonus:0 "Final Offensive"
 JAP_china_bonus2:0 "Final Offensive"
 JAP_china_bonus3:0 "Final Offensive"
 JAP_the_conquest_of_china:0 "The Conquest of China"
 JAP_the_conquest_of_china_desc:0 "In order to break The United Front, we must first start with the city of Wuhan!"
 JAP_attacking_the_interior:0 "Attack the Interior"
 JAP_attacking_the_interior_desc:0 "Chiang Kai-Shek thinks he is safe in his new capital of Chongqing? Forwards!"
 JAP_offensives_along_the_coast:0 "Offensives Along the Coast"
 JAP_offensives_along_the_coast_desc:0 "We must prevent the Nationalists from receiving any aid via the ocean, March!"
 JAP_northern_offensive:0 "Northern Offensive"
 JAP_northern_offensive_desc:0 "The Communists to the north lick their wounds following the Long March, now is surely the time to strike and end this Communist threat!"
 JAP_southern_offensive:0 "Southern Offensive"
 JAP_southern_offensive_desc:0 "The Allies are sending supplies to the enemy through the Burma Road, stop them!"
 JAP_redouble_our_efforts:0 "Redouble our Efforts"
 JAP_redouble_our_efforts_desc:0 "The offensive into China has stalled, we must press on, no matter the cost!"
 JAP_the_exploitation_of_china:0 "The Exploitation of China"
 JAP_the_exploitation_of_china_desc:0 "Following the declaration of war, we can use this as an excuse to inspire the workforce in the occupied states to work even harder."
 JAP_workforce_for_shipyards:0 "Workforce for Shipyards"
 JAP_workforce_for_shipyards_desc:0 "The newly conquered states are teeming with unemployed workers, the IJN can use their services."
 JAP_chinese_sweatshops:0 "Chinese Sweatshops"
 JAP_chinese_sweatshops_desc:0 "Constructing sweatshops in the northern states has allowed us to efficiently increase production in said states."
 JAP_relocate_the_chinese_industry_to_japan:0 "Relocate the Chinese Industry to Japan"
 JAP_relocate_the_chinese_industry_to_japan_desc:0 "The Interior is filled with profitable enterprises that can be funneled into our Military Complex in the Homeland, the Chinese have no need for these commodities."
 JAP_mobile_labor_force:0 "Mobile Labour Force"
 JAP_mobile_labor_force_desc:0 ""
 JAP_the_spoils_of_china:0 "The Spoils of China"
 JAP_the_spoils_of_china_desc:0 "The new states taken during the IJA offensive are now fully subdued and compliant to working in factories for our needs."
 JAP_increase_the_garrisons:0 "Increase the Garrisons"
 JAP_increase_the_garrisons_desc:0 "The Resistance to our occupation is higher than expected, we must devote more resources to the Kempeitai to ensure compliance."
 JAP_reeducation_centers:0" Reeducation Centers"
 JAP_reeducation_centers_desc:0 "The noncompliant shall be "reeducated" to our requirements."
 JAP_the_development_of_china:0 "The Development of China"
 JAP_the_development_of_china_desc:0 "Rewarding cooperation and punishing dissent will surely increase the compliance of our new subjects."
 JAP_wang_jingwes_regime:0 "Wang Jingwei's Regime"
 JAP_wang_jingwes_regime_desc:0 "Wang Jingwei has recently become an adamant supporter of our cause. He could be immensely useful in controlling the Chinese population."
 JAP_increase_work_quotas:0 "Lessons of Sino-Japanese War"
 JAP_increase_work_quotas_desc:0 "The conflict in China has provided invaluable insights into modern warfare. By analyzing our successes and failures, we can refine our military doctrines, enhancing our tactics and operational planning."
 JAP_conscript_volunteers:0 "Conscript Volunteers"
 JAP_conscript_volunteers_desc:0 "Hearing of our conscription issues, Wang Jingwes has rounded up an army group of volunteers for us."
 JAP_secure_newly_aquired_naval_bases:0 "Secure Newly Acquired Naval Bases"
 JAP_secure_newly_aquired_naval_bases_desc:0 "Our new Naval Bases require a supportive populace to avoid sabotage by insidious elements."
 JAP_fortify_the_coastline:0 "Fortify the Coastline"
 JAP_fortify_the_coastline_desc:0 "In event of an attack by the Allies, our holdings must be secure if the IJN should fail us."
 JAP_prepare_for_further_expansion:0 "Prepare for Further Expansion"
 JAP_prepare_for_further_expansion_desc:0 "With our new focus on the Allies, we must ensure the mountains remain ours during the occupation."
 JAP_strategic_bases_around_india:0 "Strategic Bases Around India"
 JAP_strategic_bases_around_india_desc:0 "To Prepare for our invasion of Burma, we must prepare logistics and support in the bordering states."
 JAP_pacify_the_interior:0 "Pacify the Interior"
 JAP_pacify_the_interior_desc:0 "We cannot allow Nationalist or Communist guerrilla forces to disrupt our efforts in the Interior."
 JAP_fruits_of_victory:0 "Fruits of Victory"
 JAP_fruits_of_victory_desc:0 "Victory is ours! The major elements of resistance in China have been defeated, the fruits of our victories tumble into our mouths."
 JAP_tokubetsu_konkyo_chita:0 "Expand the Konkyo-Chitai"
 JAP_tokubetsu_konkyo_chita_desc:0 "The Konkyo Chitai, the base defence force, are units allocated for defending important sites that are vital to the Imperial Japanese Navy. Currently it is of the utmost importance that our naval bases and naval dockyard sites are kept under heavy control and security as enemy incursions against these areas will prove disastrous."
 JAP_boku_tai_detachments:0 "Bōkū-tai Detachments"
 JAP_boku_tai_detachments_desc:0 ""
 JAP_dispersed_production:0 "Dispersed Production"
 JAP_dispersed_production_desc:0 "Our wooden cities are extremely vulnerable to air raids. It is time to relocate key production facilities to hardened locations."
 JAP_doctrine_enhancement_defense:0 "Enhancement of Defense"
 JAP_doctrine_enhancement_defense_desc:0 ""
 JAP_operation_ketsugo:0 "Operation Ketsugō"
 JAP_operation_ketsugo_desc:0 "The merciless white devils are at the doorstep of our homeland. To the glorious death for the holy Emperor of Japan!"
 JAP_stockpiling_of_planes:0 "Stockpiling of Aircraft"
 JAP_stockpiling_of_planes_desc:0 "We have already lost the air war against the western powers. We will save the remnants of our airforce to inflict horrific casualties on the white devils when they decide to foolishly land on our homeland."
 JAP_strengthen_the_divine_wind:0 "Strengthen the Divine Wind"
 JAP_a_weapon_for_every_man_woman_child:0 "A Weapon for Every Man, Woman, and Child"
 JAP_a_weapon_for_every_man_woman_child_desc:0 "Every Japanese man, woman, and child will die for the Emperor when the white devils land!"
 JAP_the_old_guard:0 "The Old Guard"
 JAP_the_old_guard_desc:0 "Our generals still believe that the future of warfare will be an evolution of World War 1 strategies combined with new discoveries and technologies. "
 JAP_innovative_theories:0 "A New Approach"
 JAP_innovative_theories_desc:0 "Although the Great War never saw as much action in Asia as it did in Europe, the stalemates in Europe were brought to an end by the steel encased behemoths of the western allies. Military Theorists all over the globe are discussing the impact of these new armoured vehicles and their effect on combat, the Empire of Japan can not fall behind in these developments."
 JAP_modernize_equipment:0 "Modernize Old Equipment"
 JAP_modernize_equipment_desc:0 "A large part of the Imperial Japanese Army's equipment is horribly obsolete, if the army is to partake in wars of conquest against our enemies it will need modern weapons and not relics from ages past."
 JAP_expand_small_arms_manufacturing:0 "Expand Small Arms Arsenals"
 JAP_expand_small_arms_manufacturing_desc:0 "The Imperial Japanese army will expand its own facilities and dedicate these to equipping the new units that are currently being deployed with adequate equipment."
 JAP_artillery_modernisation:0 "Artillery Modernization"
 JAP_artillery_modernisation_desc:0 "The artillery is a necessary component in warfare, to break enemy lines and to destroy enemy fortifications heavy calibre guns will be required."
 JAP_improve_logistics:0 "Prioritize Logistics"
 JAP_improve_logistics_desc:0 "The Empire of Japan, like the United Kingdom, is unique in its situation, it has overseas assets that it needs to protect and it means that army units on foreign soil are dependent on shipments. Our generals therefore need the utmost training in logistics so that they do not waste precious supply."
 JAP_strengthen_the_kwantung_army:0 "Strengthen the Kwantung Army"
 JAP_strengthen_the_kwantung_army_desc:0 "Even though the Kwantung Army is currently a loose cannon ready to unload, to sate the needs of the army we need to appease them through building appropriate infrastructure in their staging areas. Even though this may incentivize them, it can calm the army for now."
 JAP_mechanization_program:0 "Renew the Mechanization Program"
 JAP_mechanization_program_desc:0 "With the 1934 army motorization and mechanization program giving us a common truck design and some more specialized equipment, the true potential of it was subdued by lack of funding. With renewing the program and giving it full support, we can push the performance of our divisions a great step forward."
 JAP_armoured_production_facilities:0 "Exploit Continental Resources"
 JAP_armoured_production_facilities_desc:0 "The limiting factor on armoured vehicle production in the past has been the pitiful resources of our island, of which a lions share goes to the navy. With the rapid development of resource extraction on Manchuria, a new era will be ushered in for the army of our beloved empire."
 JAP_jungle_armour:0 "Jungle Armor"
 JAP_jungle_armour_desc:0 "Asia as a continent of high mountains, deep jungles and innumerable islands is not very suited for armoured warfare. But as our enemies overweight long barreled tanks will be bogged in the jungles, our armour can be designed to if not excel, at least be effective in these difficult conditions with some concessions to general performance."
 JAP_tiger:0 "Heavy Tank No.6"
 JAP_tiger_desc:0 "Germany has innovated in many areas, but their armour has the biggest bleeding edge over us. With our attachees being amazed by the new generation of German tanks, and the state of our heavier armour development being questionable to say the least, the solution is clear. We will purchase the heavy tank, full documentation, and special tooling and ship them to Japan via cruiser submarines."
 JAP_second_modernization:0 "Second Modernization"
 JAP_second_modernization_desc:0 "Our arms industry is inadequate for producing new highly advanced feats of engineering. Our machine tools are insufficient and the facilities too small. The industry must undergo a great modernization if we are ever to be able to field as many modern weapons as the army needs."
 JAP_purge_kwantung_army:0 "Purge the Kwantung Army"
 JAP_purge_kwantung_army_desc:0 "The time has come to put a leash on our wild dog, the Kwantung Army, we must thoroughly investigate the current leadership and remove them from positions of influence and make them abide by the Emperor's wishes."
 JAP_betray_the_soviets:0 "Betray the Soviets"
 JAP_betray_the_soviets_desc:0 "The Russians have repeatedly tried to stamp out the will of the Empire of the Rising Sun. We have vanquished our enemies in the pacific and with the resources of the pacific at our disposal the time has come to end the Soviet State."
 JAP_test_the_navy_in_china:0 "Test the Navy in China"
 JAP_test_the_navy_in_china_desc:0 "The navy has been able to provide vital support to the Japanese Army during our venture in China, and so far every incursion along the Chinese coast has proven successful, but only because the army was aided by the Japanese Navy."
 JAP_expand_the_jnlf:0 "Expand the Naval Infantry Branch"
 JAP_expand_the_jnlf_desc:0 "Naval Infantry is an old concept, but this new era of warfare has seen it used in different ways. Naval Infantry opens up the entire enemy coastline for attacking, as proven by our great successes against China, if we make the enemy's coastline more vulnerable their entire defence collapses."
 JAP_strengthen_the_fleet_air_arm:0 "Strengthen the IJN Air Service"
 JAP_strengthen_the_fleet_air_arm_desc:0 "Our carriers are equipped with a new weapon, aircraft that launch from new mobile islands, this new technology which we have been slowly adapting to, is something that our pilots need to get accustomed to. After our experiences in the Sino-Japanese War our pilots gathered much combat experience and became experts at performing sorties."
 JAP_yamamoto_isoroku:0 "Yamamoto Isoroku"
 JAP_yamamoto_isoroku_desc:0 "A legendary admiral, who planned the attack on Pearl Harbour that eventually lead to the demise of the Japanese Empire. Will you be able to change the fate of Japan with his assistance?"
 JAP_operation_z:0 "Build the Absolute Defense Perimeter"
 JAP_operation_z_desc:0 "We no longer have the strength to continue our offensive on the pacific. The emperor has began insisting that the army and navy will coordinate a single decisive frontal attack in the Pacific so we can force the allies to negotiate for peace. For this offensive to succeed, we need to hold our ground until our forces are re-equipped for the decisive battle. "
 JAP_reestablish_the_maizuru_naval_district:0 "Reestablish the Maizuru Naval District"
 JAP_reestablish_the_maizuru_naval_district_desc:0 "Our exit from the naval treaties allows us to open production facilities closed in the early 1920s. The war with the western imperialists will surely extract a heavy toll upon us, so more facilities is a pure necessity."
 JAP_yokosuka_naval_arsenal:0 "Yokosuka Naval Arsenal"
 JAP_yokosuka_naval_arsenal_desc:0 "Yokosuka Naval Arsenal (横須賀海軍工廠, Yokosuka kaigun kōshō) was one of four principal naval shipyards owned and operated by the Imperial Japanese Navy, and was located at Yokosuka, Kanagawa prefecture on Tokyo Bay, south of Yokohama."
 JAP_kure_naval_arsenal:0 "Kure Naval Arsenal"
 JAP_kure_naval_arsenal_desc:0 "Kure Naval Arsenal (呉海軍工廠, Kure Kaigun Kosho) was one of four principal naval shipyards owned and operated by the Imperial Japanese Navy."
 JAP_fleet_submarines:0 "Fleet Submarines"
 JAP_fleet_submarines_desc:0 "Our most likely opponents in the naval war both rely on foreign trade, which has shown to be very vulnerable to submarines. These submarines would have to have very long range to allow them to cross the oceans and operate close to the enemy shore."
 JAP_unrestricted_submarine_warfare:0 "Unrestricted Submarine Warfare"
 JAP_unrestricted_submarine_warfare_desc:0 "History has shown that whatever well-intentioned treaty tried to control submarine warfare is not worth the paper it is written on. We should not consider ourselves bound by something our enemies will ignore anyway."
 JAP_convoy_focus:0 "Convoy Escort Focus"
 JAP_convoy_focus_desc:0 "It cannot be stressed enough, our convoys are our lifeblood. We must do everything in our power to protect them and to replace lost tonnage quickly."
 JAP_a_s_warfare:0 "A-S Warfare"
 JAP_a_s_warfare_desc:0 "The Pacific and Chinese Sea are our lifelines, and we must ensure it remains clear from enemies that would prey on our vulnerable shipping, be it above the surface or below it. We shall focus on cutting-edge developments in the field of anti-submarine warfare, ensuring our escorts are equipped with the best weaponry and detection means that we can provide."
 JAP_anti_submarine_training_school:0 "Anti-Submarine Training Program"
 JAP_anti_submarine_training_school_desc:0 "One of our great disadvantages is our admirals inexperience in the field of anti submarine warfare. Our lack of experience from the old war means that we have no real understanding or experience in submarine warfare, therefore the Navy must invest heavily into making sure that crews are trained to deal with submarine warfare. By inviting foreign experts and studying foreign tactics in A/S warfare, we can make up for this deficit."
 jap_kwantung_army:0 "Kwantung Army Veto"
 jap_kwantung_army_2:0 "Kwantung Army Veto"
 jap_kwantung_army_3:0 "Kwantung Army Veto"
 jap_kwantung_army_5:0 "Kwantung Army Veto"
 jap_kwantung_army_4:0 "Kwantung Army Veto"
 JAP_test_the_navy_in_china_idea:0 "Naval War College"
 JAP_operation_z_idea:0 "Operation Z"
 JAP_navy_modernization:0 "Navy Modernization"
 JAP_modernize_the_fleet:0 "Modernize the Fleet"
 JAP_naval_war_college:0 "The Kaigun Daigakkō"
 JAP_naval_war_college_desc:0 "The Naval War College (Kaigun Daigakkō), Short form: Kaidai) was the staff college of the Imperial Japanese Navy, responsible for training officers for command positions either on warships, or in staff roles."
 jap_improved_sprit_focus:0 "Improved National Spirit"
 jap_improved_sprit_focus_desc:0 "Nationalist pride and support for the war overcomes every subject of the Emperor, driving them to ever-greater heights of devotion!"
 JAP_army_primancy_focus_bypass_tt:0 "Not enough building slots for §YMilitary Factories§! in home area."
 jap_sia_love:0 "Japanese-Siamese Diplomacy"
 jap_sia_love_desc:0 "Japan has focused its diplomatic efforts on improving relations with Siam."
 JAP_navy_primancy_focus_bypass_tt:0 "Not enough building slots for §YNaval Dockyards§! in home area."
 JAP_synth_oil_focus_tt:0 "Idemitsu Kosan available as industry concern"
 JAP_strike_ussr_while_they_are_weak:0 "Strike the USSR while they are weak"
 JAP_strike_ussr_while_they_are_weak_desc:0 "Germany has advanced deep into the Soviet Union, if we strike the communists now we may be able to acquire valuable land in the Soviet far east."
 GER_atlantikwall_tt_2:0 "§YAquitaine§!\n§YPoitou§!\n§YLoire§!\n§YBritanny§!\n§YNormandy§!\n§YPas de Calais§!\n§YVlaanderen§!\n§YHolland§!\n§YFriesland§!\n§YVestlandet§!\n"
 GER_westwall_tt:0 "Constructs §YLand Forts§! along the border with France, in each of the following states:\n"
 GER_westwall_2_tt:0 "§YMoselland§!\n§YWürttemburg§!"
 GER_prepare_to_invade_the_ussr:0 "Prepare to invade the Soviet Union"
 GER_prepare_to_invade_the_ussr_desc:0 "If we are to invade the Soviet Union a large army and airforce will have to be prepared, and they will need a staging area for where they can take off on the §GGreat Crusade to Destroy Communism§!."
 GER_prepare_to_invade_the_ussr_tt:0 "Builds up §YAirbases§! to level §R10§! and sets §YRadars§! to level 2, in each of the following states that are fully controlled by your faction:\n"
 GER_prepare_to_invade_the_ussr_2_tt:0 "§YMemel§!\n§YOstpreussen§!\n§YLublin§!\n§YPlock§!\n§YWarszawa§!\n§YKrakow§!\n§YKielce§!\n§YCarpathian Ruthenia§!\n§YNorth Transylvania§!\n§YMoldova§!\n"
 GER_tank_competition:0 "This focus will give you the next level of §YMedium Tank§! for §GFree§!. It will only work if you have the §YMedium Tank 1936 Tech§! or the §YMedium Tank 1938 Tech§!\n"
 GER_assault_gun_competition:0 "This focus will give you the next level of §YAssault Gun§! for §GFree§!. It will only work for the §YMedium Assault Gun 1938 Tech§! or the §YMedium Assault Gun 1940 Tech§!\n"
 GER_mefo_investments:0 "Mefo Investments"
 GER_mefo_investments_desc:0 "The German Reich will use the system that Schacht set up to invest even further into the armaments industry, never mind the payments... The Reich will pay back... Once it has payed back the Allies..."
 GER_invest_infantry_equipment_industry:0 "Invest into the Infantry Equipment Industry"
 GER_invest_infantry_equipment_industry_desc:0 "Opening up investments into the Infantry Equipment industry will make sure that the armaments industry is ready for the future."
 GER_invest_armor_industry:0 "Invest into the Armour Industry"
 GER_invest_armor_industry_desc:0 "Opening up investments into the Armoured Fighting Vehicle industry will make sure that the armaments industry is ready for the future."
 GER_invest_aircraft_industry:0 "Invest into the Aircraft Industry"
 GER_invest_aircraft_industry_desc:0 "Opening up investments into the Aircraft industry will make sure that the armaments industry is ready for the future."
 GER_expanded_rearmament:0 "The Defeat in the Great War"
 GER_expanded_rearmament_desc:0 "Having emerged as the losers of the Great War, the army has developed a dedicated and determined attitude which causes strategic developments to come swiftly and with one goal in mind. To crush those that wished to see Germany in ruin."
 GER_kdf_wagen:0 "KDF-Wagen"
 GER_kdf_wagen_desc:0 "The people need a car, an affordable vehicle, produced by the finest the German automobile industry has to offer... after the war..."
 GER_armor_design_competition:0 "Armour Design Competition"
 GER_armor_design_competition_desc:0 "Promising designers a reward for producing a vehicle that is up to the Wehrmachts standards will make sure that the designers will come up with a vehicle that will revolutionize warfare."
 GER_invest_aircraft:0 "Airforce Investments"
 GER_invest_aircraft_desc:0 "Göring, head of the four-year plan, has made the Luftwaffe the priority of our fiscal investments."
 GER_krupp_in_charge:0 "The Krupp Family"
 GER_krupp_in_charge_desc:0 "The Krupp family has been one the most powerful industrial families in not just Germany, but in the entire world. Lately Krupp has been trying to increase its exports to increase revenue for the company thus strengthening their national production of arms as well. Also, the Führer has wanting someone to take the role of directing arms production for the rearmament of Germany."
 GER_henschels_tiger_cave:0 "Henschel's Tiger Works"
 GER_henschels_tiger_cave_desc:0 "Herr Speer has assured the armour companies that their new designs will be able to be safely produced... 20 feet underground."
 GER_MAN_man:0 "MAN Tank Factory"
 GER_MAN_man_desc:0 "The only German Tank Factory that used a production line method."
 GER_volunteer_workers:0 "Volunteer workers"
 GER_volunteer_workers_desc:0 "By giving people in foreign countries the right... incentives to come work in the Reich, more able bodied men can be deployed to the front line."
 GER_werewolfgorillas:0 "Werewolf Guerrillas"
 GER_werewolfgorillas_desc:0 "Set up an organization that will fight for the fatherlands independence, even if the Reich falls, the Werewolf Guerrillas will keep on fighting for our cause."
 GER_hermann_goring_werke:0 "Reichswerke Hermann Göring"
 GER_hermann_goring_werke_desc:0 "The Hermann Göring Werke was a state enterprise which primarily focused on producing steel for the armaments industry."
 GER_expand_the_reichswerke:0 "Expand the Reichswerke"
 GER_expand_the_reichswerke_desc:0 "With the recent additions to the Reich, former enterprises that were once owned by the Austrian and Czech state have been left without proper management. The Reichswerke will be able to seize these enterprises and use their resources for the state."
 GER_europes_largest:0 "Europes Largest"
 GER_europes_largest_desc:0 "The Reichswerke has become the largest enterprise in the world, it controls the resource excavation of all of Europe and territories that we have managed to seize abroad. Herr Görings management of the Reichswerke is about as efficient as his management of the four year plan though..."
 GER_flakturm:0 "Flak Towers"
 GER_flakturm_desc:0 "With the skies being filled with the silhouettes of enemy airplanes wishing destruction upon the fatherland, the citizens of our fair country must be reassured by the presence of the flak towers. Large concrete structures filled to the brim with anti aircraft guns."
 GER_heavy_fighters:0 "Heavy Fighters"
 GER_heavy_fighters_desc:0 "Regular fighters are not up to the task of clearing out the skies above Germany, a heavier breed of fighter is necessary to go toe to toe with the enemy bomber formations."
 GER_ambush_tactics:0 "Pak Front"
 GER_ambush_tactics_desc:0 "The great soldiers of the Reich are unable to push any further. Due to logistical problems and the enemy’s numerical superiority we must halt and hold out until we gain the upper hand once again. With the ludicrous amount of soviet tanks and the insufficient production of our own armoured vehicles, we are in need of a new way of fighting."
 GER_cossacks:0 "Arm the Cossacks"
 GER_cossacks_desc:0 "The Cossacks have enthusiastically welcomed in Ukraine, we may arm them and use them in order to compensate for our lack of manpower."
 GER_arbeitseinsatz:0 "Arbeitseinsatz"
 GER_arbeitseinsatz_desc:0 "Since we occupy numerous countries, we have gained access to more workers. These new workers could be of use for our civil and war economy. We must escort them to our factories to produce equipment for the brave soldiers of the Reich at once!"
 GER_new_weapons:0 "Das Sturmgewehr"
 GER_new_weapons_desc:0 "Our weapon manufactures have researched the possibility of a new standard weapon for the soldiers. This new weapon should make every recruit into a machine gunner at once. With these new submachine guns that use rifle caliber bullets, will we achieve the upper hand against the enemy."
 GER_gestapo:0 "Gestapo"
 GER_gestapo_desc:0 "Keeping the peace"
 GER_gestapo2:0 "Expanded Gestapo"
 GER_gestapo2_desc:0 "With more resources, it will be easier for the Gestapo to keep the peace within both the Reich and the territories that we have annexed."
 GER_Schutzstaffel_focus:0 "Schutzstaffel"
 GER_Schutzstaffel_focus_desc:0 "A small paramilitary organization that will be used as a protection squadron for the Führer."
 GER_Schutzstaffel_focus2:0 "Schutzstaffel Polizei"
 GER_Schutzstaffel_focus2_desc:0 "The Schutzsstaffel will be given permission to police our annexed territories, where they will make sure that our new territories have fealty to the Reich."
 GER_hitler_jugend:0 "Hitlerjugend"
 GER_hitler_jugend_desc:0 "The children of today are future of the Reich’s economy and security. We must educate the younglings in ways so that they also can make our country stronger and more prosperous."
 GER_SS_armed_branch:0 "Die Waffen SS"
 GER_SS_armed_branch_desc:0 "This new war calls for an elite force that can defeat any opposition, and Himmler promises to turn the SS into a fighting force like the world has never seen."
 GER_SS_recruit_everywhere:0 "Encourage Foreign Volunteers"
 GER_SS_recruit_everywhere_desc:0 "Allow the SS to recruit from the countries that we have annexed, many former nations that are now occupied by the reich have men that are willing to pick up a rifle and fight our enemies. Furthermore, the SS are willing to organize them into divisions."
 GER_SS_restrict_recruitment:0 "Meine Ehre Heißt Treue"
 GER_SS_restrict_recruitment_desc:0 "Only the most loyal the Reich has to offer will be able to join the ranks of the SS, Himmler intends to create a fighting force unlike anything the world has ever seen before."
 GER_appoint_himmler_as_chief_of_gestapo:0 "Increase Himmler's Power"
 GER_appoint_himmler_as_chief_of_gestapo_desc:0 ""
 GER_SS_mechanized_corps:0 "Form the SS-Panzergrenadier Corps"
 GER_SS_mechanized_corps_desc:0 ""
 GER_SS_panzer_corps:0 "Form the SS-Panzer Corps"
 GER_SS_panzer_corps_desc:0 ""
 GER_SS_infantry_corps:0 "Form the SS-Infantry Corps"
 GER_SS_heavy_panzer_corps:0 "Form the SS-Schwere Panzer Corps"
 GER_SS_heavy_panzer_corps_desc:0 ""
 GER_bandenbekampfnung:0 "Bandenbekämpfung"
 GER_bandenbekampfnung_desc:0 ""
 GER_appease_steel_barons:0 "Appease Steel Barons"
 GER_appease_steel_barons_desc:0 "Appease the Steel Barons by lessening the tariffs and protectionism of the state."
 GER_steel_rearmament:0 "Steel Industry Rearmament"
 GER_steel_rearmament_desc:0 "Allow the Steel Barons to officially start producing armaments for the state again."
 GER_berlin_rome_axis:0 "The Berlin Rome Axis"
 GER_berlin_rome_axis_desc:0 "An Axis upon which the world will bend."
 GER_mediterranian_command:0 "Mediterranian Command"
 GER_mediterranian_command_desc:0 "As if the Reich would allow the Italians to run things in the mediterranean. Or anywhere for that matter..."
 GER_Feuerzauber:0 "Feuerzauber"
 GER_Feuerzauber_desc:0 "Officially send a German military mission to Spain, communism can not win in Iberia. Our advisors will turn Franco's peasants into an army."
 GER_feuerzauber_auto_on:0 "Feuerzauber: Standing Orders"
 GER_feuerzauber_auto_on_desc:0 "Order the Legion Condor's supply runs to Spain to continue without further instruction from Berlin."
 GER_feuerzauber_auto_on_tt:0 "§YOperation Feuerzauber§! will §Gautomatically restart§! each time it ends, for as long as it can be taken.\nIf it is not running now, it §Gstarts immediately§!."
 GER_feuerzauber_auto_off:0 "Feuerzauber: Cancel Standing Orders"
 GER_feuerzauber_auto_off_desc:0 "Return control of the supply runs to Spain to Berlin."
 GER_feuerzauber_auto_off_tt:0 "§YOperation Feuerzauber§! will §Rno longer restart automatically§!. A run already under way will still finish."
 GER_BREAK_THE_REDS:0 "Break the Reds"
 GER_BREAK_THE_REDS_desc:0 "Throw resources into Spain, make sure that Franco gets everything he needs. The Reds can not be allowed a victory in Iberia."
 GER_lessons_of_the_civil_war:0 "Lessons of the Civil War"
 GER_lessons_of_the_civil_war_desc:0 "The Heer has learnt a lot in Spain, submarine operations have been tested, tanks have been battling and the importance of air missions have been proven. All of the finest military thinker's theories have either been proven or disproven and new concepts have been invented. Empirically, the Reich has come out on top."
 GER_modern_fighter:0 "Modern Fighter"
 GER_modern_fighter_desc:0 "Use the knowledge..."
 GER_modern_cas:0 "Modern CAS"
 GER_modern_cas_desc:0 "And you will grow stronger than anyone can possibly imagine..."
 GER_stuka_primacy:0 "Dive Bomber Primacy"
 GER_stuka_primacy_desc:0 "Dive Bombers are the future"
 GER_fighter_primacy:0 "Fighter Primacy"
 GER_fighter_primacy_desc:0 "Fighters can interrupt any enemy air mission and make sure that the Luftwaffe is able to carry out its missions."
 GER_vengeance_weapons:0 "Vengeance Weapons"
 GER_vengeance_weapons_desc:0 "Revenge has never gone more ballistic"
 GER_vengeance_weapons2:0 "V-3 Project"
 GER_vengeance_weapons2_desc:0 "Revenge has never gone more ballistic"
 GER_heisenberg_device:0 "Heisenberg Device"
 GER_heisenberg_device_desc:0 "With the Americans, the British and the Commies all rushing to finish the bomb. The Reich must make sure that it is not lagging too far behind, with a weapon of that power, world domination lays before our feet. If world domination is not made possible by the Army, it will be made possible by splitting the atom and disintegrating our enemies."
 GER_jet_engine:0 "Jet Engine Prototype"
 GER_jet_engine_desc:0 "It seems that Luftwaffe researchers have theorized something that will prove useful for military application..."
 GER_jet_engine2:0 "Jet Engine Finalized"
 GER_jet_engine2_desc:0 "Even though the Luftwaffe may not have the numbers, it will have the most modern aircraft."
 GER_panzergrenadiers:0 "Panzergrenadiers"
 GER_panzergrenadiers_desc:0 "The Core of the Reich's new mobile army."
 GER_Purge_the_Wehrmacht:0 "Purge the Wehrmacht"
 GER_Purge_the_Wehrmacht_desc:0 "While most of the officer corps is very skilled, most of it is very old fashioned and its beliefs are not in line with the Regime's. These dissidents must be silenced so that the Party can take control of the army."
 GER_OBKW:0 "Oberkommando der Wehrmacht "
 GER_OBKW_desc:0 "Consolidate our power and authority by installing an organization which directs operations between all the three branches of the armed forces."
 GER_hitlers_lapdogs:0 "Hitler's Lapdogs"
 GER_hitlers_lapdogs_desc:0 "Since when is having a bunch of yes-sayers and kissmouths be a bad thing?"
 GER_field_replacement_and_training:0 "Field Replacement and Training"
 GER_field_replacement_and_training_desc:0 "The old must be replaced with the new at some point, and when it is, the new needs to be as good as the old."
 GER_scavenge_to_survive:0 "Scavenge to Survive"
 GER_scavenge_to_survive_desc:0 "Scavenge the battlefields, scour the bodies of our fallen foes, steal their guns, their tanks and use them to make the Armed Forces even stronger."
 GER_OB_des_heeres:0 "Oberkommando des Heeres"
 GER_OB_des_heeres_desc:0 "The Oberkommando des Heeres, which was in a constant rivalry with the Oberkommando der Wehrmacht, was primarily in charge for one theatre, the most crucial theatre of the war: The Eastern Front."
 GER_Osttruppen:0 "Osttruppen"
 GER_Osttruppen_desc:0 "New manpower has been made readily available for the Army in the newly liberated countries in the East. The Oberkommando des Heeres has also become a much more formidable fighting force on the Eastern Front."
 GER_WE_DIE_IN_STALINGRAD:0 "Death in Stalingrad"
 GER_WE_DIE_IN_STALINGRAD_desc:0 "Death and destruction in Stalingrad, the lesson to be learned is simple, you either dig your own grave or you dig a fortress to stop the unrelenting Soviet Bear."
 GER_Teutonic_Crusaders:0 "Teutonic Crusaders"
 GER_Teutonic_Crusaders_desc:0 "In the same fashion as our ancestors, we shall ride forth clad in steel and defeat our enemy in the east."
 GER_ERROR_404_COMMUNISM_DETECTED:0 "The Final Crusade"
 GER_ERROR_404_COMMUNISM_DETECTED_desc:0 "The final crusade against communism: either the German army is successful in the East, or Europe will face an eternity of darkness behind an iron curtain..."
 GER_prepare_the_kriegsmarine:0 "Prepare the Kriegsmarine"
 GER_prepare_the_kriegsmarine_desc:0 "Wait this is a thing?"
 GER_siemens:0 "The Siemens Concern"
 GER_siemens_desc:0 "Expertise in Electromechanics will be a necessity in the war of the future. Leading theorists have already proposed the mass deployment of radios to frontline units. The enigma that was invented at the end of the Great War will surely also need improvements to its design."
 GER_naval_expansion:0 "Plan Z"
 GER_naval_expansion_desc:0 "Listen to Rader, he promises the Reich a fleet that can defeat the British. This small and humble project of his will §RONLY§! take about 10 years to complete and will definitely drain the Reich's resources completely."
 GER_hmg_primacy:0 "HMG Primacy"
 GER_hmg_primacy_desc:0 "Riflemen work in support of the HMG, the HMG forms the core of the Rifleman Squad. Thus, as a result it becomes even more lethal, and when your army happens to have access to the best HMG in the world it becomes twice as lethal."
 GER_romanian_oil_question:0 "The Romanian Oil"
 GER_romanian_oil_question_desc:0 "Wait for the DLC plz"
 GER_scrap_lufthansa:0 "Seize Lufthansa Planes"
 GER_scrap_lufthansa_desc:0 "Seize the planes that are currently used by Lufthansa. The only decision the Reich needs to make is whether or not they are supposed to be used as bombers or as transport planes."
 GER_the_steel_barons:0 "Encourage the Steel Barons"
 GER_the_steel_barons_desc:0 "The Ruhr valley has always been the dominant force of the German industry, by letting leading German Industrialists influence the country's economical decision making it will only provide great benefits for our future conflict."
 GER_curtail_the_steel_barons:0 "Control the Steel Barons"
 GER_curtail_the_steel_barons_desc:0 "The Steel Barons can't be allowed to influence the state more than what is seen as necessary, by wire-tapping their offices, blackmailing factory owners and employees and by taking control of exports and imports the German economy will be more firmly under the control of our regime."
 GER_absorb_rheinmetall:0 "Rheinmetall - Merger"
 GER_absorb_rheinmetall_desc:0 "Rheinmetall will go through with its historical merger of railway locomotive manufacturer August Borsig GmbH, thus creating Rheinmetall-Borsig AG. They would later go on to create a subsidiary known as Alkett, famous for production of medium tanks."
 GER_panzershiffe:0 "Panzerschiffe"
 GER_panzershiffe_desc:0 "The ships of the class, Deutschland, Admiral Scheer and Admiral Graf Spee, were all stated to displace 10,000 long tons (10,000 t) in accordance with the Treaty, but due to their heavy armament of six 28 cm (11 in) guns and lighter weight, the British began referring to the vessels as "pocket battleships"."
 GER_amphibious_focus:0 "Seebataillon"
 GER_amphibious_focus_desc:0 "The Marine-Stoßtrupp-Kompanie was formed in March 1938. It initially consisted of two infantry platoons, one engineer platoon and one weapons platoon with a total strength about 250 men. In 1940 the unit was expanded to six companies as Marine-Stoßtrupp-Abteilung. The formation participated in the occupation of Normandy and the Channel Islands."
 GER_anti_non_contact_committee:0 "Coastal Security"
 GER_anti_non_contact_committee_desc:0 "Since the Reich does not have a navy that is on par with its neighbours, it has to rely on mines to protect its waters, but it must also be able to protect its own territorial water from mines."
 GER_modular_construction:0 "Modular Construction"
 GER_modular_construction_desc:0 "Modular construction techniques incorporated during construction include constructing large segments of equipment outside the hull. These segments (dubbed rafts) are then inserted into a hull section (a large segment of the pressure hull).""
 GER_fritz_x:0 "The Fritz X"
 GER_fritz_x_desc:0 "The Fritz X was the most common name for a German guided anti-ship glide bomb used during World War II. Fritz X was the world's first precision guided weapon deployed in combat and the first to sink a ship in combat."
 GER_carrier_focus:0 "Carrier Focus"
 GER_carrier_focus_desc:0 "Carriers are undeniably the ship of the future. The royal navy's number superiority would not matter if we can strike them from afar."
 GER_battleship_focus:0 "Battleship Focus"
 GER_battleship_focus_desc:0 "Battleships have been the backbone of any navy for a while now. Bigger and faster battleships will give us the edge against the British."
 GER_submarine_training_school:0 "Submarine Training Schools"
 GER_submarine_training_school_desc:0 "By establishing academies where we can train new personnel for our submarines, new tactics and improvements to current submarines can be suggested."
 GER_seize_private_iron_ore:0 "Seize Private Iron Ore"
 GER_seize_private_iron_ore_desc:0 "We must seize the private iron ore fields held by the Steel Barons if we ever hope to achieve autarky within steel."
 GER_mission_to_iberia:0 "Mission to Iberia"
 GER_mission_to_iberia_desc:0 ""
 GER_break_the_reds:0 "Break the Reds"
 GER_break_the_reds_desc:0 ""
 ger_medium_tank_1936:0 "Panzer III Ausf.A"
 ger_mechanised_infantry:0 "Basic German Halftracks"
 GER_operation_panzerfaust:0 "Operation Panzerfaust"
 JAP_four_days_of_snow_and_blood:0 "Four Days of Snow and Blood"
 JAP_four_days_of_snow_and_blood_desc:0 "After the Aizawa incident of late -35, the military tribunal was held under the First Infantry Division in Tokyo, whose commander has Kōdōha alligned beliefs. The trial thus became a vehicle by which the Kōdōha was able to denounce the Tōseiha and portray Aizawa as a selfless patriot. Now the First Infantry Division was ordered from Tokyo to Manchuria. But the men of the First have decided to act."
 JAP_cooperate_with_zaibatsus:0 "Co-operate with the Zaibatsus"
 JAP_cooperate_with_zaibatsus_desc:0 "Rather than the confrontational approach of the Kōdōha, which wanted to bring about the Shōwa Restoration through violence and revolution, we seek reform by working within the existing system. The Tōseiha faction sees that future wars are total ones. Thus we need to maximize Japan's industrial and military capacity with the cooperation of bureaucracy and the zaibatsu conglomerates."
 JAP_favor_nissan:0 "Favor Nissan"
 JAP_favor_nissan_desc:0 "Nissan is a new and rapidly expanding zaibatsu known for real estate, insurance and more recently also automobiles. They have recently opened the first powered car assembly line in Japan, and are currently in process of heavily investing into developing Manchuria. We should support their endeavors."
 JAP_favor_mitsubishi:0 "Favor Mitsubishi"
 JAP_favor_mitsubishi_desc:0 "Mitsubishi is a venerable zaibatsu mainly focused on shipping, mining and heavy industries. They have also pioneered military aviation in Japan, and have the facilities to rapidly increase aircraft production if state provides them additional contracts."
 JAP_merge_private_railways:0 "Unify Private Railway Companies"
 JAP_merge_private_railways_desc:0 "We should attempt to unify various private railway companies into larger more efficient ones. One such proposed example is Tokyo Kyuko Electric Railway, which would be a conglomeration of various smaller private railway companies into the area. By uniting various companies under regional blocks, we can make better use of the infrastructure for our own needs."
 JAP_expand_kobe_steel_works:0 "Expand Kobe Steel Works"
 JAP_expand_kobe_steel_works_desc:0 "With the untapped iron ore deposits in manchuria being exploited to a further degree by each passing year, it is of great importance to expand domestic steel production to fuel the growth of our economy."
 JAP_placate_the_military:0 "Placate the Military"
 JAP_showa_statism:0 "Shōwa Statism"
 JAP_showa_statism_desc:0 "The idea of Kokutai demands every Japanese man to give their all to the imperial state. The political parties have proven to be self-serving and a threat to national security with their bowing to the Western Powers and mishandling of the Great Depression. On the other hand, the military has shown itself to exemplify the spirit of the kokutai through its brave and successful adventures in Manchuria. Thus, the military is the most competent force to steer Japanese politics under the Emperor."
 JAP_militarize_nippon_electric:0 "Take Over Nippon Electric"
 JAP_militarize_nippon_electric_desc:0 "The Mita and Tamagawa plants of the Nippon Electric Corporation will be placed under military control, with direct supervision by military officers. We will refocus their considerable production and research capacity for more useful needs than decadent luxuries."
 JAP_new_order_in_asia:0 "Framework for a New Order in Asia"
 JAP_new_order_in_asia_desc:0 "It is time to start to consider the possibility of bringing rest of Asia under the Japanese order. Fumimaro Konoe is a man who is more adamant than most about bringing fractured China to the light of Japanese civilization."
 JAP_liaison_conference:0 "Liaison Conferences"
 JAP_proclaim_new_national_structure:0 "Proclaim the New National Structure"
 JAP_proclaim_new_national_structure_desc:0 "Yonai has refused to align Japan with the European Axis even as their victories seem unending. In response, the army minister Shunroku Hata resigned and the army refused to nominate a replacement. Konoe will be appointed as prime minister again, and is set to merge all existing political parties to the Imperial Rule Assistance Association and mobilize Japan for a final victory over the Chinese."
 JAP_preserve_greater_shintoism:0 "Preserve Greater Shintoism"
 JAP_preserve_greater_shintoism_desc:0 "Whilst the state heavily supports the proliferation of Shinto shrines as a patriotic moral tradition, we should keep from further ideologizing the worship at the shrines and let the priests focus on local matters."
 JAP_militarize_shintoism:0 "Militarize Shintoism"
 JAP_militarize_shintoism_desc:0 "We need to utilize the characteristics of Shinto to further patriotic dedication. For example creating a network of shrines dedicated to soldiers killed in battle. Founding the Institute of Divinities will take care of harmonizing the shrines for our needs."
 JAP_umi_yukaba:0 "Umi Yukaba"
 JAP_umi_yukaba_desc:0 ""At sea be my body water-soaked, On land be it with grass overgrown, Let me die by the side of my Lord, Never will I look back.""
 JAP_umi_yukaba_no_china_land_mastery_tt:0 "No China War Scenario: Add §G130§! £doctrine_mastery §HLand Mastery§!"
 JAP_extra_super_duralumin:0 "Extra Super Duralumin"
 JAP_extra_super_duralumin_desc:0 "Sumitomo Metal has recently developed a revolutionary aluminum alloy with excellent mechanical properties: good ductility, high strength, toughness, and good resistance to fatigue. Dubbed Extra Super Duralumin, we should adopt this invention for our fighter aircraft production."
 JAP_japanese_rocketry:0 "Japanese Rocketry"
 JAP_cement_kantai_kessen:0 "Cement Kantai Kessen"
 JAP_cement_kantai_kessen_desc:0 "Our doctrine of single decisive engagement is invincible. With the the firepower of our battleships, the torpedoes of our screens and the striking power of our naval aviation we will win any engagement as decisively as Tsushima in 1905."
 JAP_ascension_of_the_fleet_faction:0 "Ascension of the Fleet Faction"
 JAP_ascension_of_the_fleet_faction_desc:0 "During the last years the Fleet faction's influence has steadily increased due to the escalating militarist takeover of the armed forces. With the hawks in control of the Imperial Navy, we will allow arms control agreements negotiated by members of the Treaty faction to expire and pressure the civilian government for an increase in naval spending."
 JAP_asia_for_asiatics:0 "Asia for Asiatics!"
 JAP_asia_for_asiatics_desc:0 "With the fall of the last of Western colonial holdings in Asia, our dream of united Asia under our leadership has become a reality. Tenno Heika Banzai!"
 JAP_development_of_philipines:0 "The Development of Philipines"
 JAP_development_of_philipines_desc:0 "Japanese corporations will take over local industry and turn them to serve the needs of the empire. The local population will serve well as forced laborers to fortify the islands against potential allied invasion and to fuel the ever expanding needs to construct infrastructure on our far flung conquests."
 JAP_occupation_of_philipines:0 "The Occupation of Philipines"
 JAP_occupation_of_philipines_desc:0 "By offering an Asian alternative to Western colonial rule, the locals will treat us as liberators. The Kempeitai will keep any dissenters at bay. We will also start educating the locals on Japanese language and way of life."
 JAP_occupation_of_india:0 "Azad Hind"
 JAP_occupation_of_india_desc:0 "With the fall of the allied armies in the continent, Bose's dream of a free India has finally come true. However, this dream will come at cost, which the Indians will pay to us."
 JAP_azad_hind:0 "Equip the Indian National Army"
 JAP_azad_hind_desc:0 "Subhas Chandra Bose is the ideal man to lead an army of indian rebels to support our forces. Give me blood! I will give you freedom!"
 JAP_development_of_indonesia:0 "The Development of Southern Resource Area"
 JAP_development_of_indonesia_desc:0 "Japanese corporations will take over local industry and turn them to serve the needs of the empire. The local population will serve well as forced laborers to fortify the islands against potential allied invasion and to fuel the ever expanding needs to construct infrastructure on our far flung conquests."
 JAP_occupation_of_indonesia:0 "The Occupation of Southern Resource Area"
 JAP_occupation_of_indonesia_desc:0 "By offering an Asian alternative to Western colonial rule, the locals will treat us as liberators. The Kempeitai will keep any dissenters at bay. We will also start educating the locals on Japanese language and way of life."
 JAP_hakko_ichiou:0 "Hakkō Ichiu"
 JAP_hakko_ichiou_desc:0 "We have the divine right to unify the world under one emperor. As a first step we shall unify asia under a new order led by the Yamato people. "I shall cover the eight directions and make them my abode"."
 JAP_co_prosperity_sphere:0 "Greater East Asia Co-Prosperity Sphere"
 JAP_co_prosperity_sphere_desc:0 "With Europe on the brink of another World War, the time of Western imperialism will come to an end. The peoples of Asia must band together and stand as a strong, unified continent, under our leadership."
 JAP_special_naval_landing_force:0 "Special Naval Landing Force"
 JAP_expand_imperial_navys_landing_forces:0 "Expand Imperial Navy Landing Forces"
 JAP_expand_imperial_navys_landing_forces_desc:0  "Our navy has the required experience to conduct landings and is able to provide the adequate support for the landings. Thus we should reinforce the navy's land forces."
 JAP_amphibious_assault_ships:0 "Amphibious Assault Ships"
 JAP_amphibious_assault_ships_desc:0 "Our army is planning to construct a fleet of landing craft depot ships with well decks to launch large Toku Daihatsu-class landing craft. In addition the vessels will have a flight deck which allows them to also carry small aircraft to scout and support the landings."
 JAP_expand_imperial_army_shipping_section:0 "Expand Imperial Army Shipping Section"
 JAP_anti_armor_effort:0 "Anti-Armor Effort"
 JAP_expand_the_kempeitai:0 "Strengthen Kempeitais Grip"
 JAP_expand_the_kempeitai_desc:0 "The Kempeitai has proven its worth in keeping the vast territories we have conquered under our strict grip. They should be given more resources and autonomy."
 JAP_light_bomber_effort:0 "Light Bomber Effort"
 JAP_the_hump_placeholder:0 "Hump of Himalayan Mountains"
 JAP_exploit_iron_and_coal_of_mengjiang:0 "Exploit the Iron and Coal of Mengjiang"
 JAP_exploit_iron_and_coal_of_mengjiang_desc:0 "The lands of inner Mongolia are still untapped. Based on our research there are massive deposits of both coal and steel located in Mengjiang. We should invest in opening new mines in the area, and exporting the ore and coal directly to Japanese furnaces."
 JAP_focus_investments_on_resource_extraction:0 "Focus Investments on Resource Extraction"
 JAP_jap_settlement:0 "Japanese Settlement"
 JAP_jap_settlement_desc:0 "We will aim for the migration of one million Japanese families to Manchuria in next 20 years. We will give young, land-poor farmers of from our mainland a new start in the vast untamed lands. The local population can be relocated to second class areas."
 JAP_dowa_automobile_company:0 "Found the Manchurian Automotive Company"
 JAP_dowa_automobile_company_desc:0 "We will absorve all existing Manchurian automotive industry into a one massive combine under the Manchurian Industrial Development Company."
 JAP_factories_along_transport_routes:0 "Factories Along Transport Routes"
 JAP_factories_along_transport_routes_desc:0 "Manchuria has a robust railroad network and a large population, which allows the area to support massive increase in industrial output with relatively minor improvements in infrastructure."
 JAP_focus_investments_on_machine_building:0 "Focus Investments on Machine Building"
 JAP_rapid_development_of_strategic_industries:0 "Rapid Development of Strategic Industries"
 JAP_rapid_development_of_strategic_industries_desc:0 "Aikawa argues that the automotive industry and aircraft industry will both require a large number of subcontractors, few of whom were present in Manchukuo. To enable these strategic industries, we need to develop all the necessary machinery industries simultaneously."
 JAP_found_mangyo:0 "Found Mangyō"
 JAP_found_mangyo_desc:0 "Manchuria Industrial Development Company or Mangyō is one Nobusuke Kishi's public-private corporations to bring investment to Manchuria. The company has attracted a staggering 5.2 billion yen in private investments, making it by far the largest capital project in the Japanese Empire. The man handpicked by Kishi to lead the Mangyō is his distant relative and old classmate, Nissan founder Ayukawa Yoshisuke."
 JAP_new_mantetsu_subsidiaries:0 "New Mantetsu Subsidiaries"
 JAP_new_mantetsu_subsidiaries_desc:0 "The economic success of South Manchuria Railway or Mantetsu has been mostly because of its expansion to other sectors of business. We will continue expanding to new, more advanced sectors of production based on the already developed industries."
 GER_AI_BEHAVIOR:0 "@GER Germany"
 JAP_AI_BEHAVIOR:0 "@JAP Japan"
 JAP_prepare_for_expansion:0 "Prepare for Expansion"
 JAP_prepare_for_expansion_desc:0 "It is our destiny to expand across the Asian plains and waves. The army has laid out a plan for this expansion, but for us to achieve this we must expand our military capacities."
 GER_reintegrate_luxemburg_and_alsace_lorraine:0 "Reintegrate Luxemburg and Alsace-Lorraine"
 GER_reintegrate_luxemburg_and_alsace_lorraine_desc:0 "With our successful reconquest of historically German areas, we can now begin the process of their reintegration into the [Root.GetName]. Their populations must be allowed to do their patriotic duty for the fatherland."
 JAP_invite_japanese_settlers:0 "Invite Japanese Settlers"
 JAP_invite_japanese_settlers_desc:0 "By offering people to settle in Manchuria, we can make sure that Manchuria becomes one step closer to being integrated in the Greater Asian Co-Prosperity Sphere"
 JAP_send_japanese_investors:0 "Japanese Investment in Manchuria"
 JAP_send_japanese_investors_desc:0 "Both the Japanese State and the Zaibatsus in Japan should invest capital in the promising land of Manchuria. Japan is desperate for resources and Manchuria has a rich untapped potential that can be exploited by the Empire of Japan."
 JAP_pacify_the_countryside:0 "Pacify the Countryside"
 JAP_pacify_the_countryside_desc:0 ""
 JAP_pacify_the_countryside2:0 "Pacify the Countryside"
 JAP_pacify_the_countryside2_desc:0 "Order the Kwantung army to dispatch the Rebels within Manchuria, this will come at a tremendous cost as we will have to move army elements into Manchuria and send support to local divisions."
 JAP_divine_mandate:0 "The Mandate of Heaven"
 JAP_divine_mandate_desc:0 "With our conquest of China, we can now press our claim to the Manchurian throne and depose our puppet emperor. Hirohito emperor of the land of the rising sun and the land of the Dragons."
 GER_wunderwaffe_name:0 "Heisenberg Device"
 GER_wunderwaffe_name_desc:0 "Upon completion Germany will gain access to §Ynuclear reactors§! and §Yatomic bombs§!.Every month the project will get boosted by §Y2%§! provided that Germany has access to heavy water in Norway.If Germany or Slovakia research §Yatomic research§! or §Ynuclear reactors§! the project will be boosted by §Y10%§! "
 JAP_resistance_to_reform:0 "Resistance to Reform"
 JAP_resistance_to_reform_desc:0 "The Japanese ruling body is very volatile, politicians can be murdered for speaking against certain factions and certain members of the military. Any change that is made must be made with caution, as to not upset one of the many factions that strive for influence within the government."
 GER_drug_fueled_rage:0 "Drug Fueled Rage"
 GER_drug_fueled_rage_desc:0 ""
 GER_opened_ww1_stockpiles_idea:0 "Streamlined Gun Production"
 GER_opened_ww1_stockpiles_idea_desc:0""
 GER_invasion_preparations:0 "Preparations for the Invasion of Poland"
 GER_invasion_preparations_desc:0 "The Poles refused to back down - Danzig was an issue over which they would fight. Polish resistance to German demands strengthened after Britain and France issued their guarantees to defend Poland's independence in March 1939. In April, Hitler ordered preparations for the invasion of Poland."
