 GER_triumph_france9:0 "Fall Gelb 9"
 GER_triumph_france10:0 "Fall Gelb 10"
 GER_partisans:0 "Slovak Partisans"
 GER_civil_war_decision:0 "Slovak National Uprising"
 GER_partisans_desc:0 "Slovak partisans were an anti-fascist militia formed immediately after the creation of the First Slovak Republic in 1939, to fight against Nazis and their collaborators. Men and women both fought in the ranks of partisan units, as well as Jews and Christians alike. Slovak partisans had mixed loyalties as many were deeply nationalistic and wanted a to maintain an independent Slovak Republic free of fascism, while many others were socialists who forged strong links with the Soviet Union and Soviet partisans. Slovak partisans mainly carried out acts of sabotage. Their largest anti-Nazi military engagement was the Slovak National Uprising in 1944, in which Slovak partisans were aided by the Slovak Army and Soviet partisans.§YSlovak National Uprising will happen if its after 1st of january 1942 and Soviet Union's surrender progress is under 5%§!"
