 GER_Around_maginot_focus_tt:0 "§RTHIS FOCUS WILL SHOW HOW MUCH INDUSTRY YOU WILL GAIN IF YOU CLICK§! §GAROUND MAGINOT DECISION§!§R FOR EVERY MONTH YOU WAIT AFTER 1ST OF JULY 1939 YOU GAIN 2 CIVILIAN AND 2 MILITARY FACTORIES UP TO 20 EACH. TO GAIN THE MAXIMUM INDUSTRY YOU MUST DECLARE AFTER 1ST OF APRIL 1940.§!"
 GER_Around_maginot_tt:0 "§RBEFORE CLICKING THIS DECISION, CHECK THE AROUND MAGINOT FOCUS, THAT WILL BE THE EXTRA INDUSTRY YOU WILL GAIN BY DECLARING THE MOMENT YOU CLICK. THE MAXIMUM INDUSTRY YOU CAN GET IS 80 IN TOTAL, YOU WILL NEED TO WAIT 5 MONTHS TO GET THE MAXIMUM AMOUNT OF EXTRA INDUSTRY ( MAXIMUM AMOUNT GAINED IS ON FEBRUARY 1ST 1940 )§!"
