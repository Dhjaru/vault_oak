 GER_EQUIPMENT_VERSION_9:0 "Ausf.M"
 GER_EQUIPMENT_VERSION_11:0 "Ausf.N"
 GER_mechanized_equipment_1:0 "Sonderkraftfahrzeug 250"
 GER_mechanized_equipment_1_short:0 "Sd.Kfz.250"
 GER_mechanized_equipment_1_desc:0 "The Sd.Kfz. 250 A small armored half track that can perform auxiliary missions while accompanying tanks on the offensive. These were to be used chiefly for scouting, as mobile HQs, command, radio vehicles and as forward observer vehicles. They could only carry a Halbgruppe (half platoon)."
 GER_mechanized_equipment_2:0 "Sonderkraftfahrzeug 251"
 GER_mechanized_equipment_2_short:0 "Sd.Kfz. 251"
 GER_mechanized_equipment_2_desc:0 "The Sdkfz. 251 half-track was an armored fighting vehicle designed and first built by the Hanomag company during World War II, based on their earlier Sdkfz. 11 vehicle."
 GER_mechanized_equipment_3:0 "Gepanzerter Mannschaftstransportwagen 'Kätzchen'"
 GER_mechanized_equipment_3_short:0 "MTW Kätzchen"
 GER_mechanized_equipment_3_desc:0 "The Kätzchen was a German armoured personnel carrier of late World War II. The Auto-Union delivered two prototypes during 1944-45. The hull's shape was similar to the hull of the Panzerkampfwagen Tiger II, but much smaller. The vehicle had a front wheel drive with five or six overlapping steel road wheels, possibly resembling the never-built E-25 "replacement tank"'s suspension system in appearance. Power was provided by a Maybach HL50 P engine."
 jap_mechanised_infantry:0 "Type 98 So-Da"
 JAP_mechanized_equipment_1:0 "Type 98 So-Da"
 JAP_mechanized_equipment_1_short:0 "So-Da"
 JAP_mechanized_equipment_1_desc:0 "The Type 98 So-Da was an armored personnel and ammunition carrier used by the Imperial Japanese Army. Its hull had an open top and the "flatbed" in back had a double door at the rear. The flatbed could be covered wiith a tarp over the three rail supports. It could carry 6 passengers along with a crew of up to 6, and had a max speed of 45 kph."
 JAP_mechanized_equipment_2:0 "Type 1 Ho-Ha"
 JAP_mechanized_equipment_2_short:0 "Ho-Ha"
 JAP_mechanized_equipment_2_desc:0 "The Type 1 Ho-Ha was developed in 1941 as a result of a request from the army for a vehicle that could be used to transport a squad of infantry to the battlefield protected from enemy small arms fire. Despite experiences of the Second Sino-Japanese War, armored personnel carriers were viewed as too slow compared to wheeled trucks and there was not much effort for their development in the army. It could carry 13 passengers and had a max of 8mm armor."
 JAP_mechanized_equipment_3:0 "Type 1 Ho-Ki"
 JAP_mechanized_equipment_3_short:0 "Ho-Ki"
 JAP_mechanized_equipment_3_desc:0 "The Type 1 Ho-Ki was developed in 1942 as a result of a request from the army for a fully tracked heavy armored artillery tractor which could also serve as a personnel transport. It had up to 6mm of armor, and could carry 13 passengers. Rather than having a back door for troops to quickly exit, it had three side doors. It had a max speed of 42 kph."
 GER_infantry_equipment_0_desc:0 "Basic small arms developed before and during the Great War.\n Includes §HGewehr 98§!, and §HMG 15nA§!"
 GER_infantry_equipment_1_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs.\n Includes §HKarabiner 98k§! and §HMG 34§!"
 GER_infantry_equipment_2_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Modernized to include a great number of sub-machineguns and anti-tank rifles.\n Includes §HKarabiner 98k§!, §HMP 38§!, and §HMG 34§!"
 GER_infantry_equipment_3_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further modernized to include personal semi-automatic rifles and improved sub-machineguns.\n Includes §HKarabiner 98k§!, §HGewehr 43§!, §HMKb 42§!, and §HMG 42§!"
 GER_infantry_equipment_4_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further modernized to include improved personal Assault Rifles and anti-tank rockets.\n Includes §HSTG 45§!, and §HMG 45§!"
