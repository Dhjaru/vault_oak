 GER_danzig_info_tt:0 "If the decision is taken during or after §YSeptember 1939§!, "§YBlitzkrieg!§!" will last an additional §G30§! days."
 GER_fustung_tt:0 "Will give §YLevel 5 Forts§! along the entire §YVistula River§! such as near §YWarsaw§!.\nWill give §YLevel 5 Forts§! along the entire §YRhine River§! such as near §YFrankFurt§!.\n\nIn all §YCore Non-capital 20 Victory Point or higher Cities §!gain §YFestungsstadt§! and set §YLevel 7 Forts§!(Including Stronghold Networks).\n\n§YFestungsstadt:§!\nAir Mission Efficiency: §R-50%§!\nGround Attack factor: §R-25%§!\nEntrenchment Speed: §G+25%§!\nDivsion Defense: §G+25%§!\n\nIn §YBerlin§! and all §Ysurrounding provinces§! set §YLevel 8 Forts§!."
