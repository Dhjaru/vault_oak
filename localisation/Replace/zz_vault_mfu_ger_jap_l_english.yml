 GER_race_for_baku_oil_tt:0 "If by the end of our offensive we control §YBaku§!, oil wells will not be destroyed.\nIf by the end of our offensive Soviets control §YKharkov§!, §YStalino§!, §YRostov§! and §YKrasnodar§!, oil wells will not be destroyed.\nOtherwise, §YBaku§! will §Gpermanently lose§! 60% of its oil output"
