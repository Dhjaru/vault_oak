 JAP_pacific_war:0 "The Pacific War: §OMechanics§!"
 JAP_pacific_war_explanation_category:0 "Southern Expansion"
 JAP_pacific_war_explanation_category_desc:0 "\n\n£decision_topbar_JAP_strike_south_doctrine£\n\n\n\nIf our nation is to survive, then, if we are to listen to our military leadership, we have to expand. The only way our resource deprived nation can even hope to stand against the West is by expanding our Co-Prosperity Sphere and protecting the nations of Asia from the decadent western Imperialist and capitalists. They think themselves so wise that they can chokehold us with trade deals and institutions with no legal legitimacy. We will show them that nobody commands the Emperor, and that his vision and will is divine!\n\nThe National Spirit §YThe Island Hopping Campaign§! is modified by capturing the following islands:\n\n[ROOT.GetGuamController]\n[ROOT.GetMidwayController]\n[ROOT.GetWakeController]\n[ROOT.GetHawaiiController]\n[ROOT.GetCarolineController]\n[ROOT.GetIwoJimaController]\n[ROOT.GetSaipanController]\n[ROOT.GetOkinawaController]\n[ROOT.GetMarshallController]\n[ROOT.GetBurmaController]\n[ROOT.GetSingaporeController]\n[ROOT.GetGilbertController]\n[ROOT.GetSolomonController]\n[ROOT.GetPapuaController]\n[ROOT.GetPalauController]\n[ROOT.GetTaiwanController]\n[ROOT.GetSiamController]\n[ROOT.GetCambodiaController]\n\n§LIn addition, if Japan conquers these islands it will increase the modifiers on the Atlantik Wall, making it harder for the Allies to invade mainland Europe. Respectively, the Allies taking, or keeping control of these states will decrease the modifiers on the Atlantic Wall."
 JAP_secure_china:0 "Secure China"
