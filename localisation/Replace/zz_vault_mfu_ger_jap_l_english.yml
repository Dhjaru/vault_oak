 JAP_ija_general_staff_original_enchanced_defense:0 "Imperial Army General Staff"
 JAP_ija_general_staff_original_enchanced_defense_desc:0 "Surrender or retreat is rarely an option, at least for the officers and commanders of the IJA. The average infantryman is forced to strictly follow his commanding officer's orders and not their own instincts in the heat of battle; lest they receive their due corporal punishment for “disobeying” orders. This leads to the common situation of soldiers refusing to take any initiative during the heat of battle, with the CO oftentimes refusing to retreat or stop a costly attack that will likely continue for far too long."
