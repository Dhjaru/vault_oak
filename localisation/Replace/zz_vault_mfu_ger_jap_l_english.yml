 GER_arbeitseinsatz_idea_tt:0 "Gains National Spirit §YArbeitseinsatz§!, which grants (Political Power Gain: §R-10%§!, Recruitable Population: §Y0.10%§!, £prod_eff!Production Efficiency Growth: §G+10.00%§!, Required Garrisons: §R+10%§!, Resistance Damage to Garrisons §R+10%§!, §YAir Base§! construction speed: §G+50%§!, §YNaval Base§! construction speed: §G+10%§!, §YRocket Site§! construction speed: §G+10%§!, §YRadar Station§! construction speed: §G+10%§!, §YNuclear Reactor§! construction speed: §G+10%§!, §YRailways§! construction speed: §G+30%§!, §YSupply Hub§! construction speed: §G+30%§!, §YInfrastructure§! construction speed: §G+10%§!)"
