 GER_ostwall:0 "Ostwall"
 GER_ostwall_desc:0 "Despite our gains in the East, we must ensure that if the tide turns we can hold off the enemy advance. We should build a line of fortifications, the Panther-Wotan stellung, along the Dnieper river, from the Black Sea to the Baltic."
 GER_ostwall_forts:1 "Place §YLand Forts§! along the Dnieper river to the Baltic, in each of the following states that are fully controlled by your faction:\n"
 GER_ostwall_forts_2:0 "§YTartu§!\n§YPskov§!\n§YNevel§!\n§YVitebsk§!\n§YMinsk§!\n§YBobruysk§!\n§YMozyr§!\n§YKiev§!\n§YCherkasy§!\n§YDnipropetrovsk§!\n§YZaporozhe§!\n"
 GER_ostwall_tt:0 "Under control of a member of our faction.\n"
 GER_panzer_division_tt:0 "Activates four §YPanzer Divisions§! in Berlin with §Y25% Equipment§!.\n"
 GER_osttruppen_tt:0 "Allows the §YGerman Reich§! to deploy cheaper §YInfantry§!, §Ralthough they aren't as effective in combat...§!\n"
 GER_Teutonic_Crusaders_tt:0 "Adds §G150§! §YTiger Tanks§! and §G100§! §YPanzerjäger Elefant§! to the stockpile.\n"
 GER_disorganized_industry_tt:0 "Mobilizing the Reich will eventually trigger the national spirit §RDisorganized Industry§!, this can be removed by going further down the §YGerman focus tree§!. Although, it does require that you conquer most of §YEurope§! and that you go to war with the §YSoviets§!.\n"
 GER_volksturm_tt:0 "Mobilizing the Reich's citizens who have before been seen as unfit for service within the Wehrmacht. This §YNational Focus§! unlocks the £decision_icon_small to recruit Volksturm divisions.\n"
 GER_scorched_earth_tt:0 "Unlocks £decision_icon_small to destroy the infrastructure in some of our occupied territories and in parts of §YGermany§!.  "
 GER_panzer_shrek_tech:0 "Panzerfaust"
 GER_cheaper_last_stand_tt:0 "Unlocks a new §YLast Stand§! ability which is cheaper in terms of command power, and doesn't cause a loss of §YWar Support§!."
 GER_schacht_prison:0 "This action will send §HHjalmar Schacht§! to prison, thus making him unavailable as an advisor.\n"
 GER_drang_nach_osten_tt:0 "We are committed on a crusade against §YBolshevism§! and §YCommunism§!. It will be wiped out from the earth and no trace of it will be left behind. A great living space will be created for Germans in the east, and the vast riches of Russia will be secured for the Reich.\n"
 GER_winter_of_1941_tt:0 "Our soldiers have been freezing to death in the relentless and merciless cold §RRussian Winter§!, this can never happen again. No one could have prepared us for a winter like that of the one during 1941, it is as if god himself wants us to fail in Russia. To succeed we must have adequate equipment for our soldiers, with warm hats, insulated clothes and sturdy boots. This of course, will come at a cost."
 GER_finalized_command_tt:0 "Will provide a §G10%§! Defense or Attack Buff against the §YSoviet Union§! depending on your choice in the focus tree."
 GER_decision_focus_tt:0 "This focus is unlocked by completing the matching £decision_icon_small §Ydecision§! under §YForeign Policy§!. These focuses are merely graphical, and are just meant to be a tracker of your progress."
 GER_atlantikwall_tt:0 "Places §YLevel 5 Coastal Forts§! along the Atlantic Coast and §YLevel 3 Static Anti-Air§!, in each of the following states that are fully controlled by your faction:\n"
 GER_seize_foreign_assets_tt:0 "Removes §Y7 Military Factories§! and §Y11 Civilian Factories§! in occupied territories."
 GER_bismarck_and_tirpitz_tt:0 "Unlocks a £decision_icon_small §HDecision§! within the §HArmy Buildup Category§! to lay down the §YBismarck§!, her sister ship the §YTirpitz§!, and the §YGraf Zeppelin§!."
