 germany.701.t:0 "Der Krieg ist verloren."
 germany.701.d:0 "Germany has lost. Berlin has fallen and the Führer fought bravely against the Judeo-Bolsheviks until his last breath. Now, the Allied Powers circle like vultures and demand us an unconditional surrender. However, we could persuade the Western Allies into joining forces with us against the Bolsheviks, but we will have to surrender to their demands of liberating all of the land claimed by the Reich."
 germany.701.a:0 "Agree to the unconditional surrender..."
 germany.701.b:0 "Send the Anglo-Americans an offer they cannot reject."
 germany.702.t:0 "An offer from the Reich!"
 germany.702.d:0 "The Germans came up with a counter-offer! They will liberate all occupied land and renounce all claims prior to the Remilitarization of the Rhineland. However, they ask us to aid them in their war against the Soviet Union. This move could prevent a Cold War that's right around the corner, and liberate all of Eastern Europe, whose independence was taken away by the Communists."
 germany.702.a:0 "We will not betray the Soviet Union. Whatever the cost may be..."
 germany.702.b:0 "Launch Operation Unthinkable!"
