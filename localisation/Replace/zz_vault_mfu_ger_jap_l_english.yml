 GER_afrika_campaign:0 "Afrika Campaign"
 GER_afrika_campaign_desc:0 "The Führer has decreed that we are to aid our Italian allies in securing Northern Africa for the Axis Powers."
 GER_atlantic_wall_1:0 "Festung Europa"
 GER_atlantic_wall_1_desc:0 "The defence of Europe, it will be affected by how well Japan is doing in the east, as well as the survival of the Italian fascist regime. The following islands in the east, if held by Japan will increase the defence level of festung Europa:\n§GGuam\nMidway\nWake Island\nHawaii\nTruk Atoll\nIwo Jima\nSaipan\nOkinawa\nChichijima\nHong Kong\nSolomon Islands\nPapua\nPalau\nTaiwan.§!\nAllies will also receive additional debuffs if Japan manages to capitulate these countries:\n§YDutch East Indies\nIndia\nPhilippines\nAustralia§!."
