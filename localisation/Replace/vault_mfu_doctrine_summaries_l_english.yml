 doctrine_milestone_eng_no_mio_tt:0 "§HCompleting Milestones will unlock:§!\n§YFirst Tier§!:\n  §YAll Subdoctrines§!:\n     Completing a track grants the other Tier II tracks:\n     Track £GFX_doctrine_mastery mastery gain factor: §G+25%§!\n  Completing both §YSpirit of Infantry and Armor§!:\n     £industry_texticon!Factory Output: §G+10%§!\n     Add §G4§! Building Slots and §G4§! §YCivilian Factories§! in a selected state.\n\n§YSecond Tier§!:\n  §YAll Subdoctrines§!:\n     Completing a track grants the other Tier III tracks:\n     Track £GFX_doctrine_mastery mastery gain factor: §G+25%§!\n  Completing both §YArmor and Infantry Tactics§!:\n     Gain §G1§! Research Slot.\n     £industry_texticon!Factory Output: §G+10%§!\n  Completing both §YCombat Support Tactics§! and §YOperational Approach§!:\n     Add §G6§! Building Slots and §G6§! §YCivilian Factories§! in total.\n     Two state additions of §G3§! slots and §G3§! factories each.\n     Granted once, when the second track is completed.\n\n§YThird Tier§!:\n  §YAdvanced Infantry Tactics§! and §YAdvanced Armored Tactics§!:\n     Each creates units in the §YCapital§! depending on your choice.\n  Completing both §YAdvanced Combat Support Tactics§! and §YStrategic Emphasis§!:\n     Add §G10§! Building Slots and §G10§! §YMilitary Factories§! in total.\n     Two state additions of §G5§! slots and §G5§! factories each.\n     Granted once, when the second track is completed."
