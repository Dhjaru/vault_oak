 modern_tools:0 "Modern Machine Tools"
 modern_tools_desc:0 "Years of experience in weapon making allowed us to develop better techniques and machinery that are capable of manufacturing complex weaponry."
 radio_desc:0 "Adopting the inventions of amateur radio operators and extending the use of FM radio will reduce radio interference and allow us to find new uses for radio technology. This will add a need for some radio HQ equipment to each battalion getting the bonus."
 support_weapons3:0 "Improved Mortar and MG Ammunition"
 support_weapons3_desc:0 "New shell types like improved smoke shells and white phosphorus rounds make our mortars more useful in the more varied situations of modern war. Introduction of incendiary and armour piercing ammunition in limited quantities to our medium MG teams makes the weapon even deadlier against more broad range of targets."
 fuel_injection:0 "Fuel Injection"
 fuel_injection_desc:0 "Fuel injection is the introduction of fuel in an internal combustion engine, most commonly automotive engines, by the means of an injector. It allowed planes to nose down into a steep dive without engines problems."
