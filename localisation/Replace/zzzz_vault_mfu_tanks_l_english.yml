 ENG_new_generation_fighters:0 "A New Generation of Fighters"
 ENG_new_generation_fighters_desc:0 "The rapid development of aircraft engines is propelling the pace of fighter design to new heights; it would be foolish not to commit more resources to supporting our fighter aircraft manufacturers."
