 INS_BLITZKRIEG_DESC:0 "Three years ago, Soetardjo and his fellow petitioners asked The Hague for a conference on self-government within a decade. Last November, the royal decree came back. The answer was no.\n\nThe rebuke has done what years of agitation could not. In May, eight of the largest nationalist organizations set aside their quarrels and joined as a single federation, calling with one voice for an Indonesian parliament. The colonial administration answers as it always has, but Japan grinds further south through China, and the Indies are a long way from The Hague."
