 POR_restart_investment_into_timor:0 "Restart Investment into Timor"
 POR_restart_investment_into_timor_desc:0 "Timor has been seen as an economic burden during the Great Depression, and has as such received little support or management from us since the crisis first began. With the Japanese Nan'yō Kōhatsu development company investing in the region, perhaps it is time to resume our own investment there too."
 POR_revert_the_local_autonomy_policies:0 "Revert the Local Autonomy Policies"
 POR_revert_the_local_autonomy_policies_desc:0 "After the Rebellion of Manufahi in 1911, our colonial policy has shifted back towards using indigenous rulers as figureheads, abandoning prior attempts for further integration of the region. Perhaps we should revert this, and embrace the multiculturalism of our state."
