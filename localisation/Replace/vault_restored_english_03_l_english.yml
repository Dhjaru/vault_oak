 PHI_AI_BEHAVIOR:0 "@PHI The Philippines"
 PHI_BLITZKRIEG_DESC:0 "The United States has so far maintained its word, assisting the Philippines on their path to independence. \n\nMeanwhile, war has broken out between China and Japan, and the island nation looks on with concern towards the imperialist aspirations of their northern neighbor. \n\nAmerican reinforcements have begun to arrive to bolster the defenses, but will there be enough? Japan already smells blood in the water."
 PHI_GATHERING_STORM_DESC:0 "In 1935, The United States had finally agreed to a peaceful transition to independence over a ten year period. The Philippines is still early in the process, but is now increasingly in control of its own destiny. \n\nWill they maintain links with the US, or instead seek out foreign support to expedite the process towards freedom? The Philippines looks forward towards a prosperous future, but are there sharks already circling this fledgling nation?"
