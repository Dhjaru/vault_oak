 MAN_TSR_BLITZKRIEG_DESC:0 "Manchukuo, once a rump state carved out of the North of China by the Japanese army, clinging on to any strand of legitimacy by propping up Puyi as Emperor has now become a full member of the Greater East Asia Co-Prosperity Sphere. The question now is whether the state will stay in the hands of the Concordia Association or if it will fall in the hands of Puyi."
 MAN_TSR_GATHERING_STORM_DESC:0 "The Empire of Manchuria lies on a shaky foundation. Formed as a way for the Japanese to legitimize their rule over Manchuria in 1932, they chose to allow Puyi to be emperor over their new state.\n\nThe question now lies in if Puyi will continue to stay in the shadows while the Concordia Association and Japanese Army rule the country or if he will try and take back his power, and in turn potentially lose it entirely to a group of bandits also out for that role?"
