 ITA_mare_nostrum:0 "Mare Nostrum"
 ITA_mare_nostrum_desc:0 "Our resources are limited and we must make some painful choices, but the British Empire has us caged in the Mediterranean. Breaking out will require a navy to rival even theirs..."
 ITA_moschettieri_del_duce_desc_alt:0 "The Moschettieri della Republica is a unit of elite marksmen that have sworn to protect the Republic against any threat, whether it comes from outside the state or from within it. These exemplary soldiers could also be used to train our regular forces better, improving their effectiveness on the field."
 ITA_moschettieri_del_duce_desc_default:0 "The Duce has, for his own protection, a unit of elite marksmen under his command. While the Duce's safety is, of course, of the highest priority, these exemplary soldiers could also be used to train our regular forces better, improving their effectiveness on the field."
 ITA_moschettieri_del_duce_desc_king:0 "The King has, for his own protection, a unit of elite marksmen under his command. While the King's safety is, of course, of the highest priority, these exemplary soldiers could also be used to train our regular forces better, improving their effectiveness on the field."
 ITA_moschettieri_del_duce_desc_pope:0 "His Holiness has, for his own protection, a unit of elite marksmen under his command. While the safety of the Holy Father is, of course, of the highest priority, these exemplary soldiers could also be used to train our regular forces better, improving their effectiveness on the field."
