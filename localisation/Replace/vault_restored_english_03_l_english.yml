 ITA_russian_government_ideology_alt:0 "The Fight Against Stalinism"
 ITA_russian_government_ideology_alt2:0 "The Fight Against Those Who Divide Us"
 ITA_russian_government_ideology_default:0 "The Fight Against Those Who Oppose Us"
 ITA_russian_government_ideology_desc_alt:0 "Unfortunately, capitalism and fascism are not the only enemies we must face, the followers of the Stalinist doctrine see our government and our country as a threat to their interests, and are willing to destroy us by any means necessary. We can't wait idly for them to attack, we must be the ones to strike first!"
 ITA_russian_government_ideology_desc_alt2:0 "Unfortunately, there are entire countries who are hard at work trying to divide us. While we had little love for Stalin and his government, the current situation is not much better. Such countries pose a threat, we can't wait idly for them to attack, we must be the ones to strike first!"
 ITA_russian_government_ideology_desc_default:0 "Before we could deal with the threat that was the Stalinist doctrine, it had already been replaced by something even worse. Considering what this current leadership has proven capable of in the past, we can't wait idly for them to attack, we must be the ones to strike first!"
 ITA_slovenia_dalmatia_claims:0 "Claims on Yugoslavia"
 ITA_slovenia_dalmatia_claims_desc:0 "There is still a significant Italian population in Yugoslavia, dating back to the glory days of Venice at least. Restoring these regions to Italian rule is an important step towards recreating the Roman Empire!"
