 INS_GATHERING_STORM_DESC:0 "For over three centuries, the Dutch East Indies has been the crown jewel of the Netherlands' colonial empire. Its vast archipelago of islands, languages, and cultures has been bound together by little more than the colonial administration that rules over them.\n\nThe grip of The Hague grows less certain by the day. A population tired of exploitation grows increasingly receptive to nationalist movements. But these movements are far from united, each with a contradictory vision for Indonesia. Whether they can set aside their differences and speak as one may well decide the fate of the Indies."
