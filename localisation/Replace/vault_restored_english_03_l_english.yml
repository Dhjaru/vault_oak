 NOR_AI_BEHAVIOR:0 "@NOR Norway"
 NOR_BLITZKRIEG_DESC:0 "As the Third Reich grows in power and size, fascist elements inside Norway seem poised to take advantage of a possible German Invasion to seize control of the country and collaborate with the enemy.\n\nVidkun Quisling, an unscrupulous lackey of the Nazi Party seems to be conspiring to gain power for himself and his party Nasjonal Samling. It is time for hasty preparations to begin, and for Norway to stand together to fend off the dangers that lurk within and without. "
 NOR_GATHERING_STORM_DESC:0 "Since gaining independence from Sweden in 1905 Norway has struggled to find its political footing, and only now it's starting to show signs of political stability and recovery from the Hard Thirties.\n\nNow as its neighbors to the south start bickering war seems closer than ever, Norway must find a path for keeping its fragile independence, the Nygaardsvold cabinet is betting on neutrality and disarmament to appear as harmless as possible to Europe's great powers, but the merits of this approach remain to be seen."
