 ICE_BLITZKRIEG_DESC:0 "With the recent demands from Germany, it is becoming more clear by the day that the situation in Europe is untenable, and that an attack on Denmark is more than likely inevitable.\n\nWith that in mind, Iceland's future hangs on the brink, and she will likely need to seek protection by the Americans if she wishes to stay out of the conflict which is soon to begin."
 ICE_GATHERING_STORM_DESC:0 "Iceland has a long history of isolation and exploration. Having switched hands between her former owner Norway and her current overlord Denmark when Norway became a junior partner of Sweden in 1814, and having just received home rule in 1919.\n\nWith the Great depression striking Iceland, the situation looks bleak, and with conflict looming over the horizon, it may be time to jump ship and cut ties with the Danish once and for all."
