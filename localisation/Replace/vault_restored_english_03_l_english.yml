 LAT_GATHERING_STORM_DESC:0 "It has been two years since the May Coup and Latvia remains in an uncertain state. Kārlis Ulmanis who once served as Latvia’s Prime Minister now styles himself as dictator, with democratic supporters heavily opposing this attack on Latvian liberty. The fascist Perkonkrust organization has been agitated by the arrest of their leader; Gustavs Celmiņš, and if the dictatorship does not swiftly eradicate this threat, Latvia risks civil war.\n\nWith threats to the East and West, Latvia finds herself walking on a razor’s edge between victory and oblivion."
