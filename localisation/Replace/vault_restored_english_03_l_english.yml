 PER_AI_BEHAVIOR:0 "@PER Iran"
 PER_BLITZKRIEG_DESC:0 "Iran stands at the precipice of a turbulent and uncertain future. As the war begins in Europe, Reza Shah Pahlavi looks on with concern as he finds himself pincered between two major players who seem to show interest in involving themselves in the conflict at large.\n\nIran's sovereignty may come into question if resources are involved, and the Shah's government must be prepared to repel any potential invasion. The question is: will they be able to mobilize in time?"
 PER_GATHERING_STORM_DESC:0 "Formerly known as Persia, the great nation of Iran finds itself caught in the crossfire of rumbling giants. As neutral Iran rapidly modernizes with the help of the German Reich, former associates in Great Britain and the Soviet Union look on with suspicion. Reza Shah Pahlavi refuses to let these two nations encroach on Iranian sovereignty, even if invasion is a prevalent risk.\n\nWill Iran's neutrality be respected? Are we ready to protect our homeland from malicious invaders? If all else fails, perhaps it is time to look to our past and rekindle the spirit of the old Persian Empire..."
