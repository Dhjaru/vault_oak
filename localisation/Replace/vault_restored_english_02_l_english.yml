 DEN_BLITZKRIEG_DESC:0 "Denmark is in a precarious situation with a neglected military that has seen budget cuts year after year in an effort to appease the much larger and stronger neighbor, Germany. \n\nAppeasements, however, have not hindered the German Reich from consolidating its power in Europe and laying claim to other nations. Denmark must now put its faith in its declaration of neutrality, which saved them from the disastrous Great War."
 DEN_GATHERING_STORM_DESC:0 "As tensions are rising in Europe yet again, Denmark finds itself with a weak military and with the Great Depression still ravaging the economy.\n\nThe Danes must find a way to combat the high unemployment and the growing extremist movements on the political fringes, and at the same time re-evaluate the merits of the policy of neutrality and appeasement.\n\nDenmark is still master of its own fate, but for how long remains to be seen."
