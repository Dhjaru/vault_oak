 ENG_issue_gasmasks:0 "Issue Gasmasks"
 ENG_issue_gasmasks_desc:0 "The world is growing more dangerous every day. We should protect the civilian population from any poisonous gas attacks. Britain shall breathe easy."
 ENG_mi6_ns:0 "MI6"
 ENG_military_training_act:0 "Military Training Act"
 ENG_military_training_act_desc:0 "The Great War has left our people with an impression that they would not have to fight again. As the world grows dangerous, we must ensure that all capable young men receive basic military training."
 ENG_mio_trait_lms_class_stanier_class_5_black_five:0 "LMS Black Fives"
 ENG_mio_trait_lms_logistical_expertise:0 "LMS Railway Logistical Expertise"
 ENG_mio_trait_vickers_armstrong_knowledge_sharing:0 "$ENG_vickers_armstrong_eng_organization$ Knowledge Sharing"
 ENG_mot_focus_tooltip:0 "We can now deploy Motorized Infantry Divisions."
 ENG_neutrality_party_long:0 "the House of Windsor"
 ENG_neutrality_subject:0 "$OVERLORDADJ$ Britain"
 ENG_neutrality_subject_DEF:0 "$OVERLORDADJ$ Britain"
 ENG_norwegian_intervention:0 "Norwegian Intervention"
 ENG_norwegian_intervention_desc:0 "Norwegian movements against democracy continue to gain ground. We should ensure that their politics stay aligned with our own interests, even if we need to use force."
 ENG_operation_valentine:0 "Operation Valentine"
 ENG_operation_valentine_desc:0 "We shall shield the Faroe Islands from all the severities of war and establish ourselves there conveniently by sea and air until the moment comes when they will be handed back to Denmark liberated from the foul thraldom into which they have been plunged by hostile aggression, whilst also strengthening our own position in the North Sea."
 ENG_parachute_regiments:0 "Airborne Forces Depot"
 ENG_parachute_regiments_desc:0 "Following the success of early airborne operations in hostile territory, it is clear that the parachute regiments are the future. The establishment of dedicated training facilities and equipment will help us adopt these new technologies into our overall strategy."
 ENG_reach_out_across_the_channel_tt:0 "Invites §Y[FRA.GetName]§! or the §YLow Countries§! to our faction, if they are communist.\n"
 ENG_reclaim_burma:0 "Reclaim Burma"
 ENG_reclaim_burma_desc:0 "[BRM.GetName]'s brief period of independence must now come to an end. Our forces are in position, ready to return the country to its rightful overlord"
 ENG_royal_malay_regiment_focus:0 "Expand the Royal Malay Regiment"
 ENG_royal_malay_regiment_focus_desc:0 "In 1920 local rulers throughout our Malay possessions urged our colonial office to raise an infantry regiment from the colonial population. Though this has since been approved and the first company has been set up, it is still too small to be considered a fighting force. We must expand the regiment, and ensure we can adequately protect Singapore and Malaya in times of war."
 ENG_sarawakrangers_focus:0 "Strengthen the Sarawak Rangers"
 ENG_sarawakrangers_focus_desc:0 "The Sarawak Rangers in charge of protecting the Raj of Sarawak, headed by Charles Vyner Brooke, are skilled in fighting in rough jungle terrain. We should make use of their knowledge, as well as bolster their forces so that we can maintain our control over North Borneo."
 ENG_south_east_asia_air_command_focus:0 "Establish Air Command, South East Asia"
 ENG_south_east_asia_air_command_focus_desc:0 "RAF Singapore is under-equipped to protect the skies across our vast Far Eastern colonies. Group Captain Henry Cave-Browne-Cave has requested we expand the facilities in the region and establish a new air branch headquartered at RAF Changi in Singapore."
 ENG_support_weapons3:0 "Bren Mk. I & ML 3 inch mortar"
 ENG_swedish_intervention:0 "Swedish Intervention"
 ENG_swedish_intervention_desc:0 "Swedish movements against democracy have gained a worrying amount of influence. We cannot risk Swedish steel ending up as guns in the hands of our enemies. The Swedes shall remain free, but we need to secure a certain degree of influence over their country."
 ENG_tank_focus_desc:0 "[Root.GetRoyalTankRegimentDesc]"
 ENG_territorial_army_of_malaysia_focus:0 "Unify the Territorial Army of Malaysia"
 ENG_territorial_army_of_malaysia_focus_desc:0 "The forces of our Malay protectorates are heavily decentralized and inefficient. We must amend this by unifying the various Volunteer Rifle Corps, local military forces and the federation regiment into one unified army structure."
 ENG_the_mosley_memorandum_idea:0 "The Mosley Memorandum"
 ENG_the_winds_of_change:0 "The Wind of Change"
 ENG_the_winds_of_change_desc:0 "Now with decolonization nearing zenith, the winds of change are blowing ever stronger across the globe. If we wish to secure the future of our isles, we must make an effort to evacuate and extract our former colonial assets and bring them back home."
 ENG_vickers_experimental_facility_focus:0 "Vickers Experimental Facilities"
 ENG_vickers_experimental_facility_focus_desc:0 "In order to further our research and development of special technological projects, we should endeavor to expand Vickers' experimental facilities at Foxwarren."
 ENG_vickers_experimental_facility_focus_tt:0 "If there are no other §YExperimental Facilities§! in §Y[126.GetName]§!, we will gain §G1§! §YAerodynamics and Avionics Facility§! in §Y[126.GetName]§!."
 ENG_war_with_germany:0 "War with Germany"
 ENG_war_with_germany_desc:0 "The Germans have left us with no other choice. For the sake of the free world and the future of our children. It is time for war."
 ENG_war_with_italy:0 "War with Italy"
 ENG_war_with_italy_desc:0 "The Italians refuse to give up their plans for a new Empire and have proven willing to go to war in order to expand their borders. We must do what we can to eliminate this threat before it is too late."
 ENG_war_with_japan:0 "War with Japan"
 ENG_war_with_japan_desc:0 "All other options are exhausted and the Japanese refuse to give up their expansionist ways. For the safety of the British Empire and the people of Asia, we must subdue the Japanese."
 ENG_war_with_ussr:0 "Operation Unthinkable"
 ENG_war_with_ussr_desc:0 "The threat of [SOU.GetNameDef] continues to grow despite our objections. We cannot tolerate an aggressive [SOU.GetName] and are left with no other choice than to go to war for a better tomorrow."
