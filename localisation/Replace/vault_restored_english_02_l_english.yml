 CHI_spymaster:0 "BIS Spymaster"
 CHI_strenghten_warlord_authority:0 "Strengthen Warlord Authority"
 CHI_strenghten_warlord_authority_desc:0 "In order to secure our zone of control, and ensure that we aren't undermined by the Kuomintang, the communists and the Japanese, we must strengthen the authority of [ROOT.GetLeader]."
 CHI_taiyuan_arsenal_organization_sea:0 "$CHI_taiyuan_arsenal_organization$"
 CHI_taoist_devotee_trait:0 "Taoist Devotee"
 CHI_the_northern_bastion_trait:0 "The Northern Bastion"
 CHI_the_soviet_volunteer_group_focus:0 "The Soviet Volunteer Group"
 CHI_the_soviet_volunteer_group_focus_desc:0 "Our airforce remains woefully understrength compared to other powers in the region. The Soviets seem open to the possibility of sending a volunteer group."
 CHI_the_third_force_leader_trait:0 "$CHI_the_third_force_trait$"
 CHI_the_third_force_trait:0 "The Third Force"
 CHI_tsr_son_of_heaven:0 "Son of Heaven"
 CHI_tsr_son_of_heaven_2:0 "$CHI_tsr_son_of_heaven$"
 CHI_tsr_the_celestial_emperor:0 "Celestial Emperor"
 CHI_uplift_the_cavalry_regiments:0 "Uplift the Cavalry Regiments"
 CHI_uplift_the_cavalry_regiments_desc:0 "Our region has a long and proud tradition of horsemanship and equestrianism. We should honor these traditions, and ensure that our cavalry is held in the highest regard, and brought to the forefront of our armed forces."
 CHI_uplift_the_mountain_brigades:0 "Uplift the Mountain Brigades"
 CHI_uplift_the_mountain_brigades_desc:0 "The lands of the Chinese interior are harsh and difficult to traverse. As such we must train special brigades with the purpose of fighting in hilly and mountainous terrain, so that we can properly protect our lands."
 CHI_vice_premier_trait:0 "Vice Premier"
 CHI_warlord_state_idea:0 "Warlord State"
 CHI_warlord_state_idea_desc:0 "Our state is far from the definition of the word. It's a region and people living their daily lives, under the protection of an independent army who swears loyalty to no state. This leads to very little we can do as a government, but it also has its upsides."
 CHI_warlord_state_idea_tt:0 "This spirit is removed upon the completion of either of the focuses §YPower Struggle§!, §YThe Yan'an Incident§! and §YProclaim Rival Government§!"
 CHI_winner_of_resistance:0 "Victor of the War of Resistance"
 CHL_AI_BEHAVIOR:0 "@CHL Chile"
 CHL_BLITZKRIEG_DESC:0 "With the Jorge González von Marées and his fellow Nacistas coup attempt having been recently dealt with, Arturo Alessandri has stepped down and Pedro Aguirre Cerda has been elected the new President of Chile. The military threat still looms closely however, and it seems imminent that General Ariosto Herrera and his supporters attempt their own coup d'etat. \n\nWar also looms above the horizon, as tensions rise not only in Europe and Asia, but in the Amazon, close to the Chilean heartland."
 CHL_GATHERING_STORM_DESC:0 "As an effect of the Wall Street Crash, the USA stopped importing copper and nitrate from Chile, which was the country's main source of income. This led to Chile becoming the South American country to be the most badly affected by the economic depression, and the political instability, which only got worse with the depression, has not yet been solved. \n\nAs Arturo Alessandri's term draws to one final end, The fascist movement is one the rise, and the country vividly remembers the coups of the previous decade, as well as the Socialist Republic of Chile in 1932."
