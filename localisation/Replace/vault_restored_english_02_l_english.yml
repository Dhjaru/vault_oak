 FIN_BLITZKRIEG_DESC:0 "Finland finds itself caught between the Soviet Union and Nazi Germany, with tensions between the two powers on the rise. Negotiations with the Soviet Union have broken down and the government now faces difficult decisions about how to protect their country's sovereignty. \n\nEfforts have been made to strengthen Finnish defenses, but the army is still poorly equipped, and the air force and navy are virtually non-existent. Despite this, Finland's strong sense of national pride and military valor gives it a fierce determination to protect its independence."
 FIN_CAS_equipment_1:0 "Fokker-VL C.X"
 FIN_CAS_equipment_1_short:0 "Fokker-VL C.X"
 FIN_GATHERING_STORM_DESC:0 "Finland is a young country, having gained its independence from Russia in 1917, followed by a bloody civil war. The scars of the war are still fresh, and the country's coalition government still struggles to work together effectively. The Soviet Union seems to covet Finnish territory close to Leningrad, and Finland is ill-prepared for a potential conflict, but it still has a long history of military valor and determination, and its soldiers are fiercely loyal to their country. \n\nWith tensions rising and the threat of conflict looming, the future of Finland hangs in the balance."
