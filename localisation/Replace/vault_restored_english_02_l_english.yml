 CAN_cv_CAS_equipment_2_short:0 "Skua"
 CAN_cv_CAS_equipment_3:0 "Hawker Sea Fury"
 CAN_cv_CAS_equipment_3_short:0 "Sea Fury"
 CAN_demand_labrador_tooltip:0 "§H[ENG.GetName]§! will be §Rvery unlikely§! to accede to our demands unless they are in a desperate situation.\n\n"
 CAN_dominion_rifle_association:0 "Dominion of Canada Rifle Association"
 CAN_dominion_rifle_association_desc:0 "The Dominion of Canada Rifle Association was founded in 1868 and incorporated by an act of parliament in 1900. We should support the expansion of this organization, so that more Canadian men can learn how to handle firearms."
 CAN_dominion_rifle_association_idea:0 "The Dominion of Canada Rifle Association"
 CAN_father_of_the_canadian_welfare_state:0 "Father of the Canadian Welfare State"
 CAN_infantry_at:0 "Boys Anti-Tank Rifle"
 CAN_infantry_at2:0 "PIAT"
 CAN_james_stanley_scott:0 "James Stanley Scott"
 CAN_liberal_corporatist:0 "Liberal Corporatist"
 CAN_liberate_the_workers_of_the_world:0 "Spirit of the True Revolution"
 CAN_liberate_the_workers_of_the_world_desc:0 "Such is our conviction in the utopia we have built, that our young men and women flock the banner so that our downtrodden comrades in foreign lands - suffering under the yoke of oppressive regimes - might yet have a taste of our thoroughly Canadian freedom."
 CAN_lindsay_gordon:0 "James Lindsay Gordon"
 CAN_mend_relations_with_the_trotskyites:0 "Mend Relations with the Trotskyites"
 CAN_mend_relations_with_the_trotskyites_desc:0 "Old rifts in the party have divided our people for too long. It is time to embrace these once-trusted exiles and reforge our purpose as the only true beacon of the people's will."
 CAN_newfoundland_act:0 "The Newfoundland Act"
 CAN_newfoundland_act_desc:0 "The regions of Newfoundland and Labrador are close to us both culturally and geographically, yet they continue to be under British rule. It is high time that we put forth a request to unite with the territories, and assist in governing them."
 CAN_north_america_dominion_fascism:0 "Dominion of North America"
 CAN_north_america_dominion_fascism_def:0 "the Dominion of North America"
 CAN_north_america_dominion_neutrality:0 "Dominion of North America"
 CAN_north_america_dominion_neutrality_def:0 "the Dominion of North America"
 CAN_offer_concessions_for_labrador_and_newfoundland:0 "Concessions for Labrador and Newfoundland"
 CAN_offer_concessions_for_labrador_and_newfoundland_desc:0 "The British claim dominion over land adjacent to our heartland. While we do not wish for war with a superior foe, they may be willing to consider a less than optimal trade if their situation demands it."
 CAN_offer_concessions_for_labrador_tooltip:0 "§H[ENG.GetName]§! are more likely to consider this request than an outright demand. They will be §Gmore likely§! to accede to our request if they are:\n  - At war\n  - Have a high opinion of us\n  - Have greater than §H25%§! Surrender Progress\n  - Have the same ideology as us\n\nIf they accept:\n"
 CAN_reactivate_farmers_unity_league:0 "Reactivate the Farmer's Unity League"
 CAN_reactivate_farmers_unity_league_desc:0 "The Unity League performed important work leading up to our glorious revolution. Now, in our time of desperate need, we must call upon these rural loyalists to aid the state in any way possible."
 CAN_reject_authoritarianism:0 "Introspective Communism"
 CAN_reject_authoritarianism_desc:0 "With conflict and division growing around us, it has become apparent that our unique geographical and societal circumstances deter us from the wider socialist movements, and the trappings of rumored authoritarianism that come with them. The people's movement must begin again - with us."
 CAN_social_gospel:0 "Pioneer of the Canadian Social Gospel"
 CAN_stalin_and_friends_hate_us_now:0 "Dissident Suspicions"
 CAN_support_weapons3:0 "Bren Mk. I & ML 3 inch mortar"
 CAN_trotsky_loves_us:0 "Brothers in Arms"
 CAN_true_revolution:0 "True Revolution"
 CAN_unified_communist_party:0 "The People, United"
 CAN_unified_communist_party_desc:0 "Old rifts are mended; relationships repaired. Yet our tolerance in service of a shared destiny is looked upon with suspicion by those who pay only lip service to the cause, driven by that basest of motivations: the pursuit of power."
 CAS_equipment_1:0 "Close Air Support I"
 CAS_equipment_1_desc:0 "Our CAS doctrine requires an aircraft capable of precision surface attack. While these aircraft carry a lesser payload compared to our larger Tactical Bombers, they are capable of attacking and destroying small targets of opportunity through strafing and dive bombing."
 CAS_equipment_1_short:0 "CAS I"
 CAS_equipment_2:0 "Close Air Support II"
 CAS_equipment_2_desc:0 "Early war experiences have shown that increased speed, armor and maneuverability are necessary for CAS aircraft survivability against enemy fighters and ground fire. This next generation of ground attack aircraft will also utilize larger bombs, cannons and machineguns to inflict greater damage to their targets."
 CAS_equipment_2_short:0 "CAS II"
 CAS_equipment_3:0 "Close Air Support III"
 CAS_equipment_3_desc:0 "The ever increasing capability of target AA and enemy interceptors require further evolution of our CAS aircraft. The new design incorporates increased engine power, airframe improvements for increased diving capability and protection, as well as even greater payloads."
 CAS_equipment_3_short:0 "CAS III"
