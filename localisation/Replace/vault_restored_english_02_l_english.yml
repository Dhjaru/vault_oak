 CAN_booming_economy:0 "Booming Economy"
 CAN_booming_economy_desc:0 "With the great depression firmly a thing of the past, our economy has begun to improve under the significant demands of the current world situation."
 CAN_canadian_citizenship:0 "The Canadian Citizenship Act"
 CAN_canadian_citizenship_act:0 "The Canadian Citizenship Act"
 CAN_canadian_citizenship_act_desc:0 "As it currently stands, who is and isn't a Canadian citizen is based on British laws, and a Canadian citizen is no different from a British Subject. We must ensure that the Canadian nationals and citizens are no longer simply regarded as sub-classes of the British subject status."
 CAN_canadian_fuhrer:0 "The Canadian Führer"
 CAN_communist_ideals_4:0 "Communist Ideals"
 CAN_consumer_goods_for_newfoundland:0 "Compensation for Newfoundland"
 CAN_cv_CAS_equipment_1:0 "Hawker Osprey"
 CAN_cv_CAS_equipment_1_short:0 "Osprey"
