 ENG_danish_intervention:0 "Danish Intervention"
 ENG_danish_intervention_desc:0 "Danish support for the enemies of world peace has continued to grow. There is only one way to ensure they stay on our side. We should use Denmark to establish a strategic foothold in the region in case a land invasion in Europe becomes necessary."
 ENG_decolonized:0 "Britain has decolonized"
 ENG_democratic_subject:0 "$OVERLORDADJ$ Britain"
 ENG_democratic_subject_DEF:0 "$OVERLORDADJ$ Britain"
 ENG_desperate_defense_of_the_homeland:0 "Desperate Defense of the Homeland"
 ENG_dutch_security:0 "Secure The Netherlands"
 ENG_dutch_security_desc:0 "Political movements in the Netherlands continue to support our enemies. The Netherlands will have to be subdued in order to ensure a free Europe."
 ENG_east_indies_fleet_focus:0 "Establish the East Indies Fleet"
 ENG_east_indies_fleet_focus_desc:0 "In 1904 the First Sea Lord, Admiral Sir John Fisher, ordered that the three main commands in the Far East, the East Indies Squadron, the China Station, and the Australian Squadron, should all come under one command called the Eastern Fleet based in Singapore in the event of war. With tensions rising in the region, it seems prudent to begin preparations to make this happen."
 ENG_embargo_germany:0 "Embargo Germany"
 ENG_embargo_germany_desc:0 "German rearmament is an insult and a great threat to world peace. We will not be supplying the resources they need to fuel their war machine."
 ENG_embargo_ussr:0 "Embargo [SOV.GetNameDefCap]"
 ENG_embargo_ussr_desc:0 "[SOV.GetNameDefCap] is growing powerful and using British resources to fuel their military efforts. We should deprive them of access to our trade."
