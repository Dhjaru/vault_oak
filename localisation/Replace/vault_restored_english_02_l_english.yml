 ENG_expand_the_secret_intelligence_service_focus:0 "Expand the Secret Intelligence Service"
 ENG_expand_the_secret_intelligence_service_focus_desc:0 "The Secret Intelligence Service, commonly called the MI6, helps protect our homeland from any subversive activities and foreign threats. Though formed during the Great War, they were reorganized in the twenties. Back then however we missed some important details, and should endeavor to increase the size of the organization once again."
