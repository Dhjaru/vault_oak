 COG_AI_BEHAVIOR:0 "@COG Belgian Congo"
 COG_BLITZKRIEG_DESC:0 "With the Italian conquest of Abyssinia wrapped up, and the German Reich gaining new territory in Europe, the situation is looking dangerous. Italy's colonial ambitions do not stop in East Africa, and may very well threaten us in the near future, while Hitler is actively eyeing up our Belgian overlords as a step in their plan for hegemony over the European continent.\n\nIt seems that the war will come to us soon, if we do not take it to them first..."
 COG_GATHERING_STORM_DESC:0 "Still scarred by the Congo Free State and King Leopold II, the Belgian Congo has come far since that time. The colonial government still utilizes cheap labor in the mines, and an invisible roof exists, making sure the majority of the nation's inhabitants are not able to attain higher education, but not all is bleak.\n\nAs the Italian colonial ambitions grow ever larger, and having performed well in the Great War, the Force Publique is once again gearing up to protect the state, under-equipped as it may be."
