 CHI_ineffective_bureaucracy_warlord_desc:0 "The chaos of the civil war has disrupted the creation of an effective state apparatus. The region cannot be properly governed until we have reformed our bureaucracy, by hiring competent people and dividing the governorship in an effective way."
