 form_east_africa_category_desc:0 "Though culturally different, we share a common fate with many other states and peoples in East Africa. It is time that we unify, and stand together in the face of exterior threats."
 form_greater_german_state_category:0 "The New Proletarian Order"
 form_greater_german_state_category_desc:0 "Despite opposition from all sides, we have managed to overcome the corrupt governments of Western Europe. No longer can they continue to oppress the workers, whom we now have set free and are rallying to our cause at this very moment. The shackles of Capitalism have been shattered and a new order dawns over Europe - and the world."
