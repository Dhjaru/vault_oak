 germany.1002.b:0 "Poland is ours!"
 germany.1002.desc:0 "Germany and [SOU.GetNameDef] have already made agreements to partition Poland between its east and west halves, however our occupation of the east has caused something of a complication in this arrangement. Though our German allies fully expect we’ll surrender the promised Polish territories to [SOU.GetNameDef], we could instead break the pact and continue our occupation."
 germany.1003.a:0 "Now we must pay the price for their insolence."
 germany.1003.desc:0 "Despite the decision to cede eastern Poland to [SOU.GetNameDef], our allies in [From.GetNameDef] have chosen to continue their occupation of Poland, formally breaking the Molotov-Ribbentrop pact!"
 germany.1003.t:0 "[From.GetNameDefCap] Breaks the Pact!"
 germany.1041.a:0 "We have no choice."
 germany.1041.b:0 "[GetSudetenlandRejectOption]"
 germany.1041.b_ally_of_ger:0 "We will not give up our territorial gains."
 germany.1041.b_default:0 "The [FROM.GetAdjective] war machine stops here."
 germany.1041.desc:0 "Despite the recent upheaval in Czech borders, [FROM.GetAdjective] foreign policy has remained unwavering. [FROM.GetAdjective] diplomats have submitted an ultimatum to us - hand over Sudetenland, or war will be declared."
 germany.1041.desc_ally_or_subject:0 "Despite the recent upheaval in Czech borders, [FROM.GetAdjective] foreign policy has remained unwavering. [FROM.GetAdjective] diplomats have submitted their territorial demands to us, expecting us to hand over Sudetenland without delay."
 germany.1041.t:0 "[FROM.GetNameDefCap] Demands Sudetenland"
 germany.1042.a:0 "Superb."
 germany.1042.desc_ally:0 "[ROOT.GetAdjective] might knows no bounds - the Sudetenland territory previously in the [FROM.GetAdjective] sphere of influence has now been transferred to us. It didn't take long for [FROM.GetLeader] and the [FROM.GetAdjective] diplomats to realize that this is the best for the [ROOT.GetFactionName]."
 germany.1042.desc_default:0 "[ROOT.GetAdjective] might knows no bounds - the Sudetenland territory previously in the [FROM.GetAdjective] sphere of influence has now been transferred to us. [FROM.GetNameDefCap] remains out of our sights. For now."
 germany.1042.desc_subject:0 "[ROOT.GetAdjective] might knows no bounds - the Sudetenland territory previously under [FROM.GetAdjective] control has now been transferred to us. Our puppet ruler in [FROM.GetNameDef], [FROM.GetLeader], made sure that local authorities and [FROM.GetAdjective] organizations complied with the treaty without objection."
 germany.1042.t:0 "[FROM.GetNameDefCap] Submits"
 germany.1043.a:0 "Drat."
 germany.1043.desc:0 "Despite the imbalance of power, [FROM.GetAdjective] diplomats have refused our demands for the cession of the Sudetenland. It is certain that war must follow."
 germany.1043.desc_ally:0 "Despite being in the best interest of all the members of the [ROOT.GetFactionName], [FROM.GetAdjective] diplomats have refused our demands for the cession of the Sudetenland. There isn't much that can be done now, given the need to respect the autonomy of our allies."
 germany.1043.t:0 "[FROM.GetNameDefCap] Refuses Demands"
 germany.1050.a:0 "$GER_karl_donitz$ was the Führer’s preferred successor."
 germany.1050.b:0 "$GER_albert_speer$ will fulfill the Führer’s ambitions."
 germany.1050.c:0 "$GER_heinz_guderian$ will get us out of this mess."
 germany.1050.desc:0 "The Führer, $GER_adolf_hitler$, has been found dead in his bunker. With enemy forces closing in, it seems the Führer decided to take his own life rather than risk capture. In order to prevent demoralization of the troops, our propaganda outlets are being briefed that Hitler died fighting heroically to his last breath in the face of overwhelming enemy forces. However, our more immediate issue is who will step in to replace the Führer?"
 germany.1050.t:0 "Death of the Führer"
 germany.11.a.tt:0 "§RWhile the pact is in effect, the Closed Economy trade policy will be unavailable.§!\n"
 germany.118.c:0 "We should follow the Morgenthau Plan."
 germany.118.e:0 "Churchill has this idea..."
 germany.1190.desc:0 "With the war against [GER.GetNameDef] marching towards its inevitable conclusion, [yalta_origin.GetNameDef] has approached us about a conference on the future of Europe.\n\nThey are suggesting a three way split of [GER.GetNameDef] in which we will get limited influence over the Eastern region. The main industrial region would come under allied control, and the allies would also have limited control over the Southern region. It would reduce Germany's power, however our influence over central Europe will remain uncertain."
 germany.1190.t:0 "The Toronto Conference"
 germany.122.b:0 "We cannot afford a war with [From.GetNameDef]."
 germany.122.c:0 "We must comply to [FROM.GetLeader]'s demands."
 germany.124.desc_cze_subject_of_ger:0 "The [From.GetAdjective] government had no choice but to agree to cede all control of the Sudetenland, renouncing any future claim to the region.\n\nThe [ROOT.GetAdjective] population of the Sudetenland will finally be safely in the fold of the [ROOT.GetNameDef]."
 germany.125.a:0 "We would have handled it differently were it up to us."
 germany.125.d:0 "Our [FROM.GetAdjective] overlords has decided to hand over Sudetenland to [GER.GetNameDef]. They claim that the action is taken as a measure to preserve peace in the region and that any other action would have caused a far worse fate to befall us. We were not consulted in this matter and can now only watch as our rightful territory is severed from us."
 germany.125.t:0 "[FROM.GetNameDefCap] Cedes Sudetenland to [GER.GetNameDef]"
 germany.200.a:0 "Let's launch these plans"
 germany.200.b:0 "No, it's too risky"
 germany.200.desc:0 "Germany no longer poses the threat that it once did, instead it is [SOV.GetNameDef] that threatens to upset the world order. A strong and democratic Germany could be a very useful ally in this struggle. Allowing Germany to rise once more, could also hold strong trade advantages for both us and them. Maybe the time is right to end the occupation and create the foundation for a strong and united democratic world."
 germany.200.t:0 "A New Germany"
 germany.201.a:0 "There certainly are advantages to it"
 germany.201.b:0 "No, the time for this is not now"
 germany.201.desc:0 "[FROM.GetName] has decided to end their occupation of Germany, and give the Germans self rule as a new republic called [WGR.GetNameDef]. They claim this is to create a bulwark against communism, arguing that a strong democratic Germany is a better protection against the spread of communism than a weak fragmented one. \nWe have been asked to support this by merging our German territories with the newly created [WGR.GetName]. Popular support for this is strong."
 germany.201.t:0 "[FROM.GetName] Wants to Re-unite Germany"
 germany.202.a:0 "Let's create our own independent Germany then"
 germany.202.b:0 "It's not worth the effort to keep them"
 germany.202.desc:0 "[FROM.GetName] let their German territories be merged into the so called [WGR.GetName]. This has led to a lot of people in our German zone to call out for reunification with the independent Germany as well."
 germany.202.t:0 "A New Germany"
 germany.40.d_3:0 "German demands for the Sudetenland region of Czechoslovakia, where a significant number of ethnic Germans live, have come to a head. [GER.GetLeader] has positioned forces along the Czechoslovakian border in preparation for an attack. Talks are being held in Munich between the Netherlands, Britain, France, Italy and Germany in the hopes of negotiating a peaceful end to the Sudeten Crisis. What will the Dutch position be?"
 germany.59.a:0 "Another sad day for [ROOT.GetNameDef]"
 germany.59.desc:0 "In a bold and unilateral move, [GER.GetNameDef] has decreed the transfer of the [664.GetName] region to [FROM.GetNameDef]. This decision, dictated without consultation or consent, marks a further dismantling of [ROOT.GetNameDef]'s territorial integrity and a stark reminder of our geopolitical vulnerability. \nThe [GER.GetAdjective] delegation, citing old historical claims, has pressured our leadership to acquiesce to this territorial revision. The loss of [664.GetName], a region rich in culture and resources, to [FROM.GetNameDef] is a bitter pill to swallow for our people and a direct challenge to our nation's sovereignty."
 germany.62.b:0 "Versailles concerns us no longer."
 germany.70.b:0 "Perhaps his removal would be for the best..."
 germany.71.c:0 "Eva Braun must have her vengeance!"
 germany.73.e:0 "Eva Braun must have her vengeance!"
 get_SOV_ideology_london_desc:0 "The communist surge continues, with Soviet forces recently having completed the capture of London. A parade was quickly organized by the Red Army, even before the last pockets of resistance in the city had been fully dealt with.\n\nCommunist sympathizers have been quick to turn in the names of known anti-communists to the Soviet military authorities, and a People's Court has convened at Trafalgar Square to punish the worst offenders."
 get_SOV_ideology_london_desc_alt:0 "The [SOV.GetAdjective] offensive continues. The most recent developments has seen London come under an aggressive onslaught, and subsequently fall under the barrage of seemingly never-ending attacks.  \n\n The last pockets of resistance had barely been dealt with before a parade was organized by the [SOV.GetAdjective] forces to celebrate their victory. Supporters of [SOV.GetLeader] and [SOV.GetLeader.GetHerHis] leadership have offered their utmost support and admiration as this new era is finally upon them."
 get_SOV_ideology_london_response:0 "Onwards, comrades!"
 get_SOV_ideology_london_response_alt:0 "Onwards!"
