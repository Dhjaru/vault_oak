 TUR_millet_mektebi_focus_desc:0 "Though the program has already been going on for quite some time, the alphabet and language reforms are still being implemented nationwide. In order to tackle the widespread illiteracy, we should utilize the Turkish Language Research Society and nation's schools program. Further funding must also be given to the mobile teaching teams that travel between villages lacking schools in a drive to increase literacy."
