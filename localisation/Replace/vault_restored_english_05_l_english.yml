 TUR_widespread_illiteracy_idea:0 "Widespread Illiteracy"
 TUR_widespread_illiteracy_idea_desc:0 "Though the literacy within our nation has increased drastically since the initial implementations of the alphabet and language reforms thanks to Atatürk's literacy drive and national education campaigns, even going as far as earning himself the title başöğretmen, there is still much to be done."
