 bftb_greece.235.a:0 "Cowards!"
 bftb_greece.235.desc:0 "The Heraklion Convention has rattled our [ROM.GetAdjective] guarantors deeply. Rather than risk a war with major European powers, they have chosen to revoke their promises of lending their military aid to our defense."
 bftb_greece.235.t:0 "[ROM.GetName] Revokes Guarantee"
 bftb_greece.236.a:0 "We will proceed anyway"
 bftb_greece.236.b:0 "Perhaps we were a bit too eager"
 bftb_greece.236.desc:0 "Although undoubtedly interested in expanding its influence, [SOV.GetNameDef] has decided not to aid our plans to influence [TUR.GetNonIdeologyName]. Instead wanting to focus on other matters."
 bftb_greece.236.t:0 "[SOV.GetNameDefCap] Refuses to Help Against [TUR.GetNameDef]"
 bftb_greece.237.a:0 "Great news!"
 bftb_greece.237.desc:0 "Diplomats from [FROM.GetNameDef] have informed us that we have [FROM.GetLeader]'s support in our plans against [TUR.GetNameDef]. Reports from our military intelligence also suggest that they have begun to move troops towards the [TUR.GetAdjective] border."
 bftb_greece.237.t:0 "[FROM.GetName] Supports Ambitions Against [TUR.GetNonIdeologyName]"
 bftb_greece.30.a:0 "We have [TUR.GetNameDef] cornered now"
 bftb_greece.30.b:0 "They are on their own"
 bftb_greece.30.desc:0 "Great news has reached us from Athens, where the [GRE.GetAdjective] communists have seized control of the government. They now seek a pact with us against [TUR.GetNameDef], as they wish to together influence [TUR.GetNameDef] into making concessions related to the Bosporus that would effectively make them our puppet state. In response however, the [TUR.GetAdjective] government has panicked and now denies us access to the Black Sea."
