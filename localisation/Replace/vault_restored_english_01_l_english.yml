 BEL_BLITZKRIEG_DESC:0 "Instability still wracks Belgium domestically but this is nothing compared to the instability felt on the world stage at the moment. The nation's military has undergone modernization and expansion, with great attention given to the mighty fortifications rivaling those even of the French Maginot. \n\nThe Belgian government has abandoned their alliances and declared absolute neutrality, however, this has not stopped backroom deals being signed in case of attack. Belgium eyes the mounting militarism of their neighbor with great concern."
