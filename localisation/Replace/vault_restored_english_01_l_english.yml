 CHI_pacified_by_japan:0 "Pacified by the Occupier"
 CHI_pacified_by_japan_desc:0 "Years of occupation, collaborationist administration and the Kempeitai have worn this state down. The population no longer shelters our soldiers, our couriers are turned in at the roadblocks, and the guerrilla networks that once fed us intelligence have gone quiet. Our divisions fight here as though on foreign soil.\n\nLifts on its own only if compliance falls below §Y45%§!, or if the state is retaken. Funding the assassination of the collaborators running it suppresses this for §Y60 days§! — after which it returns should the population still be compliant."
