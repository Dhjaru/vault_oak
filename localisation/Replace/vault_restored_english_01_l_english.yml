 AFG_AI_BEHAVIOR:0 "@AFG Afghanistan"
 AFG_BLITZKRIEG_DESC:0 "As King Zahir Shah continues to grow into his role, the challenges facing his rule continue to mount. Britain, Germany and the Soviet Union tussle for influence over the strategically located Kingdom, bringing both investment and threats of intervention. Meanwhile trouble makers pass across the borders with the Raj, stirring unrest on both sides. But as the world descends into war once more, the question in the region is ‘what will Afghanistan do?’"
 AFG_BUK_emirate_neutrality:0 "Emirate of Afghanistan"
 AFG_BUK_emirate_neutrality_ADJ:0 "Afghan"
 AFG_BUK_emirate_neutrality_DEF:0 "the Emirate of Afghanistan"
 AFG_GATHERING_STORM_DESC:0 "Under the rule of King Zahir Shah and his uncles, Afghanistan is settling into an era of relative stability. But under the surface of the timeless Kingdom, currents of anger and distrust continue to boil. Some hope for radical modernization as attempted by the exiled Amanullah Khan, who some believe plots a return to his throne. Meanwhile others believe the glacial pace of change under Zahir Shah is still too fast and that the nation requires a return to its traditional roots. But perhaps as the world around destabilizes, the people of Afghanistan can come together to take advantage of the situation."
