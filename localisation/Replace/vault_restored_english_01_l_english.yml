 ast_aircraft_corporation_desc:0 "Australia cannot afford to remain entirely dependent upon overseas manufacturers for its military aircraft. A national aircraft corporation will provide the industrial foundation necessary to design, manufacture and maintain modern aircraft within the Commonwealth."
 AST_aluminium_plants:0 "Expand Aluminium Production"
 AST_aluminium_plants_desc:0 "Modern aircraft construction requires enormous quantities of aluminium. Expanding domestic refining and production facilities will ensure that our aviation industry has access to the strategic materials it needs, even if overseas supply lines are threatened."
 AST_Prioritise_Investment_in_the_CAC:0 "Prioritise Investment in the CAC"
 AST_Prioritise_Investment_in_the_CAC_desc:0 "The Commonwealth Aircraft Corporation must become the centrepiece of Australian aviation industry. Additional state contracts, capital investment and technical resources will allow the CAC to dramatically expand its production capacity."
 AST_Project_Our_Airpower:0 "Project Our Airpower"
 AST_Project_Our_Airpower_desc:0 "Australia is separated from many potential battlefields by vast distances. Our air force must therefore possess the range and infrastructure necessary to operate far beyond the continent, striking enemy forces before they can threaten our shores."
 AST_Home_Defence:0 "Home Defence"
 AST_Home_Defence_desc:0 "The defence of Australia itself must remain the first responsibility of our air force. Expanded fighter forces, airfields and defensive aviation infrastructure will allow us to contest our skies and protect the Commonwealth from enemy attack."
 AST_plane_factory_of_the_empire:0 "Plane Factory of the Empire"
 AST_plane_factory_of_the_empire_desc:0 "With sufficient investment, Australia can become one of the great centres of aircraft production within the British Empire. Our factories will supply not only the Royal Australian Air Force, but Commonwealth forces fighting across the globe."
 HOL_increase_colonial_investments:0 "Increase Colonial Investments"
 HOL_increase_colonial_investments_desc:0 ""
 HOL_reaffirm_armed_neutrality:0 "Reaffirm Armed Neutrality"
 HOL_reaffirm_armed_neutrality_desc:0 ""
 HOL_industrial_revitalization:0 "Crisis Monopoly Decree I"
 HOL_industrial_revitalization_desc:0 "Modernize our industrial base and direct new funding toward civilian production and manufacturing research."
 HOL_international_rubber_regulation_agreement:0 "International Rubber Regulation Agreement"
 HOL_international_rubber_regulation_agreement_desc:0 "By coordinating colonial rubber exports with the other great powers, we can secure favorable terms while strengthening our ties with Britain."
 HOL_sell_germany_dei_rubber:0 "Sell Germany East Indies Rubber"
 HOL_sell_germany_dei_rubber_desc:0 "Rather than tying our rubber exports to British quotas, we can strike a separate bargain with Germany — offering them Kalimantan rubber in return for Reich industrial investment."
 HOL_sell_germany_dei_rubber_tt:0 "§YGermany§! receives the event §Y[ROOT.GetNameDefCap] Offers Kalimantan Rubber§!.\nWe will offer §YGermany§! resource rights to §YKalimantan Rubber§! in exchange for §Y20000§! £cic£. This expires when §YGermany§! goes to war.\nIf they refuse, the §YInternational Rubber Regulation Agreement§! focus will autocomplete."
 HOL_increase_agricultural_exports_trade:0 "Increase Agricultural Exports"
 HOL_increase_agricultural_exports_trade_desc:0 ""
 HOL_increase_agricultural_exports_trade_tt:0 "Gives mutually beneficial trade decisions with Germany, France, and UK."
 HOL_agricultural_exports_trade:0 "Agricultural Exports"
 HOL_agricultural_exports_trade_desc:0 "Increase agricultural exports to our Neighbors"
 HOL_export_agricultural_goods_to_germany:0 "Export Agricultural Goods to Germany"
 HOL_export_agricultural_goods_to_germany_desc:0 "Ship food and agricultural products to Germany in exchange for a steady flow of industrial investment."
 HOL_export_agricultural_goods_to_germany_tt:0 "§YThe Netherlands§! and §YGermany§! each gain §G3000§! £cic£.\nCan be taken again after §Y70§! days."
 HOL_export_agricultural_goods_to_britain:0 "Export Agricultural Goods to Britain"
 HOL_export_agricultural_goods_to_britain_desc:0 "Ship food and agricultural products to Britain in exchange for sterling payments and industrial credits."
 HOL_export_agricultural_goods_to_britain_tt:0 "§YThe Netherlands§! gains §G3000§! £cic£.\n§YThe United Kingdom§! gains §G100§! Million Pounds.\nCan be taken again after §Y180§! days."
 HOL_export_agricultural_goods_to_france:0 "Export Agricultural Goods to France"
 HOL_export_agricultural_goods_to_france_desc:0 "Ship food and agricultural products to France in exchange for industrial credits."
 HOL_export_agricultural_goods_to_france_tt:0 "§YThe Netherlands§! and §YFrance§! each gain §G3000§! £cic£.\nCan be taken again after §Y180§! days."
 HOL_agricultural_trade_eng_cooldown:0 "Recent agricultural exports to Britain"
 HOL_agricultural_trade_fra_cooldown:0 "Recent agricultural exports to France"
 HOL_form_a_new_cabinet:0 "Colijn's Fifth Cabinet"
 HOL_form_a_new_cabinet_desc:0 ""
 HOL_form_a_new_cabinet_tt:0 "Unlocks the following §YPolitical Advisors§!:\n§YWillem Schermerhorn§! — Technocrat\n§YPieter Lieftinck§! — Free Trade Advocate\n§YHubertus van Mook§! — Colonial Administrator"
 HOL_focus_on_recovery:0 "Focus on Recovery"
 HOL_focus_on_recovery_desc:0 ""
 HOL_expand_philips:0 "Expand Philips"
 HOL_expand_philips_desc:0 "Philips has long been a market leader in radios and other electronics. Contracting and funding this Dutch electronics company may yield breakthroughs in this increasingly important field of military equipment."
 HOL_expand_philips_tt:0 "Unlocks §YPhilips§! as an Industrial Concern."
 HOL_increase_armed_deterrence:0 "Increase Armed Deterrence"
 HOL_increase_armed_deterrence_desc:0 ""
 HOL_increase_military_research_funding:0 "Leiden University Funding"
 HOL_increase_military_research_funding_desc:0 "With the cabinet reshuffled and economic priorities set, additional state funding can be directed toward military research institutes and ordnance development."
 HOL_increase_dutch_defenses:0 "Increase Dutch Defenses"
 HOL_increase_dutch_defenses_desc:0 ""
 HOL_increase_dutch_defenses_tt:0 "Available after Germany completes §YFate of Czechoslovakia§!."
 HOL_form_dutch_airforce:0 "Mobilize the Luchtvaartafdeling"
 HOL_form_dutch_airforce_desc:0 "A modern air arm is essential to defending our homeland and colonial possessions. Formalizing the service and expanding pilot training will lay the groundwork for Dutch air power."
 HOL_expand_fokker:0 "Expand Fokker"
 HOL_expand_fokker_desc:0 ""
 HOL_expand_fokker_tt:0 "Unlocks §YFokker§!."
 HOL_expand_domestic_fighter_industry:0 "Expand Domestic Fighter Industry"
 HOL_expand_domestic_fighter_industry_desc:0 "Invest in metropolitan and colonial military industry to produce aircraft at home rather than relying on foreign rush orders."
 HOL_rush_order_planes:0 "Rush Order Planes"
 HOL_rush_order_planes_desc:0 "Emergency orders from British manufacturers can quickly bolster our air strength, at a steep industrial price."
 HOL_rush_order_planes_tt:0 "We receive §Y100§! British §YFighters§! and §Y50§! British §YCAS§!."
 HOL_develop_new_light_airframes:0 "Develop New Light Airframes"
 HOL_develop_new_light_airframes_desc:0 "Refine our designs for fighters, close air support, and naval strike aircraft around lighter, more agile airframes."
 HOL_develop_new_heavy_airframes:0 "Develop New Heavy Airframes"
 HOL_develop_new_heavy_airframes_desc:0 "Invest in heavier airframes suited to long-range fighters and larger bombing platforms."
 HOL_mobilize_the_dutch_air_force:0 "Mobilize the Dutch Air Force"
 HOL_mobilize_the_dutch_air_force_desc:0 "With new airframes in development and the nation on a war footing, the Luchtvaartafdeling can be mobilized for the conflict ahead."
 HOL_mobilize_the_dutch_air_force_cas_reduction_tt:0 "Adds §G+15%§! Damage Reduction Against CAS to §YDutch Army§!."
 HOL_increase_military_preparedness:0 "Expand the Vestingwet"
 HOL_increase_military_preparedness_desc:0 "Events abroad are shaking the public out of its complacency. A sustained campaign to improve readiness can begin to overcome the worst legacies of our pacifist paralysis."
 HOL_increase_military_preparedness_tt:0 "Available after Germany completes §YAnschluss§!."
 HOL_increase_military_preparedness_effect_tt:0 "Reduces §YShell-shocked Spectator of the Great War§! penalties to:\nRecruitable Population Factor: §G-25%§!\n£industry_texticon!Factory Output: §G-10%§!\n£shipyard_texticon!Dockyard Output: §G0%§!"
 HOL_hire_new_high_command:0 "KMA Breda Expansion"
 HOL_hire_new_high_command_desc:0 ""
 HOL_propose_joint_training_with_france:0 "Franco-Dutch Staff Talks"
 HOL_propose_joint_training_with_france_desc:0 ""
 HOL_train_reservists:0 "Train Reservists"
 HOL_train_reservists_desc:0 ""
 HOL_train_reservists_tt:0 "Enables §YDraw Up the Reservists§! to grant an additional §G50,000§! Manpower."
 HOL_prepare_the_dutch_navy:0 "Prepare the Dutch Navy"
 HOL_prepare_the_dutch_navy_desc:0 ""
 HOL_buy_arms_from_germany:0 "Buy Arms from Germany"
 HOL_buy_arms_from_germany_desc:0 "Our domestic arms industry cannot keep pace with the rearmament of our neighbors. Discreet purchases from Germany will let us rebuild our stockpiles without openly abandoning neutrality."
 HOL_purchase_arms_from_the_allies:0 "Purchase Arms from the Allies"
 HOL_purchase_arms_from_the_allies_desc:0 "Our domestic industry cannot meet demand alone. We will approach France and Britain to buy surplus weapons from their stockpiles, offering industrial credits in return."
 HOL_purchase_arms_from_allies_tt:0 "§YFrance§! and §YBritain§! will be asked to sell surplus arms from their stockpiles.\n§YFrance§! receives §Y[ROOT.GetNameDefCap] Requests Arms Purchases§!.\n§YBritain§! receives §Y[ROOT.GetNameDefCap] Requests Arms Purchases§!.\n§YFrance§!: §Y6000§! Guns, §Y100§! Fighters, §Y100§! Anti-Tank, §Y100§! Anti-Air, §Y200§! Field Guns — plus §G10000§! £cic£\n§YBritain§!: §Y6000§! Guns, §Y100§! Fighters, §Y100§! Anti-Tank, §Y100§! Anti-Air, §Y200§! Artillery — costs §R10000§! £cic£, plus §G300§! Million pounds"
 HOL_prepare_the_inundation_lines_grebbelinie_tt:0 "Prepares the Grebbe Line at Arnhem and Nijmegen. The defensive effect activates when §YPrepare for War§! is completed."
 HOL_grebbelinie_active_tt:0 "Activates the Grebbe Line on Arnhem and Nijmegen, giving those provinces §R-50%§! Army Speed and §R+30%§! Attrition."
 HOL_expand_reservists:0 "Expand Reservists"
 HOL_expand_reservists_desc:0 "A modest expansion of our reservist system will allow us to raise more manpower without yet abandoning our commitment to neutrality."
 HOL_expand_reservists_tt:0 "Enables §YDraw Up the Reservists§! to grant an additional §G50,000§! Manpower."
 HOL_prepare_for_war:0 "Prepare for War"
 HOL_prepare_for_war_desc:0 "With Germany at war, neutrality alone may no longer be enough. We must begin shifting the economy toward partial mobilization before crisis reaches our borders."
 HOL_prepare_for_war_tt:0 "Available when §YGermany§! is at war."
 HOL_prepare_for_war_partial_mobilisation_tt:0 "§YNetherlands§! and §YDutch East Indies§! get §YPartial Mobilization§!."
 HOL_prepare_for_war_cic_tt:0 "Removes the §YMarket base construction line speed§! penalty from §YState of the Dutch Economy§!."
 HOL_prepare_for_war_leader_tt:0 "§YDirk Jan de Geer§! replaces §YHendrikus Colijn§! as Minister-President."
 HOL_draw_up_the_reservists:0 "Draw Up the Reservists"
 HOL_draw_up_the_reservists_desc:0 ""
 HOL_draw_up_the_reservists_tt:0 "Grants §G50,000§! Manpower if §YTrain Reservists§! was completed.\nGrants §G50,000§! Manpower if §YExpand Reservists§! was completed."
 HOL_coordinate_with_french:0 "Coordinate with France"
 HOL_coordinate_with_french_desc:0 ""
 HOL_coordinate_with_french_tt:0 "Required for the §YHold Open Corridor with France§! defense mission. While §YBrabant§! is held, the corridor grants §G+10%§! Division Defense on Core Territory. If this focus is not completed before Germany invades, that mission fails immediately."
 HOL_prepare_infrastructure_demolition:0 "Prepare Infrastructure Demolition"
 HOL_prepare_infrastructure_demolition_desc:0 "Pre-position demolition charges on bridges, railways, and roads so key routes can be destroyed once the invasion begins."
 HOL_prepare_infrastructure_demolition_tt:0 "When the §YDefense of Netherlands§! begins, starts a §Y3-day§! mission that deals §R4§! levels of §YInfrastructure§! damage in every controlled Dutch core state."
 HOL_emergency_equipment_purchases:0 "Emergency Equipment Purchases"
 HOL_emergency_equipment_purchases_desc:0 ""
 HOL_emergency_equipment_purchases_tt:0 "Grants equipment purchase subsidies:\n§Y8000§! £cic£ for §YFighters§!\n§Y6000§! £cic£ for §YInfantry Equipment§!\n§Y3000§! £cic£ for §YAnti-Tank§!\n§Y3000§! £cic£ for §YArtillery§!"
 HOL_bolster_domestic_arms_industry:0 "Expand Artillerie-Inrichtingen"
 HOL_bolster_domestic_arms_industry_desc:0 "We cannot rely indefinitely on foreign suppliers. Redirecting resources toward our own arms factories will help lift the constraints on Dutch military production."
 HOL_german_arms_purchases:0 "German Arms Purchases"
 HOL_german_arms_shipment:0 "German Arms Purchases"
 HOL_german_arms_shipment_desc:0 "Regular deliveries of German equipment arrive in exchange for industrial capacity payments."
 HOL_german_arms_shipment_tt:0 "Every §Y100§! days, grants §Y30§! German §YFighters§!, §Y2000§! §YInfantry Equipment§!, and §Y200§! §YArtillery§!, while §YGermany§! receives §Y3000 Industrial Capacity§! from our payment. §G(This mission repeats itself.)§!"
 HOL_german_shipments_halted_tt:0 "Germany has halted arms shipments to the Netherlands."
 HOL_german_arms_shipments_inactive_tt:0 "The German arms purchase agreement is no longer in effect."
 HOL_defense_of_netherlands:0 "Defense of Netherlands"
 HOL_defense_of_netherlands_desc:0 "Critical wartime missions to preserve Dutch assets, government, and links with the Allies. These missions begin when Germany launches its offensive through the Low Countries."
 HOL_prevent_capture_dutch_ships:0 "Prevent Capture of Dutch Ships Under Construction"
 HOL_prevent_capture_dutch_ships_desc:0 "With the German offensive underway, we must hold Rotterdam long enough for our warships still on the slipways to escape capture. If Holland falls too quickly, the Kriegsmarine will seize our vessels under construction along with our shipping."
 HOL_prevent_capture_dutch_ships_success_tt:0 "Dutch ships under construction have escaped capture."
 HOL_prevent_capture_dutch_ships_fail_tt:0 "§RGermany§! captures Dutch shipping and warships:\n§YGermany§! gains §Y50§! convoys\n§YNetherlands§! loses §Y50§! convoys\n§YGermany§! gains §Y6§! Dutch §Y1936 Submarines§!\n§YGermany§! gains §Y3§! Dutch §Y1940 Light Cruisers§! at §Y60%§! construction progress"
 HOL_evacuate_dutch_gold_reserves:0 "Evacuate Dutch Gold Reserves"
 HOL_evacuate_dutch_gold_reserves_desc:0 "Our gold reserves must be shipped to Britain before Amsterdam falls. Every §Y5 days§! the city holds, another convoy of bullion reaches the United Kingdom. If the Germans seize Amsterdam, they capture whatever remains — up to §Y30000§! £cic£, reduced by §Y5000§! for each completed shipment."
 HOL_evacuate_dutch_gold_reserves_tick_tt:0 "§YThe United Kingdom§! receives §G100§! Million Pounds in evacuated gold reserves."
 HOL_evacuate_dutch_gold_reserves_fail_tt:0 "§RGermany§! captures the remaining Dutch gold reserves worth up to §Y30000§! £cic£, reduced by §Y5000§! for each §Y5-day§! shipment that already reached Britain."
 HOL_evacuate_the_government:0 "Evacuate the Government"
 HOL_evacuate_the_government_desc:0 "The royal family and key ministers must escape The Hague before the city falls. If the government is captured, Germany will find willing collaborators; if we hold long enough, our government-in-exile will retain its political standing abroad."
 HOL_evacuate_the_government_success_tt:0 "Upon capitulation, §YNetherlands§! gains §G25%§! Legitimacy."
 HOL_evacuate_the_government_fail_tt:0 "Upon capitulation, §YGermany§! gains §G30%§! Compliance in all §YNetherlands§! states it controls."
 HOL_evacuate_leeuwarden_air_wing:0 "Evacuate the Leeuwarden Air Wing"
 HOL_evacuate_leeuwarden_air_wing_desc:0 "Ground crews at Leeuwarden must hold the airfield long enough to fly out whatever fighters still airworthy. If the base falls too soon, the Luftwaffe will capture the northern air wing intact."
 HOL_evacuate_leeuwarden_air_wing_success_tt:0 "Upon capitulation, §YNetherlands§! receives §Y50§! fighters and §YJacob van Helsdingen§! as an ace pilot."
 HOL_evacuate_leeuwarden_air_wing_fail_tt:0 "§RGermany§! captures Leeuwarden airfield and seizes §Y50§! Dutch fighters."
 HOL_defense_war_summary_loc:0 "The homeland has fallen after [?HOL_defense_days_held|0] days of resistance. Our armed forces inflicted [?HOL_defense_ger_casualties|0] casualties on the German invaders before capitulation."
 HOL_defense_ships_success_loc:0 "§GDutch warships under construction were scuttled to prevent capture.§!"
 HOL_defense_ships_fail_loc:0 "§RGermany captured Dutch shipping and warships.§!"
 HOL_defense_gold_evacuated_loc:0 "§G[?HOL_gold_evac_ticks_display|0]§! of §G6§! gold convoys reached Britain (§G[?HOL_gold_evac_percent|0%]§! of Dutch gold reserves evacuated).§!"
 HOL_defense_gold_none_loc:0 "§R0§! of §R6§! gold convoys reached Britain (§R0%§! evacuated); §OGermany§! seized the entire Dutch gold reserve.§!"
 HOL_defense_government_success_loc:0 "§GThe government escaped; §ONetherlands§! gained §G25%§! Legitimacy.§!"
 HOL_defense_government_fail_loc:0 "§RThe government was captured; §OGermany§! gained compliance in Dutch states.§!"
 HOL_defense_leeuwarden_air_wing_success_loc:0 "§GThe Leeuwarden air wing escaped; §ONetherlands§! received §O50§! fighters and §OJacob van Helsdingen§! as an ace pilot.§!"
 HOL_defense_leeuwarden_air_wing_fail_loc:0 "§RGermany captured Leeuwarden airfield and seized §O50§! fighters.§!"
 HOL_hold_open_corridor_with_french:0 "Hold Open Corridor with France"
 HOL_hold_open_corridor_with_french_desc:0 "French reinforcements can only reach us through the corridor at Breda. If the Germans cut this lifeline, our ability to counterattack on home soil will collapse."
 HOL_hold_open_corridor_with_french_success_tt:0 "The corridor with France remains open."
 HOL_hold_open_corridor_with_french_fail_tt:0 "§YNetherlands§! suffers §R-10%§! Division Attack on Core Territory until capitulation."
 HOL_demolish_prepared_infrastructure:0 "Demolish Dutch Infrastructure"
 HOL_demolish_prepared_infrastructure_desc:0 "Prepared charges are detonated across the homeland to slow the German advance. Roads, railways, and bridges are wrecked in a scorched-earth effort."
 HOL_demolish_prepared_infrastructure_success_tt:0 "Prepared demolitions are completed: every controlled Dutch core state suffers §R4§! levels of §YInfrastructure§! damage."
 HOL_dutch_line_inundation_mission:0 "Hold Utrecht for Inundation"
 HOL_dutch_line_inundation_mission_desc:0 "We must hold Utrecht for §Y5 days§! while the inundation lines are opened. If German forces capture the city first, the flooding operation will fail."
 HOL_dutch_line_inundation_decision_tt:0 "Begins a §Y5-day§! mission to hold Utrecht while the inundation lines are opened."
 HOL_dutch_line_inundation_success_tt:0 "Utrecht is inundated: the province gains §G+20%§! defense, and one military and one civilian factory in Holland are destroyed."
 HOL_dutch_line_inundation_fail_tt:0 "§RFailure.§! German forces captured Utrecht before the inundation could be completed."
 HOL_increase_agricultural_exports:0 "Expand Dutch Agriculture"
 HOL_increase_agricultural_exports_desc:0 ""
 HOL_public_works_projects:0 "Continue the Public Works"
 HOL_public_works_projects_desc:0 ""
 HOL_solve_the_unemployment_crisis:0 "Solve the Unemployment Crisis"
 HOL_solve_the_unemployment_crisis_desc:0 "With major public works now underway across the country, we can channel new investment into job creation and finally bring relief to the thousands still out of work."
 HOL_invest_in_the_dutch_east_indies:0 "Invest in the Dutch East Indies"
 HOL_invest_in_the_dutch_east_indies_desc:0 ""
 HOL_increase_rubber_production:0 "Increase Rubber Production"
 HOL_increase_rubber_production_desc:0 ""
 HOL_invest_in_the_caribbean_colonies:0 "Invest in the Caribbean Colonies"
 HOL_invest_in_the_caribbean_colonies_desc:0 ""
 HOL_prioritize_dutch_east_indies:0 "Prioritize Dutch East Indies"
 HOL_prioritize_dutch_east_indies_desc:0 ""
 HOL_prioritize_the_atlantic:0 "Prioritize the Atlantic"
 HOL_prioritize_the_atlantic_desc:0 ""
 HOL_increase_colonial_resource_extraction:0 "Increase Colonial Resource Extraction"
 HOL_increase_colonial_resource_extraction_desc:0 "Direct colonial capital into new mines and prospecting surveys across Suriname and the East Indies, turning imperial holdings into strategic raw materials for the metropole."
 HOL_increase_colonial_resource_extraction_tt:0 "Unlocks §YColonial Resource Prospecting§! decisions:\n§YIncrease Suriname Bauxite§!: adds §G40§! §YAluminium§! in Suriname\n§YDevelop Java Iron Sands§!: adds §G24§! §YSteel§! in Java\n§YProspect Dutch New Guinea Tungsten§!: adds §G20§! §YTungsten§! in Dutch New Guinea"
 HOL_colonial_resource_prospecting:0 "Colonial Resource Prospecting"
 HOL_colonial_resource_prospecting_desc:0 "Fund surveys and mine works across the Dutch colonial empire to expand access to strategic raw materials."
 HOL_increase_suriname_bauxite:0 "Increase Suriname Bauxite"
 HOL_increase_suriname_bauxite_desc:0 "Expand bauxite workings around Paranam and the Suriname interior to feed the growing global demand for aluminium."
 HOL_increase_suriname_bauxite_tt:0 "Adds §G40§! §YAluminium§! in §YSuriname§!."
 HOL_develop_java_iron_sands:0 "Develop Java Iron Sands"
 HOL_develop_java_iron_sands_desc:0 "Exploit the iron sand deposits along Java's southern coast, beginning with the Cilacap fields surveyed since the late colonial period."
 HOL_develop_java_iron_sands_tt:0 "Adds §G24§! §YSteel§! in §YJava§!."
 HOL_prospect_dutch_new_guinea_tungsten:0 "Prospect Dutch New Guinea Tungsten"
 HOL_prospect_dutch_new_guinea_tungsten_desc:0 "Extend geological surveys into the Vogelkop and interior highlands of Dutch New Guinea in search of commercially viable wolfram deposits."
 HOL_prospect_dutch_new_guinea_tungsten_tt:0 "Adds §G20§! §YTungsten§! in §YDutch New Guinea§!."
 HOL_increase_colonial_militia:0 "Increase Colonial Militia"
 HOL_increase_colonial_militia_desc:0 "Expand colonial recruitment and arm local militia formations across the East Indies before war reaches the archipelago."
 HOL_increase_colonial_militia_tt:0 "Unlocks §YColonial Militia§! map decisions to prepare garrisons across the East Indies. Prepared units deploy when §YMove Government to Batavia§! is completed."
 HOL_build_up_java:0 "Build Up Java"
 HOL_build_up_java_desc:0 "Expand civilian industry and infrastructure across Java so Batavia and Surabaya can support a larger colonial war effort."
 HOL_build_up_sumatra:0 "Build Up Sumatra"
 HOL_build_up_sumatra_desc:0 "Develop Palembang and Medan with new factories and roads to strengthen our hold on Sumatra."
 HOL_build_up_borneo:0 "Build Up Borneo"
 HOL_build_up_borneo_desc:0 "Invest in Dutch Borneo's ports and industry so the island can better supply and sustain colonial forces."
 HOL_build_up_curacao:0 "Build Up Curaçao"
 HOL_build_up_curacao_desc:0 "Expand industry and infrastructure on Curaçao to secure this vital Caribbean base for the wider Dutch war effort."
 HOL_modernize_colonial_holdings:0 "Modernize Colonial Holdings"
 HOL_modernize_colonial_holdings_desc:0 "Modern administrative and scientific investment in the colonies will pay dividends if the government is ever forced to continue the war from Batavia."
 HOL_modernize_colonial_holdings_tt:0 "If §YMove Government to Batavia§! is later completed, grants §G1§! Research Slot and an event to establish a research facility in Batavia with a matching research breakthrough."
 HOL_move_government_to_batavia:0 "Move Government to Batavia"
 HOL_move_government_to_batavia_desc:0 "The invasion we feared has come to pass, and our defenses have been swept aside. The government has managed to escape and is now in exile, hosted by our allies. Though our Queen would rather that the government remain in exile and 'close to the action' in Europe, we think the time has come to relocate to the East Indies, and from there continue the war as a sovereign power."
 HOL_move_government_to_batavia_does_the_following_tt:0 "Does the Following:"
 HOL_move_government_to_batavia_effect_annex_dei_tt:0 "Annex Dutch East Indies"
 HOL_move_government_to_batavia_effect_war_economy_tt:0 "Grants §YWar Economy§!"
 HOL_move_government_to_batavia_effect_army_penalties_tt:0 "Remove the penalties from §YDutch Army§!"
 HOL_move_government_to_batavia_effect_economy_penalties_tt:0 "Clears §YConstruction Speed§! and §Y£prod_eff_cap!Production Efficiency Cap§! penalties on §YDutch Economy§!"
 HOL_move_government_to_batavia_effect_colonial_garrisons_tt:0 "Spawns prepared Colonial Garrisons"
 HOL_move_government_to_batavia_effect_lose_research_slot_tt:0 "Lose §R1§! Research Slot"
 HOL_move_government_to_batavia_effect_research_facility_tt:0 "Grants a research facility and Breakthrough"
 HOL_batavia_allied_resource_trade_tt:0 "Allies can buy Dutch resources at §G60§! units per civilian factory traded."
 HOL_integrate_colonial_high_command:0 "Integrate Colonial High Command"
 HOL_integrate_colonial_high_command_desc:0 "With the government established in Batavia, the senior officers of the KNIL must be brought fully into the unified Dutch high command to lead the armies of the East Indies."
 HOL_integrate_colonial_high_command_tt:0 "Grants §YGerardus J. Berenschot§!, §YHein ter Poorten§!, and §YPieter Scholten§! as generals."
 HOL_het_verzet:0 "Het Verzet"
 HOL_het_verzet_desc:0 "Though the homeland lies under enemy occupation, the Dutch people refuse to submit. Underground networks across the Netherlands will raise the cost of holding our core territories."
 HOL_het_verzet_tt:0 "Grants §G+10%§! resistance target in occupied Dutch core states.\n§YPrince Bernhard§! becomes available as a §YHigh Command§! advisor with the §YResistance Leader§! trait."
 HOL_no_320_squadron_raf:0 "No. 320 Squadron RAF"
 HOL_no_320_squadron_raf_desc:0 "The exiled Dutch government will coordinate with the Royal Air Force to stand up a Dutch-manned squadron, securing fighters for colonial defence and expanding air assembly capacity in Curaçao."
 HOL_no_320_squadron_raf_tt:0 "Adds §G100§! British fighters to stockpile and §G1§! §YAir Assembly§! in §YCuraçao§!."
 HOL_new_naval_bombers:0 "MLD Expansion"
 HOL_new_naval_bombers_desc:0 "Allied naval bomber production will be redirected to equip Dutch crews for anti-shipping operations across the Caribbean and Pacific."
 HOL_new_naval_bombers_tt:0 "Adds §G100§! naval bombers to stockpile and grants §G100%§! research bonus for naval bomber technology."
 HOL_mobilize_dutch_east_indies:0 "Mobilize Dutch East Indies"
 HOL_mobilize_dutch_east_indies_desc:0 "The war must be fought from the colonies now. Expand military industry across Sumatra, Java, and Borneo to arm the forces defending the East Indies."
 HOL_mobilize_for_war_with_japan:0 "Mobilize for War with Japan"
 HOL_mobilize_for_war_with_japan_desc:0 "With the government relocated to Batavia, the threat from Japan can no longer be treated as a distant colonial concern. Every resource of the East Indies must be placed on a total war footing once open war with Japan begins."
 hol_dei_capitulated_to_jap:0 "The Dutch East Indies have capitulated to Japan"
 HOL_prepare_to_take_back_homeland:0 "Prepare for Our Return"
 HOL_prepare_to_take_back_homeland_desc:0 "While the war in the East Indies rages on, we must never lose sight of the homeland. Train exiled forces, refine coastal assault plans, and prepare the army to fight on Dutch soil once liberation comes."
 HOL_prepare_to_take_back_homeland_core_defence_tt:0 "Adds §G+10%§! Core Defence to §YDutch Army§!."
 HOL_prepare_to_take_back_homeland_tt:0 "Adds §G+10%§! Core Defence and §G+10%§! Core Attack to §YDutch Army§!."
 HOL_liberation_of_the_netherlands:0 "Liberation of the Netherlands"
 HOL_liberation_of_the_netherlands_desc:0 "Holland is ours once more. The government-in-exile can return from abroad, the trappings of a wartime Free Netherlands administration can be set aside, and the nation reunited behind the liberation effort."
 HOL_liberation_of_the_netherlands_tt:0 "Reinstates the Dutch government, moving the capital to §YAmsterdam§! and ending exile status."
 HOL_prince_bernhard_general_tt:0 "§YPrince Bernhard§! is recruited as a §YGeneral§! with the §YResistance Leader§! trait and begins his recurring event chain while at war."
 HOL_prince_bernhard_high_command_tt:0 "§YPrince Bernhard§! becomes available as a §YHigh Command§! advisor with the §YResistance Leader§! trait."
 HOL_prince_bernhard_events_tt:0 "While at war, Prince Bernhard may trigger recurring events covering scandals, morale boosts, air force inspiration, strategic meddling, intelligence work, and resistance organizing."
 HOL_rebuild_dutch_industry:0 "Rebuild Dutch Industry"
 HOL_rebuild_dutch_industry_desc:0 "Liberation has left factories wrecked and supply chains broken across the Randstad and the northern provinces. A concerted reconstruction programme will put the mainland's workshops back to work for the war effort."
 HOL_rebuild_dutch_industry_tt:0 "Adds §G10§! §Ycivilian factories§! across mainland Netherlands:\n§G4§! in §YHolland§!\n§G3§! in §YGelderland§!\n§G3§! in §YFriesland§!"
 HOL_mobilize_resistance_groups:0 "Mobilize Resistance Groups"
 HOL_mobilize_resistance_groups_desc:0 "Underground cells across occupied Holland are ready to act. Sabotage the occupier's fortifications and prepare partisan cadres to rise up the moment our armies return to the great cities of the Randstad."
 HOL_mobilize_resistance_groups_tt:0 "Damages §R3§! levels of §Yforts§! in §YHolland§!.\nWhen §YRotterdam§!, §YAmsterdam§!, or §YThe Hague§! are retaken, spawns §G3§! §YLight Infantry§! divisions in each city."
 HOL_repair_the_dikes:0 "Repair the Dikes"
 HOL_repair_the_dikes_desc:0 "The emergency inundations that held back the invader have left the polders waterlogged and the countryside impassable. Engineers and civilian labour must drain the land so Holland can be lived in — and fought over — once more."
 HOL_repair_the_dikes_tt:0 "Removes §YDutch Line Inundation§! from §YUtrecht§! and §YGrebbe Line§! inundation modifiers from §YArnhem§! and §YNijmegen§!."
 HOL_deny_japanese_resources:0 "Deny Japanese Resources"
 HOL_deny_japanese_resources_desc:0 "If we cannot hold every island, we can still ensure Japan gains little from them. Prepare scorched-earth plans to wreck infrastructure and destroy oil stocks before the enemy can exploit our colonial riches."
 HOL_deny_japanese_resources_focus_tt:0 "Unlocks §YDeny Japanese Resources§! decisions."
 HOL_deny_japanese_resources_state_tt:0 "Damages §Yinfrastructure§! by §R5§! levels and destroys §Rhalf§! of the state's §Yoil§! reserves. Cancelled if control of the state is lost before completion."
 HOL_deny_japanese_resources_335:0 "Deny Resources in Java"
 HOL_deny_japanese_resources_672:0 "Deny Resources in Sumatra"
 HOL_deny_japanese_resources_334:0 "Deny Resources in Borneo"
 HOL_deny_japanese_resources_667:0 "Deny Resources in the Lesser Sunda Islands"
 HOL_deny_japanese_resources_673:0 "Deny Resources in Sulawesi"
 HOL_scuttle_east_indies_factories:0 "Scuttle East Indies Factories"
 HOL_scuttle_east_indies_factories_desc:0 "Rather than let Japanese occupation turn our colonial workshops into war machines, we will wreck what industry we cannot evacuate across Borneo, Java, Sumatra, and Sulawesi."
 HOL_scuttle_east_indies_factories_tt:0 "In each of the following states still owned and controlled by the Netherlands, destroys §R1§! §Ycivilian factory§!, §R1§! §Ymilitary factory§!, and §R1§! §Ydockyard§!:\n§YBorneo§!\n§YJava§!\n§YSumatra§!\n§YSulawesi§!"
 HOL_move_industry_west:0 "Move Industry West"
 HOL_move_industry_west_desc:0 "Heavy industry in the East Indies cannot be saved where Japanese armies and fleets are strongest. Dismantle factories across the archipelago and ship them west to safer off-map production sites before they can be captured."
 HOL_move_industry_west_mission:0 "Evacuate East Indies Industry"
 HOL_move_industry_west_tt:0 "Activates a repeating mission. Every §Y25§! days, removes §G1§! §Ymilitary§! or §Ycivilian§! factory from a random controlled Dutch East Indies state and adds it as §Yoff-map§! industry. Stops when no evacuable factories remain.\nGrants §G2§! §Y50%§! research bonuses for §YArmy Doctrine§!."
 HOL_move_government_to_curacao:0 "Move Government to Curaçao"
 HOL_move_government_to_curacao_desc:0 "With the homeland overrun and the East Indies under growing threat, the cabinet can regroup on Curaçao — a secure Caribbean base whose refineries and ports can sustain our government-in-exile."
 HOL_move_government_to_curacao_tt:0 "Moves the capital to §YCuraçao§!."
 HOL_abda_command:0 "Form ABDA Command"
 HOL_abda_command_desc:0 "American, British, Dutch, and Australian forces must fight as one under a single Southwest Pacific command. Unified planning and coastal defense preparations will make every held island harder for Japan to seize by sea."
 HOL_abda_command_tt:0 "Every Dutch East Indies state currently controlled by the Netherlands gains §YABDA Coastal Defense§!, giving §G+10%§! naval invasion penalty while the Netherlands holds the state."
 HOL_reform_colonial_doctrines:0 "Revise the Defensiegrondslagen"
 HOL_reform_colonial_doctrines_desc:0 "Fighting across jungle, islands, and open sea demands new thinking. Consolidate lessons from the East Indies theater into a streamlined doctrine program for army, fleet, and air forces alike."
 HOL_integrated_doctrine_mastery:0 "Combined KNIL Maneuvers"
 HOL_integrated_doctrine_mastery_desc:0 "KNIL, navy, and air units must fight as one archipelagic defense force. Intensive combined training accelerates mastery across every active doctrine track."
 HOL_organize_defense_of_java:0 "Organize Defense of Java"
 HOL_organize_defense_of_java_desc:0 "Divert off-map industry into entrenchments, supply dumps, and prepared positions across Java before Japanese landings begin in earnest."
 HOL_organize_defense_of_borneo:0 "Organize Defense of Borneo"
 HOL_organize_defense_of_borneo_desc:0 "Borneo's jungles and coasts must be turned into a layered defensive zone while we still hold the island."
 HOL_organize_defense_of_sumatra:0 "Organize Defense of Sumatra"
 HOL_organize_defense_of_sumatra_desc:0 "Sumatra's ports and plantations cannot be defended without prepared fortifications and entrenched colonial garrisons."
 HOL_organize_defense_of_eastern_islands:0 "Organize Defense of the Eastern Islands"
 HOL_organize_defense_of_eastern_islands_desc:0 "Sulawesi anchors our eastern defenses. Fortify the island before enemy fleets cut it off from the rest of the archipelago."
 HOL_take_back_java:0 "Take Back Java"
 HOL_take_back_java_desc:0 "Coordinate naval bombardment and amphibious planning to break Japanese entrenchments across Java and prepare the island for liberation."
 HOL_take_back_borneo:0 "Take Back Borneo"
 HOL_take_back_borneo_desc:0 "Softening enemy defenses on Borneo will make our counter-offensive far less costly when the fleet returns to reclaim the island."
 HOL_take_back_sumatra:0 "Take Back Sumatra"
 HOL_take_back_sumatra_desc:0 "Sumatra's garrison must be pounded from the sea before we can land the forces needed to restore Dutch rule."
 HOL_take_back_eastern_islands:0 "Take Back the Eastern Islands"
 HOL_take_back_eastern_islands_desc:0 "Sulawesi and the surrounding eastern islands cannot be retaken until we shatter the enemy's prepared positions."
 HOL_organize_island_defense_tt:0 "Removes §R1§! §Yoff-map civilian factory§! and grants the target state §G+10§! Max Entrenchment and §G+50%§! Entrenchment Speed for §Y60§! days."
 HOL_organized_defense_java_timer:0 "Organized Defense of Java"
 HOL_organized_defense_java_timer_desc:0 "Colonial garrison works are strengthening Java's prepared defenses. §YOrganized Island Defense§! remains active until this mission expires in §Y60§! days."
 HOL_organized_defense_borneo_timer:0 "Organized Defense of Borneo"
 HOL_organized_defense_borneo_timer_desc:0 "Colonial garrison works are strengthening Borneo's prepared defenses. §YOrganized Island Defense§! remains active until this mission expires in §Y60§! days."
 HOL_organized_defense_sumatra_timer:0 "Organized Defense of Sumatra"
 HOL_organized_defense_sumatra_timer_desc:0 "Colonial garrison works are strengthening Sumatra's prepared defenses. §YOrganized Island Defense§! remains active until this mission expires in §Y60§! days."
 HOL_organized_defense_eastern_islands_timer:0 "Organized Defense of the Eastern Islands"
 HOL_organized_defense_eastern_islands_timer_desc:0 "Colonial garrison works are strengthening Sulawesi's prepared defenses. §YOrganized Island Defense§! remains active until this mission expires in §Y60§! days."
 HOL_take_back_island_focus_tt:0 "Grants the target state §YDutch Assault§! (§Y35§! days) which applies:\n Max Entrenchment: §R-50%§!\n Fort Damage from Combat: §G+40%§!"
 HOL_integrate_with_the_allies:0 "Integrate with the Allies"
 HOL_integrate_with_the_allies_desc:0 "With Java, Sumatra, and Kalimantan lost and the homeland under enemy occupation, the Dutch war effort can only continue as part of the wider Allied coalition. We will hand remaining colonial assets to our partners and join the Soviet struggle in Europe."
 HOL_integrate_with_the_allies_tt:0 "§YRemaining Dutch East Indies territories§! and any divisions stationed there transfer to §Y[AST.GetNameDef]§! if they have not capitulated.\n§YCapital ships§! and §Ysubmarines§! transfer to §Y[USA.GetNameDef]§!; §Ydestroyers§! transfer to §Y[ENG.GetNameDef]§!.\n§YOff-map factories and dockyards§! are divided among §Y[AST.GetNameDef]§!, §Y[RAJ.GetNameDef]§!, and §Y[SAF.GetNameDef]§! if they have not capitulated.\n§YCuraçao§! and §YSuriname§! transfer to §Y[USA.GetNameDef]§! if still held.\nEquipment stockpiles go to §Y[RAJ.GetNameDef]§!, otherwise §Y[ENG.GetNameDef]§!, otherwise §Y[USA.GetNameDef]§!; §Yconvoys§! go to §Y[USA.GetNameDef]§!.\n§YAir wings§! transfer to §Y[ENG.GetNameDef]§!.\nThe player is transferred to §Y[SOV.GetNameDef]§! cooperative play."
 HOL_defend_java:0 "Defend Java"
 HOL_defend_java_desc:0 ""
 HOL_fortify_sumatra:0 "Fortify Sumatra"
 HOL_fortify_sumatra_desc:0 "Harden Palembang, Medan, and the Sumatran coastline against invasion from the sea."
 HOL_fortify_borneo:0 "Fortify Borneo"
 HOL_fortify_borneo_desc:0 "Strengthen Dutch Borneo's ports and coastal defenses before the enemy can seize Kalimantan."
 HOL_fortify_other_east_indies_islands:0 "Fortify the Outer Islands"
 HOL_fortify_other_east_indies_islands_desc:0 "Extend garrison fortifications across the Lesser Sunda Islands, Sulawesi, West Papua, and the Moluccas."
 HOL_adapt_to_modern_ways_of_war:0 "Adapt to Modern Ways of War"
 HOL_adapt_to_modern_ways_of_war_desc:0 "Lessons from the fall of the Netherlands and the fight for the Indies must be absorbed into how our remaining forces train and fight."
 HOL_commit_to_defense:0 "Commit to Defense"
 HOL_commit_to_defense_desc:0 "Pour every available colonial recruit into static garrisons across the Indies rather than gamble on offensive arms."
 HOL_commit_to_defense_tt:0 "Spawns §G10§! §YGarrison§! divisions across Batavia, Surabaya, Palembang, Medan, and Dutch Borneo."
 HOL_form_a_marine_corps:0 "Royal Netherlands Marine Corps"
 HOL_form_a_marine_corps_desc:0 "Train colonial marines and expand our amphibious lift so garrison forces can strike back across the archipelago."
 HOL_form_a_marine_corps_tt:0 "Grants §G2§! §Y50%§! research bonuses for §YArmy Doctrine§!, §G3§! §Y50%§! research bonuses for §YSpecial Forces Doctrine§!, and §G100%§! research bonus for §YTransport Planes§!."
 HOL_light_tanks_remove_tank_penalty_tt:0 "Removes the §YDutch Army§! §R+200%§! armor production cost penalty."
 HOL_fortify_caribbean:0 "Fortify Caribbean"
 HOL_fortify_caribbean_desc:0 "Curaçao and Suriname are the linchpins of our Atlantic empire. Coastal batteries, inland strongpoints, and anti-air defenses must be expanded before the enemy can seize our Caribbean bases."
 HOL_improve_curacao_infrastructure:0 "Improve Curaçao Infrastructure"
 HOL_improve_curacao_infrastructure_desc:0 "Expand roads, ports, and supply links across Curaçao so the island can better support garrisons and the wider Caribbean war effort."
 HOL_build_up_suriname:0 "Build Up Suriname"
 HOL_build_up_suriname_desc:0 "Improve infrastructure and industrial capacity in Suriname so the colony can sustain bauxite exports and garrison the South American flank of our Caribbean defenses."
 HOL_buy_equipment_from_the_usa:0 "Buy Equipment from the USA"
 HOL_buy_equipment_from_the_usa_desc:0 "Open trade with Washington and secure access to American arms markets to keep our forces supplied."
 HOL_buy_equipment_from_the_usa_tt:0 "Grants §Ymarket access§! to §Y[USA.GetNameDef]§! and unlocks §YProcure Equipment§! decisions once the United States completes §YCash and Carry§!."
 HOL_coordinate_navy_with_allies:0 "Coordinate Navy With Allies"
 HOL_coordinate_navy_with_allies_desc:0 "With the homeland lost, our surviving fleet must fight as part of the Allied naval effort in the Atlantic and Pacific."
 HOL_take_over_convoy_escort:0 "Take Over Convoy Escort"
 HOL_take_over_convoy_escort_desc:0 "Accept responsibility for escorting Allied convoys with modern destroyers equipped for anti-submarine warfare."
 HOL_take_over_convoy_escort_tt:0 "Grants §Y1940 Sonar§!, §Y1940 Depth Charges§!, §Y1940 Destroyer Hulls§!, and §YGun Laying Radar§!."
 HOL_bolster_submarine_fleet:0 "Bolster Submarine Fleet"
 HOL_bolster_submarine_fleet_desc:0 "Expand the Koninklijke Marine's submarine arm to raid enemy shipping from colonial bases."
 HOL_bolster_submarine_fleet_tt:0 "Removes §YDisrupted Submarine Production§! if present.\nGrants the §YSubmarine Upkeep§! spirit. As the submarine fleet grows, production costs will rise through upkeep tiers at one-third of Germany's submarine thresholds."
 HOL_expand_colonial_shipyards:0 "Expand Colonial Shipyards"
 HOL_expand_colonial_shipyards_desc:0 "Expand shipbuilding capacity across our colonial holdings so the fleet can be rebuilt and sustained far from the occupied homeland."
 HOL_colonial_militia:0 "Colonial Militia"
 HOL_colonial_militia_desc:0 "Raise and equip colonial garrison formations across the Dutch East Indies. These decisions are only available in peacetime."
 HOL_java_garrisons:0 "Java Garrisons"
 HOL_java_garrisons_desc:0 "Organize colonial militia in Java around Batavia and Surabaya."
 HOL_java_garrisons_tt:0 "Costs §Y100§! Political Power, §Y2000§! Infantry Equipment, and §Y10000§! Manpower.\nOn §YMove Government to Batavia§!: spawns §Y3§! §YKoloniale Garnizoen Divisie§! — §Y2§! at Batavia and §Y1§! at Surabaya."
 HOL_sumatra_garrisons:0 "Sumatra Garrisons"
 HOL_sumatra_garrisons_desc:0 "Organize colonial militia in Sumatra around Palembang and Medan."
 HOL_sumatra_garrisons_tt:0 "Costs §Y100§! Political Power, §Y2000§! Infantry Equipment, and §Y10000§! Manpower.\nOn §YMove Government to Batavia§!: spawns §Y3§! §YKoloniale Garnizoen Divisie§! — §Y2§! at Palembang and §Y1§! at Medan."
 HOL_borneo_garrisons:0 "Borneo Garrisons"
 HOL_borneo_garrisons_desc:0 "Organize colonial militia garrisons at each major port in Borneo."
 HOL_borneo_garrisons_tt:0 "Costs §Y70§! Political Power, §Y1500§! Infantry Equipment, and §Y7000§! Manpower.\nOn §YMove Government to Batavia§!: spawns §Y1§! §YKoloniale Garnizoen Divisie§! at each Borneo port."
 HOL_lesser_sunda_garrisons:0 "Lesser Sunda Garrisons"
 HOL_lesser_sunda_garrisons_desc:0 "Organize colonial militia garrisons at each major port in the Lesser Sunda Islands."
 HOL_lesser_sunda_garrisons_tt:0 "Costs §Y70§! Political Power, §Y1500§! Infantry Equipment, and §Y7000§! Manpower.\nOn §YMove Government to Batavia§!: spawns §Y1§! §YKoloniale Garnizoen Divisie§! at each Lesser Sunda port."
 HOL_sulawesi_garrisons:0 "Sulawesi Garrisons"
 HOL_sulawesi_garrisons_desc:0 "Organize colonial militia garrisons at each major port in Sulawesi."
 HOL_sulawesi_garrisons_tt:0 "Costs §Y50§! Political Power, §Y1000§! Infantry Equipment, and §Y5000§! Manpower.\nOn §YMove Government to Batavia§!: spawns §Y1§! §YKoloniale Garnizoen Divisie§! at each Sulawesi port."
 HOL_west_papua_garrisons:0 "West Papua Garrisons"
 HOL_west_papua_garrisons_desc:0 "Organize a colonial militia garrison at the West Papua port."
 HOL_west_papua_garrisons_tt:0 "Costs §Y25§! Political Power, §Y500§! Infantry Equipment, and §Y2500§! Manpower.\nOn §YMove Government to Batavia§!: spawns §Y1§! §YKoloniale Garnizoen Divisie§! at the West Papua port."
 HOL_moluccas_garrisons:0 "Moluccas Garrisons"
 HOL_moluccas_garrisons_desc:0 "Organize colonial militia garrisons at each major port in the Moluccas."
 HOL_moluccas_garrisons_tt:0 "Costs §Y50§! Political Power, §Y1000§! Infantry Equipment, and §Y5000§! Manpower.\nOn §YMove Government to Batavia§!: spawns §Y1§! §YKoloniale Garnizoen Divisie§! at each Moluccas port."
 HOL_increase_curacao_oil_production:0 "Increase Curaçao Oil Production"
 HOL_increase_curacao_oil_production_desc:0 "Curaçao's oil fields are among our most valuable colonial assets. Further investment in extraction and refining infrastructure will secure the fuel supplies our fleet and industry will need."
 HOL_begin_naval_expansion:0 "Begin Naval Expansion"
 HOL_begin_naval_expansion_desc:0 "The Royal Netherlands Navy must grow to defend our trade routes and colonial possessions. Expanding dockyard capacity at home and across the Caribbean will lay the foundation for a modern fleet."
 HOL_increase_colonial_shipbuilding_efforts:0 "Increase Colonial Shipbuilding Efforts"
 HOL_increase_colonial_shipbuilding_efforts_desc:0 "Colonial yards and off-map shipbuilding contracts can supplement our limited metropolitan industry, allowing the fleet to expand even when European construction capacity is stretched thin."
 HOL_focus_on_submarines:0 "Focus on Submarines"
 HOL_focus_on_submarines_desc:0 "Submarines offer a cost-effective means of contesting hostile fleets and commerce. Concentrating our naval expansion on undersea warfare will give us a sharp edge against stronger maritime powers."
 HOL_focus_on_destroyers:0 "Focus on Destroyers"
 HOL_focus_on_destroyers_desc:0 "Destroyers are the backbone of fleet escort and coastal defense. Prioritizing their design and construction will strengthen our ability to protect convoys and contest enemy surface forces."
 HOL_expand_east_indies_naval_yards:0 "Expand East Indies Naval Yards"
 HOL_expand_east_indies_naval_yards_desc:0 "Establish new shipbuilding capacity across the outer islands of the East Indies to support fleet expansion beyond the home provinces."
 HOL_expand_java_naval_yards:0 "Soerabaja Naval Arsenal"
 HOL_expand_java_naval_yards_desc:0 "Concentrate colonial dockyard construction on Java, where industry and manpower can sustain larger naval production."
 HOL_mobilize_the_dutch_navy:0 "Mobilize the Dutch Navy"
 HOL_mobilize_the_dutch_navy_desc:0 "With yards expanded at home and in the colonies, the fleet can be brought to full readiness for the war we have long feared."
 HOL_mobilize_the_dutch_navy_shore_bombardment_tt:0 "Adds §G+100%§! Shore Bombardment to §YDutch Army§!."
 RULE_NO_FATHER_SPIRIT:0 "No Father"
 RULE_NO_FATHER_SPIRIT_DESC:0 "The No Father spirit is designed to allow hosts to prevent air and navy minors if they wish without fears of rule skirters or excessive need of the OAK tool."
 RULE_OPTION_SPIRIT_ENABLED:0 "Enabled"
 RULE_OPTION_SPIRIT_DISABLED:0 "Disabled"
 SUBWIPE:0 "§HDelete All Submarines§!\nDeletes every submarine belonging to the owner of the selected state.\n\n"
 SUBWIPE_DELAYED:0 ""
 MILREMOVE:0 "§HRemove 1 Military Factory§!\nRemoves a military factory from the selected state, or an offsite factory from the state's owner if none are present in the state.\n\n"
 MILREMOVE_DELAYED:0 ""
 horsttool.1.t:0 "Oak Tool"
 horsttool.11.t:0 "Oak Tool"
 horsttool.12.t:0 "Oak Tool"
 horsttool.13.t:0 "Oak Tool"
 horsttool.14.t:0 "Oak Tool"
 horsttool.15.t:0 "Oak Tool"
 horsttool.30.t:0 "How to use Oak Tool"
 reichswerke_hermann_goring_early:0 "Early Reichswerke Hermann Göring"
 reichswerke_hermann_goring_early_desc:0 "Established in 1937 under the control of Göring with unchecked access to state financing. This is simply the first stage of Göring's state-owned steel conglomerate. Other companies have been absorbed, steel production has increased. All captured assets are now the property of the state. §GThe potential is limitless...§!"
 SOV_STAVKA:0 "STAVKA"
 SOV_STAVKA_desc:0 "The Soviet High Command, responsible for all offensive and defensive plans taken during the War."
 SOV_Gosplan_modifier:0 "Gosplan"
 SOV_Gosplan_modifier_desc:0 "State of the central economic policy of the Soviet Union"
 SOV_Yezhovshchina:0 "Yezhovchina"
 SOV_Yezhovshchina_desc:0 "The political monolith in wake of the purges"
 SOV_armament_plan:0 "Re-Armament Plan"
 fascist_assault_divisions_romania:0 "Fascist Assault Divisions"
 fascist_assault_divisions_romania_desc:0 "Fanatical paramilitaries of the fascist movement have been folded into the regular army. Their zeal swells the ranks and stokes the cause, but their indiscipline frays the home front."
 HOL_gerardus_berenschot:0 "Gerardus J. Berenschot"
 HOL_pieter_scholten:0 "Pieter Scholten"
 HOL_dirk_jan_de_geer:0 "Dirk Jan de Geer"
 HOL_pieter_sjoerds_gerbrandy:0 "Pieter Sjoerds Gerbrandy"
 HOL_charles_douw_van_der_krap:0 "Charles Douw van der Krap"
 HOL_nico_van_straten:0 "Nico van Straaten"
 HOL_philips_desc:0 "Philips designs and builds electronics for military and civilian use."
 HOL_hoogovens:0 "Koninklijke Nederlandse Hoogovens"
 HOL_hoogovens_research:0 "Koninklijke Nederlandse Hoogovens"
 HOL_hoogovens_research_desc:0 "Hoogovens leads Dutch heavy industry and metallurgical research."
 HOL_artillerie_inrichtingen_research:0 "Artillerie-Inrichtingen"
 HOL_artillerie_inrichtingen_research_desc:0 "Artillerie-Inrichtingen designs and builds all types of small arms."
 HOL_hih_siderius_research:0 "Haarlem'sche IJzer- en Staalgieterij"
 HOL_hih_siderius_research_desc:0 "HIH Siderius designs and builds artillery, coastal defence guns, and rocket weapons."
 HOL_nsm_amsterdam_research:0 "Nederlandsche Scheepsbouw Maatschappij"
 HOL_nsm_amsterdam_research_desc:0 "NSM Amsterdam researches and develops Dutch naval vessels."
 HOL_fokker_research:0 "Fokker"
 HOL_fokker_research_desc:0 "Fokker researches and develops Dutch military aircraft."
