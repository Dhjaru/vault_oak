 ARG_GATHERING_STORM_DESC:0 "In 1930, the cabinet of Hipólito Yrigoyen was overthrown in the first military coup since the adoption of the Argentine Constitution, ushering in what was known as the Infamous Decade. Argentina must navigate a rapidly changing world where great powers threaten the fragile peace that has been held since the end of the Great War. \n\nWhat is the more prominent threat? The gathering storm in Europe? Their very own neighbors? Or themselves? Argentina will have to stand its ground and cement its place on the world stage."
