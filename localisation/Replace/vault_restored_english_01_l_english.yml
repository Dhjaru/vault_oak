 landmark_bojnice_castle:0 "The Bojnice Castle"
 landmark_bojnice_castle_desc:0 "The Bojnice castle once hosted Hungarian kings and other high-ranking nobles, but since its separation from Hungary in 1920, it serves as one of the most beautiful structures in Slovakia."
 landmark_prague_castle:0 "The Prague Castle"
 landmark_prague_castle_desc:0 "The ancient Prague Castle, the largest in the world, has served for centuries as the residence of kings, emperors and now finally the presidents of Czechoslovakia. Its exterior makes clear that is not a defensive structure, but a symbol of power, being reminiscent of grand palaces. While behind its outer walls it features Czechoslovakia's largest church, finished in 1926."
 BUL_airforce_buildup:0 "Bulgarian Air Force Buildup"
 BUL_airforce_buildup_desc:0 "Our revived air force requires modern aircraft in numbers that Bulgarian industry cannot yet provide. Until domestic production is capable of satisfying our needs, we may turn to Europe's established aviation industries to rapidly expand and modernize our aerial forces."
 BUL_purchase_german_planes:0 "Purchase German Aircraft"
 BUL_purchase_german_planes_desc:0 "Germany possesses one of Europe's most rapidly developing aviation industries. By negotiating a contract with German manufacturers, we can acquire modern military aircraft and accelerate the modernization of the Bulgarian Air Force."
 BUL_purchase_polish_planes:0 "Purchase Polish Aircraft"
 BUL_purchase_polish_planes_desc:0 "Poland has developed a capable domestic aviation industry and several modern aircraft designs suitable for our requirements. Purchasing Polish machines would provide our air force with valuable equipment while reducing our dependence upon any single foreign supplier."
 BUL_purchase_italian_planes:0 "Purchase Italian Aircraft"
 BUL_purchase_italian_planes_desc:0 "Italy has considerable experience in both aircraft production and military aviation. Contracts with Italian manufacturers could provide Bulgaria with modern aircraft quickly and strengthen our military ties with Rome."
 BUL_establish_an_airforce:0 "Establish an Air Force"
 BUL_establish_an_airforce_desc:0 "The restrictions imposed upon Bulgaria after the Great War left our military aviation crippled and neglected. If Bulgaria is to defend its skies and pursue its national ambitions, we must once again establish a proper military air force."
 BUL_build_supporting_infrastructure:0 "Build Supporting Infrastructure"
 BUL_build_supporting_infrastructure_desc:0 "Aircraft alone cannot constitute an effective air force. New airfields, maintenance facilities, fuel depots and communications networks must be constructed throughout the country if our aviators are to operate efficiently in both peace and war."
 BUL_Pilot_Training:0 "Expand Pilot Training"
 BUL_Pilot_Training_desc:0 "Modern aircraft are of little use without skilled men to fly them. By expanding our flight schools and developing a standardized training program, we can create a new generation of Bulgarian pilots capable of meeting the demands of modern aerial warfare."
 BUL_Foreign_contracts:0 "Foreign Contracts"
 BUL_Foreign_contracts_desc:0 "Our domestic industry cannot yet provide all of the aircraft and equipment required by a modern air force. Agreements with foreign manufacturers will allow us to obtain modern designs while exposing Bulgarian engineers and pilots to the latest developments in military aviation."
 BUL_Establish_domestic_production:0 "Establish Domestic Production"
 BUL_Establish_domestic_production_desc:0 "Reliance upon foreign suppliers leaves our air force vulnerable to diplomatic pressure and disrupted supply lines. By investing in domestic factories, technical expertise and aircraft assembly facilities, Bulgaria can begin building the machines required to defend its own skies."
 BUL_Standing_with_the_giants:0 "Standing with the Giants"
 BUL_Standing_with_the_giants_desc:0 "Air power has become an independent instrument of modern warfare, deserving the same attention and authority as the traditional branches of the armed forces. Our airmen must be granted the institutional independence necessary to develop their own doctrine and command structure."
 BUL_Airforce_Subordinate_to_the_Army:0 "Air Force Subordinate to the Army"
 BUL_Airforce_Subordinate_to_the_Army_desc:0 "Bulgaria's limited resources cannot be wasted upon competing military institutions. Aviation should remain closely integrated with the army, concentrating upon reconnaissance, battlefield support and the destruction of enemy forces in direct cooperation with our troops."
 BUL_an_airforce_to_match_the_ambition:0 "An Air Force to Match Our Ambition"
 BUL_an_airforce_to_match_the_ambition_desc:0 "Bulgaria's aspirations cannot be secured by land forces alone. With trained pilots, modern aircraft and an expanding aviation industry, we can forge an air force worthy of our national ambitions and capable of contesting the skies of the Balkans."
