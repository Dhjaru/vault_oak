 ARG_BLITZKRIEG_DESC:0 "Through the most fraudulent election in Argentinian history, the Concordancia continue to hold a majority in government with Roberto María Ortiz now running the country as its president. \n\nHowever as tensions rise between Argentina’s two closest friends in Europe, the country must now prepare for the inevitability of being torn between two factions. Not only that, discontent in the military grows, and paranoia is constantly stoked about their ever slumbering rival in the north. Argentina stands at a major crossroads, and must think carefully on how to react."
