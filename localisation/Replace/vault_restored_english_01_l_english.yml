 BEL_GATHERING_STORM_DESC:0 "Belgium remains scarred by its experiences in the Great War, with large parts of the nation still lying in ruin and deeper wounds to be found in the psyche of its people. The democratic future of the nation itself is in some question, beset as it is by allegations of corruption brought against them by various fascist factions. \n\nInternationally Belgium treads a tight rope between the treaty obligations to those who turned the nation into a battlefield, and concerns for their ongoing security in an increasingly unsettled world."
