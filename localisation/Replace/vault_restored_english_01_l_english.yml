 MAN_field_gun_equipment_1_desc:0 "Although we had extensive experience with artillery, as the result of the war with Russia and had the technology and industrial infrastructure to construct medium or large caliber naval weapons prior to the Great War, planners at the Imperial Japanese Army General Staff turned to Krupp in Germany, for the latest trend in artillery design. So, Krupp 7.5 cm Model 1903 were imported. However, after the Great War, Japanese production capabilities had improved, and the Type 38 underwent a re-design in Japan to improve the carriage, with a corresponding increase in elevation, range and rate of fire to 10-12 rounds per minute."
 ITA_heavy_artillery_equipment_1_desc:0 "A German sFH 13 licensed and produced in Italy. The howitzers carriage is modified to allow the wheels to extend to allow extra clearance for the breech to recoil. This combined with a modified recoil mechanism and elevation mechanism allows up to 65° of elevation."
