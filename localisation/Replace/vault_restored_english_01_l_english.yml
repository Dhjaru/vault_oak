 AST_air_command_of_the_ministry_of_the_army_desc:0 "The growing importance of military aviation demands a more coherent command structure. By placing our air forces under a dedicated command within the Ministry of the Army, we can better coordinate procurement, training and operational planning for the conflicts to come."
