 AST_BLITZKRIEG_TAOG_DESC:0 "Out of their slumber, the diggers emerge, rubbing the sleep from their eyes as their ANZAC spirits awaken. As Australians don their uniforms and bid their homeland farewell once more, the prospect of war hangs in the air like a starting gun waiting to fire.\n\nWill the military investments of recent years be enough to repel European threats as well as Asian ones, and will Britain be able to uphold its promises to Australia while stretched thin across the globe? Many questions remain, but one has always been answered: when battles are to be fought, Australia will be there to fight them."
