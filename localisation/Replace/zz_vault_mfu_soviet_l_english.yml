 soviet.133.t:0 "Koshkin's T-34 Test Run"
 soviet.133.desc:0 "Tank designer Mikhail Koshkin has recently proposed a revolutionary tank design, the T-34. The T-34, meant to be more of a ‘universal tank’, is heavier than the BT-7 while being easier to produce when compared to the heavy T-35. To prove that the tank can be operational and useful in adverse conditions, Koshkin proposed to lead the tank himself from Kharkov to Moscow. The route would require him to drive through 744 kilometres of mud, snow and rivers while avoiding large roads and cities for fear of German spies."
 soviet.133.a:0 "Excellent."
