 SOV_motorized_equipment_1_desc:0 "Serial production of the ZIS-5 started on October 1, 1933. The truck was an instant success and, which together with the GAZ-AA, became the main Soviet truck of 1930-50's. It also evolved into the workhorse of the Soviet armed forces. During the war the ZIS-5 was used on all fronts, where it was greatly appreciated for its remarkably simple and reliable construction."
