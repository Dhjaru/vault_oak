 SOV_found_the_warsaw_pact_desc:0 "As the winds of change are blowing over Europe, it is becoming ever more clear that we will need a collective defense treaty in order to stave off any aggression from the decadent west. To this end, we should formalize the Warsaw Pact Organization, a military complement to the COMECON."
