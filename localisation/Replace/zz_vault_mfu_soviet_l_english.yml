 SOV_mechanized_equipment:0 "Mechanized"
 SOV_mechanized_equipment_short:0 "Mechanized"
 SOV_mechanized_equipment_desc:0 "Mechanized infantry is infantry equipped with armored personnel carriers (APCs) or infantry fighting vehicles (IFVs) for transport and combat. Mechanized infantry is distinguished from motorized infantry in that its vehicles provide a degree of protection from hostile fire, as opposed to soft-skinned wheeled vehicles (trucks or jeeps) for motorized infantry."
 SOV_mechanized_equipment_1:0 "TB-42"
 SOV_mechanized_equipment_1_short:0 "TB-42"
 SOV_mechanized_equipment_1_desc:0 "An armoured personnel carrier on a chassis of ZIS-42 semi-tracked truck"
 SOV_mechanized_equipment_2:0 "B-3"
 SOV_mechanized_equipment_2_short:0 "B-3"
 SOV_mechanized_equipment_2_desc:0 "The B-3 was an armoured personnel carrier developed on the ZiS-22 chassis, and borrowed the track system from the T-40 light tank."
 SOV_mechanized_equipment_3:0 "BTR-152"
 SOV_mechanized_equipment_3_short:0 "BTR-152"
 SOV_mechanized_equipment_3_desc:0 "Mechanized infantry is infantry equipped with armored personnel carriers (APCs) or infantry fighting vehicles (IFVs) for transport and combat. Mechanized infantry is distinguished from motorized infantry in that its vehicles provide a degree of protection from hostile fire, as opposed to soft-skinned wheeled vehicles (trucks or jeeps) for motorized infantry."
