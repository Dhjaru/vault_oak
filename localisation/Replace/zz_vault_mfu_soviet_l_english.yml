 SOV_phase_of_5_year_plan_focus_tt:0 "A state must have been marked by the great industrial planners of the Union to be a part of the next phase of the five year plan for this focus to have any effects.\n\nEvery §Y80 days§!, a new state will be marked automatically!\n\nWill be bypassed if you do not have the idea §YStalin's Second Five Year Plan§!\n\n"
 SOV_phase_of_5_year_plan_focus_arms_tt:0 "\nA state must have been marked by the great industrial planners of the Union to be a part of the next phase of the five year plan for this focus to have any effects.\n\nEvery §Y80 days§!, a new state will be marked automatically!\n\nWill be bypassed if you do not have the idea §YStalin's Second Five Year Plan§!\n\n"
 SOV_mark_for_5_year_plan_tt:0 "This §Ydecision§! will select an area of the Soviet Union that will be developed. Each state that is marked will gain bonuses depending on the five year plan side we have chosen."
 SOV_marked_for_5_year_plan_tt:0 "This state has been marked by the great industrial planners of the Union to be a part of the next phase of the five year plan. §RLong live comrade Stalin!§!\n\n"
