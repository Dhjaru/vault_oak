 SOV_create_unit_tank_corps_tt:0 "4 "Tank Corps" will be created in Moscow, these units contain:\n§GFrontline Battalions§!\n  2 §YMechanized§!\n  3 §YMotorized§!\n  4 §YMedium Armour§!\n  2 §YLight Armour§!\n  2 §YMotorized Artillery Battalion§!\n  1 §YMotorized Anti-Air Battalion§!\n§GSupport Companies§!\n  Division Headquarters\n  §RNKVD§! attachment\n  Recon Company\n  Armoured Car Recon\n  Logistics\n  Motorized Logistics\n  Engineers\n  Maintenance Company."
 SOV_great_patriotic_war_category_tt:0 "Unlocks £decision_icon_small! the Decision Category: §YGreat Patriotic War§!.\n\nEverything will have to be sacrificed in order to win in our titanic struggle against fascism. My dear and beloved comrades, brothers and sisters, everything to the front! For the motherland! Comrade Stalin will guide us to victory! §GZa Rodinu!§!\n"
 SOV_brave_defenders_of_the_motherland_tt:0 "\nBrave Soviet Divisions have been formed to defend this city to the last man. They will not yield, they will never surrender, they won't take one step back. Comrades! Drive back the invaders! Death to the fascists! For the motherland! This focus will spawn 8 §YInfantry Divisions§! in the City this focus sets out to hold."
 SOV_defense_of_moscow_forts_tt:0 "\nAdds §YLand Forts§! in a protective ring around §YMoscow§!. It will also add 10 §YMilitary Factories§! in §YMoscow§!.\n"
 SOV_defense_of_stalingrad_forts_tt:0 "\nAdds §YLand Forts§! in a protective ring around §YStalingrad§!. It will also add 10 §YMilitary Factories§! in §YStalingrad§!, as well as burn the infrastructure in 2 of the bordering states to slow down the German's advance.\n"
 SOV_defense_of_leningrad_forts_tt:0 "\nAdds §YLand Forts§! in a protective ring around §YLeningrad§!. It will also add 10 §YMilitary Factories§! in §YLeningrad§!, as well as burn the infrastructure in 2 of the bordering states to slow down the German's advance.\n"
 SOV_create_unit_tank_corps_reformed_tt:0 "STAVKA has ordered that existing §YTank Corps§! are to be reformed according to a newly created standard. Depending on our tank doctrine choice, this will spawn either 5 §RRED GUARD§! §YMedium Tank Divisions§! with §Y100%§! starting equipment or 4 §RRED GUARD§! §YHeavy Tank Divisions§! with §Y85%§! starting equipment."
 SOV_create_unit_tank_corps_reformed_2_tt:0 "STAVKA has ordered that existing §YTank Corps§! are to be reformed according to a newly created standard. Depending on our tank doctrine choice, this will spawn either 4 §RRED GUARD§! §YMedium Tank Divisions§! with §Y100%§! starting equipment or 3 §RRED GUARD§! §YHeavy Tank Divisions§! with §Y85%§! starting equipment."
 SOV_create_unit_rifle_corps_tt:0 "8 "§YMotorized Rifle Corps§!" will be created in Moscow, these are motorized infantry units containing 11 §YMotorized Infantry Battalions§! with 2 §YMotorized Artillery Battalions§!, 1 §YMotorized Heavy Artillery Battalion and 1 §Y Motorized Anti Tank Battalion§!."
 SOV_create_unit_marine_divisions_tt:0 "8 Elite "§YMarine Divisions§!" will be created in Sevastopol. These are Marine Divisions containing 11 §YMarine Battalions§! and 2 §YMotorized Artillery Battalions§!, 1 §YMotorized Heavy Artillery Battalion§! and 1 §Y Motorized Anti Tank Battalion§!."
 SOV_garrison_system_tt:0 ""
 SOV_garrison_system_2_tt:0 "\nThe following will be §Rexpended§! to increase our garrison's strength, with old equipment prioritized first:\n§Y2170§! Infantry Equipment\n§Y725§! Horse Equipment\n§Y90§! Artillery Equipment\n§Y41§! Anti Tank Equipment\n§Y20§! Field Gun Equipment\n§Y20§! Heavy Artillery Equipment\n§Y18§! Anti Air Equipment\n§Y214§! Support Equipment\n§Y41§! Motorized Equipment\n§Y100§! Radio Equipment\n\n\nFor §Yevery investment§! you have done, out of a §Ymaximum of three§!, you will get §Y3§! 30w divisions. (A net §G33%§! increase of equipment assuming you have researched Focus On Quantity 2, otherwise it will be more)\n\nDivisions gained will all be §Yseasoned§!.\n\nIn the event of war with Germany, we estimate we can mobilize these divisions within §Y60§! days."
 SOV_garrison_system_3_tt:0 "\nThe following will be §Rexpended§! to increase our garrison's strength, with old equipment prioritized first:\n§Y2060§! Infantry Equipment\n§Y685§! Horse Equipment\n§Y86§! Artillery Equipment\n§Y39§! Anti Tank Equipment\n§Y20§! Field Gun Equipment\n§Y20§! Heavy Artillery Equipment\n§Y17§! Anti Air Equipment\n§Y204§! Support Equipment\n§Y39§! Motorized Equipment\n§Y95§! Radio Equipment\n\n\nFor §Yevery investment§! you have done, out of a §Ymaximum of three§!, you will get §Y3§! 30w divisions. (A net §G40%§! increase of equipment assuming you have researched Focus On Quantity 2, otherwise it will be more)\n\nDivisions gained will all be §Yseasoned§!, except for the ones on the border with Japan which will be §Ybattle-hardened§!.\n\nIn the event of war with Germany, we estimate we can mobilize these divisions within §Y140§! days."
 SOV_western_reinforcements_tt:0 "Reinforcements are arriving from the §YWestern Military Districts§!! Depending on how much we've reinforced them, we will get a differing amount of divisions."
 SOV_eastern_reinforcements_tt:0 "Reinforcements are arriving from the §YEastern Military Districts§!! Depending on how much we've reinforced them, we will get a differing amount of divisions."
