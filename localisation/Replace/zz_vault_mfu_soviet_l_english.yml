 news.449:0 "Mongolia Annexed"
 soviet.1.t:0 "Japanese Build-Up"
 soviet.1.d:0 "Tensions along the Manchurian border have been tense for some time, and now we are receiving reports from our Mongolian comrades that the Japanese are massing forces in Heilungkiang. Backing down may be seen as a sign of weakness, but if we respond with force the situation could escalate. What are your orders, tovarisch komandir?"
 soviet.1.a:0 "We push back. Hard."
 soviet.1.b:0 "We cannot afford a war with Japan."
 soviet.2.t:0 "Successful Raid"
 soviet.2.d:0 "Our raid across the Manchurian border against the Japanese forces massing there was a success! We caught them before they had finished their preparations, and our brave soldiers gave them a good beating in the violent skirmish that ensued."
 soviet.2.a:0 "Well done!"
 soviet.3.t:0 "Failed Raid"
 soviet.3.d:0 "Our raid across the Manchurian border against the Japanese forces massing there was a failure! The enemy caught our forces in a pincer movement and we took heavy casualties before we managed to disengage."
 soviet.3.a:0 "Prepare a firing squad."
 soviet.4.t:0 "Romania Surrenders Bessarabia"
 soviet.4.d:0 "The Romanians have wisely folded to our demands and withdrawn all of their forces from Bessarabia. We will incorporate the territory into the union as the Moldavian Soviet Socialist Republic. Its citizenry will now enjoy the benefits of socialism. "
 soviet.4.a:0 "Excellent."
 soviet.5.t:0 "Romania Refuses Our Demands"
 soviet.5.d:0 "The Romanians have refused to give in to our demands! It looks like we will have to expel their occupying forces from Bessarabia with force."
 soviet.5.a:0 "Fools!"
 soviet.6.t:0 "Estonia Submits"
 soviet.6.d:0 "Estonia has surrendered to our demands. We have replaced the decadent government in Tallinn with a People's Parliament, which has unanimously voted to convert Estonia into a Soviet Socialist Republic. After deliberations, the Supreme Soviet has decided to accept this request."
 soviet.6.a:0 "Welcome to the union, comrades."
 soviet.7.t:0 "Estonia Refuses Our Offer"
 soviet.7.d:0 "Estonia has outrageously decided to refuse our generous offer of a mutual assistance pact! The capitalists and sycophants in Tallinn have further had the gall to issue a statement demanding that we respect the territorial integrity of their nation!"
 soviet.7.a:0 "We must protect the Estonians from themselves."
 soviet.8.t:0 "Latvia Submits"
 soviet.8.d:0 "The Latvian government in Riga has agreed to our demands, and we have replaced their corrupt rule with a People's Assembly. This body has unanimously voted to request membership in our great union as a Soviet Socialist Republic. We have graciously agreed to fulfill this request."
 soviet.8.a:0 "You are socialists now!"
 soviet.9.t:0 "Latvia Refuses Our Offer"
 soviet.9.d:0 "The bourgeoisie oppressors ruling Latvia have chosen to abandon all reason. They have rejected our generous mutual assistance pact, and are demanding the immediate withdrawal of all Soviet forces 'massing' along their border."
 soviet.9.a:0 "The Latvian people must be liberated."
 soviet.10.t:0 "Lithuania Submits"
 soviet.10.d:0 "Our request for military bases in Lithuania has been granted, but unfortunately their government has collapsed. We have established a People's Parliament to avoid anarchy, and they have unanimously voted to petition the Supreme Soviet for membership in our union. This request has been granted."
 soviet.10.a:0 "We will save you from capitalism."
 soviet.11.t:0 "Lithuania Refuses Our Offer"
 soviet.11.d:0 "Lithuania seems bent on self-destruction, and the fools in their government are denying our forces access to their country. Do they think they would be better off under the Germans? Their selfish leaders are committing a crime against the people by denying their citizens true socialism."
 soviet.11.a:0 "The Lithuanian people have suffered enough."
 soviet.12.t:0 "Finland Accepts Our Demands"
 soviet.12.d:0 "The overwhelming forces we massed along their borders have convinced the Finnish government to accept our modest request for a revision of their borders. We have gained control of Karelia, and the position of Leningrad is now much more secure."
 soviet.12.a:0 "We expected them to put up a fight..."
 soviet.13.t:0 "Finland Rejects Our Demands"
 soviet.13.d:0 "The Finnish government has rejected our demands, but this was to be expected. If we want Karelia, we will have to take it by force. It is time to teach the stubborn Finns a lesson they won't forget!"
 soviet.13.a:0 "We will crush them in a few weeks."
 soviet.14.t:0 "Membership in the USSR"
 soviet.14.d:0 "We are under pressure from Moscow to officially join the USSR. Should we agree to this?"
 soviet.14.a:0 "Yes, let us join them."
 soviet.14.b:0 "No, we have yet to reach our full potential!"
 soviet.15.t:0 "Tannu Tuva Refuses!"
 soviet.15.d:0 "The Tuvans have outrageously refused to merge with the Soviet Union! What such a pitiful nation could possibly hope to accomplish on its own is a mystery that may never be answered."
 soviet.15.a:0 "Best of luck to them."
 soviet.16.t:0 "The Annexation of Tannu Tuva"
 soviet.16.d:0 "The Supreme Soviet has received a formal request from the Tuvan parliament for membership in the Soviet Union. They will be organized as the Tuvan Autonomous Oblast in the Russian SFSR."
 soviet.16.a:0 "Welcome to the union, comrades."
 soviet.17.t:0 "Improving the Stalin Line"
 soviet.17.d:0 "A thorough revision of the defensive fortifications along our western border regions has been completed, and convicts from our corrective labor camps stand ready to begin work. Soon the Stalin Line will live up to its glorious namesake!"
 soviet.17.a:0 "Comrade Stalin will be proud!"
 soviet.18.t:0 "The Xi'an Incident"
 soviet.18.d:0 "External pressure from the Soviet Union for the end of the hostilities between us and the Chinese Red Army has led to people in our ranks taking matters into their own hands. Two generals have had [Root.GetLeader] arrested, attempting to force a truce between us and the communists to unite China against external threats. International pressure for a peaceful solution, along with the weakness of China divided in this era are factors in favor of establishing a united front. What course should we take?"
 soviet.18.a:0 "Contact the communist party for peace talks."
 soviet.18.b:0 "Never!"
 soviet.19.t:0 "Nationalists Offer Truce"
 soviet.19.d:0 "Disagreements within the Nationalist ranks have led to a precarious situation. Their leader, [From.GetLeader] has been arrested in an effort to force our enemies to accept a truce with us to unite China against foreign enemies. Although we would like to see the Kuomintang leadership facing punishment for their crimes against us, this is a rare opportunity to cooperate and ensure that China does not fall in the hands of foreign imperialists."
 soviet.19.a:0 "We accept a truce for now."
 soviet.19.b:0 "The revolution cannot be set aside for this!"
 soviet.20.t:0 "Nationalist China Refuses Negotiations"
 soviet.20.d:0 "Despite the kidnapping of [From.GetLeader], the Nationalists have refused to enter negotiations for a truce with the Communists. Sadly, the Chinese will remain in violent conflict with their own people, making them easy prey for their enemies."
 soviet.20.a:0 "We did what we could."
 soviet.21.t:0 "Truce in Chinese Civil War"
 soviet.21.d:0 "The negotiations in Xi'an have borne results. Both Nationalists and Communists have agreed to a truce, putting an at least temporary end to the hostilities and allowing the parties to cooperate against foreign threats."
 soviet.21.a:0 "There is hope for China yet."
 soviet.22.t:0 "Communist China Refuses Negotiations"
 soviet.22.d:0 "Despite the best efforts of Kuomintang generals to achieve a truce with the Communist Party leaders, the communists refuse to make even a temporary peace as long as the leader of the Nationalists is alive. It appears that the hostilities will not end so easily."
 soviet.22.a:0 "At this rate, China's enemies may divide and conquer."
 soviet.23.t:0 "Soviet Union Cedes Land"
 soviet.23.d:0 "The Soviet Union has other threats to worry about and does not wish to further increase hostilities with our Empire. As a sign of desiring peace between our nations, they have ceded some territory to us, hoping that this will strengthen our diplomatic ties."
 soviet.23.a:0 "Perhaps this can be a turning point."
 soviet.24.t:0 "The Fifth Column"
 soviet.24.d:0 "The persecution of enemies of the people, those who would reverse or subvert the revolution, has been ongoing policy since the Party came to power. The internal power struggles that followed have shifted our focus, and purging the Party ranks themselves has been given more emphasis since Trotsky's exile. Stalin has made himself an icon, but at the cost of making many real enemies and innumerable imaginary ones.\n\nHaving seen the worst of internal power struggles, the General Secretary is prone to act on the slightest suspicion. Being purged from the Party means imprisonment or death. Dark times lie ahead for those who show disloyalty - or just a bit too much loyalty to seem credible."
 soviet.24.a:0 "Are Zinoviev and his ilk still in touch with Trotsky?"
 soviet.25.t:0 "Trial of the Anti-Soviet Trotskyist Center"
 soviet.25.d:0 "Despite Leon Trotsky being forced into exile, Joseph Stalin fears that he has secret supporters within the party. A series of rapid arrests and brutal interrogations have yielded confessions and testimonies conveniently pointing to some of Stalin's rivals. However, the more questions are asked and the deeper the secret police delves into letters and journals, the more people are implicated, if indirectly.\n\nParty members are beginning to believe that Stalin's absolute power and the death of his wife have isolated him to the point where he perceives anyone as a threat, but isn't that exactly what a traitor would say?"
 soviet.25.a:0 "Kalinin's wife is suspected. He cannot be trusted either."
 soviet.25.b:0 "Khrushchev dabbled with Trotskyism in the past. He must go."
 soviet.25.c:0 "Radek's confession points to several people within the party."
 soviet.25.e:0 "Party members can be trusted. This paranoia must cease."
 soviet.26.t:0 "Secret Trial of the Generals"
 soviet.26.d:0 "The Red Army has always been home to subversive elements, ever since Trotsky himself was Commissar of War. Documents acquired by the NKVD have implicated several high-ranking officers as not only traitors, but spies. Mikhail Tukhachevsky is among the most prominent of the suspects, and one Stalin is keen to rid the army of. Meanwhile, the navy's frequent contact with foreigners has led to many of them being arrested as well.\n\nAlthough there are documents from our enemies proving their guilt, there is no telling if they fabricated them, or if they were given false information by those who wanted this purge in motion to begin with."
 soviet.26.a:0 "Tukhachevsky must be tried in secret and executed immediately."
 soviet.26.b:0 "Rokossovsky refuses to confess, but cannot be allowed to live."
 soviet.26.c:0 "False documents and forced confessions are not proof."
 soviet.27.t:0 "Trial of the 21"
 soviet.27_tt:0 "Increases penalty from §YOfficers Purged§!"
 soviet.27_tt2:0 "§RWill lead to a civil war in the future.§!"
 soviet.27.d:0 "After several rounds of arrests and trials, the Great Purge has weaved a narrative that led up to this trial. Among the accused are not only old leaders like Nikolai Bukharin, but a number of diplomats, politicians, military officials and even many high-ranking NKVD officers. The charges are also more extensive than previously, including decade-old plots to murder Soviet leaders and sell the Union to its enemies.\n\nThe fact that the NKVD themselves are now among the targets of the purge has in a sense brought the proceedings in full circle. Threats and beatings have led to many confessing to all charges, even the most outlandish ones. The leading defendants face execution."
 soviet.27.a:0 "The navy and air force have been getting off easy so far."
 soviet.27.b:0 "As we suspected, enemies are everywhere."
 soviet.27.c:0 "This has gone too far. Soon we will have killed all of our own."
 soviet.28.t:0 "Trial of the Sixteen"
 soviet.28.d:0 "The main charge was forming a terror organization with the purpose of killing Joseph Stalin and other members of the Soviet government. They were tried by the Military Collegium of the Supreme Court of the USSR, with Vasili Ulrikh presiding. The Prosecutor General was Andrei Vyshinsky, a former member of the Mensheviks who in 1917 had signed an order to arrest Lenin. Defendant Ivan Nikitich Smirnov was blamed by his co-defendants for being the leader of the Center which planned Kirov's assassination. He, however, had been in prison since January 1933 and refused to confess."
 soviet.28.a:0 "Leaders come and go, but the people remain."
 soviet.29.t:0 "France wants to join the Comintern."
 soviet.29.d:0 "Our comrades in Parti Communiste Francais have made great progress. The nation of France is ready to join the Comintern."
 soviet.29.a:0 "A welcome addition"
 soviet.29.b:0 "No!"
 soviet.30.t:0 "Demand Bessarabia"
 soviet.30.d:0 "Romania cannot expect to withstand the might of the Red Army, if we send them a demand for our rightfully claimed land in Bessarabia they may just hand it over without a fight."
 soviet.30.a:0 "Send the ultimatum!"
 soviet.30.b:0 "No, we'll pay the iron price!"
 soviet.31.t:0 "Demand Karjala"
 soviet.31.d:0 "Finland cannot expect to withstand the might of the Red Army, if we send them a demand for our rightfully claimed land in Karjala they may just hand it over without a fight."
 soviet.31.a:0 "Send the ultimatum!"
 soviet.31.b:0 "No, we'll pay the iron price!"
 soviet.32.t:0 "Oppress Estonia"
 soviet.32.d:0 "Estonia cannot expect to withstand the might of the Red Army, if we send them a demand for basing rights and control of their border security we can effectively annex them without fighting."
 soviet.32.a:0 "Send the ultimatum!"
 soviet.32.b:0 "No, we'll pay the iron price!"
 soviet.33.t:0 "Oppress Baltic States"
 soviet.33.d:0 "Baltic States cannot expect to withstand the might of the Red Army, if we send them a demand for basing rights and control of their border security we can effectively annex them without fighting."
 soviet.33.a:0 "Send the ultimatum!"
 soviet.33.b:0 "No, we'll pay the iron price!"
 soviet.34.t:0 "Oppress Lithuania"
 soviet.34.d:0 "Lithuania cannot expect to withstand the might of the Red Army, if we send them a demand for basing rights and control of their border security we can effectively annex them without fighting."
 soviet.34.a:0 "Send the ultimatum!"
 soviet.34.b:0 "No, we'll pay the iron price!"
 soviet.35.t:0 "[From.GetNameDefCap] seeks to join [SOV.GetNameDef]"
 soviet.35.d:0 "Recent political turmoil in [From.GetName] has left their government with a strong vision for the future that aligns with our own. They have seen the good a powerful Soviet Union can do for the world and are willing to give everything for the Motherland."
 soviet.35.a:0 "Set it in motion."
 soviet.35.b:0 "The time is not right for such a move."
 soviet.35_threat_LIT:0 "Lithuania part of Soviet Union"
 soviet.35_threat_FIN:0 "Finland part of Soviet Union"
 soviet.35_threat_EST:0 "Estonia part of Soviet Union"
 soviet.35_threat_LAT:0 "Latvia part of Soviet Union"
 soviet.36.t:0 "[From.GetName] wants our rule."
 soviet.36.d:0 "Recent political turmoil in [From.GetName] has left their government with a strong vision for the future that aligns with our own plans. They seek our protection and offer their unconditional support. Officially they will continue as a nation of their own, but they will follow the Motherland in every move."
 soviet.36.a:0 "Another tool to aid our progress."
 soviet.36.b:0 "They will require too much protection."
 soviet.36_threat_LIT:0 "Lithuania puppet of Soviet Union"
 soviet.36_threat_FIN:0 "Finland puppet of Soviet Union"
 soviet.36_threat_EST:0 "Estonia puppet of Soviet Union"
 soviet.36_threat_LAT:0 "Latvia puppet of Soviet Union"
 soviet.46.t:0 "Great Patriotic War"
 soviet.46.d:0 "The Fascists have betrayed us and launched a vile surprise attack against us. The heart of our industry unfortunately resides in the west, close to our enemies; therefore we have started the massive undertaking of moving most of our factories beyond the Urals. This project will cause severe issues for one full year, but it will allow us to wage war almost indefinitely. Only with the total commitment of all men, women and children can we hope to stop and push back the invaders!"
 soviet.46.a:0 "Za rodinu! Za Stalina!"
 soviet.47.t:0 "The Question of Eastern Security"
 soviet.47.d:0 "With the recent Japanese incursions into the Soviet Union, it has become clear both to STAVKA and the Politbureau that the military districts in the eastern parts of the Soviet Union need to be reinforced. Currently, they are severely understrength and with the growing German threat in the west we need to at least have some form of defence prepared in case Japan decides to stab us in the back."
 soviet.47.a:0 "Socialism in one country!"
 soviet.48.t:0 "All Part of the Plan"
 soviet.48.d:0 "Comrade, the Industrial Planners and Construction workers of our beloved country have triumphed today as they have finished marking two states for the next stage of the five year plan. This will only strengthen our country and bring the Soviet Union one step closer to parity with the west! Progress does not wait for anyone, it must be seized, and today our workers have triumphed."
 soviet.48.a:0 "A toast comrades!"
 soviet.55:0 "The Annexation of Mongolia"
 soviet.55.t:0 "The Annexation of Mongolia"
 soviet.55.d:0 "After the execution of Georgy Zhukov for his role in the failure of The Red Army at Khalkin Gol, Stavka and the Kremlin have deemed it a strategic necessity to annex the former autonomous state of Mongolia and integrate it as a Soviet Republic. With the looming threat of Japan at the Soviet Union's far east border, this is a necessity for national security. The mongolians didn't accept this as easily as the higher ups in the Kremlin did, and tried to resist our forces in futile attempts of resistance, but the mighty red army crushed any resistance and seized the capital in a matter of weeks."
 soviet.55.a:0 "It was for their own good"
 soviet.60.t:0 "The Partitioning of Poland"
 soviet.60.d:0 "Poland is ours, but the western parts fall under the [GER.GetAdjective] sphere of influence according to the stipulations of the Molotov-Ribbentrop Pact. Should we withdraw our forces and let the [GER.GetAdjective]s occupy this territory? Failure to do so would render our treaty void."
 soviet.60.a:0 "Yes. Now is not the time to break treaties."
 soviet.60.b:0 "No! All of Poland belongs to the Motherland!"
 soviet.61.t:0 "Soviets honor the pact"
 soviet.61.d:0 "In accordance with the treaty, the [SOV.GetAdjective]s have turned over the western parts of Poland to our administration. German troops have moved in to provide security."
 soviet.61.a:0 "Excellent."
 soviet.62.t:0 "Soviets violate the pact"
 soviet.62.d:0 "Despite repeated assurances, the Soviets have so far not pulled back their troops, nor have they made any move to turn over the territories and return to the borders we have agreed on. It appears that they have no intention of following the treaty."
 soviet.62.a:0 "It was not even worth the ink!"
 soviet.56.t:0 "The Hunt for Trotsky"
 soviet.56.d:0 "The Hunt for Trotsky"
 soviet.56.a:0 "The Hunt for Trotsky"
 soviet.68.t:0 "The Hunt For Trotsky" # §
 soviet.68.d:0 "Despite our NKVD agents' best attempts, they have failed to locate Trotsky. One of our active NKVD cells in Norway had reported a sighting of Trotsky at a local hotel, and two agents from the cell were dispatched to go look for him. When they arrived at the hotel, the receptionist told them that he had never seen a person who fit the agents' description. But one of the agents noticed that a janitor made a run for it, rushing up the stairs. The agents went off in pursuit of the janitor, and when they arrived on the floor they last heard the janitor on, there was an eerie silence. The only thing they could hear was the cold Norwegian wind blowing through the hallways, and they noticed that one of the hotel room's doors was open. They went to the room and found it pristinely cleaned, but with no bags or any evidence of its former guest's whereabouts. The NKVD agents looked through what they presumed to be Trotsky's belongings that he left behind. The only thing they managed to find was evidence that he was travelling with a grandson and was accompanied by at least two bodyguards. Other than that, it was a dead end."
 soviet.68.a:0 "The hunt continues..."
 soviet.69.t:0 "The Hunt For Trotsky"
 soviet.69.d:0 "Despite our NKVD agents' best attempts, they have failed to locate Trotsky. One of our active NKVD cells in Egypt had reported that a chief of police was receiving some esteemed guests at a dinner party at his villa outside of Cairo. Our NKVD agents prepared their ambush and were ready to strike at Trotsky as the party was about to get out of the convoy of cars that had approached the villa. As the NKVD agents prepared to fire their guns at what they believed to be Trotsky, they noticed that Trotsky's car was completely empty—not only to the surprise of the NKVD agents but also to the surprise of the Chief of Police."
 soviet.69.a:0 "Someone told him that we were coming"
 soviet.70.t:0 "The Hunt For Trotsky"
 soviet.70.d:0 "Despite our NKVD agents best attempts, they have failed at locating Trotsky. One of our active NKVD cells in Holland had reported that a person bearing a great resemblance to Trotsky had purchased a ticket for a trans atlantic trip. The NKVD agents purchased two tickets as well after interrogating the ticketmaster further and they went aboard the ship before every other passenger to set up in their cabin and prepare an ambush for Trotsky. They waited in their cabin for the rest of the passengers to get on board, and once the ferry signalled its departure by blowing its horn the agents went into action and started stalking every conrer of the ship. Until they came upon a cabin which had been completely vacated in a hurry, they realized that the person in question was making a run for it. They quickly went to the upper deck to look for anyone who seemed to be in a hurry, and noticed that there was a gathering of people around where one of the life boats should've been. As soon as the agents got close they noticed that the boat was no longer there and that someone was rowing away at a hurried place. To not raise any suspicion they went back to their cabin and pondered upon how Trotsky always seemed to be one step ahead of them."
 soviet.70.a:0 "How did he know?"
 soviet.71.t:0 "The Hunt For Trotsky"
 soviet.71.a:0 "Who can still harbor loyalty for a traitor?"
 soviet.72.t:0 "The Hunt For Trotsky"
 soviet.72.d:0 "Despite our NKVD agents best attempts, they have failed at locating Trotsky. One of our active cells in Turkey had reported that a train was supposed to carry Trotsky from Istanbul to Paris, from where he would move on to unknown places, this could not be allowed to happen. The agents had quickly purchased tickets and a coupe for themselves and prepared to scan through the entire train at night when everyone was asleep. They waited until the sun had set and night was upon them, and went through the entire train from top to bottom. When they got to the storage wagon they heard silent whispers and a door opening. The agents burst into the wagon, with pistols held high and yelled at them to surrender themselves. But the agents had been too late and whoever was in the wagon had already escaped it and the agents went to the open door saw a few shadowy figures escape into the night and to an escape car. The agents tried running after them, but the car had simply sped off into the night and into the dark unknown."
 soviet.72.a:0 "He has eyes and ears everywhere"
 soviet.73.t:0 "The Hunt For Trotsky"
 soviet.73.d:0 "Despite our NKVD agents best attempts, they have failed at locating Trotsky. One of our active cells in Rome had reported that a man who bore a striking resemblance to Trotsky had been seen in Rome at a local theatre, and that he had expressed a wish to catch the next evening's performance. The NKVD agents went into action and prepared a heavy duty sniper rifle from the Russian Civil War that they would use to shoot Trotsky from one of the house seats in the theatre. The agents snuck in earlier than everyone else and made the rifle ready and waited for the rest of the theatre goers to come into the theatre. They kept an eye open for anyone that resembled Trotsky and were ready to send him off to meet the Romanovs in hell. But, they suddenly noticed that someone was pointing towards them and four men ran off through the crowd. One of the agents tried to line up a perfect shot, whilst the other ran towards the reception area where people were still mingling and enjoying champagne, the once quiet and peaceful scene had turned into a commotion by the time the pursuit was over and as the agents had got out into the street of Rome, the four men were long gone, and so were the NKVD agents aspirations."
 soviet.73.a:0 "Alea, acta, est"
 soviet.74.t:0 "The Hunt For Trotsky"
 soviet.74.d:0 "Despite our NKVD agents' best attempts, they have failed to locate Trotsky. One of our active NKVD cells in Bern listened in to a phone call between someone who could very well be Trotsky and a local philanthropist who had decided upon a boat tour in a lake in Switzerland. The NKVD agents rented their own boat and went out on the aforementioned lake. Upon scanning the lake, they found no other boat on the surface, but on the lakeside they found a boat that had been hurriedly landed with footsteps leading away from the lake itself. The agents had to scour the entire forest surrounding the lake to look for any traces of the owners of the boat, but they couldn't find anything."
 soviet.74.a:0 "The hunt continues..."
 soviet.75.t:0 "The Hunt For Trotsky"
 soviet.75.d:0 "Despite our NKVD agents best attempts, they have failed at locating Trotsky. One of our active NKVD cells in Stockholm found out that a man had requisitioned a suit from the same store that Lenin had bought one once upon a time. There could only be one man with the knowledge and connections to this tailor that once our esteemed comrade Lenin purchased a suit from. The exact measurements that had been ordered fits Trotsky's physical appearance perfectly as well. The agents had gone to the store by car, and they were waiting outside of the storefront for anyone to approach. They waited for hours and hours, and when the sun set they realized that no one was going to show up. As the storekeeper tried to close for the evening, the NKVD agents barged in and demanded to see his orders for the day. He stammered out a response and showed them the list, they found one name that hadn't been crossed out yet, for one person called: "Pero". Trotsky's old pseudonym."
 soviet.75.a:0 "The hunt continues..."
 soviet.99:0 "§RStalin summons you to his Dacha...§!"
 soviet.99.t:0 "Stalin has summoned you to his Dacha"
 soviet.99.d:0 "The two guards force you into Stalin's office, where you stand on trial for 2 hours, Stalin accuses you of betrayal based on evidence of industrial sabotage as you have failed to reach the production goals of this Five-Year-Plan. When you get the chance to speak in defence, you explain that you were not in charge of the first 3 years of the five year plan! Stalin calms down, sits down, lights his pipe, and hands you a piece of paper. He says that instead of you he wants the name of every engineer, every foreman and every worker that has not been fully dedicated to the plan... And your significant other..."
 soviet.99.a:0 "I guess running away to Afghanistan isn't an option anymore..."
 soviet.99.b:0 "Run away to Afghanistan!"
 soviet.100.t:0 "Communists relent"
 soviet.100.d:0 "Due to the Soviet Union and ourselves being at war with a common enemy, they seem to have toned down support to our domestic communist parties."
 soviet.100.a:0 "Glad to be rid of them!"
 soviet.114:0 "German-Soviet-Trade Agreement"
 soviet.114.t:0 "German-Soviet Trade Agreement"
 soviet.114.d:0 "A Soviet delegation lead by Molotov arrived in Berlin today, to sign the final documents and paper that make the trade agreement between the Soviet Union and the German Reich official. Molotov glanced over the document which promised German technical expertise, tools, machines in exchange for German access to Soviet resources at a greatly discounted price. Both parties happily signed the agreement and extended their pact of friendship to now include trade between both nation. One part would gain the ability to effectivize the buildup and industrialization of their country, the other the means to feed their war machine and people."
 soviet.114.a:0 "Prost, meine herren und Kameraden!"
 soviet.115:0 "The Germans have Agreed"
 soviet.115.t:0 "German-Soviet Trade Agreement"
 soviet.115.d:0 "Molotov returned after a successful diplomatic mission to Berlin today. He was greeted with astounding applauds in the Kremlin as he had secured a deal with the Germans that would benefit the Soviet Union immensely. With access to the German Engineering in both theory and physical form it will have large implications for the advancements that our country will take in the next few years. Comrade Stalin shook hands with Molotov and told him that he has managed to strike a deal with their former enemies, not once, but twice now. Servants were bringing refreshments."
 soviet.115.a:0 "Na zdorov'ye Comrades! Long live the Soviet Union!"
 soviet.116:0 "The Future of the Red Army"
 soviet.116.t:0 "The Future of the Red Army"
 soviet.116.d:0 "The Red Army consists of three branches, the Armour, the Artillery and the Infantry, and they are all in desperate need of improvement. However, we will only be able to focus on one branch at once and we have to finish that one before we can progress in another branch. So, which will be our first branch that we develop tovarish?"
 soviet.116.a:0 "Armour to smash the enemies of the Union!"
 soviet.116.b:0 "Artillery to crush the enemies of the Union!"
 soviet.116.c:0 "Infantry to overwhelm our enemies with supreme willpower!"
 soviet.117.t:0 "Next Step in the Armament Program"
 soviet.117.d:0 "The Red Army consists of three branches, the Armour, the Artillery and the Infantry, and they are all in desperate need of improvement. However, we will only be able to focus on one branch at once and we have to finish that one before we can progress in another branch. So, which will be our first branch that we develop tovarish?"
 soviet.117.a:0 "Armour to smash the enemies of the Union!"
 soviet.117.b:0 "Artillery to crush the enemies of the Union!"
 soviet.117.c:0 "Infantry to overwhelm our enemies with supreme willpower!"
 soviet.117.e:0 "With the completion of the plan, Stalin wishes to congratulate you, personally!"
 soviet.135.a:0 "OK."
 soviet.136.t:0 "Second Sino-Japanese War"
 soviet.136.desc:0 "We are now gaining extra §OPolitical Power§! and §OArmy Experience§! from the Sino-Japanese War. The amount of Political Power and Army Experience depends on how well §GChina§! is doing in this war. We will lose §R-0.04§! Army Experience Gain and §R-0.05§! Political Power Gain for every lost Chinese state after Japan declares war on China.\nSupport China through decisions!"
 soviet.136.a:0 "OK."
 GAME_OVER_TT:0 "§RThe game will end for you.§!"
 soviet.1000.t:0 "General Vlasov has defected!"
 soviet.1000.d:0 "After the second shock army under Soviet general Vlasov was surrounded, he himself was offered an escape by aeroplane. The now traitor to the motherland refused and hid in German-occupied territory. Eventually he was found out and sent to German captivity. While in prison, Vlasov adopted a pro-Nazi stance out of opportunism, careerism, and survival, fearing retribution for losing his last battle and his army. Vlasov was taken to Berlin under the protection of the Wehrmacht's propaganda department. While there, he and other traitorous officers have begun drafting plans for the creation of a Russian provisional government and the recruitment of a Russian army of "liberation"."
 soviet.1000.a:0 "Death to Traitors!"
 soviet.1013.t:0 "The Battle of Lake Khasan"
 soviet.1013.d:0 "The Japanese have taken positions inside our borders near lake Khasan. Our army has gone onto offensive to depose the invaders. First multiple waves of bombers attacked the Japanese positions. This attack was delayed either because of fog or poor preparations. After the bombers an assault by tanks and infantry, including mechanized troops, supported by artillery was made. In the difficult terrain the tanks suffered heavy losses, only individual tanks made it to their objectives, all of which were destroyed or retreated later. During the attack an outflanking movement was made. The Japanese were pushed back after heavy fighting, the subsequent days the Japanese counterattacked but were unable to recapture their positions. We have concluded that the difficulties happened because of poor communications infrastructure and roads as well as the loss of unit coherence due to poor organization, headquarters and commanders and a lack of combat supply units. Blyukher is responsible for the faults in the army and leadership at Khasan."
 soviet.1013.a:0 "Call the NKVD..."
 soviet.57.t:0 "Winter Offensive"
 soviet.57.d:0 "This will be a very cold winter, our soldiers are used to this cold unlike the Germans who will struggle to keep their feets from freezing off! We have been able to conscript a lot of soldiers from the asian plains, they should be happy to fight for us after we brought the socialist paradise to their lands."
 soviet.57.a:0 "Not one step backwards!"
 soviet.63.t:0 "Young cadet Spreading Fascist Sentiments. "
 soviet.63.d:0 "A memo has recently appeared on your desk regarding the possibility of a young cadet spreading fascism and inciting fascist sympathies among his comrades. The prospect of a young, promising junior officer turning his back on the communist cause is no trivial matter. And what is worse, who knows how long this could have been going on for? Action must be taken immediately to quash this incident and re-educate him before any major damage is done. Hopefully once he sees the error of his ways, he will be willing to cooperate with the NKVD in erasing any other enemies of the states running wild."
 soviet.63.a:0 "He will learn his lesson, in Siberia"
 soviet.63.b:0 "Dispatch of this cretin permanently"
 soviet.64.t:0 "General Embezzling Materiel"
 soviet.64.d:0 "Few things are more repulsive than a senior officer lining his own pockets with precious funds which could otherwise go toward a far more noble cause. Not only is it outright selfish, but it sets a poor example to both civilian and armed forces member alike. The idea of someone who ought to be a figure of admiration and idolisation putting his own interests first must be dealt with quickly and efficiently. But before we get around to punishing him, he should make a frank and public confession and apologise to his comrades of the Motherland and declare that however he will be punished, he brought it upon himself."
 soviet.64.a:0 "He will learn his lesson, in Siberia"
 soviet.64.b:0 "Dispatch of this cretin permanently"
 soviet.65.t:0 "Captains and Plots"
 soviet.65.d:0 "News has reached your office of a small cadre of officers holding regular meetings in the back rooms of a nearby warehouse. There is nothing concrete regarding the nature of these meetings, but it is easy to piece together what is what. Junior officers, especially captains, have the benefit of being able to drift between the various echelons of the command hierarchy; gathering information without any suspicion. Who knows what information has been received, and who knows how long it has been going on for? But either way, action is mere hours away as a loyal labourer has given us a tip off of another meeting later on this evening. With one swift stroke we can put this issue to bed and carry on steering the military onto a righteous and loyal path."
 soviet.65.a:0 "They will learn their lesson, in Siberia"
 soviet.65.b:0 "Dispatch of these pests permanently"
 soviet.66.t:0 "Private Sentenced to Five Years Hard Labour"
 soviet.66.d:0 "There is always a certain amount of threat which somehow manages to leak its way through hidden channels to the masses, this is to be expected, but what always comes as a tragedy is when it’s one of our own in the Red Army. Clearly this one private who had been engaged in treasonous activities against the Motherland has doubts about the nobleness of his cause. No matter though, a long honest and hard-working sentence to a labour camp should afford him the time to contemplate his actions and in time come to see the error of his ways. Alternatively, he can simply disappear from society altogether with no knowledge of his existence. Either way, the issue is now closed."
 soviet.66.a:0 "He will learn his lesson, in Siberia"
 soviet.66.b:0 "Dispatch of this cretin permanently"
 soviet.67.t:0 "Espionage in the Admiralty"
 soviet.67.d:0 "Recently there have been rumours of a certain senior officer within the Red Navy of being a spy. This certainly comes as a surprise given that the navy has often been a fairly solid, if not slightly more loyal branch of the armed forces. Either way, such rumours, be they of truth or not must be investigated and dealt with promptly. The navy may not be the largest of our branches, but dissent of any kind, navy or not, must be squashed quickly and efficiently before it spreads into the army. Then we will have a severe problem on our hands. We shall start with bringing in various junior officers in for “questioning” in regards to any suspicious activity they have noticed while on duty. This shouldn’t take too long, and it should be best if this ‘problem’ stays fairly under wraps, the boss is already paranoid enough in regards to the army as it is. The last thing he needs is the navy turning against him as well."
 soviet.67.a:0 "There is a one way ticket to Siberia waiting in his office"
 soviet.67.b:0 "He can join our enemies, in hell."
 soviet.101.t:0 "Dispatch NKVD Assassins"
 soviet.101.d:0 "The NKVD will contact one of their cells and order assassins to strike against the target. Preparations are pivotal for the missions success, and the NKVD has requesitioned assets from the army so that they can supply the cell with the equipment that is necessary to perform the assassination. Although this comes at a cost, no cost is too high to satisfy comrade Stalin's §Yneeds and wishes§!."
 soviet.101.a:0 "If you fail comrades, Stalin will have our heads next..."
 soviet.102.t:0 "Assassins Kill Their Target!"
 soviet.102.d:0 "This morning, the police reported that assassins had struck against one of our communist politicians. No trace of the assailants were left, only the victims mutilated body. This has caused an uproar amongst the left in our country and left them wonder who could be capable of such cruelty?"
 soviet.102.a:0 "From Russia with Love"
 soviet.103.t:0 "Assassins Fail to Kill Their Target"
 soviet.103.d:0 "This morning the police chief announced that the police had been in a firefight against 4 unidentified assailants targetting one of the country communist leaders. The assailants had been stalking the communist leader throughout the day, and he had grown suspicious of the group that were obviously observing his every move. After a quick conference with the police he set up a trap for them"
 soviet.103.a:0 "Someone is not going to be happy."
 soviet.104.t:0 "A Successful Operation"
 soviet.104.d:0 "The Assassins have reported to us via a secure line of communication that the target has been eliminated and that the murder can not be traced back to us. The agents have gone back into hiding and we have yet another name to take off one of Stalin's many lists."
 soviet.104.a:0 "A job well done, comrades."
 soviet.105.t:0 "An Unsuccessful Operation"
 soviet.105.d:0 "The target is still breathing, unlike our agents... They have either scattered with the wind, or chosen to commit suicide to avoid the wrath of Stalin. Nonetheless, this will have serious consequences for us as all the NKVD personnel that organized this assassination are now under scrutiny..."
 soviet.105.a:0 "You have failed me for the last time, commander!"
 soviet.106.t:0 "Scientist accused of Non-Ideological Activities"
 soviet.106.d:0 "Acting on an anonymous tip, our agents have stormed the state laboratory where the scientist is employed. Upon reading him the charges, he tried to beg the agents and pleaded that he was innocent. But, our determined agents of course knew better and sent away this saboteur and man wishing to see this great union dissolved and destroyed by our enemies. One of his colleagues even held up the door for the agents as they were leaving and congratulated them on rooting out another corrupting influence on the purity of the communist system."
 soviet.106.a:0 "Innocence proves nothing."
 soviet.106.b:0 "Erase him from history."
 soviet.107.t:0 "Writer Takes Liberties"
 soviet.107.d:0 "Sometimes writers think that they can get away with putting anything they want into their books, and that we do not proof read everything that is going to be published, this writer had put in the slightest insinuation that the Soviet System was not operating at the rate that Stalin was telling the people, such an accusation, is high treason."
 soviet.107.a:0 "Innocence proves nothing."
 soviet.107.b:0 "Erase him from history."
 soviet.108.t:0 "Painter accused of Western Influences"
 soviet.108.d:0 "Upon inspecting a painting made by a formerly well respected painter, an inspector noticed that the painter had chosen a motive that was not touched upon by the state-approved standards for what a painting may contain. Necessarily it wasn't harmful and the painting was quite innocent in itself, but the fact that the artist had chosen to defy the very clear and numerous restrictions is high treason."
 soviet.108.a:0 "Innocence proves nothing."
 soviet.108.b:0 "Erase him from history."
 soviet.109.t:0 "Poet Accused of Being a Spy"
 soviet.109.d:0 "A poem was to be published in a state-approved magazine, but the publicist had called in to an NKVD office to report that he suspected that a poem was an encrypted message to a government outside of the Soviet Union. After an investigation and a quick trial the poet in question was judged to have committed an act of high treason."
 soviet.109.a:0 "Innocence proves nothing."
 soviet.109.b:0 "Erase him from history."
 soviet.110.t:0 "Athlete Accused of Smuggling"
 soviet.110.d:0 "A local popular athlete has been accused of smuggling goods and later selling them to the fictive black market that allegedly exists. The athlete of course denied ever having any of those contents within his sport bags, and that his trainer could verify that he had never engaged in any such activities. The trainer of course wisely remained silent and realised that his athlete had committed an act of high treason."
 soviet.110.a:0 "Innocence proves nothing."
 soviet.110.b:0 "Erase him from history."
 soviet.111.t:0 "Musician Playing His Last Tune"
 soviet.111.d:0 "Comrade Stalin had been looking forward to a performance by a musician at the opera in Moscow, said performance was to be broadcast on radio as well. News then reached Stalin that the musician that the entire piece was centered around had fallen ill, Stalin furious at this turn of events had called in his agents to collect the musician, accusing him of sabotage and a lack of ideological conviction."
 soviet.111.a:0 "Innocence proves nothing."
 soviet.111.b:0 "Erase him from history."
 soviet.112.t:0 "Army Officer Accused of Treason"
 soviet.112.d:0 "An army official had filed an official report that his unit was both under-equipped and ill fit for any form of combat. A few men had even deserted the ranks and had shown an unwillingness to continue within the unit. The officer in question upon filing this report was immediately brought in for questioning by the NKVD, his false impression of the state of our army is now facing charges of high treason."
 soviet.112.a:0 "Innocence proves nothing."
 soviet.112.b:0 "Erase him from history."
 soviet.113.t:0 "A Normal Day in the Union"
 soviet.113.d:0 "Heavy physical work, the care of home and children, petty quarrels with neighbours, filled up the horizon of their minds. To keep them in control was not difficult. A few agents of the NKVD moved always among them, spreading false rumours and marking down and eliminating any individuals who were judged capable of becoming dangerous; but no attempt was made to indoctrinate them with the ideology of the party. It was not desirable that the proles should have strong political feelings. All that was required of them was a primitive patriotism which could be appealed to whenever it was necessary to make them accept longer working-hours or shorter rations. And even when they became discontented, as they sometimes did, their discontent led nowhere, because being without general ideas, they could only focus it on petty specific grievances. The larger evils invariably escaped their notice. It was not necessary to know much. So long as they continued to work and breed, their other activities were without importance."
 soviet.113.a:0 "Ignorance is Strength!"
 soviet.113.b:0 "Freedom is Slavery!"
 soviet.113.c:0 "A perpetual silence amongst the lambs, they know that the Georgian wolf hunts at night."
 soviet.118.t:0 "Stalin, Smiles"
 soviet.118.d:0 "Despite the odd hitch here and there, some possible paperwork vanishing into thin air (or the nearest steel furnace) and some very hardworking, dedicated people almost working themselves to death, coupled with various odd handshakes, granting of favours and back scratching, there has been no doubt that this five-year plan was a roaring success. A grand celebration is due to take place in the morning, and you shall surely be rewarded as a hero of the Soviet Union for dragging Russia’s antiquated industry into the 20th century. No longer will the Soviet Union be subject to ridicule by capitalistic western powers. This century will be Russia’s, and it was completely down to you and the noble sacrifices you had to endure to achieve this. "
 soviet.118.a:0 "This has been a collective effort, Comrade Stalin"
 soviet.119.t:0 "Stalin Summons you to his Dacha"
 soviet.119.d:0 "Sometimes when it comes to dealing with the Man of Steel himself, the odd result here and there doesn’t hurt. But in this case, those results were far below his expectations. You are summoned to Stalin’s office (effective immediately), and there the man sits comfortably in his chair, puffing away at his pipe, enormous plumes of smoke obscuring most of his face following your entrance through half-closed eyes. He gestures to the chair on the other side of his desk. Maybe this wasn’t as bad as you had feared.  Oh how very were you indeed. Stalin leaps to his feet and bends over the entire length of the desk until his face is no less than a foot away from yours. His eyes wide with a severely unwelcoming glower. You go to open your mouth, but no sooner have your lips even parted, Stalin tears you to shreds. Beginning with the typical accusations of being a traitor and an agent working against the Motherland, to outright tirades regarding how well you have been treated and why would you go against your home, your family, your leader.  Eventually Stalin manages to calm himself down and seats himself down to top up his pipe. His eyes return to a passive, half closed state as he focuses on the pipe bowl in front of him. After what feels like ages he finally announces that you will not punished too severely, but your family will be placed under very heavy scrutiny and should you fail again, well, you will find out. And with that he points the door, whereupon a guard opens it and ‘helps’ you out. "
 soviet.119.a:0 "Should I be thankful that I am alive?"
 soviet.120.t:0 "Telegram from Stalin"
 soviet.120.d:0 "You have let down our country and our Red Army. You have the nerve not to manufacture aircraft until now. Our Red Army now needs aircraft like the air it breathes, like the bread it eats. Our aircraft plants produce an insufficient amount of aircraft... It is a mockery of the Red Army... I ask you not to try the government’s patience, and demand that you manufacture more aircraft.\n\nThis is my final warning. Stalin"
 soviet.120.a:0 "It won't happen again, comrade Stalin"
 soviet.121.t:0 "Long May Our Crimson Flag Inspire"
 soviet.121.d:0 "The fascist were brave indeed for thinking they could march into the very heart of our Motherland and get away with it. It was as if knowing that they were fighting for what would be the ultimate last effort, a great strength befell the army. Was it self-belief? Supernatural? Self-preservation? We will never know, either way, we fought for the future, will destroy the invader and long shall we be united and free!"
 soviet.121.a:0 "This is our Mother's Prayer"
 soviet.122.t:0 "The Heart of the Motherland has Stopped"
 soviet.122.d:0 "The heart which has kept this great nation going has fallen silent. A great chill descends upon all comrades of the USSR. Stalin and the rest of the Politburo is nowhere to be seen. The high command? Gone. Everything is just gone. The last hope in the world has gone. We have lost, and with it, the world has now lost. The world is now about to plunge into an uncertain future, one possibly devoid of anything as the fashist boot cruelly oppresses any attempt to stand up to them. Failure was not an option and yet somehow it happened anyway. "
 soviet.122.a:0 "Not one step back!"
 soviet.123.t:0 "Through the Darkness, Shining in Glory"
 soviet.123.d:0 "The siege of Leningrad has been one of unparalleled brutality and hardship. Stranded between our Finnish enemies and the German fashist, there was no escape for anyone. The only way out of hell, was through it, and that was exactly what you did. You lifted that terrible siege and showed those bastards that even in our darkest hour, the city which bears the name of the great Lenin, will never break, not to filthy monarchists or monstrous fascists. "
 soviet.123.a:0 "Death to the Invaders!"
 soviet.124.t:0 "A Moment of Silence, Shrouded in Darkness, "
 soviet.124.d:0 "The harsh cold of a Baltic winter is creeping in, bodies line the streets, their faces contorted with unimageable expressions of horror. This ancient city will become nothing more than a ruin, haunted by those who died attempting to hold it. Their wailing echoing throughout for all time. A reminder of what price failure is met with, a reminder that sometimes, some things are better left forgotten for their memory is too painful to recollect."
 soviet.124.a:0 "Lenin turns in his tomb"
 soviet.125.t:0 "The Fortress City Stands Triumphant"
 soviet.125.d:0 "Through the suffering, death and destruction, our brave comrades have succeeded in repelling the fashist from this glorious city which bears our great leader’s name. Now, however, is not the time for celebration, it is not the time for rest, it is not the time to dwell on those we have lost. Now it is the time to push, harder and more ferociously than ever before. We WILL drive the Nazi bastards back to where the pizda himself sits on his throne of skulls and anguish."
 soviet.125.a:0 "Vpered k smerti I slave!"
 soviet.126.t:0 "Nothing but Rubble on the Volga"
 soviet.126.d:0 "Despite seemingly giving everything we could have possibly given, it wasn’t enough. There is nothing left for us beyond the Volga. Stalingrad has fallen, Russia has fallen. All the blood and sacrifice up until this point has all been for nothing. The fashist will march through this sacred city, defiling the very foundations with every step taken. Any survivors left in the city will have no mercy from those bastards. The screams of women and children will echo throughout the Motherland, and you failed in preventing it."
 soviet.126.a:0 "Everything is not yet lost..."
