 SOV_infantry_equipment_0_desc:0 "Basic small arms developed before and during the Great War.\n Includes §HMosin-Nagant M1891§!, and §HMadsen§!"
 SOV_infantry_equipment_1_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs.\n Includes §HMosin-Nagant M1891/30§!, and §HDP-27§!"
 SOV_infantry_equipment_2_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Modernized to include a great number of sub-machineguns and anti-tank rifles.\n Includes §HMosin-Nagant M1938§!, §HPPD-40§!, and §HDP-27§!"
 SOV_infantry_equipment_3_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further modernized to include personal semi-automatic rifles and improved sub-machineguns.\n Includes §HMosin-Nagant M1938§!, §HSVT-40§!, §HPPSH-41§!, and §HDPM§!"
 SOV_infantry_equipment_4_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further modernized to include improved personal Assault Rifles and anti-tank rockets.\n Includes §HAK-47§!, and §HRPD§!"
