 SOV_american_lend_lease_tt:0 "Grants the following:\n§Y12.50K§! units of American §YM1 Garand§! is added to the national stockpile.\n§Y1.00K§! units of American §YRadio Equipment§! is added to the national stockpile.\n§Y2.00K§! units of American §YSupport Equipment§! is added to the national stockpile.\n§Y2K§! units of American §YMedium Infantry Trucks§! is added to the national stockpile.\nAdditionally grants §Y300§! English §YLight Fighters§! if you have completed focus §YExpand the Air Corps Tactical School§! and §Y500§! Soviet §YMedium Tanks§! or §Y400§! Soviet §YHeavy Tanks§! depending on your choice of tank focuses."
 SOV_artic_lend_lease_tt:0 "Grants the following after §Y100§! days via mission§G(This mission repeats itself)§!\n§Y17.50K§! units of American §YM1 Garand§! is added to the national stockpile.\n§Y1.00K§! units of American §YRadio Equipment§! is added to the national stockpile.\n§Y1.00K§! units of American §YSupport Equipment§! is added to the national stockpile.\n§Y1.00K§! units of American §YMedium Infantry Trucks§! is added to the national stockpile.\n§Y800§! units of American §Y105mm M2 Howitzer Lt-artillery I§!\n§Y400§! units of American §Y75mm Gun M2§!\n§Y300§! units of Soviet §YBM-13§! is added to the national stockpile. Additionally grants §Y200§! English §YLight Fighters§! if you have completed focus §YExpand the Air Corps Tactical School§! and §Y400§! Soviet §YMedium Tanks§! or §Y250§! Soviet §YHeavy Tanks§! depending on your choice of tank focuses."
 SOV_persian_lend_lease_tt:0 "Grants the following after §Y100§! days via mission§G(This mission repeats itself)§!\n§Y20.00K§! units of American §YM1 Garand§! is added to the national stockpile.\n§Y2.50K§! units of American §YRadio Equipment§! is added to the national stockpile.\n§Y2.50K§! units of American §YSupport Equipment§! is added to the national stockpile.\n§Y3.00K§! units of American §YMedium Infantry Trucks§! is added to the national stockpile.\n§Y800§! units of American §Y105mm M2 Howitzer Lt-artillery I§!\n§Y400§! units of American §Y75mm Gun M2§!\n§Y300§! units of Soviet §YBM-13§! is added to the national stockpile. Additionally grants §Y300§! English §YLight Fighters§! if you have completed focus §YExpand the Air Corps Tactical School§! and §Y700§! Soviet §YMedium Tanks§! or §Y400§! Soviet §YHeavy Tanks§! depending on your choice of tank focuses."
