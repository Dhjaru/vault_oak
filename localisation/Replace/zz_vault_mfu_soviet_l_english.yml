 SOV_convoys_counting_tt:0 "Current convoy limit of @SOV§YSoviet Union§! is [?SOV.counting_convoys|G0]. This limit can be increased by @SOV§YSoviet Union§! losing ground to Axis, leveling up naval MIO or with decision on @USA§YUnited States of America§! but the limit can never go over §R2000§!. @SOV§YSoviet Union§! can build or be lend leased convoys to reach the current limit. Any convoys over the limit will be destroyed."
 SOV_murmansk_lend_lease_tt:0 "Grants the following after §Y100§! days via mission§G(This mission repeats itself)§!\n§Y12.50K§! units of American §YM1 Garand§! is added to the national stockpile.\n§Y2.00K§! units of American §YRadio Equipment§! is added to the national stockpile.\n§Y2.00K§! units of American §YSupport Equipment§! is added to the national stockpile.\n§Y2.50K§! units of American §YMedium Infantry Trucks§! is added to the national stockpile.\n§Y600§! units of American §Y105mm M2 Howitzer Lt-artillery I§!\n§Y200§! units of American §Y75mm Gun M2§!\n§Y200§! units of Soviet §YBM-13§! is added to the national stockpile.\nAdditionally grants §Y200§! English §YLight Fighters§! if you have completed focus §YExpand the Air Corps Tactical School§! and §Y400§! Soviet §YMedium Tanks§! or §Y250§! Soviet §YHeavy Tanks§! depending on your choice of tank focuses."
