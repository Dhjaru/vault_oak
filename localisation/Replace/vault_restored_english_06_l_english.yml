 landmark_hagia_sophia:0 "The Hagia Sophia"
 landmark_hagia_sophia_desc:0 "Standing at the crossroads of empires, the Hagia Sophia has been a Byzantine cathedral, an Ottoman mosque, and a symbol of Istanbul’s ever-changing rulers. Its massive dome and grand halls reflect both its spiritual significance and the ambitions of those who claimed the city as their own."
 landmark_hakko_ichiu:0 "The Hakkō Ichiu Monument"
 landmark_hakko_ichiu_desc:0 "The Hakkō Ichiu tower has been constructed to commemorate the 2,600th anniversary of the founding of Japan, and as a monument to symbolize the Japanese destiny of unifying the Eight Corners of the World under one roof."
 landmark_hakko_ichiu_plural:0 "$landmark_hakko_ichiu$"
 landmark_national_diet:0 "The National Diet Building"
 landmark_national_diet_desc:0 "The Kokkai-gijidō is the building where both houses of the National Diet of Japan meet. Being completed in early 1936, it is constructed almost entirely of Japanese materials with only a few exceptions. Its predecessor was destroyed in 1925 when another fire ravaged the area. Though the diet building has fallen many times, this time it will surely stand for centuries!"
 landmark_national_diet_plural:0 "$landmark_national_diet$"
 landmark_sadabad_complex:0 "The Sa'dabad Complex"
 landmark_sadabad_complex_desc:0 "Built by the Qajars and expanded by the Pahlavis, the Sa'dabad Complex in northern Tehran serves as a royal residence and seat of power. Its palaces and gardens reflect Iran’s shifting political landscape, from conservatism to modernism."
 landmark_taj_mahal:0 "The Taj Mahal"
 landmark_taj_mahal_desc:0 "The Taj Mahal stands as a masterpiece of Mughal architecture. Its grand white marble domes and intricate gardens make it one of the most iconic symbols of India, a testament to both imperial power and enduring legacy."
 lar_collab_gov.1.d:0 "[From.GetNameDefCap] have recently increased their efforts to build collaboration within our nation. A number of [This.GetAdjective] politicians have started speaking rather sympathetically about the [From.GetAdjective] regime, and many partisans within our nation are turning their [From.GetRulingIdeology] sentiment into direct support for [From.GetNameDef].\n\nThe growing [From.GetAdjective] influence in our nation will undoubtedly lower [Root.GetAdjective] resistance and may even lead to a new [From.GetRulingIdeology] government in collaboration with [From.GetNameDef] in the event that [Root.GetNameDef] should capitulate."
 lar_collab_gov.1.t:0 "[From.GetAdjective] Partisans in [Root.GetNameDef]"
 lar_portugal_overseas_provinces.3.a:0 "This is for the sake of Portugal."
 lar_portugal_overseas_provinces.3.desc:0 "Our former colony of East Timor have finally been integrated into our nation. The local Timorese population has obtained Portuguese citizenship and now shares the same rights and duties as any other Portuguese citizen, including military service. This will lead to a new source of manpower to strengthen our army."
 lar_portugal_overseas_provinces.3.t:0 "Timorese Territory Integrated"
 lar_spain.100.a:0 "They will crumble once more"
 lar_spain.100.b:0 "We are once more a world power!"
 lar_spain.100.d:0 "As of today, [SPR.GetLeader] has announced the unification of all Hispanic people under the banner of [SPR.GetNameDef]. They have stated that their goal is protect all bring the Hispanic people to prosperity, and to ensure that the Empire stands for another thousand years, further stating that their national mission has not yet come to an end."
