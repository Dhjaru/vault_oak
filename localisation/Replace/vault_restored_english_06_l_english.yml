 mtg_netherlands.72.t:0 "Kaiser Wilhelm II Passes Away"
 mtg_netherlands.80.t:0 "[From.GetNameDefCap] Reneges on Arms Agreement"
 mtg_netherlands.80.d:0 "The [From.GetAdjective] government has seized the remaining payments from our arms arrangement and halted further shipments. Our reliance on German equipment has come to an abrupt end."
 mtg_netherlands.80.a:0 "Treacherous, but hardly surprising."
 mtg_netherlands.81.t:0 "[From.GetNameDefCap] Offers Kalimantan Rubber"
 mtg_netherlands.81.d:0 "[From.GetNameDefCap] has approached us with a separate rubber deal outside the Anglo-Dutch quota system. In exchange for resource rights to Kalimantan rubber, they ask for a major Reich industrial investment — paid for in part by dismantling two of our civilian factories."
 mtg_netherlands.81.a:0 "Accept the rubber agreement."
 mtg_netherlands.81.b:0 "Reject the offer."
 mtg_netherlands.82.t:0 "[From.GetNameDefCap] Accepts Rubber Agreement"
 mtg_netherlands.82.d:0 "The [From.GetAdjective] government has accepted our Kalimantan rubber proposal. Resource rights have been granted and Reich industrial investment is already being transferred to the Netherlands."
 mtg_netherlands.82.a:0 "Excellent news."
 mtg_netherlands.83.t:0 "[From.GetNameDefCap] Declines Rubber Agreement"
 mtg_netherlands.83.d:0 "The [From.GetAdjective] government has rejected our separate rubber deal. With no German alternative available, we must proceed with the International Rubber Regulation Agreement instead."
 mtg_netherlands.83.a:0 "We have no choice."
 mtg_netherlands.84.t:0 "Batavia Research Facility"
 mtg_netherlands.84.d:0 "Funding from our colonial modernization program is ready to be committed. We must decide what kind of research facility to establish at Batavia."
 mtg_netherlands.84.a:0 "Land warfare research."
 mtg_netherlands.84.b:0 "Air warfare research."
 mtg_netherlands.84.c:0 "Naval warfare research."
 mtg_netherlands.84.e:0 "Nuclear research."
 mtg_netherlands.85.t:0 "Final Report on the Defense of the Netherlands"
 mtg_netherlands.85.d:0 "[GetHOLDefenseWarSummary]\n\n§ORotterdam§! — [GetHOLDefenseShipsOutcome]\n\n§OAmsterdam§! — [GetHOLDefenseGoldOutcome]\n\n§OThe Hague§! — [GetHOLDefenseGovernmentOutcome]\n\n§OLeeuwarden§! — [GetHOLDefenseLeeuwardenAirWingOutcome]\n\nThe government-in-exile will carry this record forward as proof that the Netherlands did not surrender without a fight."
 mtg_netherlands.85.a:0 "We held as long as we could."
 mtg_netherlands.87.t:0 "[From.GetNameDefCap] Requests Arms Purchases"
 mtg_netherlands.87.d:0 "[From.GetNameDefCap] has offered to buy surplus weapons from our stockpiles in exchange for industrial credits. The proposed shipment includes infantry equipment, fighters, anti-tank guns, anti-air guns, and field guns."
 mtg_netherlands.87.a:0 "Sell them the arms."
 mtg_netherlands.87.b:0 "We cannot spare the equipment."
 mtg_netherlands.88.t:0 "[From.GetNameDefCap] Requests Arms Purchases"
 mtg_netherlands.88.d:0 "[From.GetNameDefCap] has offered to buy surplus weapons from our stockpiles, paying partly in industrial credits and partly in sterling. The proposed shipment includes infantry equipment, fighters, anti-tank guns, anti-air guns, and artillery."
 mtg_netherlands.88.a:0 "Sell them the arms."
 mtg_netherlands.88.b:0 "We cannot spare the equipment."
 mtg_netherlands_88_british_pounds_tt:0 "§Y[ENG.GetNameDefCap]§! receives §G300§! million pounds."
 mtg_netherlands.89.t:0 "[From.GetNameDefCap] Agrees to Sell Arms"
 mtg_netherlands.89.d:0 "[From.GetNameDefCap] has accepted our request and is dispatching the agreed shipment of French surplus weapons, along with the promised industrial credits."
 mtg_netherlands.89.a:0 "The shipment is most welcome."
 mtg_netherlands.90.t:0 "[From.GetNameDefCap] Agrees to Sell Arms"
 mtg_netherlands.90.d:0 "[From.GetNameDefCap] has accepted our request and is dispatching the agreed shipment of British surplus weapons in exchange for our payment."
 mtg_netherlands.90.a:0 "The shipment is most welcome."
 mtg_netherlands.91.t:0 "[From.GetNameDefCap] Declines Arms Sale"
 mtg_netherlands.91.d:0 "[From.GetNameDefCap] has refused to sell us the requested surplus weapons. We will have to look elsewhere to make up the shortfall."
 mtg_netherlands.91.a:0 "Most unfortunate."
 mtg_netherlands.92.t:0 "[From.GetNameDefCap] Declines Arms Sale"
 mtg_netherlands.92.d:0 "[From.GetNameDefCap] has refused to sell us the requested surplus weapons. We will have to look elsewhere to make up the shortfall."
 mtg_netherlands.92.a:0 "Most unfortunate."
 mtg_netherlands.93.t:0 "Dutch East Indies Capitulates"
 mtg_netherlands.93.d:0 "With Batavia, Soerabaja, Palembang, Medan, and Balikpapan in our hands, organized Dutch resistance in the archipelago has collapsed. The remaining colonial garrisons are surrendering, and the last KNIL formations are being disarmed as we assume full control of Nederlands-Indië."
 mtg_netherlands.93.a:0 "The riches of the Indies are ours."
 mtg_netherlands.94.t:0 "The February Strike"
 mtg_netherlands.94.d:0 "Word has reached us from the occupied homeland: on 25 February, Dutch workers in Amsterdam launched a general strike against the German persecution of the Jewish population. Tram workers, dockers, and civil servants have walked off the job in a remarkable show of solidarity. Though the occupation authorities are moving to suppress the unrest, the strike has demonstrated that the Dutch people have not been broken."
 mtg_netherlands.94.a:0 "The spirit of the Netherlands endures."
 mtg_netherlands.95.t:0 "The Defense of the Netherlands"
 mtg_netherlands.95.d:0 "When Germany launches its offensive through the Low Countries, a set of timed defense missions will activate under the §ODefense of the Netherlands§! decision category. Hold each objective until its timer expires to preserve our assets, government, and links with the Allies — or lose the city too soon and hand the enemy a victory.\n\n§BRotterdam§! — §O7 days§!\nHold Rotterdam so warships still on the slipways can be scuttled before capture.\nIf the city falls too soon, §OGermany§! seizes our shipping and warships:\n§ONetherlands§! loses §O50§! convoys\n§OGermany§! gains §O50§! convoys\n§OGermany§! gains §O6§! Dutch §O1936 Submarines§!\n§OGermany§! gains §O3§! Dutch §O1940 Light Cruisers§! at §O60%§! construction progress\n\n§BAmsterdam§! — §O5 days§! per shipment (repeating)\nHold Amsterdam to evacuate gold convoys to Britain. Each completed shipment:\n§OThe United Kingdom§! receives §G100§! Million Pounds\nEach shipment reduces what §OGermany§! can seize if Amsterdam falls later by §O5000§! £cic£\nUp to §O6§! shipments may complete; if Amsterdam is captured immediately, §OGermany§! may seize up to §O30000§! £cic£ in remaining gold (minimum §O0§!)\n\n§BThe Hague§! — §O12 days§!\nHold The Hague long enough for the government to escape:\nUpon capitulation, §ONetherlands§! gains §G25%§! Legitimacy\nIf the city falls too soon, upon capitulation §OGermany§! gains §G30%§! Compliance in all §ONetherlands§! states it controls\n\n§BLeeuwarden§! — §O7 days§!\nHold Leeuwarden airfield to fly out the northern air wing.\nIf held, upon capitulation §ONetherlands§! receives §O50§! fighters and §OJacob van Helsdingen§! as an ace pilot\nIf the base falls too soon, §OGermany§! captures §O50§! fighters\n\n§BBreda§! — §O100 days§! (only if we coordinated with France)\nHold Breda to keep the French corridor open.\nIf the Germans capture Breda, §ONetherlands§! suffers §R-10%§! Division Attack on Core Territory until capitulation\n\n§BUtrecht§! — §O5 days§! (only if we prepared inundation lines)\nHold Utrecht while the inundation is completed to flood the Dutch Line and strengthen our defenses.\nIf the Germans capture Utrecht first, the flooding operation fails.\n\n§BInfrastructure demolitions§! — §O3 days§! (only if we prepared infrastructure demolitions)\nAfter three days, prepared charges automatically wreck §O4§! levels of §OInfrastructure§! in every Dutch core state we still control.\n\nEvery mission we complete strengthens our position for the struggle ahead; every failure strengthens Germany."
 mtg_netherlands.95.a:0 "We will hold as long as we can."
 hol_dei_capitulation_cities_tt:0 "Japan or a member of Japan's faction controls Batavia, Soerabaja, Palembang, Medan, and Balikpapan."
 hol_dei_capitulation_effect_tt:0 "All Dutch East Indies states still held by §Y[HOL.GetNameDef]§! or §Y[INS.GetNameDef]§! are transferred to §Y[JAP.GetNameDef]§!, and any remaining Dutch divisions in those states are disbanded."
 mtg_news.65.t:0 "Dutch East Indies Capitulates"
 mtg_news.65.desc:0 "After seizing Batavia, Soerabaja, Palembang, Medan, and Balikpapan, [JAP.GetAdjective] forces have broken the last organized Dutch resistance in the East Indies. The colonial administration has ceased to function, and the remaining Dutch territories in the archipelago are passing under [JAP.GetAdjective] occupation."
 mtg_news.65.a:0 "The East Indies are secured."
 mtg_news.65.b:0 "Our empire in the East is lost."
 mtg_news.65.c:0 "A decisive blow in the Pacific."
