 HOL_dutch_economy_dynamic_modifier:0 "State of the Dutch Economy"
 HOL_dutch_economy_dynamic_modifier_desc:0 "Due to the peculiarities of global economics, the Great Depression has hit in the Netherlands much later than elsewhere. The Dutch decision to maintain the Gold Standard, while other nations abandoned it rather quickly, has further exacerbated the crisis years tremendously. In keeping the Guilder from devaluing, no funds are left to aid the ailing Dutch economy, let alone improve the poor state of national defenses.\n\nThe crisis can be reduced by investing in public works. Colonial industrial firms provide §G+20%§! MIO Funds Gain and §G-20%§! MIO Size Up Requirement, while synthetic rubber refinery production costs are increased as in the wider Allied war economy. After relocating the government to Batavia, metropolitan construction penalties are cleared while wartime mobilization reshapes the national economy."
 HOL_prince_bernhard_desc:0 "§LWhile at war, Prince Bernhard may trigger recurring events covering scandals, morale boosts, air force inspiration, strategic meddling, intelligence work, and resistance organizing.§!"
 HOL_severed_french_corridor:0 "Severed French Corridor"
 HOL_severed_french_corridor_desc:0 "With Breda in German hands, the link to our French allies has been cut and our counter-offensive capacity on core territory has been badly weakened."
