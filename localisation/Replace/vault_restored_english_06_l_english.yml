 rangers_backbone_doctrine:0 "Light Infantry Specialization"
 rangers_backbone_doctrine_desc:0 "The skills our woodland specialists have acquired are something that all our elite forces can benefit from. We must use this knowledge across all branches of light and elite troops."
 rangers_fire_support_integration:0 "Fire Support Integration"
 rangers_fire_support_integration_desc:0 "The integration of forward observers with portable signal equipment into ranger teams means that even small, isolated units need not fight without artillery fire support."
 rangers_guerilla_doctrine:0 "Forest Guerillas"
 rangers_guerilla_doctrine_desc:0 "Initiative and movement are key ingredients to being able to attack the enemy. Our rangers should excel at using stealth and surprise."
 rangers_jaegers_training:0 "Incorporate Jaeger Traditions"
 rangers_jaegers_training_desc:0 "Light infantry trained at fighting in Forests, living off what the area has to offer, experts at setting traps, ambushes and excellent shots."
 rangers_jungle_training:0 "Rangers Jungle Training"
 rangers_jungle_training_desc:0 "Adept at not only surviving, but also fighting in the densest of forests, in tropical heat, these rangers are key to operating in areas normal troops dare not enter."
 rangers_recon_terrain_training:0 "Recon Rangers Terrain Mastery"
 rangers_recon_terrain_training_desc:0 "An essential prerequisite of ranger tactics is the ability to traverse the roughest terrain to strike the enemy where he does not expect."
 rangers_tech:0 "Rangers I"
 rangers_tech2:0 "Rangers II"
 rangers_tech2_desc:0 "Using woodland specialists en masse rather than as small recon units gives us the opportunity to conduct massive assaults against lightly defended sectors."
 rangers_tech3:0 "Rangers III"
 rangers_tech3_desc:0 "Operating in difficult areas require special equipment and special training methods. We need to ensure our troops are equipped with the latest tools, and trained using the latest methods."
 rangers_tech_cat:0 "Rangers Technology"
 rangers_tech_desc:0 "By specializing in woodland combat, training our light infantry to adapt to terrain and vegetation, we can economize on troops in defense, or even push through enemy lines where they least expect us."
 rangers_urban_combat:0 "Rangers Urban Combat Expertise"
 rangers_urban_combat_desc:0 "Forest and city fighting share certain similarities, with short engagement ranges and limited observation. Troops skilled in one environment can be trained to adapt to the other."
