 mtg_britain.200.a:0 "It is safer to agree."
 mtg_britain.200.b:0 "Over our dead bodies!"
 mtg_britain.200.d:0 "In a stunning turn of events, the government of [FROM.GetLeader] has attempted to rally support in [ROOT.GetName] to change our ruling party to [FROM.GetRulingIdeology]."
 mtg_britain.200.t:0 "[FROM.GetNameDefCap] Attempts To Install [FROM.GetRulingIdeology] Regime"
 mtg_britain.200.tt:0 "§RThis may have dire consequences§!"
 mtg_britain.201.a:0 "Let us drop the subject, unity is more important."
 mtg_britain.201.b:0 "It is war."
 mtg_britain.201.d:0 "In a stunning display of disloyalty, [FROM.GetLeader] has announced their refusal to submit to the wishes of [ROOT.GetLeader] over the topic of the role of [ROOT.GetRulingIdeology] in their government. Our only way to achieve regime change now is through an armed conflict with [FROM.GetNameDef]."
 mtg_britain.201.t:0 "[FROM.GetNameDefCap] Refuses Regime Change"
 mtg_britain.202.a:0 "Some things are worth fighting for."
 mtg_britain.202.d:0 "It appears [FROM.GetLeader] did not take our rejection well, going so far as to announce an official declaration of war!"
 mtg_britain.202.t:0 "[FROM.GetNameDefCap] Declares War"
 mtg_britain.203.a:0 "No war with the mother country."
 mtg_britain.203.d:0 "In a note from [FROM.GetLeader], they have announced their acceptance of our refusal, citing the need to maintain the unity of the Commonwealth."
 mtg_britain.203.t:0 "[FROM.GetNameDefCap] Drops Regime Change Topic"
 mtg_britain.66.c:0 "Our government might not yet share [ENG.GetAdjective] beliefs, but the winds are shifting."
 mtg_netherlands.37.desc:0 "[From.GetNameDefCap] has refused to share their intelligence."
 mtg_netherlands.77.a:0 "A marvelous idea - we stand no chance without it."
 mtg_netherlands.77.b:0 "Our sovereignty is paramount - we will go far in our cooperation, but not that far."
 mtg_netherlands.77.d:0 "The [From.GetAdjective] government has approached ours with a proposal to unify the Low Countries in one state. They argue that the present global crises warrant closer cooperation and unity between our peoples, of the kind that can only be achieved through complete unification. Should we accept, preparations will be made for the immediate surrender of sovereignty to a new supranational state, under [From.GetAdjective] leadership."
 mtg_netherlands.77.t:0 "[From.GetNameDef] Proposes Federation"
 mtg_netherlands.78.d:0 "The [From.GetAdjective] government has informed us that they approve of our proposal for a unified state in the Low Countries. Should all parties accept, we may proceed with the implementation of our plans."
 mtg_netherlands.78.t:0 "[From.GetNameDef] Accepts Federation"
 mtg_netherlands.79.d:0 "[From.GetAdjective] representatives have informed us that they do not currently see the need for a unified state in the Low Countries. They look forward to continuing their cooperation with us, but while maintaining full sovereignty."
 mtg_netherlands.79.t:0 "[From.GetNameDef] Rejects Federation"
 mtg_news.3.g:0 "Yet their support for us is unwavering!"
 mtg_news.3.g_tt:0 "Their guarantee of us is §Rnot§! affected by this!"
 mtg_news.62.b:0 "The Empire is in crisis."
 mtg_news.62.desc:0 "Representatives of the Dominion governments today announced that they will unilaterally be breaking ties with the Crown. They cite the King's flagrant disregard for the opinions and wishes of the Dominion governments and their peoples as the primary reason for why the British-Commonwealth relationship can no longer continue. This crisis, brought on by the King's intent to marry Wallis Simpson, has now resulted in the formation of a new Commonwealth of Nations with the various Dominions, and it seems that the present paralysis of the British government will preclude any action being taken in response to this move. This is undoubtedly what the Dominions have hoped for."
 mtg_news.63.desc:0 "The [Root.GetAdjective] government today announced that they will unilaterally be breaking ties with the [ENG.GetAdjective] government. They cite their inability to reconcile their political views with the present political developments occurring in [ENG.GetName] as the primary reason for this."
 mtg_news.63.t:0 "[Root.GetName] Declares Independence"
 mtg_news.64.a:0 "All our peoples stand united to defend our homeland."
 mtg_news.64.b:0 "United again? Make up your minds!"
 mtg_news.64.desc:0 "Citing severe external threats to their national security, the governments of the Low Countries have announced the immediate unification of their governments and armed forces to strengthen the position of their peoples. Under [From.GetOldAdjective] leadership industrial investments and defensive military planning will now take precedence over other domestic matters, aimed at ensuring military readiness is sufficient to react to any action that might threaten the new state's sovereignty."
 mtg_news.64.t:0 "Low Countries Unite"
 mtg_usa_canadian_corridor.1.a:0 "They shall have it."
 mtg_usa_canadian_corridor.1.b:0 "Never!"
 mtg_usa_canadian_corridor.1.desc:0 "Our ambassador in [USA.GetNameDef] was summoned to the Department of State today and presented with an ultimatum. According to the note handed to him, government of [USA.GetNameDef] can no longer accept Canadian sovereignty over the areas between Washington and Alaska. \n\nSuggestions to negotiate a treaty allowing passage of troops and exemption from certain border controls were flatly refused. The [USA.GetAdjective] government expects an answer by midnight."
 mtg_usa_canadian_corridor.1.t:0 "The Canadian Corridor"
 mtg_usa_canadian_corridor.2.a:0 "They chose wisely."
 mtg_usa_canadian_corridor.2.desc:0 "The government of [CAN.GetLeader] has agreed to our demands and withdrawn from the contested territories. Our forces have moved forward to establish control over what outposts of civilization exist beyond the cities."
 mtg_usa_canadian_corridor.2.t:0 "[CAN.GetNameDefCap] accepts"
 mtg_usa_canadian_corridor.3.a:0 "We offered peace and they chose war."
 mtg_usa_canadian_corridor.3.b:0 "We can't afford a war over a bunch of rocks and trees."
 mtg_usa_canadian_corridor.3.t:0 "[CAN.GetNameDefCap] Refuses"
 mtg_usa_civil_war_democrats.1.a:0 "Let them protest, we have a country to run."
 mtg_usa_civil_war_democrats.1.t:0 "Protests in the Capital"
 mtg_usa_civil_war_democrats.10.desc:0 "A US armory in a remote part of [GETUSASTATE] was subjected to an assault by forces unknown over the last night. The small group of armed men forced the few guards into a shed, where they were locked in. When the soldiers managed to escape after dawn, they found the armory thoroughly looted. It appears that during the night, the attackers moved away large quantities of material to an unknown location."
 mtg_usa_civil_war_democrats.11.a:0 "Nothing wrong with that."
 mtg_usa_civil_war_democrats.11.t:0 "Citizen Militia forms"
 mtg_usa_civil_war_democrats.14.a:0 "What else would one expect from these communist traitors?"
 mtg_usa_civil_war_democrats.14.desc:0 "Mass strikes have been reported all across the US, with a wide variety of unions calling for action. Only the most vital of services are exempt. Fights have broken out in many places between strikers and strike-breakers. \n\nUnusually, the workers do not demand higher wages or other concessions but nothing less than the resignation of President [USA.GetLeader]."
 mtg_usa_civil_war_democrats.14.t:0 "Workers on strike"
 mtg_usa_civil_war_democrats.15.a:0 "They are most welcome."
 mtg_usa_civil_war_democrats.15.desc:0 "With instability growing throughout the country, many entrepreneurs have started to quietly look for safer places to set up shop. In particular, the southern states of the US have enjoyed a resurgence in industrial output, with some companies moving entire factories halfway across the country."
 mtg_usa_civil_war_democrats.15.t:0 "Industrialists move Arms Factories"
 mtg_usa_civil_war_democrats.16.a:0 "This proves that the President's policies are working!"
 mtg_usa_civil_war_democrats.16.t:0 "Economic migration"
 mtg_usa_civil_war_democrats.2.a:0 "And how do they propose to enforce that demand?"
 mtg_usa_civil_war_democrats.2.desc:0 "All across the country, the regular protests against the policies of President [USA.GetLeader] have only grown in size, now regularly topping several million protesters. Today, More than a million marched through the streets of Washington, with similar numbers reported in at least nine other locations. This is not even accounting for the smaller marches in state capitals and smaller cities, which still pulled in thousands of people each, with some topping hundreds of thousands. The protests come after a series of unpopular policy decisions by the administration, which the organizers claim undermine the very democratic fabric of the republic.\n\n Where previously the protesters demanded that the President distance himself from more radical ideologies, they have now come to demand his immediate removal from office."
 mtg_usa_civil_war_democrats.2.t:0 "The Ten-Million-March"
 mtg_usa_civil_war_democrats.20.a:0 "No one will take them seriously. This will blow over."
 mtg_usa_civil_war_democrats.20.t:0 "The Boston Rebellion"
 mtg_usa_civil_war_democrats.21.a:0 "We still hold the center of the country."
 mtg_usa_civil_war_democrats.21.desc:0 "The state governments of California, Oregon and Washington state have all declared their support of the Boston Government and ordered all federal officers to either resign their posts or leave the territories of these states immediately. Although there are reports of some scattered pockets of resistance against this move, it does seem to largely enjoy the support of the population."
 mtg_usa_civil_war_democrats.21.t:0 "Rebellion spreads to the West Coast"
 mtg_usa_civil_war_democrats.22.a:0 "As well they should."
 mtg_usa_civil_war_democrats.22.desc:0 "With more and more states refusing to follow directions from the legitimate government, the governors of Ohio, Missouri, Wisconsin, Illinois, Indiana and Michigan have jointly declared that they will not tolerate any seditious behavior amongst their population. A new civil war, they argue, would leave the US dangerously weakened in the face of foreign aggression."
 mtg_usa_civil_war_democrats.22.t:0 "Midwest declares for the government"
 mtg_usa_civil_war_democrats.23.a:0 "We will return."
 mtg_usa_civil_war_democrats.23.desc:0 "Rebel forces marching south from New England have been widely greeted as liberators in Maryland, New York, Pennsylvania and New Jersey, with the local governors ordering state police and the national guard not to interfere. Any attempts to rally loyalist forces around the capital have failed. President [USA.GetLeader] was evacuated from Washington mere hours before rebel forces closed all exits. His motor column has made it to Richmond, Virginia, and will likely continue further south."
 mtg_usa_civil_war_democrats.23.t:0 "The East Coast joins the Rebellion"
 mtg_usa_civil_war_democrats.25.a:0 "That's mostly empty land, anyway."
 mtg_usa_civil_war_democrats.25.desc:0 "The governors of Wyoming, Idaho and Montana have jointly declared for the Boston government. Rebel forces from Washington and Oregon have already linked up with their comrades-in-arms in the states."
 mtg_usa_civil_war_democrats.25.t:0 "The North-West Secedes"
 mtg_usa_civil_war_democrats.26.a:0 "They are strategic territories."
 mtg_usa_civil_war_democrats.26.desc:0 "The state legislatures of Wyoming, Idaho and Montana have passed a round of anti-sedition laws, giving the local law-enforcement agencies sweeping powers to arrest and detain anyone found speaking out against the federal government for the duration of the current emergency. However, the presence of rebel forces in nearby Washington and Oregon will require swift support from loyalist forces."
 mtg_usa_civil_war_democrats.26.t:0 "North-West declares for the government"
 mtg_usa_civil_war_democrats.27.a:0 "Excellent, less useless desert to defend."
 mtg_usa_civil_war_democrats.27.desc:0 "Nevada, Arizona, Utah, New Mexico and Colorado have all declared for the Rebellion. State officials who refused to follow orders to allow the passage of rebel forces from California have been summarily removed from office and in many cases imprisoned."
 mtg_usa_civil_war_democrats.27.t:0 "The South-West Secedes"
 mtg_usa_civil_war_democrats.28.a:0 "The time for rallies and speeches is long gone."
 mtg_usa_civil_war_democrats.28.desc:0 "The governors of Nevada, Arizona, Utah, New Mexico and Colorado have declared a state of emergency following wide-spread demonstrations in support of the Boston Government. In several cases, state police and National Guard units fired on the protesters, who fled in panic, dragging their dead and wounded with them."
 mtg_usa_civil_war_democrats.28.t:0 "The South-West declares for the government"
 mtg_usa_civil_war_democrats.29.a:0 "That territory is easily recaptured."
 mtg_usa_civil_war_democrats.29.desc:0 "The state governments of the Dakotas, Iowa, Minnesota and Nebraska were swept out of office by a well-coordinated and executed uprising supported by local law-enforcement officers and sympathetic national guardsmen. The hastily elected Interim Governors have declared their support for the Boston Government."
 mtg_usa_civil_war_democrats.29.t:0 "West Mid-West Secedes"
 mtg_usa_civil_war_democrats.30.a:0 "Heroes one and all."
 mtg_usa_civil_war_democrats.30.desc:0 "The state governments of the Dakotas, Iowa, Minnesota and Nebraska today narrowly managed to defeat an apparently well-planned coup attempt by leftist elements, supported by law enforcement and rebellious National Guardsmen. Loyalist citizens managed to protect the state legislatures and prevent the capture of several governors, but suffered casualties in several sharp firefights raging in the state capitals."
 mtg_usa_civil_war_democrats.30.t:0 "West Mid-West declares for the government"
 mtg_usa_civil_war_democrats.31.a:0 "They are but the last in a long line of traitors to be dealt with."
 mtg_usa_civil_war_democrats.31.t:0 "The Mid-West Secedes"
 mtg_usa_civil_war_democrats.40.a:0 "Desperate times call for desperate measures."
 mtg_usa_civil_war_democrats.40.b:0 "That would be the end of the republic."
 mtg_usa_civil_war_democrats.40.desc:0 "With the government in full retreat and large parts of the country siding with the insurrection, General MacArthur has approached us with an offer. Pointing out that only he truly understands the American mindset and provide stability and leadership in this moment of crisis, MacArthur has offered to lead a 'Government of National Defense' until the insurrection has been defeated. According to MacArthur, this is to reduce friction between the civilian leadership and the military commanders by placing General MacArthur in charge.\n\nSome in the government are somewhat uncomfortable with the fact that he continues to refer to himself in the third person."
 mtg_usa_civil_war_democrats.40.t:0 "MacArthur offers to lead the Government"
 mtg_usa_civil_war_democrats.41.a:0 "He has done his duty."
 mtg_usa_civil_war_democrats.41.b:0 "The republic still has need of him."
 mtg_usa_civil_war_democrats.41.c:0 "Mr. Hilt seems the best candidate to rebuild the country."
 mtg_usa_civil_war_democrats.41.d:0 "Ask Charles Lindbergh to form a government."
 mtg_usa_civil_war_democrats.41.desc:0 "With the Boston insurrection finally at an end, many in the government are unsure how to proceed. MacArthur's Government of National Defense was originally envisioned to only last until the end of the war. However, the world around [USA.GetNameDef] has only grown more hostile, and we may soon find ourselves once again at war. Fascist leader William Dudley Pelley has publicly called for a return to 'lawful and orderly government', while thanking MacArthur for his service. Pointing to the surge in support for his movement during the war, Pelley clearly considers himself predestined for the position of President and Leader of America.[USA.GetCandidatesFascism2][USA.GetCandidatesFascism]\n\nIn an uncharacteristic show of humility, [USA.GetLeader] has offered to step down should the public opinion demand it. The American people look to us to see how the rest of the administration considers the issue."
 mtg_usa_civil_war_democrats.41.t:0 "William Dudley Pelley challenges [USA.GetLeader]"
 mtg_usa_civil_war_fascists.1.a:0 "We must avoid escalating the situation."
 mtg_usa_civil_war_fascists.1.b:0 "We must not bow to the mob."
 mtg_usa_civil_war_fascists.1.t:0 "Silver Legion protests"
 mtg_usa_civil_war_fascists.10.a:0 "Deeply troubling news."
 mtg_usa_civil_war_fascists.10.desc:0 "A US Army armory in [GetCSAState] was assaulted and briefly taken over yesterday. The small detachment of guards found themselves opposed by a large armed mob that demanded the keys to the storage rooms. When reinforcements from a nearby garrison arrived, the attackers had already retreated, carrying with them a large number of small arms.\n\nGiven that the guards were completely unharmed and the reinforcements took a suspiciously long time to arrive, some in government speculate that this was a coordinated attack."
 mtg_usa_civil_war_fascists.10.t:0 "Armory Raided"
 mtg_usa_civil_war_fascists.11.a:0 "Greedy."
 mtg_usa_civil_war_fascists.11.desc:0 "The government of [GetCSAState] has sent state police to shut down all tax collection and assessment operations in the state. Furthermore, the governor declared any taxes and duties on tobacco and alcohol null and void and ordered businesses not to pay any customs or duties to the Treasury. \n\n However, he also ordered that businesses and private individuals should continue to file taxes with state tax authorities, including taxes otherwise owed to the Treasury."
 mtg_usa_civil_war_fascists.11.t:0 "State Interferes with Tax Collection"
 mtg_usa_civil_war_fascists.12.a:0 "He will be missed."
 mtg_usa_civil_war_fascists.12.desc:0 "Citing poor health, General [From.GetName] has handed in his resignation. It is an open secret, however, that he has privately voiced deep concerns about the political direction of the country, even going so far as to claim that a new American Civil War is just around the corner.\n\nRather than contemplating his own loyalties, he seems to have decided not to take up arms against his fellow citizens at all."
 mtg_usa_civil_war_fascists.12.t:0 "General [From.GetName] Resigns"
 mtg_usa_civil_war_fascists.13.a:0 "Very unsettling."
 mtg_usa_civil_war_fascists.13.t:0 "Governor mobilizes National Guard"
 mtg_usa_civil_war_fascists.14.a:0 "Such disloyalty."
 mtg_usa_civil_war_fascists.14.desc:0 "Alarming reports have come in from several units that soldiers have failed to return from leave or simply deserted their posts. Perhaps even more alarming is the fact that many of these soldiers come from the same geographical areas, and many had received mail from home only a few days before they disappeared.\n\nIt appears that there is a concerted effort going on to get soldiers from southern states to return home."
 mtg_usa_civil_war_fascists.14.t:0 "Soldiers Desert"
 mtg_usa_civil_war_fascists.15.a:0 "That shouldn't matter too much."
 mtg_usa_civil_war_fascists.15.desc:0 "Citing a political climate unsuitable to business, the owner of a major arms company has today announced that he will be moving production to a more suitable location. He specifically noted an increase in union activity which he claims lowered production and reduced investor confidence. Instead, the company will build a new factory in an undisclosed location in the southern states."
 mtg_usa_civil_war_fascists.15.t:0 "Industrialist moves Arms Factory"
 mtg_usa_civil_war_fascists.16.a:0 "An absurd and unamerican position."
 mtg_usa_civil_war_fascists.16.desc:0 "According to a confidential support from the Department of Commerce, a growing number of industrialists in the northern parts of the US have made plans to move production to other states after a number of strikes were called by unions, demanding higher wages and shorter workdays. A climate of deep worry has set in in the business community, with many arguing that it is becoming increasingly difficult to turn a reasonable profit in states that will not act to suppress these strikers."
 mtg_usa_civil_war_fascists.16.t:0 "Industrialist moves Civilian Factory"
 mtg_usa_civil_war_fascists.2.a:0 "Blood has been spilt. We must expect that more will be spilt before this is over."
 mtg_usa_civil_war_fascists.2.desc:0 "Tensions escalated at another protest in the capital today, as another mass-protest was called by, amongst others, the Silver Legion of America. Repeating their earlier demands that a number of Members of Congress be arrested and turned over to them, the protesters issued an ultimatum of one hour before they would storm the Capitol and remove the people on their list by force. \n\nWhen the ultimatum passed without reaction, small squads of Silver Legionnaires rushed the line of Capitol Police. A bloody melee developed, which quickly spread to engulf other protesters. With the police so occupied, other groups gained entrance into the buildings. Going from room to room, they managed to find several of their intended victims, but were stopped from leaving by armed police. In the ensuing firefight, several of the attackers were killed, while two congressmen were injured.\n\nAn ugly mood has settled over the capital, with both sides blaming the other for the escalation. The next few weeks will show whether the incident now known as The Battle of Capitol Hill was the end of the protests, or merely the prelude to an even bigger conflict."
 mtg_usa_civil_war_fascists.2.t:0 "Protests escalate into violence"
 mtg_usa_civil_war_fascists.20.a:0 "Call it what it is: Treason."
 mtg_usa_civil_war_fascists.20.desc:0 "At 8:00 AM today, a special envoy from [CSAcapital.GetName] arrived at the White House to deliver to President [USA.GetLeader] a note from the State Legislation announcing that [CSAcapital.GetName] will no longer consider itself part of the republic. Claiming that this is a fundamental right of any civilized people - and quoting extensively from the Declaration of Independence - the note also stated emphatically that a peaceful secession is in everyone's interest and that the new state wishes nothing more than to conduct its own affairs as a good neighbor of [USA.GetNameDef]."
 mtg_usa_civil_war_fascists.20.t:0 "Secession!"
 mtg_usa_civil_war_fascists.201.a:0 "Form them into separate units."
 mtg_usa_civil_war_fascists.201.b:0 "Integrate them into the Army."
 mtg_usa_civil_war_fascists.201.desc:0 "As our forces have advanced into [CSA_liberated_state.GetName], they have come across a large number of sympathetic citizens who have long harbored hidden sympathies towards us. Swept up in a wave of patriotic fervor, they have asked to join our military."
 mtg_usa_civil_war_fascists.201.t:0 "Volunteers from [CSA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.202.desc:0 "As our forces have advanced into [USA_liberated_state.GetName], they have come across a large number of sympathetic citizens who have long harbored hidden sympathies towards us. Swept up in a wave of patriotic fervor, they have asked to join our military."
 mtg_usa_civil_war_fascists.202.t:0 "Volunteers from [USA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.203.a:0 "Traitors one and all."
 mtg_usa_civil_war_fascists.203.desc:0 "A group calling themselves the [USA_state_government_created.GetName] Citizen Council have announced that they have taken over administration of [USA_state_government_created.GetName] from [CSA.GetAdjective] military authorities. While they claim no affiliation in the ongoing conflict, they also announced that they would implement several new laws dealing with recruitment for the [CSA.GetAdjective] military.\n\nAs part of the announcement, they have declared that whatever congressional delegates still remain in the capital are no longer representing the people of [USA_state_government_created.GetName]."
 mtg_usa_civil_war_fascists.203.t:0 "Rebels create collaboration government in [USA_state_government_created.GetName]"
 mtg_usa_civil_war_fascists.21.a:0 "We've been here before, haven't we?"
 mtg_usa_civil_war_fascists.21.t:0 "A House Divided"
 mtg_usa_civil_war_fascists.22.a:0 "They are cowards, certainly, but at least not enemies."
 mtg_usa_civil_war_fascists.22.b:0 "They have chosen their side."
 mtg_usa_civil_war_fascists.22.desc:0 "Following the outbreak of hostilities between [USA.GetNameDef] and [CSA.GetNameDef], a number of state legislatures have passed motions of non-intervention. These laws order the governor to maintain the territorial integrity of the state and prevent combat troops from either side from entering. They further ban any kind of recruitment efforts by either side but, crucially, do not restrict the sale of arms and munitions to either party in the conflict provided that payment is rendered beforehand. \n\nThe motions also stress that the states consider themselves to be part of [USA.GetNameDef] and do not wish to form their own permanent government."
 mtg_usa_civil_war_fascists.22.t:0 "Neutral Bloc forms"
 mtg_usa_civil_war_fascists.23.a:0 "They were not worth the price in blood after all."
 mtg_usa_civil_war_fascists.23.desc:0 "With the end of the war, the states in the neutral bloc have announced that they will end the various laws and measures put in place to maintain their neutrality. From this day forward, combat troops may once again freely enter their territories. The militias raised during the war have peacefully disbanded."
 mtg_usa_civil_war_fascists.23.t:0 "Neutral Bloc dissolves"
 mtg_usa_congress_add_state_tt:0 "Two Senators are added to Congress. They will initially §Gsupport the government§!.\n"
 mtg_usa_congress_remove_state_tt:0 "Two Senators are removed from Congress.\n"
 mtg_usa_foreign_support.1.a:0 "We must do what we can."
 mtg_usa_foreign_support.1.b:0 "We can't afford anything."
 mtg_usa_foreign_support.1.desc:0 "Some leading members of the Silver Legion of America have been on a lecture tour through [This.GetNameDef], talking at length about the threat their country faces from well-entrenched communists in all levels of government. The American way of life is under attack, and any kind of support we could render would be greatly appreciated and might make the difference in the sadly necessary struggle about to come."
 mtg_usa_foreign_support.1.t:0 "Donations for [USA.GetNameDef]"
 mtg_usa_foreign_support.10.a:0 "True [USA.GetAdjective] Heroes"
 mtg_usa_foreign_support.10.desc:0 "A message has arrived from our delegation in [From.GetNameDef]. The [From.GetAdjective] government has approved the construction of several training camps to train members of the Silver Legion in infantry tactics. They will hone their skills until the war breaks out."
 mtg_usa_foreign_support.10.t:0 "[From.GetNameDefCap] approves Training Camps"
 mtg_usa_foreign_support.11.a:0 "We will remember this."
 mtg_usa_foreign_support.11.desc:0 "A message has arrived from our delegation in [From.GetNameDef]. They have been unable to secure permission for our proposed training camps from [From.GetLeader], and are requesting further instructions."
 mtg_usa_foreign_support.11.t:0 "[From.GetNameDefCap] refuses to help"
 mtg_usa_foreign_support.12.a:0 "They shall earn their wings."
 mtg_usa_foreign_support.12.b:0 "We don't have time for this nonsense."
 mtg_usa_foreign_support.12.desc:0 "American fascists of the Silver Legion have met with [This.GetLeader] to be allowed to send a number of volunteers over for pilot training. The candidates would be carefully selected for their skills and correct ideological foundation before being approved by us. It appears that the legion believes that many of the professional pilots in the current armed forces would not accept a fascist government in the US and support an insurrection."
 mtg_usa_foreign_support.12.t:0 "Silver Legion wants to train pilots"
 mtg_usa_foreign_support.13.a:0 "They will be eagerly expected."
 mtg_usa_foreign_support.13.desc:0 "The [From.GetAdjective] government has approved a small number of Silver Legionaries for pilot training. Further negotiations have secured the sale of a small number of fighter planes on credit, to be delivered when the war breaks out."
 mtg_usa_foreign_support.13.t:0 "[From.GetNameDefCap] approves pilot training"
 mtg_usa_foreign_support.14.a:0 "Flying a plane isn't that difficult, is it?"
 mtg_usa_foreign_support.14.desc:0 "Citing grave concerns over the suitability of the candidates, the [From.GetAdjective] government has refused permission for our proposed pilot training program."
 mtg_usa_foreign_support.14.t:0 "[From.GetNameDefCap] Refuses to Train Pilots"
 mtg_usa_foreign_support.15.a:0 "A worthwhile investment"
 mtg_usa_foreign_support.15.b:0 "That would be a waste of money"
 mtg_usa_foreign_support.15.desc:0 "A representative of the Silver Legion has arrived to ask for help in securing funding for a number of projects to build ships in [USA.GetNameDef]. The Silver Legion - with backing from people in the [USA.GetAdjective] government - want to keep these ships off the books and have to look for alternate funding sources."
 mtg_usa_foreign_support.15.t:0 "Silver Legion seeks to acquire ships"
 mtg_usa_foreign_support.16.a:0 "You can't build a ship in a day."
 mtg_usa_foreign_support.16.desc:0 "The [From.GetAdjective] government has approved the necessary funds to purchase ships. The current plan is to buy ships and armaments separately and join them together when the war begins. That process will no doubt take some time."
 mtg_usa_foreign_support.16.t:0 "[From.GetNameDefCap] approves Funding"
 mtg_usa_foreign_support.17.a:0 "Unfortunate."
 mtg_usa_foreign_support.17.desc:0 "Despite securing a personal meeting with [From.GetLeader], our agents in [From.GetNameDef] have been told that the [From.GetAdjective] government can not spare the money to help us buy ships."
 mtg_usa_foreign_support.17.t:0 "[From.GetNameDefCap] refuses Funding"
 mtg_usa_foreign_support.2.a:0 "It will be useful in the future."
 mtg_usa_foreign_support.2.desc:0 "The delegation we sent to [From.GetNameDef] has reported good success in their donations drive. A major contribution was reportedly made by [From.GetLeader] himself."
 mtg_usa_foreign_support.2.t:0 "[From.GetNameDefCap] approves donations"
 mtg_usa_foreign_support.3.a:0 "That's too bad."
 mtg_usa_foreign_support.3.desc:0 "Our delegation in [From.GetNameDef] has had little success, speaking before empty rooms and finding it impossible to even meet with political leaders. They have returned empty-handed."
 mtg_usa_foreign_support.3.t:0 "[From.GetNameDefCap] refuses to allow donations"
 mtg_usa_foreign_support.4.a:0 "Send some Rifles"
 mtg_usa_foreign_support.4.b:0 "Send some field guns"
 mtg_usa_foreign_support.4.c:0 "Send some old tanks"
 mtg_usa_foreign_support.4.d:0 "They'll have to fend for themselves."
 mtg_usa_foreign_support.4.desc:0 "Using back-channels, a number of Silver Legion members have approached us to negotiate arms purchases. They strongly believe that their country is heading for a civil war against communist elements perverting the American way of life, possibly with support from the outside. \n\nThey merely want to even the odds a little and ask if we can spare any equipment."
 mtg_usa_foreign_support.4.t:0 "Weapons for [USA.GetNameDef]"
 mtg_usa_foreign_support.5.a:0 "They will come in handy."
 mtg_usa_foreign_support.5.desc:0 "Our connections to [From.GetNameDef] have paid off. With the explicit approval of [From.GetLeader], [From.GetAdjective] companies have started to sell rifles to us on credit. The weapons will be held in storage in neutral countries until the war comes."
 mtg_usa_foreign_support.5.t:0 "[From.GetNameDefCap] sends Rifles"
 mtg_usa_foreign_support.6.a:0 "How rude."
 mtg_usa_foreign_support.6.desc:0 "Our attempts at procuring new weapons from [From.GetNameDef] have been rudely rebuffed. [From.GetLeader] declared that his government would never permit the resources of the [From.GetAdjective] people to be squandered in such stupid endeavors."
 mtg_usa_foreign_support.6.t:0 "[From.GetLeader] refuses support"
 mtg_usa_foreign_support.7.a:0 "Outstanding!"
 mtg_usa_foreign_support.7.desc:0 "Our delegation in [From.GetNameDef] report a significant breakthrough in their attempts to secure more support for our cause. The [From.GetAdjective] military has agreed to part with a number of old field guns and make them available for us. To avoid alerting the enemy, they will be held in storage at a secret location until the time comes."
 mtg_usa_foreign_support.7.t:0 "[From.GetNameDefCap] sends field guns"
 mtg_usa_foreign_support.8.a:0 "Let our enemies beware!"
 mtg_usa_foreign_support.8.desc:0 "Our agent in [From.GetNameDef] reports a stunning success. Over a private dinner, [From.GetLeader] agreed to sell us a number of armored vehicles on credit. [From.GetNameDefCap] is watching developments in [USA.GetNameDef] with great interest, and would be more than happy to assist us in any way they can.\n\nHowever, the [From.GetAdjective] government can not be seen to overtly support a party that is not yet in power, so the tanks will be delivered when the war breaks out."
 mtg_usa_foreign_support.8.t:0 "[From.GetNameDefCap] sends tanks"
 mtg_usa_foreign_support.9.a:0 "We will make men out of them!"
 mtg_usa_foreign_support.9.b:0 "They can play soldiers somewhere else."
 mtg_usa_foreign_support.9.desc:0 "The Silver Legion of America has approached us with a request to construct a number of training camps to train volunteers. With the political situation in their home country rapidly deteriorating, they want to ensure that they are ready for the war that they believe is coming."
 mtg_usa_foreign_support.9.t:0 "Silver Legion wants to build training camps"
 mtg_usa_north_american_dominion.1.a:0 "We have no choice."
 mtg_usa_north_american_dominion.1.t:0 "[USA.GetNameDefCap] demands Control over Foreign Policy"
 mtg_usa_north_american_dominion.2.a:0 "A wise choice."
 mtg_usa_north_american_dominion.2.desc:0 "The government of [From.GetLeader] has agreed to our requests and will allow our ambassador a veto on any major policy decision they make."
 mtg_usa_north_american_dominion.2.t:0 "[From.GetNameDefCap] accepts subjugation"
 mtg_usa_north_american_dominion.3.a:0 "Brave words from someone so weak."
 mtg_usa_north_american_dominion.3.b:0 "Perhaps he is right."
 mtg_usa_north_american_dominion.3.desc:0 "[From.GetLeader] has reacted with deep consternation to our diplomatic note. In his answer, he declared that [From.GetNameDef] has a long and proud history of independence and sovereignty and would never permit a foreign power to enforce its will on them.\n\nHe further implored President [USA.GetLeader] to consider the ramifications of a war on this issue, which would surely see [USA.GetNameDef] labeled the largest threat to peace and would have unimaginable consequences."
 mtg_usa_north_american_dominion.3.t:0 "[From.GetNameDefCap] Refuses"
 mtg_usa_pacific_pacification.1.a:0 "Surely they wouldn't interfere in internal matters."
 mtg_usa_pacific_pacification.1.b:0 "We can defend those areas just fine."
 mtg_usa_pacific_pacification.1.desc_a:0 "A delegation of the [USA.GetAdjective] government has arrived to discuss the security of our holdings in the Pacific. Noting the continued instability in China and the situation in Japan, President [USA.GetLeader] is willing to assume responsibility for the defense of [GET_AUSTRALIA_NEW_ZEALAND_STATUS], in return for a number of privileges and reserve rights.\n\n While the [USA.GetAdjective]s claim that these rights would only be used to ensure the security of [GET_AUSTRALIA_NEW_ZEALAND_STATUS], many in the government believe that it would make [GET_AUSTRALIA_NEW_ZEALAND_STATUS] little more than puppets."
 mtg_usa_pacific_pacification.1.desc_b:0 "A delegation of the [USA.GetAdjective] government has arrived to discuss plans for our common defense. It appears that President [USA.GetLeader] considers our little part of the world of vital interest to the security of [USA.GetNameDef]. Beyond a simple guarantee to come to our aid, however, the [USA.GetAdjective] government wants to ensure that we ourselves can not become a threat. For this reason, the agreement comes with a number of provisions that will allow [USA.GetNameDef] a significant say in how we conduct our internal matters.\n\nWhile the threat of war has not been made in the negotiations so far, it clear that President [USA.GetLeader] would consider our refusal a very hostile act."
 mtg_usa_pacific_pacification.1.t:0 "[USA.GetNameDefCap] demands colonial holdings"
 mtg_usa_pacific_pacification.2.a:0 "Great work."
 mtg_usa_pacific_pacification.2.desc:0 "The government of [From.GetLeader] has accepted our proposals. A special joint committee has been set up to coordinate the implementation of the details."
 mtg_usa_pacific_pacification.2.t:0 "[From.GetNameDefCap] accepts"
 mtg_usa_pacific_pacification.3.a:0 "We have no choice but to use force."
 mtg_usa_pacific_pacification.3.b:0 "We can't afford a war."
 mtg_usa_pacific_pacification.3.desc:0 "The government of [From.GetNameDef] has refused to even meet with our delegation, claiming that there are no outstanding issues between our nations. However, the military attaches in [GET_AUSTRALIA_NEW_ZEALAND_STATUS] have reported a significant increase in military maneuvers recently."
 mtg_usa_pacific_pacification.3.t:0 "[From.GetNameDefCap] Refuses"
 mtg_usa_protect_south_america.1.a:0 "Consequences too heavy to bear."
 mtg_usa_protect_south_america.1.b:0 "We will defend our freedom!"
 mtg_usa_protect_south_america.1.desc:0 "At a summit in the [USA.GetAdjective] capital, [USA.GetAdjective] President [USA.GetLeader] has called for a new security architecture in South America. While couched in diplomatic terms, the [USA.GetAdjective] government clearly envisions itself as the main force behind the security of the continent, and in return expects that we follow their political guidance.\n\n In fact, [USA.GetAdjective] diplomats are already pushing for this behind the scenes and translating these proposals into concrete action points like special consultation rights and veto powers for the US ambassador - and only the US ambassador.\n\nMore chilling is the fact that refusing to accept this would, according to the President, be considered a hostile and destabilizing act, with 'deeply unfortunate' consequences."
 mtg_usa_protect_south_america.1.t:0 "The South-American Security Summit"
 mtg_usa_protect_south_america.2.a:0 "A true leader."
 mtg_usa_protect_south_america.2.desc:0 "President [From.GetLeader] has accepted our proposals and instructed the [From.GetAdjective] Foreign Minister to negotiate the finer details."
 mtg_usa_protect_south_america.2.t:0 "[From.GetNameDefCap] accepts our Guidance"
 mtg_usa_protect_south_america.3.a:0 "We can not allow these renegades to threaten the region."
 mtg_usa_protect_south_america.3.b:0 "A war would only hasten the destabilization of the area."
 mtg_usa_protect_south_america.3.desc:0 "The delegation from [From.GetNameDef] have hurriedly left the summit to travel home. The [From.GetAdjective] ambassador has so far refused to comment on this, claiming to still be waiting on instructions from home."
 mtg_usa_protect_south_america.3.t:0 "[From.GetNameDefCap] Rejects our Guidance"
 mtg_usa_secure_asia.1.a:0 "It is better to live on your knees."
 mtg_usa_secure_asia.1.b:0 "It is better to die on your feet."
 mtg_usa_secure_asia.1.desc:0 "President [USA.GetLeader] has sent a special representative to the capital to meet with [This.GetLeader] and discuss the renewed interest of [USA.GetNameDef] in the area. [This.GetNameDefCap] evidently forms the linchpin of [USA.GetAdjective] strategy for the region. As such, it has been communicated to our government that [USA.GetNameDef] can not tolerate an unfriendly or indeed hostile government in [This.GetNameDef]."
 mtg_usa_secure_asia.1.t:0 "[USA.GetNameDefCap] exerts pressure"
 mtg_usa_secure_asia.2.a:0 "Excellent."
 mtg_usa_secure_asia.2.desc:0 "Following extensive negotiations and guarantees of his personal safety, [From.GetLeader] has accepted to allow our Special Envoy extensive consultation rights, allowing us a significant amount of influence over their internal matters."
 mtg_usa_secure_asia.2.t:0 "[From.GetLeader] accepts"
 mtg_usa_secure_asia.3.a:0 "Brave. Stupid, certainly, but brave."
 mtg_usa_secure_asia.3.b:0 "They don't matter after all."
 mtg_usa_secure_asia.3.t:0 "[From.GetNameDefCap] Defiant"
 mtg_usa_secure_asia.4.a:0 "They are welcome to them."
 mtg_usa_secure_asia.4.b:0 "A preposterous proposal."
 mtg_usa_secure_asia.4.desc:0 "In a recent press conference, President [USA.GetLeader] announced a new strategic outlook for the Indo-Chinese region and greater South-East Asia. His government will no longer accept the apparent power-vacuum in the region. Whatever control over Indonesia exists is far too weak to guarantee the security of [USA.GetAdjective] interests in the region. His government aims to change this. \n\nWhen summoned by [This.GetLeader] to explain the comments, the [USA.GetAdjective] ambassador handed over a note that outlined the [USA.GetAdjective] position in detail. The demands amount to nothing less than handing over control over the Islands of Indonesia to [USA.GetAdjective] control."
 mtg_usa_secure_asia.4.t:0 "US demands Control over Colonies"
 mtg_usa_secure_asia.5.a:0 "The best possible outcome."
 mtg_usa_secure_asia.5.desc:0 "Speaking before the press, [From.GetLeader] today announced that his government had signed a treaty with [USA.GetNameDef] regarding shared sovereignty in the East Indies.\n\nThe treaty contains a number of secret provisions that will essentially transfer control to us as soon as our administrators are in place. The State Department has already dispatched a number of officials to the region."
 mtg_usa_secure_asia.5.t:0 "[From.GetLeader] accepts our proposal."
 mtg_usa_secure_asia.6.a:0 "They had a chance to solve this peacefully. They chose not to."
 mtg_usa_secure_asia.6.b:0 "They may keep the territories...for now."
 mtg_usa_secure_asia.6.desc:0 "Negotiations with [From.GetNameDef] have collapsed almost as soon as they started. The [From.GetAdjective] cabinet discussed our note for less than an hour before summarily rejecting it. The [From.GetAdjective] foreign minister has informed our ambassador that unless the proposal is substantially altered, there is nothing to discuss."
 mtg_usa_secure_asia.6.t:0 "[From.GetNameDefCap] walks out"
 mtg_usa_secure_asia.7.a:0 "Let them have Vietnam."
 mtg_usa_secure_asia.7.b:0 "These are vital [This.GetAdjective] territories!"
 mtg_usa_secure_asia.7.desc:0 "As part of a larger diplomatic offensive, President [USA.GetLeader] has publicly identified Vietnam and Indochina as a region of vital interest to [USA.GetNameDef]. Therefore, [USA.GetNameDef] will aim to increase their presence in the area.\n\nPrivately, [USA.GetNameDef] have been making very aggressive noises about Indochina. Aside from exerting pressure on [SIA.GetNameDef], they have also demanded the right to station troops in our colonies and to 'direct' the colonial administration. \n\nIn effect, this would amount to ceding those territories to their control."
 mtg_usa_secure_asia.7.t:0 "[USA.GetNameDefCap] demands Indochina"
 mtg_usa_secure_asia.8.a:0 "Our involvement in Vietnam marks a new era of peace and prosperity for the region."
 mtg_usa_secure_asia.8.desc:0 "the [From.GetAdjective] government has agreed to our demands and instructed the local administration to cooperate fully until we can get our people in place."
 mtg_usa_secure_asia.8.t:0 "[From.GetNameDefCap] cedes Indochina"
 mtg_usa_secure_asia.9.a:0 "We will not compromise on national security."
 mtg_usa_secure_asia.9.b:0 "Getting involved in Vietnam would be a grave mistake, anyway."
 mtg_usa_secure_asia.9.desc:0 "Following prolonged and increasingly heated negotiations, the [From.GetAdjective] government has at last rejected our proposal. Our ambassador in [From.GetNameDef] reports that he can no longer even get an appointment with [From.GetLeader]."
 mtg_usa_secure_asia.9.t:0 "[From.GetNameDefCap] Refuses"
 mtg_usa_southern_threat.1.a:0 "We must accept the unacceptable to avoid bloodshed."
 mtg_usa_southern_threat.1.b:0 "Never!"
 mtg_usa_southern_threat.1.t:0 "[USA.GetNameDefCap] demands Treaty of Consultation and Friendship"
 mtg_usa_southern_threat.2.a:0 "Pershing would be proud."
 mtg_usa_southern_threat.2.desc:0 "Realizing the hopelessness of their position, the government of [MEX.GetLeader] have accepted our proposal and agreed to consult us before any major policy decision."
 mtg_usa_southern_threat.2.t:0 "[MEX.GetLeader] accepts"
 mtg_usa_southern_threat.3.a:0 "We can not permit this insult to go unpunished."
 mtg_usa_southern_threat.3.b:0 "War is not currently in our best interest."
 mtg_usa_southern_threat.3.t:0 "[MEX.GetLeader] refuses."
 mtg_usa_strategic_interests.1.a:0 "They are welcome to them."
 mtg_usa_strategic_interests.1.b:0 "These are strategic territories!"
 mtg_usa_strategic_interests.1.desc:0 "President [USA.GetLeader] has arrived in London to discuss a number of proposals regarding ownership of several strategic locations around the globe. According to the [USA.GetAdjective] government, [ENG.GetNameDef] lacks both the resources and the will to adequately defend those areas in a way that ensures that [USA.GetAdjective] interests are met. Unless the [ENG.GetAdjective] government can give sufficient guarantees that these commitments are met, analysts believe that [USA.GetLeader] will demand that we turn over control over these territories to [USA.GetNameDefCap]."
 mtg_usa_strategic_interests.1.t:0 "US demands Territories"
 mtg_usa_strategic_interests.2.a:0 "Great!"
