 modern_sonar:0 "Modern Sonar"
 modern_sonar_desc:0 "Advances in signal filtering and directional scanning give this new sonar model unmatched precision, allowing us to hunt enemy submarines with deadly precision. \n\nMounting this module in an §YElectronics Slot§! on §YLight Ships§! or §YCruisers§! will help them detect enemy §YSubmarines§!."
 modern_tank_aa_chassis:0 "Modern SP Anti-Air"
 modern_tank_aa_chassis_1:0 "Modern SP Anti-Air"
 modern_tank_aa_chassis_desc:0 "A modern vehicle, intended to provide mobile and well-protected defense against enemy air attack."
 modern_tank_aa_equipment:0 "Modern SP Anti-Aircraft"
 modern_tank_aa_equipment_1:0 "Modern SP Anti-Air"
 modern_tank_aa_equipment_1_desc:0 "With a combination of missiles and rapid fire cannon, modern anti-aircraft artillery presents a deadly threat to hostile aviation assets."
 modern_tank_aa_equipment_1_short:0 "Modern AA"
 modern_tank_aa_equipment_desc:0 "With a combination of missiles and rapid fire cannon, modern anti-aircraft artillery presents a deadly threat to hostile aviation assets."
 modern_tank_artillery_chassis:0 "Modern SP Artillery"
 modern_tank_artillery_chassis_1:0 "Modern SP Artillery"
 modern_tank_artillery_chassis_desc:0 "A modern vehicle, designed to be a fully-functional artillery piece that can keep up with modern tanks and be protected against any threats found on the battlefield."
 modern_tank_artillery_equipment:0 "Modern SP Artillery"
 modern_tank_artillery_equipment_1:0 "Modern SP Artillery"
 modern_tank_artillery_equipment_1_desc:0 "Modern self-propelled artillery vehicles may superficially resemble tanks, but they are generally lightly armored, too lightly to survive in direct-fire combat. However, they protect their crews against shrapnel and small arms."
 modern_tank_artillery_equipment_1_short:0 "Modern SPG"
 modern_tank_artillery_equipment_desc:0 "Modern self-propelled artillery vehicles may superficially resemble tanks, but they are generally lightly armored, too lightly to survive in direct-fire combat. However, they protect their crews against shrapnel and small arms."
 modern_tank_chassis:0 "Modern Tank"
 modern_tank_chassis_1:0 "Modern Tank"
 modern_tank_chassis_desc:0 "A modernized chassis that borrows heavily from previous medium tanks, but puts a much bigger emphasis on speed and maneuverability, while also allowing for more armor and bigger guns than usually carried on medium tanks. The result is a vehicle that can fill a wide variety of roles."
 modern_tank_destroyer_chassis:0 "Modern Tank Destroyer"
 modern_tank_destroyer_chassis_1:0 "Modern Tank Destroyer"
 modern_tank_destroyer_chassis_desc:0 "A modern vehicle, intended to provide a fast response to enemy tank attacks, while having comparable protection levels."
 modern_tank_destroyer_equipment:0 "Modern Tank Destroyer"
 modern_tank_destroyer_equipment_1:0 "Modern Tank Destroyer"
 modern_tank_destroyer_equipment_1_desc:0 "Modern Tank Destroyers are an evolution of earlier light and medium TDs, preferring mobility and stealth over heavy armor."
 modern_tank_destroyer_equipment_1_short:0 "Modern TD"
 modern_tank_destroyer_equipment_desc:0 "Modern Tank Destroyers are an evolution of earlier light and medium TDs, preferring mobility and stealth over heavy armor."
 modern_tank_equipment:0 "Modern Tank"
 modern_tank_equipment_1:0 "Modern Tank"
 modern_tank_equipment_1_desc:0 "Modern tanks are agile, multi-purpose AFVs which combine heavy tank firepower with the mobility of a medium tank, prefiguring modern MBTs."
 modern_tank_equipment_1_short:0 "Mod. Tank"
 modern_tank_equipment_desc:0 "Modern tanks are agile, multi-purpose AFVs which combine heavy tank firepower with the mobility of a medium tank, prefiguring modern MBTs."
 modernist_and_reformer:0 "Modernist and Reformer"
