 morgenthau_division_tt:0 "[FRA.GetFlag] [FRA.GetNameDefCap] receives §Y[42.GetName]§!\n[POL.GetFlag] Poland receives §Y[67.GetName]§! and §Y[5.GetName]§!.\n[SOV.GetFlag] [SOV.GetNameDefCap] receives §Y[763.GetName]§!\nAn international zone, under [ENG.GetFlag] [ENG.GetAdjective] administration will be created in: §Y[51.GetName]§!, §Y[52.GetName]§!, and §Y[56.GetName]§!.\n An independent [GER.GetFlag] North German State, in the [yalta_partner.GetAdjective] zone of influence, is to be established in §Y[58.GetName]§!, §Y[59.GetName]§!, §Y[51.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[68.GetName]§!, §Y[66.GetName]§!, §Y[65.GetName]§!, §Y[64.GetName]§!, and §Y[60.GetName]§!. \nAn independent [GER.GetFlag] South German state will be created in §Y[54.GetName]§!, §Y[50.GetName]§!, §Y[978.GetName]§!, §Y[52.GetName]§!, and §Y[53.GetName]§!."
 motivated:0 "Motivated"
 motivated_desc:0 "A competent man is good. If he is motivated, then that is better."
 motor_tycoon:0 "Motor Tycoon"
 motorbike_equipment:0 "Military Motorcycle"
 motorbike_equipment_1:0 "Military Motorcycle"
 motorbike_equipment_desc:0 "Fast and versatile, military motorbikes are often equipped with sidecars and mounted machine guns to serve as reconnaissance, communication and rapid-response units."
 motorized_equipment_0:0 "Early Truck"
 motorized_equipment_0_desc:0 "During the Great War the armies starting using basic civilian trucks for transporting supplies and hauling equipment. These have since become an integral part of most armies."
 motorized_rocket_equipment:0 "Motorized Rocket Artillery"
 motorized_rocket_equipment_desc:0 "Multiple rocket launchers such as these deliver explosives to a target area more quickly than conventional artillery, but with lower accuracy and requiring a longer time to reload. Being mounted on trucks, this version is able to launch attacks and change positions before the enemy can return fire."
 motorized_rocket_equipment_short:0 "Mot. R. Artillery"
 mountain_defensive_training:0 "Mountain Defensive Training"
 mountain_defensive_training_desc:0 "Special training will allow our troops to better defend in mountainous terrain."
