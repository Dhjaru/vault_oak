 SIA_BLITZKRIEG_DESC:0 "Since taking power in late 1938, Prime Minister Phibunsongkhram has remade Siam in his own image. The country has a new name — Thailand — and a new creed: military discipline, Pan-Thai nationalism, and territorial ambition aimed at the Thai-speaking peoples still under French and British colonial rule.\n\nAs Europe slides toward war and Japan drives deeper into China, Phibun's army grows stronger by the day. His ambitions are no secret. The only question is who Thailand will stand beside when the moment comes."
