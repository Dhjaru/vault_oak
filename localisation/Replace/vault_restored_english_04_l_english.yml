 ROM_fascism_party2_long:0 "Partidul National Crestin"
 ROM_national_christian_party:0 "National Christian Party"
 ROM_national_christian_party_desc:0 "The writer Octavian Goga holds strong influence over our nation through his National Christian party. Born from influence gained as the Agrarian party, it has strong ties with rural communities. A reorganization of our cabinet could bring his influence into play in our favor."
 ROM_national_christian_party_in_power:0 "National Christian Party"
 ROM_polish_loyalists_neutrality:0 "Provisional Kingdom of Poland-Romania"
 ROM_polish_loyalists_neutrality_DEF:0 "the Provisional Kingdom of Poland-Romania"
 ROM_subject:0 "$OVERLORDADJ$ $ROM$"
 ROM_subject_DEF:0 "$OVERLORDADJ$ $ROM$"
 ROM_white_squadron:0 "White Squadron"
 ROM_white_squadron_desc:0 "The White squadron is a service of air ambulances piloted exclusively by women. Merely the notion that rescue might be close at hand keeps our soldiers in high spirits."
 ROM_white_squadron_focus:0 "The White Squadron"
 ROM_white_squadron_focus_desc:0 "The White squadron, proposed by Marina Ştirbei - a talented pilot of noble birth - is a service of air ambulances piloted exclusively by women. Merely the notion that rescue might be close at hand could keep our soldiers in high spirits."
 RSI:0 "Repubblica Sociale Italiana"
 RSI_ADJ:0 "Italian"
 RSI_DEF:0 "the Repubblica Sociale Italiana"
