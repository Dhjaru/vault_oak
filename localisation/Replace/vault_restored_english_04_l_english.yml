 SIA_GATHERING_STORM_DESC:0 "Just four years have passed since the Khana Ratsadon ended centuries of absolute monarchy. Siam takes its first steps as a constitutional state, but unity has already begun to fray: civilian reformists dream of democracy while the military demands strength, discipline, and Pan-Thai expansion.\n\nHemmed in by British and French colonial power, with an emboldened Japan advancing to the north, Siam must navigate carefully. The coming storm may force this young nation to choose a side — or find a way to survive without one."
