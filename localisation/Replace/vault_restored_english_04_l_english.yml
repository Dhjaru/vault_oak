 SWE_GATHERING_STORM_DESC:0 "Despite remaining neutral in the Great War, Sweden suffered a great deal of hardship due to British attempts to blockade Germany. As tensions rise on the continent, the Swedish people worry they will once again be forced to suffer at the hands of the great powers. \n\nMeanwhile, the Social Democrats attempt to find a balance between creating a welfare state that can support the beleaguered population and creating a credible military deterrent to maintain the nation's century old commitment to neutrality."
