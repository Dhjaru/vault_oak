 SWE_BLITZKRIEG_DESC:0 "The rumblings of another Great War grow louder by the day as Germany erodes the borders of their neighbors. With the militaristic power being dependent on Swedish iron ore, fears are increasing that their territorial ambitions may soon spread beyond the Baltic and into Scandinavia. \n\nIn anticipation of such a threat, the Swedish military has begun to rearm and modernize thanks to the nation's burgeoning defense industry. All that remains to be seen is whether the nation is capable of deterring an invasion."
