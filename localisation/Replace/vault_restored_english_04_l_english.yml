 RULE_ALLOW_RELEASE_NATIONS_WARLORD_CHINA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! may not release §Y[CHI.GetNameDef]§! or §Y[PRC.GetNameDef]§!."
 RULE_ALLOW_SCORCHED_EARTH:0 "Scorched Earth"
 RULE_ALLOW_SCORCHED_EARTH_ALLOWED_DESC:0 "Countries may use Scorch Earth freely."
 RULE_ALLOW_SCORCHED_EARTH_BLOCKED:0 "Scorched Earth is disabled in custom game rules.\n\n"
 RULE_ALLOW_SCORCHED_EARTH_BLOCKED_DESC:0 "Countries may not use Scorch Earth under any circumstances."
 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_38_DESC:0 "Wargoals can only be gained from national focuses, events and decisions, until 1938."
 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_39_DESC:0 "Wargoals can only be gained from national focuses, events and decisions, until 1939."
 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_40_DESC:0 "Wargoals can only be gained from national focuses, events and decisions, until 1940."
 RULE_ALT_FASCIST_BALBO_ITA_AI_DESC:0 "The Italian AI will attempt to oust Mussolini from power, and install Italo Balbo instead to seek an independent path forward."
 RULE_ALT_FASCIST_GRANDI_ITA_AI_DESC:0 "The Italian AI will attempt to oust Mussolini from power, and install Dino Grandi instead to seek to strengthen ties with the allies."
 RULE_ARROW_CROSS_MOVEMENT_HUN_AI_DESC:0 "The Hungarian AI will attempt to establish absolute rule under the Arrow Cross Party, eventually joining the Axis as a faithful ally of theirs."
 RULE_BERMONDT_POL_AI_DESC:0 "The Polish AI will crown Pavel Bermondt-Avalov as King and attempt to join the Axis."
 RULE_COMMONWEALTH_POL_AI_DESC:0 "The Polish AI will crown Friedrich Christian as King and attempt to restore the Polish-Lithuanian Commonwealth."
 RULE_COMMUNIST_ARG_AI_DESC:0 "The AI will attempt to turn the country communist and will join the Comintern to focus on spreading their ideology in South America."
 RULE_COMMUNIST_BALTIC_AI_DESC:0 "The AI will attempt to establish a communist regime by going down the relevant path in the national focus tree."
 RULE_DEMOCRATIC_ARG_AI_DESC:0 "The AI will attempt to turn democratic and will join the Allies to safe guard democracy and freedom in South America"
 RULE_DEMOCRATIC_BRA_AI_DESC:0 "Brazil will attempt to overthrow Vargas by ending the state of emergency. It will then attempt to reform the nation, increasing democratic participation before ultimately cooperating with the USA against the Axis powers."
 RULE_ENTENTE_EST_AI_DESC:0 "Estonia will attempt to formalize the Baltic Entente and survive against the Soviets."
 RULE_ENTENTE_LAT_AI_DESC:0 "Latvia will attempt to formalize the Baltic Entente and survive against the Soviets."
 RULE_ENTENTE_LIT_AI_DESC:0 "Lithuania will attempt to formalize the Baltic Entente and survive against the Soviets."
 RULE_ETH_IMPERIAL_AI_DESC:0 "The Ethiopian AI will attempt to defeat Italy on its own, without getting the help of the League of Nations. Thereafter it will attempt to expand its empire"
 RULE_EXILES_FASCIST:0 "Fascist Exiles"
 RULE_EXILES_TSARIST:0 "Tsarist Exiles"
 RULE_FASCISM_ARG_AI_DESC:0 "The AI will attempt to turn the country fascist and will join the Axis powers to open up a new front in South America."
 RULE_FASCISM_BRA_AI_DESC:0 "The Integralist movement will betray Vargas and install one of their own as leader. They will then attempt to dominate South America through diplomacy and force."
 RULE_FASCIST_ALTERNATE_KING_HUN_AI_DESC:0 "The Hungarian AI will elect a fascist king and join the Axis."
 RULE_FASCIST_EST_AI_DESC:0 "The Estonian AI will attempt to establish a fascist government by going down the relevant path in the national focus tree."
 RULE_FASCIST_INDEPENDENT_POL_AI_DESC:0 "The Polish AI will attempt to embrace Falangism and stand against Germany."
 RULE_FASCIST_LAT_AI_DESC:0 "The Latvian AI will attempt to establish a fascist government by going down the relevant path in the national focus tree."
 RULE_FASCIST_LIT_AI_DESC:0 "The Lithuanian AI will attempt to establish a fascist government by going down the relevant path in the national focus tree."
 RULE_GROUP_GENERAL_UI:0 "UI"
 RULE_GROUP_PEACE_SCORE:0 "Peace Score distribution"
 RULE_HABSBURG_HUNGARY_HUN_AI_DESC:0 "The Hungarian AI will elect Joseph August as its king, and restore Greater Hungary, but under Habsburg rule."
 RULE_HABSBURG_POL_AI_DESC:0 "The Polish AI will crown Karl Albrecht von Habsburg as King and attempt to form a union with Czechoslovakia."
 RULE_HISTORICAL_ARG_AI_DESC:0 "The AI will attempt to adhere to historical events by avoiding entry into the war and gradually cooperating with the UK and USA."
 RULE_HISTORICAL_BRA_AI_DESC:0 "Vargas will attempt to stay in power by carefully eliminating the political opposition in Brazil before eventually joining the Allies and working with the United States."
 RULE_HISTORICAL_CHL_AI_DESC:0 "The Chilean AI will reinforce the democratic system and choose to support social-democratic policies whilst maintaining the power balance, and will join the global struggle only if it drags on."
 RULE_HISTORICAL_DEN_AI_DESC:0 "The Danish AI will attempt to stay out of any conflicts and follow the historical events as much as possible. If it becomes a subject, it will try to slowly build support with foreign powers to eventually reassert its independence once again."
 RULE_HISTORICAL_EST_AI_DESC:0 "The Estonian AI will remain neutral for most of the campaign but will become a Soviet puppet in the 1940s."
 RULE_HISTORICAL_ETH_AI_DESC:0 "The Ethiopian AI will attempt to defeat Italy using the League of nations, and if that fails try to go into exile. Thereafter it will try to recover its home territory, and rebuild Ethiopia."
 RULE_HISTORICAL_FIN_AI_DESC:0 "The Finnish AI will attempt to follow the historical chain of events as much as possible."
 RULE_HISTORICAL_ICE_AI_DESC:0 "The Icelandic AI will try to maintain neutrality and will seek US protection when needed."
 RULE_HISTORICAL_LAT_AI_DESC:0 "The Latvian AI will remain neutral for most of the campaign but will become a Soviet puppet in the 1940s."
 RULE_HISTORICAL_LIT_AI_DESC:0 "The Lithuanian AI will remain neutral for most of the campaign but will become a Soviet puppet in the 1940s."
 RULE_HISTORICAL_NOR_AI_DESC:0 "Norway will attempt to remain democratic and resist the German invasion before continuing to fight on as a government in exile, alongside the Allies."
 RULE_HISTORICAL_SWE_AI_DESC:0 "The AI will attempt to build up the Swedish military while remaining neutral and democratic. It will carefully avoid getting into conflict with the Axis and Comintern, but may offer limited support to the Allies later in the war."
 RULE_HISTORICAL_SWI_AI_DESC:0 "Switzerland will remain neutral, while building up their militias and fortifications in preparation for any attack. They will give some support to the allies towards the end of the war."
 RULE_HORTHYIST_KING_HUNGARY_HUN_AI_DESC:0 "The Hungarian AI will crown either Miklos Horthy or his son as king of Hungary, and attempt to establish a Greater Hungarian Kingdom."
 RULE_LEFT_OPPOSITION_COOPERATIVE:0 "Left Opposition Cooperative"
 RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC:0 "The French AI will attempt to restore the French monarchy and place the Bonapartist pretender on the throne by going down the relevant path on the focus tree."
 RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC:0 "The French AI will attempt to restore the French monarchy and place the Legitimist pretender on the throne by going down the relevant path on the focus tree."
 RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC:0 "The French AI will attempt to restore the French monarchy and place the Orléanist pretender on the throne by going down the relevant path on the focus tree."
 RULE_NON_GIE_CALL:0 "§RWe cannot call allies while only at war with a country in Exile§!"
 RULE_NON_GIE_JOIN:0 "§RWe cannot join wars against Government in Exile countries§!"
 RULE_OPTION_ALTERNATE_COMMUNIST_GRE_AI_DESC:0 "Greece will attempt to fight fascism in Europe alongside communist Yugoslavia."
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI:0 "Independent Communism"
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI_DESC:0 "Turkey will adopt a communist government that maintains its Kemalist qualities and attempt to form a faction of its own."
 RULE_OPTION_ALTERNATE_GUOMAO:0 "The Unwilling Diarchy"
 RULE_OPTION_ALTERNATE_GUOMAO_DESC:0 "The AI will go down the path of the Unwilling Diarchy, with Mao and Guotao attempting to co-operate against the warlords. The AI will not seek to join the Second United Front."
 RULE_OPTION_ALTERNATE_KEMALIST_AI:0 "Alternative Kemalist"
 RULE_OPTION_ALTERNATE_KEMALIST_AI_DESC:0 "Turkey will appoint Fevzi Çakmak to follow in Mustafa Kemal Atatürk's footsteps as President, and will pursue neutrality for as long as possible before attempting to join either the Axis or the Allies."
 RULE_OPTION_ALT_FASCIST_BALBO:0 "Alternative Fascist - Italo Balbo"
 RULE_OPTION_ALT_FASCIST_GRANDI:0 "Alternative Fascist - Dino Grandi"
 RULE_OPTION_AMERICAS_DEIMPERIALIZED:0 "Americas Deimperialized"
 RULE_OPTION_AMERICAS_DEIMPERIALIZED_DESC:0 "All Amerindian tags in the Americas are released upon game-start"
 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI:0 "Fascist Pankhurst-Walsh"
 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI_DESC:0 "Adela Pankhurst-Walsh leads Australia with an initial goal of expanding the British Empire ever further, though precisely who will inherit that expanded empire remains an open question."
 RULE_OPTION_AST_AI_RANDOM_TAOG_HISTORICAL:0 "Historical"
 RULE_OPTION_AST_AI_RANDOM_TAOG_HISTORICAL_DESC:0 "A firmly entrenched, if unstable democracy gives Australia the foundation with which to look out across the wider world, and brace for the coming storm."
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI:0 "Anti-Commonwealth Communist"
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI_DESC:0 "The distant overlord has determined Australia's fate for too long. Now is the time to cast off the imperial yoke... and liberate others along the way."
 RULE_OPTION_AST_COMINTERN_COMMUNIST_TAOG_AI:0 "Comintern Communist"
 RULE_OPTION_AST_COMINTERN_COMMUNIST_TAOG_AI_DESC:0 "It is only in unity that the Communist utopia can be realized, for this is the path of the worldwide workers' revolution"
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI:0 "Fascist Stephensen"
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI_DESC:0 "Australia First demands an independent Australia that is free to forge her own future."
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI:0 "Random Social-Democratic"
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI_DESC:0 "The voice of the people matters most in Democratic Australia, to whose will the fate of the nation is beholden."
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI:0 "Variant Historical - Östfrei!"
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI_DESC:0 "The AI will largely follow the Historical path, but will attempt to stave off Anschluss by any means possible, fighting tooth and claw for their independence until the bitter end. This might present a challenge or delay to the outbreak of the war"
 RULE_OPTION_AUS_COMMUNIST_AI:0 "Communist"
 RULE_OPTION_AUS_COMMUNIST_AI_DESC:0 "The AI will attempt to go communist and overthrow the government. Adhering to a strict Austromarxist agenda they will create a faction of their own"
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI:0 "Soviet Austrian"
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC:0 "The AI will attempt to go communist and overthrow the government before aligning with the USSR and joining the Comintern"
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI:0 "Austrian Democratic - Allies"
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC:0 "The AI will attempt to join the Allies by re-establishing democracy in Austria."
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI:0 "Austrian Democratic - Alpine Federation"
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC:0 "The AI will attempt to re-establish democracy in Austria and form the Alpine Federation."
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI:0 "Austrian Democratic - Federative"
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC:0 "The AI will attempt to form the Danubian Federation by inviting other nations along the Danube under a democratic rule."
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI:0 "Non-Aligned Federative"
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC:0 "The AI will attempt to form the Danubian Federation by inviting other nations along the Danube under a non-aligned rule."
 RULE_OPTION_BALKAN_ENTENTE:0 "Safeguard the Balkans"
 RULE_OPTION_BALKAN_ENTENTE_DESC:0 "Turkey will commit itself to maintaining security in the Balkans and attempt to form a faction with Greece, Romania, and Yugoslavia."
 RULE_OPTION_BALTIC_ENTENTE:0 "Baltic Entente"
 RULE_OPTION_BERMONDT:0 "Monarchist: House of Avalishvili"
 RULE_OPTION_BOLSHEVIK_PRC:0 "28 ½ Bolshevik"
 RULE_OPTION_BOLSHEVIK_PRC_DESC:0 "The AI will go down the 28 ½ Bolshevik path, trying to align with the Soviet Union. If in the Second United Front, the AI will try to influence the faction diplomatically."
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT:0 "Communism - Aliança Nacional Libertadora"
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC:0 "Brazil will resurrect the ANL and attempt to overthrow the democratic government. It will be replaced by the ANL council who will then implement communist reforms before ultimately attempting to liberate the continent from fascism and imperialism."
 RULE_OPTION_BRA_COMMUNIST_STALINISM:0 "Communism - Luís Carlos Prestes"
 RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC:0 "Brazil will attempt to overthrow the democratic government and replace it with a Soviet aligned, communist government headed by Luís Carlos Prestes. It will then join the Comintern and aide the Soviet Union."
 RULE_OPTION_CALIPHATE_AFG:0 "A New Caliphate"
 RULE_OPTION_CALIPHATE_AFG_AI_DESC:0 "The Afghan AI will attempt to oust King Zahir Shah and replace him with the Faqir of Ipi who will then attempt to reverse the modernization of the country. Afghanistan will then look to expanding its borders eventually forming a new Caliphate."
 RULE_OPTION_CHL_ANTI_IMPERIALISM:0 "Anti-Imperialism"
 RULE_OPTION_CHL_ANTI_IMPERIALISM_DESC:0 "The Chilean AI will choose to support the various Mapuche organizations, eventually having them take control of the country. It will later go on a crusade against Imperialism, outing the European controlled states from South and Central America."
 RULE_OPTION_CHL_COMMUNIST:0 "The Socialist Republic of Chile"
 RULE_OPTION_CHL_COMMUNIST_AI_DESC:0 "The Chilean AI will utilize the instability caused by the fascists to demand Arturo Alessandri's resignation, and increase presidential powers so that they can instate a communist state."
 RULE_OPTION_CHL_LE_DELUGE:0 "The Kingdom of Araucanía and Patagonia"
 RULE_OPTION_CHL_LE_DELUGE_DESC:0 "The Chilean AI will look to tradition and thus oust Alessandri from power, instating Ibáñez in his place. It will then go into a civil war, in which Antoine III will restore the old Kingdom of Araucanía and Patagonia, declaring himself a successor to Napoleon."
 RULE_OPTION_CHL_OPERATION_BOLIVAR:0 "Cooperation with Operation Bolivar"
 RULE_OPTION_CHL_OPERATION_BOLIVAR_DESC:0 "The Chilean AI will go down the path of fascism, choosing to side with the German Reich if they get the chance, eventually going to war and attempting to restore the Kingdom of Chile of old."
 RULE_OPTION_CHL_PAN_HISPANISM:0 "Pan-Hispanism"
 RULE_OPTION_CHL_PAN_HISPANISM_DESC:0 "The Chilean AI will go down the path of fascism, eventually choosing to not side with any of the great world powers. They will later go on to either conquer the Hispanic world, or unite it diplomatically."
 RULE_OPTION_COG_COM_INDEPENDENCE_AI:0 "Communist Emancipation Movements"
 RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC:0 "The Congolese AI will attempt to gain its independence as soon as it can through peaceful means, and later attempt to spread communism throughout Africa."
 RULE_OPTION_COG_COM_REVOLUTION_AI:0 "The Simba's Revolution"
 RULE_OPTION_COG_COM_REVOLUTION_AI_DESC:0 "The Congolese AI will attempt to break free from their colonial overlords through a violent revolution and subsequent civil war, and will then attempt to spread communism throughout the African continent."
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI:0 "Democratic Emancipation Movements"
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC:0 "The Congolese AI will attempt to gain its independence as soon as it can through peaceful means, and later campaign for democracy throughout Africa."
 RULE_OPTION_COMMONWEALTH:0 "Monarchist: House of Wettin"
 RULE_OPTION_COMMUNISM_PER_AI:0 "Communism - Tudeh"
 RULE_OPTION_COMMUNISM_PER_DESC:0 "The AI will engage in a revolution that will leave the Soviet aligned Tudeh party in power. The communist regime will attempt to destabilize the region."
 RULE_OPTION_COMMUNIST_AFG_AI_DESC:0 "The Afghan AI will cozy up to the Soviet Union and implement radical reforms to transform the nation into a Communist state. It will then join the Comintern and attempt to take control of central Asia."
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION:0 "Communist - Balkan Federation"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC:0 "Bulgaria will attempt to form a Balkan alliance, influencing its neighbors to embrace the revolution and ultimately unifying the Balkans."
 RULE_OPTION_COMMUNIST_BEL_AI:0 "Socialists"
 RULE_OPTION_COMMUNIST_BEL_AI_DESC:0 "The AI will allow the Labour party to win the election, and then slowly begin to align themselves with the Communist bloc."
 RULE_OPTION_COMMUNIST_BUL_AI_DESC:0 "Bulgaria will attempt to join the Comintern and fight together with its Soviet comrades against fascism and capitalism in Europe."
 RULE_OPTION_COMMUNIST_GRE_AI:0 "Communist"
 RULE_OPTION_COMMUNIST_JAP_AI:0 "The Red Sun Rises"
 RULE_OPTION_COMMUNIST_PAR_AI:0 "Communist"
 RULE_OPTION_COMMUNIST_PAR_AI_DESC:0 "The AI will keep Rafael Franco's communist government and seek to take revenge against Bolivia for the Chaco War."
 RULE_OPTION_COMMUNIST_PHI_AI:0 "Maritime Communism"
 RULE_OPTION_COMMUNIST_PHI_AI_DESC:0 "The red sun will rise over the Philippines, as maritime communism takes hold and seeks to spread the spirit of equality across the world's oceans."
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI:0 "The Labor-Farmer Faction Ascendant"
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI_DESC:0 "The Japanese AI will attempt to turn communist and install a Ronoha-led government, leading a crusade against imperialism in Asia by going down the relevant path in the national focus tree."
 RULE_OPTION_COMMUNIST_TUR_AI:0 "Communism"
 RULE_OPTION_COMMUNIST_TUR_AI_DESC:0 "Turkey will install a communist government and attempt to join the Comintern."
 RULE_OPTION_DEFAULT_GER_FRAGEMNTATION_DESC:0 "Germany is intact as historical"
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI:0 "Defensive Democrats"
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI_DESC:0 "The AI will throw off the shackles of their weak-willed king, and attempt to defend Belgium at all costs."
 RULE_OPTION_DEMOCRATIC_AFG_AI_DESC:0 "The Afghan AI will push King Zahir Shah to oust his uncles before continuing on a path of radical reforms. This will culminate in Afghanistan becoming a democracy and joining the Allies."
 RULE_OPTION_DEMOCRATIC_ALT_AI:0 "Alt Democratic"
 RULE_OPTION_DEMOCRATIC_ALT_AI_URG_DESC:0 "The AI will attempt to keep out of world affairs and focus on internal industrialization, putting the Blanco party in power. Only joining the allies at the end of the war."
 RULE_OPTION_DEMOCRATIC_GRE_AI:0 "Venezelist"
 RULE_OPTION_DEMOCRATIC_LIBERAL:0 "Democratic - Liberal"
 RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC:0 "The Bulgarian Democratic Party will attempt to join the Allies as it conspires against Tsar Boris to remove him from power and form a pro-Allies regency council."
 RULE_OPTION_DEMOCRATIC_PAR_AI:0 "Democratic"
 RULE_OPTION_DEMOCRATIC_PAR_AI_DESC:0 "The AI will fight against Rafael Franco's coup and enter a civil war to try and keep its democratic government intact."
 RULE_OPTION_DEMOCRATIC_PER_AI:0 "Democratic - Constitutional Monarchy"
 RULE_OPTION_DEMOCRATIC_PER_DESC:0 "The AI will force constitutional limits on the Shah and follow a path of democracy before eventually attempting to join a democratic faction."
 RULE_OPTION_DEMOCRATIC_POL_AI_DESC:0 "The Polish AI will attempt to restore democracy and join the Allies."
 RULE_OPTION_DEMOCRATIC_SEA:0 "Chinese Democratic League"
 RULE_OPTION_DEMOCRATIC_SEA_DESC:0 "The Chinese AI will attempt to go down the Democratic League path of the focus tree."
 RULE_OPTION_DEMOCRATIC_SIA_AI:0 "$RULE_OPTION_DEMOCRATIC$"
 RULE_OPTION_DEMOCRATIC_SIA_AI_DESC:0 "$RULE_DEMOCRATIC_ALTERNATE_NZL_AI_DESC$"
 RULE_OPTION_DEMOCRATIC_SOCIALIST:0 "Democratic - Socialist"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC:0 "The government led by Nikola Mushanov will follow socialist policies, seeking to improve its relations with neighboring nations to form a Balkan Confederation and defend the Balkans against foreign aggressors."
 RULE_OPTION_DEN_FASCIST:0 "Fascist Denmark"
 RULE_OPTION_DEN_FASCIST_AI_DESC:0 "The Fascist Party will try to seize power in Denmark and re-establish the North Sea Empire of old."
 RULE_OPTION_DEN_MONARCHIST:0 "Expansionist Monarchy"
 RULE_OPTION_DEN_MONARCHIST_AI_DESC:0 "King Christian X will try to secure natural resources and strengthen Denmark's military capabilities by controlling the rest of the Nordics by any means necessary."
 RULE_OPTION_DEN_REARMAMENT:0 "Danish Rearmament"
 RULE_OPTION_DEN_REARMAMENT_AI_DESC:0 "Denmark will try to seek alliances with stronger nations and try to withstand any invasion attempts."
 RULE_OPTION_DICTATORSHIP_NEUTRAL:0 "Neutral Dictatorship"
 RULE_OPTION_DICTATORSHIP_NEUTRAL_AI_DESC:0 "The AI will go down the route of an authoritarian dictatorship but try and remain neutral"
 RULE_OPTION_DICTATORSHIP_WARMONGER_AI_DESC:0 "The AI will go down the route of an authoritarian dictatorship and try to expand their territory"
 RULE_OPTION_DISPERSE_MILITARY_POWER:0 "Disperse Military Power"
 RULE_OPTION_DISPERSE_MILITARY_POWER_AI_DESC:0 "The AI will stay neutral in world affairs and try and develop their own country unless provoked."
 RULE_OPTION_EMPIRE_AFG:0 "A Second Afghan Empire"
 RULE_OPTION_EMPIRE_AFG_AI_DESC:0 "The Afghan AI will attempt to oust King Zahir Shah and replace him with Emir Sayyid Mir Muhammad Alim Khan who will then attempt to unify the Afghan tribes. Afghanistan will then look to expanding its borders eventually forming a new Afghan Empire."
 RULE_OPTION_ETH_ANARCHIST:0 "Anarcho-Communist: Callout to the World"
 RULE_OPTION_ETH_ANARCHIST_desc:0 "The AI will attempt to turn Ethiopia into an anarcho-communist federation with the support of communists and anarchists from across the world."
 RULE_OPTION_ETH_COLLABORATIONIST:0 "Fascist: Collaborationist"
 RULE_OPTION_ETH_COLLABORATIONIST_desc:0 "The AI will stab Haile Selassie in the back and side with the Italians, causing Ethiopia to become a fascist puppet."
 RULE_OPTION_ETH_FRAGMENTED:0 "Ethiopia Fragmented"
 RULE_OPTION_ETH_FRAGMENTED_DESC:0 "Ethiopia will be split into the regional states comprising the country"
 RULE_OPTION_ETH_IMPERIAL:0 "Imperial: The Lion Stands Firm"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST:0 "Fascist: Independent"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc:0 "The AI will stab Haile Selassie in the back and side with the Italians, causing Ethiopia to become a fascist puppet. However, it will attempt to break free and become an independent fascist nation. "
 RULE_OPTION_ETH_STALINIST:0 "Communist: Soviet Aid"
 RULE_OPTION_ETH_STALINIST_desc:0 "The AI will attempt to turn Ethiopia communist and garner the support of the Soviet Union, turning it into a Stalinist puppet."
 RULE_OPTION_EXILES_FASCIST_SOV_AI_DESC:0 "The Soviet AI will expel the Communists through civil war, and establish a fascist government, by going down the relevant path in the national focus tree."
 RULE_OPTION_EXILES_TSARIST_SOV_AI_DESC:0 "The Soviet AI will expel the Communists through civil war, and reinstate Tsarist Russia, by going down the relevant path in the national focus tree."
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI:0 "Expansionist Fascists (VNV)"
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI_DESC:0 "The AI will go with the Flemish Nationalist Fascists, and aggressively try to unite the low countries then turn on France."
 RULE_OPTION_FASCISM:0 "Fascism"
 RULE_OPTION_FASCISM_AFG_AI_DESC:0 "The Afghan AI will attempt to oust King Zahir Shah and replace him with Amanullah Khan who will then attempt to rapidly modernize the country. Afghanistan will then look to expanding its borders with the aid of the Axis powers."
 RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC:0 "Greece will become democratic, suffer a collapse in government, and then go on to aspire for the grandest of ambitions..."
 RULE_OPTION_FASCISM_GRE_AI_DESC:0 "Greece will become a National Socialist republic and attempt to join the Axis alongside Turkey."
 RULE_OPTION_FASCISM_IRQ_AI:0 "Fascism - Golden Square"
 RULE_OPTION_FASCISM_IRQ_AI_DESC:0 "The AI will attempt to put the Golden Square in power as soon as possible before joining the Axis to fight the UK. They will then attempt to annex neighbouring Arab territories."
 RULE_OPTION_FASCISM_PER_AI:0 "Fascism - SUMKA"
 RULE_OPTION_FASCISM_PER_DESC:0 "The AI will unite the country's nationalists and form SUMKA, bringing a fascist regime to the country. It will attempt to join a fascist faction and declare war on their neighbors."
 RULE_OPTION_FASCISM_TUR_AI:0 "Kemalist Fascism"
 RULE_OPTION_FASCISM_TUR_AI_DESC:0 "Recep Peker shall transition Turkey into a fascist dictatorship and attempt to join the Axis."
 RULE_OPTION_FASCIST_AI_URG_DESC:0 "The AI will align with the Axis, turning the country into a springboard for a South American conquest."
 RULE_OPTION_FASCIST_ALTERNATE_GRE_AI:0 "Anatolian Fascist"
 RULE_OPTION_FASCIST_BUL_AI_DESC:0 "As fascism rises in the country, right-wing leader Hristo Lukov will attempt to join the Axis, eventually overthrowing the Tsar and imposing a military dictatorship."
 RULE_OPTION_FASCIST_INDEPENDENT:0 "Fascist: Falangist International"
 RULE_OPTION_FASCIST_PHI_AI:0 "Fascism"
 RULE_OPTION_FASCIST_PHI_AI_DESC:0 "The Philippines will align themselves with the Japanese, potentially falling foul of fascism themselves."
 RULE_OPTION_FASCIST_SEA:0 "Fascist"
 RULE_OPTION_FASCIST_SEA_DESC:0 "The Chinese AI will attempt to go down the fascist path of the focus tree."
 RULE_OPTION_FASCIST_URG_AI:0 "Fascist"
 RULE_OPTION_FIN_COMMUNIST_PLAN:0 "Communist"
 RULE_OPTION_FIN_COMMUNIST_PLAN_DESC:0 "Seeking help from the Soviet Union, communists will organize the Finnish left movement, uniting socialists, social-democrats and other left-wing elements in order to coup the government and lead the country towards a new revolution against the capitalist and fascist threats abroad."
 RULE_OPTION_FIN_DEMOCRATIC_PLAN:0 "Democratic"
 RULE_OPTION_FIN_DEMOCRATIC_PLAN_DESC:0 "Finnish Social-Democrats will appeal to the Finnish people and lead a drastic but bloodless change in the course of Finnish politics. Finland will then attempt to join other western major democracies in order to preserve the country's sovereignty and its conservative-left society."
 RULE_OPTION_FIN_FASCIST_PLAN:0 "Fascist"
 RULE_OPTION_FIN_FASCIST_PLAN_DESC:0 "The Finnish Right, led by the Patriotic People's Movement, will overthrow the former conservative democracy, attempting to strengthen ties with Germany and relying on organizations like the Mustapaidat and Suojeluskunta to develop a powerful military and expand the country's borders according to the Greater Finland idea."
 RULE_OPTION_FLEXIBLE_PHI_AI:0 "Flexible"
 RULE_OPTION_FLEXIBLE_PHI_AI_DESC:0 "The Philippines will play the USA and the Japanese off against each other, to maximize their potential."
 RULE_OPTION_FOCUSES_ONLY_38:0 "Focuses Only (Until 1938)"
 RULE_OPTION_FOCUSES_ONLY_39:0 "Focuses Only (Until 1939)"
 RULE_OPTION_FOCUSES_ONLY_40:0 "Focuses Only (Until 1940)"
 RULE_OPTION_FRA_FRAGMENTED:0 "France Fragmented"
 RULE_OPTION_FRA_FRAGMENTED_DESC:0 "All releasable constituent nations comprising France will be released as free and independent states upon game-start."
 RULE_OPTION_GERMANY_FRAGMENTED:0 "Germany Fragmented"
 RULE_OPTION_GERMANY_FRAGMENTED_DESC:0 "Germany will start fragmented into various smaller states"
 RULE_OPTION_GER_ALT_FASCIST:0 "Alternative Fascism"
 RULE_OPTION_GER_ALT_FASCIST_AI_DESC:0 "The German AI will attempt to replace Hitler with one of the members of the Inner Circle, heed von Neurath's concerns and attempt to enforce its New World Order."
 RULE_OPTION_GER_COMMUNIST_SPARTACUS:0 "Revive the Spartacus League"
 RULE_OPTION_GER_COMMUNIST_SPARTACUS_AI_DESC:0 "The German AI will attempt to overthrow the Nazis, and bring the communist revolution to Germany. They will then attempt to install a more democratic socialist regime under the new Spartacus League, and spread the communist revolutionary wildfire throughout Europe."
 RULE_OPTION_GER_COMMUNIST_STALINIST:0 "Dictatorship of the Proletariat"
 RULE_OPTION_GER_COMMUNIST_STALINIST_AI_DESC:0 "The German AI will attempt to overthrow the Nazis, and bring the communist revolution to Germany. They will then attempt to establish a dictatorship of the proletariat."
 RULE_OPTION_GOE_HISTORICAL:0 "GOE - Historical"
 RULE_OPTION_GOE_HISTORICAL_RAJ_AI_DESC:0 "$RULE_OPTION_DEMOCRATIC_HISTORICAL_RAJ_AI_DESC$"
 RULE_OPTION_GOE_INDIA_COMMUNISM:0 "GOE - Communism (Agrarian Socialism)"
 RULE_OPTION_GOE_INDIA_COMMUNISM_RAJ_AI_DESC:0 "India will attempt to gain independence via the communist focus tree. If successful, India will focus on agricultural economic growth and establishing its own unique socialist ideology."
 RULE_OPTION_GOE_INDIA_COMMUNISM_URBAN:0 "GOE - Communism (Urban Industrialism)"
 RULE_OPTION_GOE_INDIA_COMMUNISM_URBAN_RAJ_AI_DESC:0 "India will attempt to gain independence via the communist focus tree. If successful, India will focus on urbanization and rapid industrialization of society, and will attempt to seek aid from the Soviet Union."
 RULE_OPTION_GOE_INDIA_EAST_INDIA_COMPANY:0 "GOE - East India Company"
 RULE_OPTION_GOE_INDIA_EAST_INDIA_COMPANY_RAJ_AI_DESC:0 "India will break apart and the English will reinstate the East India Company"
 RULE_OPTION_GOE_INDIA_FASCISM_BOSE:0 "GOE - Unaligned Chandra Bose"
 RULE_OPTION_GOE_INDIA_FASCISM_BOSE_RAJ_AI_DESC:0 "India will go down the path of resistance and pick Chandra Bose as its leader, taking a more militant stance towards independence"
 RULE_OPTION_GOE_INDIA_FASCISM_HINDUTVA:0 "GOE - Hindutva Fascism"
 RULE_OPTION_GOE_INDIA_FASCISM_HINDUTVA_RAJ_AI_DESC:0 "India will go down the path of resistance and pick Savarkar as its leader, taking a more militant stance towards independence and try and form Akhand Bharat"
 RULE_OPTION_GOE_INDIA_MUGHAL:0 "GOE - Mughal Empire"
 RULE_OPTION_GOE_INDIA_MUGHAL_RAJ_AI_DESC:0 "India will try and form the Mughal Empire"
 RULE_OPTION_GOE_INDIA_UNITED:0 "GOE - India United"
 RULE_OPTION_GOE_INDIA_UNITED_RAJ_AI_DESC:0 "India will endeavour to become independent, remain Democratic and join the Allies, but stand united as one country and avoid Partition."
 RULE_OPTION_HABSBURG:0 "Monarchist: House of Habsburg"
 RULE_OPTION_HASHEMITE_IRQ_AI:0 "Hashemite - Non-Aligned"
 RULE_OPTION_HASHEMITE_IRQ_AI_DESC:0 "The AI will attempt to remain loyal to the UK while building up its power in the region, gradually taking over administration of territory and ultimately forming the Hashemite Arab Federation."
 RULE_OPTION_HIDE:0 "Hide"
 RULE_OPTION_HIDE_DESC:0 "Certain obsolete branches will be hidden under the appropriate circumstances for easier navigation of the Focus Tree."
 RULE_OPTION_HISTORICAL_AFG_AI_DESC:0 "The Afghan AI will attempt to stay neutral throughout the time period while also attempting to gain economic concessions from the Allies, Comintern and Axis powers."
 RULE_OPTION_HISTORICAL_AUS_AI_DESC:0 "The AI will turn fascist and attempt to stave off the Anschluss with the Vaterländische Front at the helm."
 RULE_OPTION_HISTORICAL_BEL_AI:0 "Historical"
 RULE_OPTION_HISTORICAL_BEL_AI_DESC:0 "Belgium will initially try to stave off attacks, but will then fall back to the Congo and continue the war from there."
 RULE_OPTION_HISTORICAL_BUL_AI_DESC:0 "Tsar Boris III will lead the country towards the Axis, relying on German arbitration to expand Bulgarian borders peacefully, eventually signing the Tripartite Pact and delaying Bulgarian participation in the war."
 RULE_OPTION_HISTORICAL_COG_AI_DESC:0 "The Congolese AI will stay with Belgium and utilize its relationship with the nation to its fullest potential, eventually looking for increased autonomy"
 RULE_OPTION_HISTORICAL_IRQ_AI:0 "Historical"
 RULE_OPTION_HISTORICAL_IRQ_AI_DESC:0 "The AI will flip-flop between historical coups, culminating in the Golden Square seizing control and going to war with the UK before ultimately restoring the monarchy and surrendering."
 RULE_OPTION_HISTORICAL_PAR_AI_DESC:0 "The AI will keep out of global politics and focus on internal issues, going through instabilities keeping it out of the war."
 RULE_OPTION_HISTORICAL_PER_AI:0 "Historical"
 RULE_OPTION_HISTORICAL_PER_AI_DESC:0 "The AI will work through political reforms and bolster their military, before being invaded and immediately capitulating."
 RULE_OPTION_HISTORICAL_PHI_AI:0 "Historical"
 RULE_OPTION_HISTORICAL_PHI_AI_DESC:0 "The Philippines will remain aligned with the United States."
 RULE_OPTION_HISTORICAL_SEA:0 "Historical"
 RULE_OPTION_HISTORICAL_SEA_DESC:0 "The Chinese AI will attempt to follow the historical chain of events as much as possible."
 RULE_OPTION_HISTORICAL_SIA_AI:0 "Historical"
 RULE_OPTION_HISTORICAL_SIA_AI_DESC:0 "The AI will follow the historical outcome. The AI will go down the fascist tree, attack Indochina and join the Japanese faction."
 RULE_OPTION_HISTORICAL_TUR_AI:0 "Historical"
 RULE_OPTION_HISTORICAL_TUR_AI_DESC:0 "Turkey will pursue neutrality for as long as possible under the leadership of İsmet İnönü, and then attempt to join the Allies."
 RULE_OPTION_HISTORICAL_URG_AI_DESC:0 "The AI will attempt to keep out of world affairs and focus on internal industrialization, putting the Colorado party in power. Only joining the allies at the end of the war."
 RULE_OPTION_HUN_ARROW_CROSS_MOVEMENT:0 "The Arrow Cross Movement"
 RULE_OPTION_HUN_COMMUNIST_STALINISM:0 "The Pannonian Stalin"
 RULE_OPTION_HUN_DEMOCRATIC_KING:0 "The Democratic King"
 RULE_OPTION_HUN_FASCIST_KING:0 "The Fascist King"
 RULE_OPTION_HUN_HABSBURG_HUNGARY:0 "A Habsburg Hungary"
 RULE_OPTION_HUN_HISTORICAL:0 "Continue the Horthyist Regency"
 RULE_OPTION_HUN_HORTHYIST_KING_HUNGARY:0 "A New Dynasty"
 RULE_OPTION_HUN_REPUBLICAN_DEMOCRACY:0 "The Second Republic"
 RULE_OPTION_HUN_REPUBLICAN_DEMOCRACY_EXPANSIONIST:0 "The Dragon Movement"
 RULE_OPTION_HUN_RESTORE_THE_SOCIALIST_REPUBLIC:0 "The Socialist Federative Republic"
 RULE_OPTION_HUN_ROME_PROTOCOLS:0 "Restore the Rome Protocols"
 RULE_OPTION_ICE_COMMUNIST:0 "Communist"
 RULE_OPTION_ICE_COMMUNIST_AI_DESC:0 "The Icelandic AI will denounce the monarchy, and establish a communist state in Iceland."
 RULE_OPTION_ICE_FASCIST:0 "Fascist"
 RULE_OPTION_ICE_FASCIST_AI_DESC:0 "The Icelandic AI will denounce the Danish King, and try to create a fascist empire in the North Sea"
 RULE_OPTION_ICE_SUPPORT:0 "Supporting Denmark"
 RULE_OPTION_ICE_SUPPORT_AI_DESC:0 "The Icelandic AI will attempt to support a Danish defense against any attacker"
 RULE_OPTION_IMPERIAL_PER_AI:0 "Imperial - Non-Aligned"
 RULE_OPTION_IMPERIAL_PER_DESC:0 "The AI will establish an absolute monarchy as Reza Shah Pahlavi and work towards a campaign of conquest in the Middle East."
 RULE_OPTION_INDEPENDENCE_COM:0 "Zhao Shangzhi's Coup"
 RULE_OPTION_INDEPENDENCE_COM_MAN_AI_DESC:0 "The Manchu AI will attempt to break free and becoming the People's Republic of China by going down the relevant branch of the national focus tree."
 RULE_OPTION_INDEPENDENCE_DEM:0 "The New Beiyang Government"
 RULE_OPTION_INDEPENDENCE_DEM_MAN_AI_DESC:0 "The Manchu AI will attempt to break free and assume the mantle of the new Beiyang Government going down the relevant branch of the national focus tree."
 RULE_OPTION_INDEPENDENCE_FAS:0 "Imperial Divinity"
 RULE_OPTION_INDEPENDENCE_FAS_MAN_AI_DESC:0 "The Manchu AI will attempt to break free and take over all of China and Outer Manchuria by going down the relevant branch of the national focus tree."
 RULE_OPTION_INDEPENDENCE_NEU:0 "A New Constitution"
 RULE_OPTION_INDEPENDENCE_NEU_MAN_AI_DESC:0 "The Manchu AI will attempt to break free and take over all of China as a Constitutional Monarchy by going down the relevant branch of the national focus tree."
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY:0 "Christian Democracy"
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY_AI_DESC:0 "King Vittorio Emanuele will depose Mussolini, attempt to form an independent faction and lead Italy towards a constitutional monarchy favoring the Christian Democratic party, led by Alcide de Gasperi."
 RULE_OPTION_ITA_COMMUNIST_PLAN:0 "Italian Communism"
 RULE_OPTION_ITA_COMMUNIST_PLAN_AI_DESC:0 "Italian anti-fascists will join forces to overthrow the fascist regime by force, forming a communist government, abolishing the colonies and seeking to join the Comintern."
 RULE_OPTION_ITA_DEMOCRATIC_PLAN:0 "Italian Socialism"
 RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC:0 "Italian anti-fascists will join forces to overthrow the fascist regime by force, forming a social-democratic government and seeking to form a Confederation with former colonies in Africa."
 RULE_OPTION_ITA_FRAGMENTED:0 "Reverse the Risorgimento"
 RULE_OPTION_ITA_FRAGMENTED_DESC:0 "Reverses the Risorgimento in Italy and sets the borders back to how they looked just before it."
 RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE:0 "Monarchist - Roman Empire"
 RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE_AI_DESC:0 "King Vittorio Emanuele will lead Italy towards an absolutist monarchy, trying to achieve Mare Nostrum and reforming the Roman Empire."
 RULE_OPTION_JAP_DEMOCRATIC:0 "A Clean Democracy"
 RULE_OPTION_JAP_FASCIST:0 "Imperial Rule Assistance Association"
 RULE_OPTION_JAP_NEUTRALITY:0 "The Kodoha Faction Victorious"
 RULE_OPTION_KURDISTAN_IRQ_AI:0 "Kurdistan Independence"
 RULE_OPTION_KURDISTAN_IRQ_AI_DESC:0 "The Kurds of Northern Iraq will launch a revolt against the Iraqi government. If they succeed, they will attempt to unify their lands across Turkey and Iran."
 RULE_OPTION_LEFT_OPPOSITION:0 "Left Opposition"
 RULE_OPTION_LEFT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "The Soviet AI will try to re-instate the Left Opposition and include other opposition groups in the party as well as re-start the permanent revolution, by going down the relevant branches of the national focus tree. The goal for the AI is to form the Supreme Soviet."
 RULE_OPTION_LEFT_OPPOSITION_SOV_AI_DESC:0 "The Soviet AI will try to re-instate the Left Opposition and re-start the permanent revolution, by going down the relevant branches of the national focus tree."
 RULE_OPTION_LOYALIST_INS_AI:0 "Loyalism"
 RULE_OPTION_LOYALIST_INS_AI_DESC:0 "The AI will stay loyal to the Netherlands, either seeking independence peacefully through the Soetardjo petition, or maintaining the colonial order."
 RULE_OPTION_MACARTHUR_PHI_AI:0 "Declare Military Emergency"
 RULE_OPTION_MACARTHUR_PHI_AI_DESC:0 "After the fall of the Philippine government, a military figure will rise and lead the nation against any and all aggressors."
 RULE_OPTION_METAXIST_GRE_AI_DESC:0 "Greece will pursue a policy of neutrality while developing the ideas of Metaxism."
 RULE_OPTION_MONARCHIST:0 "Monarchist"
 RULE_OPTION_MONARCHIST_ALCANTARA:0 "Monarchist - Dom Pedro de Alcântara"
 RULE_OPTION_MONARCHIST_ALCANTARA_DESC:0 "The AI will attempt to reform the Empire of Brazil by gaining support for Pedro de Alcântara as the rightful heir to the throne. It will then attempt to reunify with Portugal through diplomacy or force."
 RULE_OPTION_MONARCHIST_ALTERNATE_GRE_AI_DESC:0 "Greece will become an absolute monarchy and seek to join the Central Powers with Germany or Austria-Hungary."
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI:0 "Monarchist - Annexation"
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI_DESC:0 "The AI will attempt to reform the Austrian Empire by rebuilding their military and then expanding and annexing their old lost territories."
 RULE_OPTION_MONARCHIST_BONAPARTIST:0 "Monarchist: House of Bonapart"
 RULE_OPTION_MONARCHIST_CZE_AI_DESC:0 "The Czechoslovakian AI will go monarchist and attempt to restore the Bohemian Empire."
 RULE_OPTION_MONARCHIST_GRE_AI:0 "Monarchist"
 RULE_OPTION_MONARCHIST_GRE_AI_DESC:0 "Greece will become an absolute monarchy and seek to join the Allies."
 RULE_OPTION_MONARCHIST_GRE_ALTERNATE_AI:0 "Join the Central Powers"
 RULE_OPTION_MONARCHIST_HENRIQUE:0 "Monarchist - Dom Pedro Henrique"
 RULE_OPTION_MONARCHIST_HENRIQUE_DESC:0 "The AI will attempt to reform the Empire of Brazil by gaining support for Pedro Henrique as the rightful heir to the throne. It will then attempt to conquer or integrate Brazil's neighbors."
 RULE_OPTION_MONARCHIST_LEGITIMIST:0 "Monarchist: House of Bourbon"
 RULE_OPTION_MONARCHIST_LIT_AI_DESC:0 "Lithuania will attempt to restore the monarchy and claim the Polish-Lithuanian Commonwealth."
 RULE_OPTION_MONARCHIST_ORLEANIST:0 "Monarchist: House of Orléan"
 RULE_OPTION_MONARCHIST_PHI_AI:0 "Hispanic"
 RULE_OPTION_MONARCHIST_PHI_AI_DESC:0 "The Philippines will have its election overturned, having $PHI_neutrality_party_long$ take over until eventually having an independence war with support from friendly Hispanic nations and becoming a monarchy."
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI:0 "Monarchist - Subjugation"
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI_DESC:0 "The AI will attempt to reform the Austro-Hungarian Empire by rebuilding their military and demanding subjugation of the countries that now occupy their old lands."
 RULE_OPTION_MONARCHIST_SIA_AI:0 "Monarchist"
 RULE_OPTION_MONARCHIST_SIA_AI_DESC:0 "The AI will go down the Monarchist route."
 RULE_OPTION_MUGHAL_AFG:0 "A New Mughal Empire"
 RULE_OPTION_MUGHAL_AFG_AI_DESC:0 "The Afghan AI will attempt to oust King Zahir Shah and replace him with Mirza Khurshid Jah Bahadur who will then attempt to recreate the Mughal Empire. They will then look to expanding their borders eventually forming a new Timurid Empire."
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI:0 "Nationalist Fascists (Rexist)"
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI_DESC:0 "The AI will go with the Rexist Fascists, and establish a tall highly industrial state, then assist the fascists in the war."
 RULE_OPTION_NORDICS_FRAGMENTED:0 "Nordics Fragmented"
 RULE_OPTION_NORDICS_FRAGMENTED_DESC:0 "The Nordic countries will be fragmented and split apart."
 RULE_OPTION_NOR_FASCIST:0 "Nasjonal Samling"
 RULE_OPTION_NOR_FASCIST_AI_DESC:0 "The AI will let Fascism's influence grow over time, and will eventually align with The Third Reich, or go it alone if Germany is no longer Fascist."
 RULE_OPTION_NOR_MONARCHIST:0 "Monarchist"
 RULE_OPTION_NOR_MONARCHIST_AI_DESC:0 "The AI will start pressuring King Haakon VII to dismantle the Storting and turn Norway into an Oligarchic Monarchy."
 RULE_OPTION_NOR_STALINIST:0 "Stalinist"
 RULE_OPTION_NOR_STALINIST_AI_DESC:0 " The AI will attempt to increase the popularity of Communism, while aligning Norway to Stalin's Soviet Union, or the biggest Non-Trotskyist Communist country if Stalin has been ousted."
 RULE_OPTION_NOR_TROSTSKYIST:0 "Trotskyist"
 RULE_OPTION_NOR_TROSTSKYIST_AI_DESC:0 "The AI will try to keep Lev Trotskij in Norway, and follow his principles of Communism, going against the Soviet Union if it remains Stalinist, and allying with it if Trotskij becomes its leader."
 RULE_OPTION_OBEDIENCE_CHINA:0 "The Two Emperors"
 RULE_OPTION_OBEDIENCE_CHINA_MAN_AI_DESC:0 "The Manchu AI will attempt to remain loyal as much as possible and follow the relevant branch in the national focus tree, eventually becoming the Empire of China."
 RULE_OPTION_OTTOMAN:0 "Restore the Ottoman Sultanate"
 RULE_OPTION_OTTOMAN_DESC:0 "The Republic of Turkey will collapse and from its ashes the Ottoman Sultanate shall be restored to power once again."
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_NO_DESC:0 "All winners keep all the Peace Score they earned during the war."
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_YES_DESC:0 "Winners with less than 5% of war participation give all their score to other winners.\nDoes not apply if no winner has at least 10% of war participation.\nDoes not apply to Human Players."
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_NO_DESC:0 "Faction Members keep all the Peace Score they earned during the war."
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_YES_DESC:0 "Faction Members give 10% of their Peace Score to the Faction Leader."
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_NO_DESC:0 "Puppets keep all the Peace Score they earned during the war."
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_YES_DESC:0 "Puppets give a part of their Peace Score to their Overlord. The ratio depends on their Autonomy level."
 RULE_OPTION_QUEBEC:0 "Free Quebec"
 RULE_OPTION_QUEBEC_DESC:0 "Quebec is free at game start"
 RULE_OPTION_RAJ_PRINCELY_STATES_FREE:0 "Princely States Free"
 RULE_OPTION_RAJ_PRINCELY_STATES_FREE_DESC:0 "The Indian Princely States will be released upon game start."
 RULE_OPTION_REVOLUTION_COMMUNIST_INS_AI:0 "Malaka's Revolution (Communism)"
 RULE_OPTION_REVOLUTION_COMMUNIST_INS_AI_DESC:0 "The AI will start an early revolution. Tan Malaka will have a coup to establish a communist government before spreading the revolution throughout the pacific."
 RULE_OPTION_REVOLUTION_DEMOCRATIC_INS_AI:0 "Sjahrir's Revolution (Democratic)"
 RULE_OPTION_REVOLUTION_DEMOCRATIC_INS_AI_DESC:0 "The AI will start an early revolution. Sutan Sjahrir will take power and establish a democratic government."
 RULE_OPTION_REVOLUTION_UNALIGNED_INS_AI:0 "Sukarno's Revolution (Unaligned)"
 RULE_OPTION_REVOLUTION_UNALIGNED_INS_AI_DESC:0 "The AI will start an early revolution. Sukarno will maintain power and opposition movements will be stopped."
 RULE_OPTION_RIGHT_OPPOSITION:0 "Right Opposition"
 RULE_OPTION_RIGHT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "The Soviet AI will try to put the Right Opposition in power and include other opposition groups in the party, by going down the relevant branches of the national focus tree. The goal for the AI is to form the Supreme Soviet."
 RULE_OPTION_RIGHT_OPPOSITION_SOV_AI_DESC:0 "The Soviet AI will try to put the Right Opposition in power, by going down the relevant branches of the national focus tree."
 RULE_OPTION_ROMANIA:0 "Monarchist: House of Hohenzollern"
 RULE_OPTION_SAPMI_RELEASED:0 "Sápmi Released"
 RULE_OPTION_SAPMI_RELEASED_DESC:0 "Sápmi will be released from Finland, Sweden and Norway."
 RULE_OPTION_SHOW:0 "Show"
 RULE_OPTION_SHOW_DESC_DESC:0 "Obsolete branches will always remain visible in the Focus Tree."
 RULE_OPTION_SIDQI_IRQ_AI:0 "Bakr Sidqi - Non-Aligned"
 RULE_OPTION_SIDQI_IRQ_AI_DESC:0 "Bakr Sidqi will launch his historical coup but will not be assassinated. Instead, the government will work with Iran and Turkey to form a regional power bloc."
 RULE_OPTION_SOV_UTTERLY_FRAGMENTED:0 "Soviet Union Fragmented"
 RULE_OPTION_SOV_UTTERLY_FRAGMENTED_DESC:0 "All releasable Republics, Okrugs and Territories comprising the Soviet Union are released as free and independent nations upon game-start."
 RULE_OPTION_STALINIST_GRE_AI:0 "Stalinist"
 RULE_OPTION_STALINIST_GRE_AI_DESC:0 "Greece will attempt to join the Comintern and spark a battle for the Bosporus with Turkey."
 RULE_OPTION_SWE_COMMUNISM:0 "Communism"
 RULE_OPTION_SWE_COMMUNISM_DESC:0 "The Swedish AI will go down the communist tree and either ally the Axis or the Allies"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL:0 "Nordic Defence Council"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC:0 "The AI will try and form the Nordic Defence Council to protect the Nordics"
 RULE_OPTION_SWE_DEM_ALT:0 "Alternative Democratic"
 RULE_OPTION_SWE_DEM_ALT_DESC:0 "The Swedish AI will go down the democratic tree but will be more likely to become actively involved in the war by rearming faster, leaning more into right-leaning policies."
 RULE_OPTION_SWE_FASCIST_INDEPENDENT:0 "Independent Fascist"
 RULE_OPTION_SWE_FASCIST_INDEPENDENT_DESC:0 "The Swedish AI will go down the fascist path, remain independent and try to form the Great Nordic Kingdom"
 RULE_OPTION_SWE_FASCIST_PUPPET:0 "Obedient Reichskommissariat Fascist"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER:0 "Backstabber Reichskommissariat Fascist"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER_DESC:0 "The Swedish AI will go down the fascist path, become subservient to Germany and break free from them when the time is right."
 RULE_OPTION_SWE_FASCIST_PUPPET_DESC:0 "The Swedish AI will go down the fascist path, become subservient to Germany and remain obedient to their overlord."
 RULE_OPTION_SWE_UNALIGNED:0 "Monarchist"
 RULE_OPTION_SWE_UNALIGNED_DESC:0 "The Swedish AI will go down the unaligned path, return the king to power and try to form the Great Nordic Kingdom"
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC:0 "Allied Democratic"
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC:0 "The AI will arm Switzerland and prepare for war, aligning Switzerland to the democratic powers of the world, eventually breaking neutrality in favor of the Allies"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC:0 "Expansionist Democracy"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC:0 "The AI will try to convince states around Switzerland to join the confederation, and will arm the country in preparation for owner of those states refusing to let their states be free."
 RULE_OPTION_SWI_FASCIST:0 "Fascist"
 RULE_OPTION_SWI_FASCIST_AI_DESC:0 "The AI will make Switzerland align itself with Germany and slowly turn the country fascist, eventually either allying with the Axis or becoming a German Puppet."
 RULE_OPTION_SWI_IMPERIAL:0 "Imperial"
 RULE_OPTION_SWI_IMPERIAL_AI_DESC:0 "The AI will attempt to form the Alpine Protectorate by abandoning neutrality and democracy in favor of a militaristic and expansionist regime."
 RULE_OPTION_THE_RETURN_OF_FERDINAND:0 "The Return of Ferdinand I"
 RULE_OPTION_THE_RETURN_OF_FERDINAND_BUL_AI_DESC:0 "Following the death of Tsar Boris III, his father Ferdinand I will sit on the throne once again, seeking revenge against those who wronged him decades ago."
 RULE_OPTION_TRUE_HISTORICAL_INS_AI:0 "Historical"
 RULE_OPTION_TRUE_HISTORICAL_INS_AI_DESC:0 "The AI will stay loyal to the Netherlands, but will start a revolution after facing Japanese occupation."
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE:0 "Democratic Conservatism"
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE_DESC:0 "Adnan Menderes will transition Turkey into a conservative democracy and attempt to join the Allies."
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST:0 "Democratic Kemalism"
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST_DESC:0 "Celâl Bayar will transition Turkey into a Kemalist democracy and attempt to join the Allies."
 RULE_OPTION_TUR_FASCISM_ALTERNATE:0 "Militaristic Fascism"
 RULE_OPTION_TUR_FASCISM_ALTERNATE_DESC:0 "Fevzi Çakmak shall transition Turkey into a conservative quasi-fascist dictatorship and attempt to form a faction with Italy."
 RULE_OPTION_VENEZELIST_GRE_AI_DESC:0 "Greece will fight for the right to fulfill the Megali Idea."
 RULE_OPTION_WANG_JINGWEI_SEA:0 "Wang Jingwei Front"
 RULE_OPTION_WANG_JINGWEI_SEA_DESC:0 "The Chinese AI will attempt to go down the Wang Jingwei path of the focus tree."
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_HUN_AI_DESC:0 "The Hungarian AI will oppose Horthy, and bring democracy to Hungary, eventually embracing the Dragon Movement and attempting to restore Greater Hungary."
 RULE_REPUBLICAN_DEMOCRACY_HUN_AI_DESC:0 "The Hungarian AI will oppose Horthy, and attempt to bring democracy to the nation, establishing the Danubian Federation."
 RULE_RESTORE_THE_SOCIALIST_REPUBLIC_HUN_AI_DESC:0 "The Hungarian AI will attempt to restore the old Socialist Federative Republic, and bring about a Red Greater Hungarian State."
 RULE_RIGHT_OPPOSITION_COOPERATIVE:0 "Right Opposition Cooperative"
 RULE_ROMANIA_POL_AI_DESC:0 "The Polish AI will crown a Hohenzollern as King and attempt to form a union with Romania."
